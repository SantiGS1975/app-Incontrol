// ---------- almacenamiento local ----------
(function installStoragePolyfill() {
  if (window.storage) return;
  const NS = "incontrol:";
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(NS + key);
      if (raw === null) throw new Error("clave no encontrada: " + key);
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(NS + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(NS + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const p = NS + (prefix || "");
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(NS.length));
      return { keys, prefix: prefix || "", shared: false };
    },
  };
})();

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

function noteParts(v) {
  if (!v) return { title: "", detail: "" };
  if (typeof v === "string") return { title: v, detail: "" };
  return { title: v.title || "", detail: v.detail || "" };
}

function beep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    [0, 0.35, 0.7].forEach((t) => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.28);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
    setTimeout(() => ctx.close && ctx.close(), 1500);
  } catch (e) {}
}

async function notifyDrink(time) {
  const title = "Incontrol · hora de beber";
  const opts = { body: `Toca tu toma de líquido de las ${time}.`, tag: "incontrol-" + time, requireInteraction: true, vibrate: [300, 150, 300] };
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg && reg.showNotification) { reg.showNotification(title, opts); return; }
    }
    new Notification(title, opts);
  } catch (e) {}
}

function buildReminderIcs(times) {
  const pad = (n) => String(n).padStart(2, "0");
  const d = new Date();
  const ymd = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const stamp = `${ymd}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Incontrol//Recordatorios//ES", "CALSCALE:GREGORIAN"];
  times.forEach((t) => {
    const [h, m] = t.split(":");
    lines.push(
      "BEGIN:VEVENT",
      `UID:incontrol-${h}${m}@incontrol.app`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${ymd}T${h}${m}00`,
      `DTEND:${ymd}T${h}${m}00`,
      "RRULE:FREQ=DAILY",
      "SUMMARY:Incontrol - Hora de beber",
      "DESCRIPTION:Toma de liquido programada. Anotala en Incontrol.",
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Hora de beber", "TRIGGER:PT0M", "END:VALARM",
      "BEGIN:VALARM", "ACTION:AUDIO", "TRIGGER:PT0M", "END:VALARM",
      "END:VEVENT"
    );
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

function downloadIcs(times) {
  const blob = new Blob([buildReminderIcs(times)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "incontrol-recordatorios.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function toLocalIsoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
const todayStr = () => toLocalIsoDate(new Date());
// Inicio de la jornada (Ajustes → Horarios). Un registro hecho antes de esa hora cuenta para el día anterior.
let DAY_START = "00:00";
const dayOf = (rec) => {
  if (!rec || !rec.date) return rec && rec.date;
  if (DAY_START === "00:00" || !rec.time || rec.time >= DAY_START) return rec.date;
  return addDaysIso(rec.date, -1);
};
const logicalToday = () => dayOf({ date: todayStr(), time: nowTimeStr() });
const nowTimeStr = () => new Date().toTimeString().slice(0, 5);
const fmtDateLabel = (isoDate) => {

};
const fmtDateFull = (isoDate) => {
  const d = new Date(isoDate + "T00:00:00");

};

const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const fmtDateShort = (isoDate) => {

};

function dayOffset(isoStart, isoDate) {
  const a = new Date(isoStart + "T00:00:00");
  const b = new Date(isoDate + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function addDaysIso(isoStart, n) {
  const d = new Date(isoStart + "T00:00:00");
  d.setDate(d.getDate() + Math.round(n));
  return toLocalIsoDate(d);
}

function linreg(values, xs) {
  const n = values.length;
  if (n < 2) return { slope: 0, intercept: values[0] || 0, r2: 0 };
  if (!xs) xs = values.map((_, i) => i);
  const xMean = mean(xs), yMean = mean(values);
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - xMean) * (values[i] - yMean); den += (xs[i] - xMean) ** 2; }
  const slope = den === 0 ? 0 : num / den;
  const intercept = yMean - slope * xMean;
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < n; i++) {
    const pred = intercept + slope * xs[i];
    ssRes += (values[i] - pred) ** 2;
    ssTot += (values[i] - yMean) ** 2;
  }
  const r2 = ssTot === 0 ? 0 : 1 - ssRes / ssTot;
  return { slope, intercept, r2 };
}

const fmtEs = (n, decimals = 0) => n.toLocaleString("es-ES", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });

// ---------- exportación ----------
function downloadWorkbook(sheets, filename) {
  if (!XLSX) {
    alert("La librería Excel aún se está cargando. Inténtalo en un segundo.");
    return;
  }
  const wb = XLSX.utils.book_new();
  for (const [name, rowsOrSheet] of sheets) {
    const ws = Array.isArray(rowsOrSheet)
      ? XLSX.utils.json_to_sheet(rowsOrSheet.length ? rowsOrSheet : [{ " ": "Sin datos" }])
      : rowsOrSheet;
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  }
  XLSX.writeFile(wb, filename);
}

function buildCoverSheet(subtitle, periodText) {
  const rows = [
    ["Incontrol"],
    ["Diario de control de incontinencia — " + subtitle],
    [""],
    ["Generado el", new Date().toLocaleString("es-ES", { dateStyle: "long", timeStyle: "short" })],
    ["Periodo", periodText],
    [""],
    ["Este documento es un registro personal de seguimiento."],
    ["No sustituye la valoración de un profesional sanitario."],
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 16 }, { wch: 46 }];
  return ws;
}

  const liquidRows = [...data.liquids]

  const diaperRows = [...data.diapers]
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((p) => ({
      Fecha: p.date, Hora: p.time, "Peso total (g)": p.weight,
      "Peso seco (g)": p.dryWeight === "" || p.dryWeight === undefined ? "" : p.dryWeight,
      "Peso neto (g)": round1(netWeight(p.weight, p.dryWeight)), Nocturno: voidIsNight(p) ? "Sí" : "No", Nota: p.note || "",
    }));
  const summaryRows = dailyAgg.map((d) => ({
    Fecha: d.date, "Líquido total (ml)": round1(d.liquidTotal), "Tomas de líquido": d.liquidCount,
    "Peso neto pañales (g)": round1(d.diaperTotal), "Cambios de pañal": d.diaperCount, "Nota del día": d.dayNote || "", "Detalle de la nota": d.dayNoteDetail || "",
    Severidad: classifyLoss(d.diaperTotal)?.label || "",
    Micciones: d.voidCount, "Micciones nocturnas": d.nightVoids, "Jarra nocturna (ml)": round1(d.nightVoidVol), Escapes: d.leakCount,
    "Orina nocturna (%)": d.nightUrine + d.dayUrine > 0 ? round1((d.nightUrine / (d.nightUrine + d.dayUrine)) * 100) : "",
  }));
  const voidRows = [...(data.voids || [])].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((v) => ({ Fecha: v.date, Hora: v.time, "Volumen (ml)": v.volume === "" ? "" : v.volume, Nocturna: voidIsNight(v) || v.isFirstMorning ? "Sí" : "No", Nota: v.note || "" }));
  const leakRows = [...(data.leaks || [])].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((l) => ({ Fecha: l.date, Hora: l.time, Desencadenante: (LEAK_TRIGGERS.find((t) => t.id === l.trigger) || {}).label || l.trigger, Cantidad: l.amount, Nota: l.note || "" }));

  const cover = buildCoverSheet("diario completo", periodText);
  downloadWorkbook(
    [["Portada", cover], ["Líquidos", liquidRows], ["Pañales", diaperRows], ["Micciones", voidRows], ["Escapes", leakRows], ["Resumen diario", summaryRows]],
    `incontrol-diario-${todayStr()}.xlsx`

function exportRangeExcel(filtered, liquidStats, diaperStats, range) {

    Severidad: classifyLoss(d.diaperTotal)?.label || "",
  }));
  const cvOf = (s) => (s.mean > 0 ? round1((s.sd / s.mean) * 100) : 0);
  const statsRows = [
    { Métrica: "Líquido (ml/día)", Media: round1(liquidStats.mean), Mediana: round1(liquidStats.median), "Desv. típica": round1(liquidStats.sd), "Coef. variación (%)": cvOf(liquidStats), Máximo: round1(liquidStats.max), Mínimo: round1(liquidStats.min) },

  ];
  const cover = buildCoverSheet("periodo seleccionado", `${range.start} — ${range.end}`);
  downloadWorkbook(
    [["Portada", cover], ["Serie diaria", rows], ["Estadísticas del periodo", statsRows]],
    `incontrol-periodo-${range.start}_a_${range.end}.xlsx`

}

function generateDemoDataset() {

  const today = new Date();
  const patterns = [
    { l: [250, 300, 200, 250, 200, 150], p: [180, 140, 260], v: [{ t: "02:30", vol: 280 }, { t: "07:15", vol: 310, wake: true }, { t: "12:00", vol: "" }, { t: "17:30", vol: "" }], lk: [], note: "" },
    { l: [250, 350, 250, 300, 250, 200], p: [220, 190, 340], v: [{ t: "03:10", vol: 340 }, { t: "07:20", vol: 350, wake: true }, { t: "13:15", vol: "" }], lk: [{ t: "11:20", tr: "esfuerzo", am: "Gotas" }], note: "Caminata larga" },
    { l: [200, 250, 200, 200, 150], p: [140, 120, 210], v: [{ t: "04:00", vol: 240 }, { t: "07:10", vol: 260, wake: true }, { t: "11:45", vol: "" }, { t: "16:20", vol: "" }, { t: "20:10", vol: "" }], lk: [], note: "" },
    { l: [250, 300, 250, 200, 150], p: [150, 130, 220], v: [{ t: "02:45", vol: 260 }, { t: "07:30", vol: 290, wake: true }, { t: "12:30", vol: "" }, { t: "18:00", vol: "" }], lk: [], note: "" },
    { l: [300, 350, 300, 250, 300], p: [260, 230, 410], v: [{ t: "01:50", vol: 320 }, { t: "04:40", vol: 290 }, { t: "07:25", vol: 340, wake: true }, { t: "14:00", vol: "" }], lk: [{ t: "15:40", tr: "urgencia", am: "Moderado" }], note: "Café extra y cena tardía" },
    { l: [250, 250, 200, 200, 150], p: [130, 110, 190], v: [{ t: "03:30", vol: 230 }, { t: "07:15", vol: 270, wake: true }, { t: "11:30", vol: "" }, { t: "16:45", vol: "" }], lk: [], note: "" },
    { l: [200, 250, 250, 200, 100], p: [120, 95, 175], v: [{ t: "03:50", vol: 210 }, { t: "07:20", vol: 250, wake: true }, { t: "12:10", vol: "" }, { t: "17:15", vol: "" }, { t: "21:00", vol: "" }], lk: [], note: "Buen descanso" },
  ];

  for (let i = 13; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const iso = toLocalIsoDate(d);
    const pat = patterns[(13 - i) % patterns.length];
    const lTimes = ["08:30", "11:00", "14:00", "17:00", "19:30", "21:15"];
    pat.l.forEach((amt, idx) => liquids.push({ id: uid(), date: iso, time: lTimes[idx] || "12:00", amount: amt, note: idx === 0 ? "Desayuno" : idx === 2 ? "Comida" : "" }));
    const pTimes = ["08:00", "16:30", "23:45"];
    pat.p.forEach((net, idx) => {
      const dry = idx === 2 ? 90 : 40;
      diapers.push({ id: uid(), date: iso, time: pTimes[idx], weight: net + dry, dryWeight: dry, note: idx === 2 ? "Nocturno" : "Día" });
    });
    pat.v.forEach((item) => voids.push({ id: uid(), date: iso, time: item.t, volume: item.vol, isFirstMorning: !!item.wake, note: item.wake ? "Al despertar" : "" }));
    pat.lk.forEach((item) => leaks.push({ id: uid(), date: iso, time: item.t, trigger: item.tr, amount: item.am, note: "" }));

  }
  return { liquids, diapers, voids, leaks, dayNotes, settings: { defaultLiquidAmount: 200, defaultDryWeight: 40, nightDryWeight: 90 } };
}

function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}
function stddev(arr) {
  if (arr.length < 2) return 0;
  const m = mean(arr);
  return Math.sqrt(arr.reduce((a, b) => a + (b - m) ** 2, 0) / (arr.length - 1));
}
function statsOf(arr) {
  if (!arr.length) return { mean: 0, median: 0, sd: 0, max: 0, min: 0, n: 0 };
  return { mean: mean(arr), median: median(arr), sd: stddev(arr), max: Math.max(...arr), min: Math.min(...arr), n: arr.length };
}
const round1 = (n) => Math.round(n * 10) / 10;

// ---------- comparativa por periodos ----------
function lgammaFn(x) {
  const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = x, tmp = x + 5.5;
  tmp -= (x + 0.5) * Math.log(tmp);
  let ser = 1.000000000190015;
  for (let j = 0; j < 6; j++) ser += c[j] / ++y;
  return -tmp + Math.log((2.5066282746310005 * ser) / x);
}
function betacfFn(a, b, x) {
  const MAXIT = 200, EPS = 3e-12, FPMIN = 1e-30;
  const qab = a + b, qap = a + 1, qam = a - 1;
  let c = 1, d = 1 - (qab * x) / qap;
  if (Math.abs(d) < FPMIN) d = FPMIN;
  d = 1 / d;
  let h = d;
  for (let m = 1; m <= MAXIT; m++) {
    const m2 = 2 * m;
    let aa = (m * (b - m) * x) / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d; h *= d * c;
    aa = (-(a + m) * (qab + m) * x) / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d;
    const del = d * c; h *= del;
    if (Math.abs(del - 1) < EPS) break;
  }
  return h;
}
function betaIncFn(x, a, b) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const bt = Math.exp(lgammaFn(a + b) - lgammaFn(a) - lgammaFn(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? (bt * betacfFn(a, b, x)) / a : 1 - (bt * betacfFn(b, a, 1 - x)) / b;
}
const tTwoSidedP = (t, df) => betaIncFn(df / (df + t * t), df / 2, 0.5);
function fTwoSidedP(F, d1, d2) {
  const upper = betaIncFn(d2 / (d2 + d1 * F), d2 / 2, d1 / 2);
  return Math.min(1, 2 * Math.min(upper, 1 - upper));
}

const PERIOD_SOURCES = {
  loss: { label: "Pérdida (peso neto)", unit: "g/día", ok: (d) => d.diaperCount > 0, val: (d) => d.diaperTotal, lower: true },
  liquid: { label: "Líquido ingerido", unit: "ml/día", ok: (d) => d.liquidCount > 0, val: (d) => d.liquidTotal, lower: null },
  nocturia: { label: "Nocturia", unit: "por noche", ok: (d) => d.voidCount > 0, val: (d) => d.nightVoids, lower: true },
  leaks: { label: "Escapes", unit: "al día", ok: (d) => d.voidCount > 0 || d.leakCount > 0, val: (d) => d.leakCount, lower: true },
};
const PERIOD_MEASURES = {
  mean: { label: "Media", f: (v) => mean(v), test: "t" },
  median: { label: "Mediana", f: (v) => median(v), test: null },
  sd: { label: "Desviación típica", f: (v) => stddev(v), test: "f" },
  variance: { label: "Varianza", f: (v) => stddev(v) ** 2, test: "f", sq: true },
  cv: { label: "Coeficiente de variación", f: (v) => { const m = mean(v); return m > 0 ? (stddev(v) / m) * 100 : 0; }, test: null, pct: true },
  max: { label: "Máximo", f: (v) => Math.max(...v), test: null },
  min: { label: "Mínimo", f: (v) => Math.min(...v), test: null },
  slope: { label: "Tendencia (pendiente)", f: (v, rows) => (v.length < 2 ? 0 : linreg(v, rows.map((r) => dayOffset(rows[0].date, r.date))).slope), test: null, slope: true },
};

// Divide el pasado en bloques de la misma duración que el periodo elegido (el actual primero)
function buildPeriodBlocks(dailyAgg, range, sourceKey, maxBlocks = 6) {
  const src = PERIOD_SOURCES[sourceKey];
  const n = Math.round((new Date(range.end + "T00:00:00") - new Date(range.start + "T00:00:00")) / 86400000) + 1;
  if (!(n >= 3) || !dailyAgg.length) return { n: n > 0 ? n : 0, blocks: [] };
  const firstDate = dailyAgg[0].date;
  const blocks = [];
  for (let i = 0; i < maxBlocks; i++) {
    const end = addDaysIso(range.end, -i * n), start = addDaysIso(range.start, -i * n);
    if (end < firstDate) break;
    const rows = dailyAgg.filter((d) => d.date >= start && d.date <= end && src.ok(d)).map((d) => ({ date: d.date, v: src.val(d) }));
    blocks.push({ i, start, end, rows, vals: rows.map((r) => r.v) });
  }
  return { n, blocks };
}

function measureValue(block, measureKey) {
  return block.vals.length ? PERIOD_MEASURES[measureKey].f(block.vals, block.rows) : null;
}

// Compara dos bloques: devuelve cambio %, prueba estadística si procede y veredicto
function compareBlocks(cur, prev, measureKey, sourceKey) {
  const m = PERIOD_MEASURES[measureKey], src = PERIOD_SOURCES[sourceKey];
  if (cur.vals.length < 3 || prev.vals.length < 3) return null;
  const a = m.f(cur.vals, cur.rows), b = m.f(prev.vals, prev.rows);
  const diff = a - b;
  const pct = !m.slope && b !== 0 ? (diff / Math.abs(b)) * 100 : null;
  const out = { a, b, diff, pct, p: null, mdc: null, d: null, kind: "band" };
  const n1 = cur.vals.length, n2 = prev.vals.length;
  const s1 = stddev(cur.vals), s2 = stddev(prev.vals);
  if (m.test === "t" && (s1 > 0 || s2 > 0)) {
    const se = Math.sqrt((s1 * s1) / n1 + (s2 * s2) / n2);
    const t = diff / se;
    const df = (se ** 4) / (((s1 * s1) / n1) ** 2 / (n1 - 1) + ((s2 * s2) / n2) ** 2 / (n2 - 1));
    out.p = tTwoSidedP(t, df);
    out.mdc = 1.96 * se;
    const pooled = Math.sqrt(((n1 - 1) * s1 * s1 + (n2 - 1) * s2 * s2) / (n1 + n2 - 2));
    out.d = pooled > 0 ? diff / pooled : null;
    out.kind = "t";
  } else if (m.test === "f" && s1 > 0 && s2 > 0) {
    out.p = fTwoSidedP((s1 * s1) / (s2 * s2), n1 - 1, n2 - 1);
    out.kind = "f";
  }
  out.lower = src.lower;
  return out;
}

function periodBand(absPct) {
  return absPct < 5 ? "sin cambio apreciable" : absPct < 10 ? "cambio leve" : absPct < 20 ? "cambio moderado" : "cambio importante";
}

const SEVERITY_THRESHOLDS = { leve: 100, moderada: 300, severa: 600 };
function classifyLoss(gramsPerDay) {
  if (gramsPerDay === null || gramsPerDay === undefined || gramsPerDay <= 0) return null;
  if (gramsPerDay < SEVERITY_THRESHOLDS.leve) return { label: "Leve", color: "#0D9488", bg: "#CCFBF1" };
  if (gramsPerDay < SEVERITY_THRESHOLDS.moderada) return { label: "Moderada", color: "#D97706", bg: "#FEF3C7" };
  if (gramsPerDay < SEVERITY_THRESHOLDS.severa) return { label: "Severa", color: "#EA580C", bg: "#FFEDD5" };
  return { label: "Muy severa", color: "#DC2626", bg: "#FEE2E2" };
}
const netWeight = (weight, dryWeight) => Math.max(0, (Number(weight) || 0) - (Number(dryWeight) || 0));

// Clasificación orientativa de las micciones del día: hasta 8 de día y 1 de noche se considera normal
const VOID_DAY_MAX = 8, VOID_NIGHT_MAX = 1;
function classifyVoids(d) {
  if (!d || !d.voidCount) return null;
  const night = d.nightVoids || 0, day = d.voidCount - night;
  if (night >= 3) return { label: "Nocturia marcada", color: "#DC2626", bg: "#FEE2E2" };
  if (night > VOID_NIGHT_MAX) return { label: "Nocturia", color: "#EA580C", bg: "#FFEDD5" };
  if (day > VOID_DAY_MAX) return { label: "Frecuentes", color: "#D97706", bg: "#FEF3C7" };
  return { label: "Normal", color: "#0D9488", bg: "#CCFBF1" };
}

const LIQUID_RECOMMENDED = 1500;
const LIQUID_THRESHOLDS = { insuficiente: 1000, poco: 1500, mucho: 2500 };
function classifyLiquid(mlPerDay) {
  if (mlPerDay === null || mlPerDay === undefined || mlPerDay <= 0) return null;
  if (mlPerDay < LIQUID_THRESHOLDS.insuficiente) return { label: "Insuficiente", color: "#DC2626", bg: "#FEE2E2" };
  if (mlPerDay < LIQUID_THRESHOLDS.poco) return { label: "Poco", color: "#D97706", bg: "#FEF3C7" };
  if (mlPerDay <= LIQUID_THRESHOLDS.mucho) return { label: "Adecuado", color: "#0D9488", bg: "#CCFBF1" };
  return { label: "Mucho", color: "#D97706", bg: "#FEF3C7" };
}

// ---------- diario miccional ----------
// Horario de noche configurable (Ajustes → Noche). Se actualiza desde la app antes de calcular nada.
let NIGHT_START = "23:00", NIGHT_END = "07:00";
const isNightTime = (t) => {
  if (!t) return false;
  return NIGHT_START > NIGHT_END ? (t >= NIGHT_START || t < NIGHT_END) : (t >= NIGHT_START && t < NIGHT_END);
};
// Una micción puede reclasificarse a mano: period = "night" | "day" | (vacío = automático según la hora)
const voidIsNight = (v) => (v.period === "night" ? true : v.period === "day" ? false : isNightTime(v.time));
const LEAK_TRIGGERS = [
  { id: "esfuerzo", label: "Esfuerzo (tos, risa, ejercicio)", short: "Esfuerzo" },
  { id: "urgencia", label: "Urgencia", short: "Urgencia" },
  { id: "sinaviso", label: "Sin aviso", short: "Sin aviso" },
  { id: "otro", label: "Otro", short: "Otro" },
];
const LEAK_AMOUNTS = ["Gotas", "Moderado", "Abundante"];

function summarizeDiary(days) {
  const sum = (arr, f) => arr.reduce((a, d) => a + f(d), 0);
  const withVoid = days.filter((d) => d.voidCount > 0);
  const withDiary = days.filter((d) => d.voidCount > 0 || d.leakCount > 0);
  const nightJarraDays = days.filter((d) => d.nightVoidVol > 0);
  const dayVolCount = sum(days, (d) => d.dayVoidVolCount);
  const night = sum(days, (d) => d.nightUrine);
  const dayU = sum(days, (d) => d.dayUrine);
  const byTrigger = {};
  LEAK_TRIGGERS.forEach((t) => { byTrigger[t.id] = sum(days, (d) => d.leakByTrigger[t.id] || 0); });
  const totalLeaks = sum(days, (d) => d.leakCount);
  const totalVoids = sum(days, (d) => d.voidCount);
  return {
    nVoidDays: withVoid.length, nDiaryDays: withDiary.length, totalVoids, totalLeaks,
    voidsPerDay: withVoid.length ? totalVoids / withVoid.length : null,
    nocturia: withVoid.length ? sum(withVoid, (d) => d.nightVoids) / withVoid.length : null,
    nightVolPerNight: nightJarraDays.length ? sum(nightJarraDays, (d) => d.nightVoidVol) / nightJarraDays.length : null,
    leaksPerDay: withDiary.length ? totalLeaks / withDiary.length : null,
    byTrigger, nightUrine: night, dayUrine: dayU,
    npi: dayVolCount > 0 && night + dayU > 0 ? (night / (night + dayU)) * 100 : null,
  };
}

function leakPattern(sm) {
  if (!sm || sm.totalLeaks < 3) return null;
  const e = sm.byTrigger.esfuerzo / sm.totalLeaks, u = sm.byTrigger.urgencia / sm.totalLeaks;
  if (e >= 0.3 && u >= 0.3) return "Patrón mixto (esfuerzo y urgencia).";
  if (e >= 0.5) return "Predominio de escapes por esfuerzo.";
  if (u >= 0.5) return "Predominio de escapes por urgencia.";
  return "Sin un patrón claro por desencadenante.";
}

function diaryText(filtered) {
  const sm = summarizeDiary(filtered);
  const lines = [];
  if (sm.nDiaryDays > 0) {
    lines.push(`Diario miccional (${sm.nDiaryDays} días con micciones o escapes anotados):`);
    if (sm.voidsPerDay !== null) lines.push(`- Micciones anotadas por día: media ${round1(sm.voidsPerDay)}.`);
    if (sm.nocturia !== null) lines.push(`- Nocturia (micciones entre ${NIGHT_START} y ${NIGHT_END}): media ${round1(sm.nocturia)} por noche.`);
    if (sm.nightVolPerNight !== null) lines.push(`- Volumen nocturno medido en jarra: media ${round1(sm.nightVolPerNight)} ml por noche.`);
    if (sm.npi !== null) lines.push(`- Reparto de la orina estimada: ${round1(sm.npi)} % nocturna frente a ${round1(100 - sm.npi)} % diurna.`);
    if (sm.totalLeaks > 0) lines.push(`- Escapes: ${sm.totalLeaks} en total (${round1(sm.leaksPerDay)} por día); por desencadenante: ${LEAK_TRIGGERS.map((t) => `${t.short} ${sm.byTrigger[t.id]}`).join(", ")}.`);
  }
  return lines.join("\n");
}

const OLD_STORAGE_KEY = "diaper-tracker-entries-v1";
const STORAGE_KEY_LIQUIDS = "diaper-tracker-liquids-v1";
const STORAGE_KEY_DIAPERS = "diaper-tracker-diapers-v1";
const STORAGE_KEY_DAYNOTES = "diaper-tracker-daynotes-v1";
const STORAGE_KEY_SETTINGS = "diaper-tracker-settings-v1";
const STORAGE_KEY_LASTREPORT = "diaper-tracker-lastreport-v1";
const STORAGE_KEY_VOIDS = "diaper-tracker-voids-v1";
const STORAGE_KEY_LEAKS = "diaper-tracker-leaks-v1";
const storageAvailable = () => typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";

async function loadData() {
  if (!storageAvailable()) return { data: { liquids: [], diapers: [], dayNotes: {}, settings: {}, lastReport: null, voids: [], leaks: [] }, storageOk: false };
  const getKey = async (k) => { try { const r = await window.storage.get(k, false); return r && r.value ? JSON.parse(r.value) : null; } catch (e) { return null; } };
  let [voids, leaks, liquids, diapers, dayNotes, settings, lastReport] = await Promise.all([
    getKey(STORAGE_KEY_VOIDS), getKey(STORAGE_KEY_LEAKS), getKey(STORAGE_KEY_LIQUIDS),
    getKey(STORAGE_KEY_DIAPERS), getKey(STORAGE_KEY_DAYNOTES), getKey(STORAGE_KEY_SETTINGS), getKey(STORAGE_KEY_LASTREPORT)
  ]);
  if (liquids === null && diapers === null) {
    const parsed = await getKey(OLD_STORAGE_KEY);
    if (parsed) {
      liquids = parsed.liquids || []; diapers = parsed.diapers || [];
      await window.storage.set(STORAGE_KEY_LIQUIDS, JSON.stringify(liquids), false);
      await window.storage.set(STORAGE_KEY_DIAPERS, JSON.stringify(diapers), false);
    }
  }
  return { data: { liquids: liquids || [], diapers: diapers || [], dayNotes: dayNotes || {}, settings: settings || {}, lastReport: lastReport || null, voids: voids || [], leaks: leaks || [] }, storageOk: true };
}

async function saveData(data) {
  if (!storageAvailable()) return false;
  try {
    const results = await Promise.all([
      window.storage.set(STORAGE_KEY_LIQUIDS, JSON.stringify(data.liquids), false),
      window.storage.set(STORAGE_KEY_DIAPERS, JSON.stringify(data.diapers), false),
      window.storage.set(STORAGE_KEY_DAYNOTES, JSON.stringify(data.dayNotes || {}), false),
      window.storage.set(STORAGE_KEY_SETTINGS, JSON.stringify(data.settings || {}), false),
      window.storage.set(STORAGE_KEY_LASTREPORT, JSON.stringify(data.lastReport || null), false),
      window.storage.set(STORAGE_KEY_VOIDS, JSON.stringify(data.voids || []), false),
      window.storage.set(STORAGE_KEY_LEAKS, JSON.stringify(data.leaks || []), false),
    ]);
    return results.every(Boolean);
  } catch (e) {
    return false;
  }
}

// ---------- ErrorBoundary ----------
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, detail: "" };
  }
  static getDerivedStateFromError(error) { return { hasError: true, detail: String((error && (error.stack || error.message)) || error).slice(0, 600) }; }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ minHeight: "100vh", background: "#F4F7F6", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "'Plus Jakarta Sans', sans-serif" }}>

            <div style={{ fontSize: 13.5, color: "#64748B", marginBottom: 14 }}>Tus datos guardados siguen intactos.</div>
            {this.state.detail && <details style={{ textAlign: "left", fontSize: 11, color: "#64748B", marginBottom: 16 }}><summary>Detalle técnico</summary><pre style={{ whiteSpace: "pre-wrap", wordBreak: "break-word" }}>{this.state.detail}</pre></details>}

        </div>
      );
    }
    return this.props.children;
  }
}

    check();
    const id = setInterval(check, 15000);
    document.addEventListener("visibilitychange", check);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", check); };
  }, [ready]);

  const flushSave = useCallback(() => {
    if (saveTimer.current) { clearTimeout(saveTimer.current); saveTimer.current = null; }
    setSaveStatus("saving");
    saveData(dataRef.current).then((ok) => setSaveStatus(ok ? "saved" : "error"));
  }, []);

  useEffect(() => {
    if (!ready || saveStatus === "unavailable") return;
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current = setTimeout(() => {
      saveData(data).then((ok) => setSaveStatus(ok ? "saved" : "error"));
    }, 200);
    return () => clearTimeout(saveTimer.current);
  }, [data, ready, saveStatus]);

  useEffect(() => {
    const onHide = () => { if (saveTimer.current) flushSave(); };
    document.addEventListener("visibilitychange", onHide);
    window.addEventListener("pagehide", onHide);
    window.addEventListener("beforeunload", onHide);
    return () => {
      document.removeEventListener("visibilitychange", onHide);
      window.removeEventListener("pagehide", onHide);
      window.removeEventListener("beforeunload", onHide);
    };
  }, [flushSave]);

  const addLiquid = (entry) => {
    const id = uid();
    setData((d) => ({ ...d, liquids: [...d.liquids, { id, ...entry }] }));
    notifyAction(`+${entry.amount} ml registrados`, () => setData((d) => ({ ...d, liquids: d.liquids.filter((x) => x.id !== id) })));
  };
  const addDiaper = (entry) => {
    const id = uid();
    const net = round1(netWeight(entry.weight, entry.dryWeight));
    setData((d) => ({ ...d, diapers: [...d.diapers, { id, ...entry }] }));
    notifyAction(`Pañal registrado · ${net} g`, () => setData((d) => ({ ...d, diapers: d.diapers.filter((x) => x.id !== id) })));
  };
  const removeLiquid = (id) => {
    const target = dataRef.current.liquids.find((x) => x.id === id);
    setData((d) => ({ ...d, liquids: d.liquids.filter((x) => x.id !== id) }));
    if (target) notifyAction(`Eliminada ingesta de ${target.amount} ml`, () => setData((d) => ({ ...d, liquids: [...d.liquids, target] })));
  };
  const removeDiaper = (id) => {
    const target = dataRef.current.diapers.find((x) => x.id === id);
    setData((d) => ({ ...d, diapers: d.diapers.filter((x) => x.id !== id) }));
    if (target) notifyAction("Eliminado pesaje de pañal", () => setData((d) => ({ ...d, diapers: [...d.diapers, target] })));
  };
  const ENTRY_KEYS = { liquido: "liquids", panal: "diapers", miccion: "voids", escape: "leaks" };
  const updateEntry = (kind, id, patch) => setData((d) => {
    const key = ENTRY_KEYS[kind];
    if (!key) return d;
    return { ...d, [key]: (d[key] || []).map((x) => (x.id === id ? { ...x, ...patch } : x)) };
  });
  const restoreData = (incoming, mode) => setData((d) => {
    const arr = (v) => (Array.isArray(v) ? v.filter((x) => x && x.id && x.date) : []);
    const inc = {
      liquids: arr(incoming.liquids), diapers: arr(incoming.diapers), voids: arr(incoming.voids), leaks: arr(incoming.leaks),
      dayNotes: incoming.dayNotes && typeof incoming.dayNotes === "object" ? incoming.dayNotes : {},
      settings: incoming.settings && typeof incoming.settings === "object" ? incoming.settings : {},
    };
    if (mode === "replace") return { ...d, ...inc, lastReport: incoming.lastReport || null };
    const union = (a, b) => { const ids = new Set(a.map((x) => x.id)); return [...a, ...b.filter((x) => !ids.has(x.id))]; };
    return {
      ...d,
      liquids: union(d.liquids || [], inc.liquids), diapers: union(d.diapers || [], inc.diapers),
      voids: union(d.voids || [], inc.voids), leaks: union(d.leaks || [], inc.leaks),
      dayNotes: { ...inc.dayNotes, ...(d.dayNotes || {}) },
      settings: { ...inc.settings, ...(d.settings || {}) },
    };
  });
  const addVoid = (entry) => {
    const id = uid();
    setData((d) => ({ ...d, voids: [...(d.voids || []), { id, ...entry }] }));
    notifyAction(entry.volume ? `Jarra · ${entry.volume} ml` : "Micción anotada", () => setData((d) => ({ ...d, voids: (d.voids || []).filter((x) => x.id !== id) })));
  };
  const removeVoid = (id) => {
    const target = (dataRef.current.voids || []).find((x) => x.id === id);
    setData((d) => ({ ...d, voids: (d.voids || []).filter((x) => x.id !== id) }));
    if (target) notifyAction("Micción eliminada", () => setData((d) => ({ ...d, voids: [...(d.voids || []), target] })));
  };
  const addLeak = (entry) => {
    const id = uid();
    setData((d) => ({ ...d, leaks: [...(d.leaks || []), { id, ...entry }] }));
    notifyAction(`Escape · ${entry.amount}`, () => setData((d) => ({ ...d, leaks: (d.leaks || []).filter((x) => x.id !== id) })));
  };
  const removeLeak = (id) => {
    const target = (dataRef.current.leaks || []).find((x) => x.id === id);
    setData((d) => ({ ...d, leaks: (d.leaks || []).filter((x) => x.id !== id) }));
    if (target) notifyAction("Escape eliminado", () => setData((d) => ({ ...d, leaks: [...(d.leaks || []), target] })));
  };
  const setDayNote = (date, title, detail) => setData((d) => {
    const dayNotes = { ...(d.dayNotes || {}) };
    const t = (title || "").trim(), x = (detail || "").trim();
    if (t || x) dayNotes[date] = { title: t, detail: x }; else delete dayNotes[date];
    return { ...d, dayNotes };
  });
  const setDefault = (key, value) => setData((d) => ({ ...d, settings: { ...(d.settings || {}), [key]: value } }));
  const setLastReport = (report) => setData((d) => ({ ...d, lastReport: report }));

  const loadDemoData = () => {
    const demo = generateDemoDataset();
    setData((d) => ({
      ...d, liquids: demo.liquids, diapers: demo.diapers, voids: demo.voids, leaks: demo.leaks, dayNotes: demo.dayNotes,
      settings: { ...(d.settings || {}), ...demo.settings },
    }));
    notifyAction("Cargados 14 días de ejemplo", () => setData((d) => ({ ...d, liquids: [], diapers: [], voids: [], leaks: [], dayNotes: {} })));
  };

  const dailyAgg = useMemo(() => {
    const map = {};
    const ensure = (date) => {
      map[date] = map[date] || { date, liquidTotal: 0, liquidCount: 0, diaperTotal: 0, diaperCount: 0, diaperWeights: [], liquidNotes: [], diaperNotes: [], dayNote: "", voidCount: 0, voidVolume: 0, voidVolCount: 0, nightVoids: 0, nightVoidVol: 0, dayVoidVolCount: 0, leakCount: 0, leakByTrigger: {}, nightUrine: 0, dayUrine: 0 };
      return map[date];
    };
    for (const l of data.liquids) {
      const row = ensure(dayOf(l));
      row.liquidTotal += Number(l.amount) || 0; row.liquidCount += 1;
      if (l.note) row.liquidNotes.push(l.note);
    }
    for (const p of data.diapers) {
      const row = ensure(dayOf(p));
      const net = netWeight(p.weight, p.dryWeight);
      row.diaperTotal += net; row.diaperCount += 1; row.diaperWeights.push(net);
      if (p.note) row.diaperNotes.push(p.note);
      if (voidIsNight(p)) row.nightUrine += net; else row.dayUrine += net;
    }
    for (const v of (data.voids || [])) {
      const row = ensure(dayOf(v));
      row.voidCount += 1;
      const night = voidIsNight(v);
      if (night) row.nightVoids += 1;
      const vol = Number(v.volume);
      if (vol > 0) {
        row.voidVolume += vol; row.voidVolCount += 1;
        if (night || v.isFirstMorning) {
          row.nightUrine += vol;
          if (night) row.nightVoidVol += vol;
        } else {
          row.dayUrine += vol; row.dayVoidVolCount += 1;
        }
      }
    }
    for (const l of (data.leaks || [])) {
      const row = ensure(dayOf(l));
      row.leakCount += 1; row.leakByTrigger[l.trigger] = (row.leakByTrigger[l.trigger] || 0) + 1;
    }
    for (const [date, v] of Object.entries(data.dayNotes || {})) {
      const n = noteParts(v);
      const row = ensure(date);
      row.dayNote = n.title; row.dayNoteDetail = n.detail;
    }
    return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
  }, [data]);

  const allDates = dailyAgg.map((d) => d.date);
  const minDate = allDates[0] || todayStr();
  const maxDate = allDates[allDates.length - 1] || todayStr();

  const streak = useMemo(() => {
    if (!allDates.length) return 0;
    const dateSet = new Set(allDates);
    let count = 0;
    const cursor = new Date(logicalToday() + "T00:00:00");
    if (!dateSet.has(logicalToday())) cursor.setDate(cursor.getDate() - 1);
    while (dateSet.has(toLocalIsoDate(cursor))) { count++; cursor.setDate(cursor.getDate() - 1); }
    return count;
  }, [allDates]);

  const lastDryWeight = useMemo(() => {
    if (!data.diapers.length) return "";
    const sorted = [...data.diapers].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    return sorted[sorted.length - 1].dryWeight ?? "";
  }, [data.diapers]);

  if (!ready) {
    return (
      <div style={{ minHeight: "100vh", background: COLORS.paper, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, fontFamily: "'Plus Jakarta Sans', sans-serif", color: COLORS.inkSoft }}>
        <LogoMark size={52} />
        <div style={{ fontSize: 14, fontWeight: 600 }}>Cargando Incontrol…</div>
      </div>
    );
  }

  return (
    <ThemeContext.Provider value={COLORS}>
      <div style={{ minHeight: "100vh", background: COLORS.paper, fontFamily: "'Plus Jakarta Sans', ui-sans-serif, sans-serif", color: COLORS.ink, transition: "background 250ms ease, color 250ms ease" }}>
        <style>{`
          * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
          .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
          input[type="date"], input[type="time"], input[type="number"], input[type="text"], input[type="password"], select, textarea {
            font-family: 'Plus Jakarta Sans', sans-serif;
            border: 1.5px solid transparent;
            background: ${COLORS.inputBg};
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 600;
            color: ${COLORS.ink};
            outline: none;
            transition: all 160ms ease;
          }
          input[type="number"], input[type="date"], input[type="time"] { font-family: 'JetBrains Mono', monospace; }
          input:focus, select:focus, textarea:focus {
            background: ${COLORS.card};
            border-color: ${COLORS.teal};
            box-shadow: 0 0 0 4px ${COLORS.tealSoft};
          }
          button { cursor: pointer; font-family: inherit; transition: transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1), background 160ms ease, opacity 160ms ease; }
          button:active { transform: scale(0.96); }
          @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
          @keyframes sheetUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
          .tab-view { animation: fadeSlideUp 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
          .bottom-sheet { animation: sheetUp 280ms cubic-bezier(0.16, 1, 0.3, 1); }
        `}</style>

        {dueReminder && (
          <div className="no-print" role="alert" style={{ position: "fixed", top: 14, left: 14, right: 14, zIndex: 55, maxWidth: 480, margin: "0 auto", background: COLORS.card, borderRadius: 20, padding: "14px 16px", display: "flex", alignItems: "center", gap: 12, boxShadow: COLORS.shadowLg }}>
            <div style={{ width: 42, height: 42, borderRadius: 14, background: COLORS.tealSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <Bell size={20} color={COLORS.teal} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 800, fontSize: 14.5 }}>Hora de beber ({dueReminder})</div>
              <div style={{ fontSize: 12.5, color: COLORS.inkSoft }}>Anota tu toma cuando la realices.</div>
            </div>
            <button onClick={() => { setTab("registro"); setDueReminder(null); window.dispatchEvent(new CustomEvent("incontrol-goto", { detail: "liquido" })); }} style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 12, padding: "9px 14px", fontSize: 13, fontWeight: 700 }}>Anotar</button>
            <button onClick={() => setDueReminder(null)} aria-label="Cerrar" style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 4 }}><X size={18} /></button>
          </div>
        )}

        <Header
          daysCount={dailyAgg.length}
          streak={streak}
          saveStatus={saveStatus}
          onRetry={flushSave}
          isDark={isDark}
          onToggleDark={() => setDefault("darkMode", !isDark)}
          onOpenSettings={() => setShowSettingsModal(true)}
        />

        {toast && (
          <div className="no-print" role="status" style={{ position: "fixed", bottom: 88, left: 16, right: 16, zIndex: 50, maxWidth: 420, margin: "0 auto", background: "#0F172A", color: "#F8FAFC", borderRadius: 18, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, boxShadow: COLORS.shadowLg, animation: "fadeSlideUp 200ms ease-out" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <CheckCircle2 size={17} color="#2DD4BF" />
              <span style={{ fontSize: 13.5, fontWeight: 600 }}>{toast.label}</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {toast.undoFn && (
                <button
                  onClick={() => { toast.undoFn(); setToast(null); }}
                  style={{ display: "flex", alignItems: "center", gap: 4, background: "rgba(255,255,255,0.14)", color: "#fff", border: "none", borderRadius: 10, padding: "6px 11px", fontSize: 12, fontWeight: 700 }}
                >
                  <Undo2 size={13} /> Deshacer
                </button>
              )}
              <button onClick={() => setToast(null)} aria-label="Cerrar" style={{ background: "none", border: "none", color: "#94A3B8", padding: 2, display: "flex" }}>
                <X size={16} />
              </button>
            </div>
          </div>
        )}

        {showSettingsModal && (
          <SettingsModal
            onClose={() => setShowSettingsModal(false)}
            settings={data.settings || {}}
            setDefault={setDefault}
            data={data}
            onRestore={restoreData}
            onLoadDemo={loadDemoData}
          />
        )}

        <main style={{ maxWidth: 680, margin: "0 auto", padding: "12px 18px 112px" }}>
          <div key={tab} className="tab-view">
            {tab === "registro" && (
              <RegistroTab
                data={data}
                addLiquid={addLiquid}
                addDiaper={addDiaper}
                removeLiquid={removeLiquid}
                removeDiaper={removeDiaper}
                updateEntry={updateEntry}
                lastDryWeight={lastDryWeight}
                dailyAgg={dailyAgg}
                setDayNote={setDayNote}
                addVoid={addVoid} removeVoid={removeVoid} addLeak={addLeak} removeLeak={removeLeak}
                settings={data.settings || {}}
                setDefault={setDefault}
                onLoadDemo={loadDemoData}
              />
            )}
            {tab === "graficas" && (
              <GraficasTab dailyAgg={dailyAgg} minDate={minDate} maxDate={maxDate} />
            )}
            {tab === "informe" && (
              <InformeTab dailyAgg={dailyAgg} minDate={minDate} maxDate={maxDate} lastReport={data.lastReport} setLastReport={setLastReport} />
            )}
          </div>
        </main>

        <BottomNav tab={tab} setTab={setTab} />
      </div>
    </ThemeContext.Provider>
  );
}

// ---------- anillo circular de progreso ----------
function ProgressRing({ progress, color, size = 56, stroke = 5.5, icon: Icon }) {
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;
  const clamped = Math.max(0, Math.min(100, progress || 0));
  const offset = circumference - (clamped / 100) * circumference;

  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="rgba(255,255,255,0.16)" strokeWidth={stroke} />
        <circle
          cx={size / 2} cy={size / 2} r={radius} fill="none"
          stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={circumference} strokeDashoffset={offset}
          style={{ transition: "stroke-dashoffset 500ms cubic-bezier(0.2, 0.8, 0.2, 1)" }}
        />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <Icon size={20} color={color} strokeWidth={2.2} />
      </div>
    </div>
  );
}

// ---------- tarjeta resumen HOY ----------
function TodayCard({ todayAgg, lastAgg, onOpenAction, onLoadDemo }) {
  const hasToday = todayAgg && (todayAgg.liquidCount > 0 || todayAgg.diaperCount > 0 || todayAgg.voidCount > 0 || todayAgg.leakCount > 0);
  const displayAgg = hasToday ? todayAgg : lastAgg;
  const showingPast = !hasToday && !!displayAgg;
  const [showHelp, setShowHelp] = useState(false);

  const severity = displayAgg ? classifyLoss(displayAgg.diaperTotal) : null;
  const hydration = displayAgg ? classifyLiquid(displayAgg.liquidTotal) : null;

  const liquidPct = displayAgg ? Math.min(100, Math.round((displayAgg.liquidTotal / LIQUID_RECOMMENDED) * 100)) : 0;
  const lossPct = displayAgg ? Math.min(100, Math.round((displayAgg.diaperTotal / SEVERITY_THRESHOLDS.severa) * 100)) : 0;
  const voidClass = displayAgg ? classifyVoids(displayAgg) : null;
  const voidPct = displayAgg ? Math.min(100, Math.round((displayAgg.voidCount / (VOID_DAY_MAX + VOID_NIGHT_MAX)) * 100)) : 0;

  return (
    <div style={{
      marginBottom: 22, borderRadius: 26, padding: "22px",
      background: "linear-gradient(135deg, #0D3B38 0%, #115E59 55%, #0F766E 100%)",
      color: "#FFFFFF", boxShadow: "0 16px 36px -10px rgba(13, 59, 56, 0.42)",

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18, gap: 8, flexWrap: "wrap" }}>
        <div style={{ fontSize: 12.5, fontWeight: 700, opacity: 0.85, textTransform: "capitalize" }}>
          {showingPast ? `Último registro · ${fmtDateFull(displayAgg.date)}` : `Hoy · ${fmtDateFull(logicalToday())}`}
        </div>
        {displayAgg && displayAgg.leakCount > 0 && (
          <div style={{ display: "flex", gap: 6, fontSize: 11.5, fontWeight: 700 }}>
            {displayAgg.leakCount > 0 && (
              <span style={{ background: "rgba(255,255,255,0.14)", padding: "4px 10px", borderRadius: 99 }}>
                {displayAgg.leakCount} {displayAgg.leakCount === 1 ? "escape" : "escapes"}
              </span>
            )}
          </div>
        )}
      </div>

      {!displayAgg ? (
        <div>
          <div style={{ fontSize: 18, fontWeight: 800, marginBottom: 6, letterSpacing: "-0.02em" }}>
            Empieza tu seguimiento diario
          </div>
          <div style={{ fontSize: 13.5, opacity: 0.86, marginBottom: 18, lineHeight: 1.5 }}>
            Registra tus tomas de líquido, el peso de los pañales o la jarra nocturna en segundos.
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button onClick={() => onOpenAction("panal")} style={{ display: "flex", alignItems: "center", gap: 7, background: "#FFFFFF", color: "#0D3B38", border: "none", borderRadius: 14, padding: "11px 16px", fontSize: 13.5, fontWeight: 800 }}>
              <Scale size={16} /> Pesar pañal
            </button>
            <button onClick={() => onOpenAction("liquido")} style={{ display: "flex", alignItems: "center", gap: 7, background: "rgba(255,255,255,0.16)", color: "#FFFFFF", border: "none", borderRadius: 14, padding: "11px 16px", fontSize: 13.5, fontWeight: 700 }}>
              <Droplets size={16} /> Anotar líquido
            </button>
            {onLoadDemo && (
              <button onClick={onLoadDemo} style={{ display: "flex", alignItems: "center", gap: 7, background: "rgba(255,255,255,0.1)", color: "#FFFFFF", border: "1px dashed rgba(255,255,255,0.35)", borderRadius: 14, padding: "11px 16px", fontSize: 13, fontWeight: 600 }}>
                <Database size={15} /> Ver ejemplo (14 días)
              </button>
            )}
          </div>
        </div>
      ) : (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 12 }}>
            <div style={{ background: "rgba(255,255,255,0.1)", backdropFilter: "blur(8px)", borderRadius: 20, padding: "14px 12px", display: "flex", alignItems: "center", gap: 10, minWidth: 0, minHeight: 92 }}>
              <ProgressRing progress={liquidPct} color="#7DD3FC" icon={Droplets} size={48} />
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 12, opacity: 0.8, fontWeight: 600, marginBottom: 2, whiteSpace: "nowrap" }}>Hidratación</div>
                <div className="num" style={{ fontSize: 20, fontWeight: 700, lineHeight: 1.1, whiteSpace: "nowrap" }}>
                  {round1(displayAgg.liquidTotal)}<span style={{ fontSize: 12, fontWeight: 500, opacity: 0.75 }}> ml</span>
                </div>
                <div style={{ fontSize: 11, opacity: 0.8, marginTop: 4 }}>
                  {hydration ? hydration.label : ""}
                </div>
                <div style={{ fontSize: 10.5, opacity: 0.65, marginTop: 2, whiteSpace: "nowrap" }}>
                  {liquidPct} % de {fmtEs(LIQUID_RECOMMENDED, 0)} ml
                </div>
              </div>
            </div>

            <div style={{ background: "rgba(255,255,255,0.1)", backdropFilter: "blur(8px)", borderRadius: 20, padding: "14px 12px", display: "flex", alignItems: "center", gap: 10, minWidth: 0, minHeight: 92 }}>
              <ProgressRing progress={lossPct} color="#FCD34D" icon={Scale} size={48} />
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 12, opacity: 0.8, fontWeight: 600, marginBottom: 2, whiteSpace: "nowrap" }}>Pérdida neta</div>
                <div className="num" style={{ fontSize: 20, fontWeight: 700, lineHeight: 1.1, whiteSpace: "nowrap" }}>
                  {round1(displayAgg.diaperTotal)}<span style={{ fontSize: 12, fontWeight: 500, opacity: 0.75 }}> g</span>
                </div>
                <div style={{ fontSize: 11, opacity: 0.8, marginTop: 4 }}>
                  {severity ? severity.label : `${displayAgg.diaperCount} cambios`}
                </div>
                <div style={{ fontSize: 10.5, opacity: 0.65, marginTop: 2, whiteSpace: "nowrap" }}>
                  {lossPct} % de {fmtEs(SEVERITY_THRESHOLDS.severa, 0)} g
                </div>
              </div>
            </div>
          </div>

          <div style={{ marginTop: 12, background: "rgba(255,255,255,0.1)", backdropFilter: "blur(8px)", borderRadius: 20, padding: "14px 12px", display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
            <ProgressRing progress={voidPct} color="#A5B4FC" icon={ToiletIcon} size={48} />
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ fontSize: 12, opacity: 0.8, fontWeight: 600, marginBottom: 2 }}>Micciones</div>
              <div className="num" style={{ fontSize: 20, fontWeight: 700, lineHeight: 1.1 }}>
                {displayAgg.voidCount}<span style={{ fontSize: 12, fontWeight: 500, opacity: 0.75 }}> {displayAgg.voidCount === 1 ? "vez" : "veces"}</span>
                {displayAgg.voidVolume > 0 && <span style={{ fontSize: 12, fontWeight: 500, opacity: 0.75 }}> · {round1(displayAgg.voidVolume)} ml medidos</span>}
              </div>
              <div style={{ fontSize: 11, opacity: 0.8, marginTop: 4 }}>
                {voidClass ? voidClass.label : "Sin micciones anotadas"}{displayAgg.nightVoids > 0 ? ` · ${displayAgg.nightVoids} de noche` : ""}
              </div>
            </div>
          </div>

          <button onClick={() => setShowHelp((v) => !v)} aria-expanded={showHelp}
            style={{ marginTop: 12, display: "inline-flex", alignItems: "center", gap: 6, background: "rgba(255,255,255,0.12)", color: "#fff", border: "none", borderRadius: 99, padding: "7px 13px", fontSize: 12, fontWeight: 700 }}>
            <AlertCircle size={14} /> Interpretación <ChevronRight size={14} style={{ transform: showHelp ? "rotate(90deg)" : "none", transition: "transform 150ms" }} />
          </button>
          {showHelp && (
          <div style={{ marginTop: 8, fontSize: 11.5, lineHeight: 1.5, opacity: 0.8 }}>
            <b>Qué indican los círculos.</b> Cada uno compara el total del día con una referencia orientativa:
            {" "}<b>Hidratación</b> con {fmtEs(LIQUID_RECOMMENDED, 0)} ml de líquido al día (círculo lleno = referencia alcanzada; es mejor estar cerca de ella).
            {" "}<b>Pérdida neta</b> con {fmtEs(SEVERITY_THRESHOLDS.severa, 0)} g al día, el límite a partir del cual se considera «muy severa» (aquí, círculo más lleno = más pérdida).
            {" "}<b>Micciones</b> con {VOID_DAY_MAX + VOID_NIGHT_MAX} al día ({VOID_DAY_MAX} de día y {VOID_NIGHT_MAX} de noche), lo que se considera normal: más de 8 de día = frecuentes; 2 o más de noche = nocturia.
          </div>
          )}

          {showingPast && (
            <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid rgba(255,255,255,0.14)", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
              <span style={{ fontSize: 12.5, opacity: 0.88 }}>Sin anotaciones hoy todavía</span>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => onOpenAction("panal")} style={{ background: "#fff", color: "#0D3B38", border: "none", borderRadius: 10, padding: "6px 12px", fontSize: 12, fontWeight: 800 }}>+ Pañal</button>
                <button onClick={() => onOpenAction("liquido")} style={{ background: "rgba(255,255,255,0.18)", color: "#fff", border: "none", borderRadius: 10, padding: "6px 12px", fontSize: 12, fontWeight: 700 }}>+ Líquido</button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Taza de váter (SVG propio con el mismo trazo que lucide)
function ToiletIcon({ size = 24, color = "currentColor", strokeWidth = 2, style, ...rest }) {
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style} aria-hidden="true" {...rest}>
      <path d="M7 3h10v5H7z" />
      <path d="M4 11h16" />
      <path d="M5 11c0 4 1.5 6 4 7v3h6v-3c2.5-1 4-3 4-7" />
    </svg>
  );
}

// ---------- Bottom Sheet modal para formularios ----------
function ActionBottomSheet({ activeAction, onClose, children }) {
  const COLORS = useTheme();
  const [extraTab, setExtraTab] = useState("escape");

  useEffect(() => {
    if (activeAction === "escape" || activeAction === "nota") setExtraTab(activeAction);
  }, [activeAction]);

  useEffect(() => {
    if (!activeAction) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [activeAction, onClose]);

  if (!activeAction) return null;

  const titles = {
    panal: "Registrar pesaje de pañal",
    liquido: "Registrar ingesta de líquido",
    miccion: "Registrar micción",
    escape: "Incidencia o nota del día",
    nota: "Incidencia o nota del día",
  };

  return (
    <div
      role="dialog"
      aria-modal="true"
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, zIndex: 60,
        background: "rgba(15, 23, 42, 0.55)", backdropFilter: "blur(4px)",
        display: "flex", alignItems: "flex-end", justifyContent: "center",
      }}
    >
      <div
        className="bottom-sheet"
        onClick={(e) => e.stopPropagation()}
        style={{
          width: "100%", maxWidth: 640, maxHeight: "90vh", overflowY: "auto",
          background: COLORS.card, borderTopLeftRadius: 28, borderTopRightRadius: 28,
          padding: "12px 20px calc(24px + env(safe-area-inset-bottom, 0px))",
          boxShadow: COLORS.shadowLg,
        }}
      >
        <div style={{ width: 40, height: 4, borderRadius: 99, background: COLORS.line, margin: "0 auto 14px" }} />
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
          <div style={{ fontSize: 18, fontWeight: 800, letterSpacing: "-0.02em" }}>{titles[activeAction]}</div>
          <button onClick={onClose} aria-label="Cerrar" style={{ width: 34, height: 34, borderRadius: 99, border: "none", background: COLORS.inputBg, color: COLORS.inkSoft, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <X size={18} />
          </button>
        </div>

        {(activeAction === "escape" || activeAction === "nota") && (
          <div style={{ display: "flex", gap: 8, marginBottom: 16, background: COLORS.inputBg, padding: 5, borderRadius: 14 }}>
            <button
              onClick={() => setExtraTab("escape")}
              style={{
                flex: 1, padding: "9px", borderRadius: 11, border: "none", fontSize: 13, fontWeight: 700,
                background: extraTab === "escape" ? COLORS.card : "transparent",
                color: extraTab === "escape" ? COLORS.ink : COLORS.inkSoft,
                boxShadow: extraTab === "escape" ? COLORS.shadowSm : "none",
              }}
            >
              Registrar escape
            </button>
            <button
              onClick={() => setExtraTab("nota")}
              style={{
                flex: 1, padding: "9px", borderRadius: 11, border: "none", fontSize: 13, fontWeight: 700,
                background: extraTab === "nota" ? COLORS.card : "transparent",
                color: extraTab === "nota" ? COLORS.ink : COLORS.inkSoft,
                boxShadow: extraTab === "nota" ? COLORS.shadowSm : "none",
              }}
            >
              Nota del día
            </button>
          </div>
        )}

        {typeof children === "function" ? children(extraTab) : children}
      </div>
    </div>
  );
}

// ---------- Tab: registro ----------
function RegistroTab({ data, addLiquid, addDiaper, removeLiquid, removeDiaper, lastDryWeight, dailyAgg, setDayNote, addVoid, removeVoid, addLeak, removeLeak, updateEntry, settings, setDefault, onLoadDemo }) {
  const COLORS = useTheme();
  const [activeSheet, setActiveSheet] = useState(null);
  const [editing, setEditing] = useState(null);
  const [historyFilter, setHistoryFilter] = useState("panal");
  const [visibleDays, setVisibleDays] = useState(10);
  const [openDays, setOpenDays] = useState({}); // por defecto solo está desplegado el último día
  useEffect(() => { setVisibleDays(10); }, [historyFilter]);
  const totalEntries = data.liquids.length + data.diapers.length + (data.voids || []).length + (data.leaks || []).length;
  const lastBackup = settings?.lastBackup;
  const backupAge = lastBackup ? Math.floor((new Date(todayStr() + "T00:00:00") - new Date(lastBackup + "T00:00:00")) / 86400000) : null;
  const needsBackup = totalEntries >= 10 && (backupAge === null || backupAge > 14);

  useEffect(() => {
    const h = (e) => setActiveSheet(e.detail);
    window.addEventListener("incontrol-goto", h);
    return () => window.removeEventListener("incontrol-goto", h);
  }, []);

  const unifiedTimeline = useMemo(() => {
    const all = [
      ...data.liquids.map((l) => ({ ...l, kind: "liquido" })),
      ...data.diapers.map((p) => ({ ...p, kind: "panal" })),
      ...(data.voids || []).map((v) => ({ ...v, kind: "miccion" })),
      ...(data.leaks || []).map((k) => ({ ...k, kind: "escape" })),
    ];
    const filtered = historyFilter === "todos" ? all : all.filter((it) => it.kind === historyFilter);
    filtered.sort((a, b) => ((b.date || "") + (b.time || "")).localeCompare((a.date || "") + (a.time || "")));
    const byDay = {};
    for (const it of filtered) {
      const dk = dayOf(it);
      byDay[dk] = byDay[dk] || [];
      byDay[dk].push(it);
    }
    return Object.entries(byDay).sort((a, b) => b[0].localeCompare(a[0]));
  }, [data, historyFilter]);

  const dayAggMap = useMemo(() => Object.fromEntries(dailyAgg.map((d) => [d.date, d])), [dailyAgg]);
  const todayAgg = dayAggMap[logicalToday()];
  const lastAgg = dailyAgg.length ? dailyAgg[dailyAgg.length - 1] : null;

  return (
    <div>
      <TodayCard todayAgg={todayAgg} lastAgg={lastAgg} onOpenAction={setActiveSheet} onLoadDemo={dailyAgg.length === 0 ? onLoadDemo : null} />

      {needsBackup && (
        <button
          onClick={() => window.dispatchEvent(new CustomEvent("incontrol-open-settings"))}
          className="no-print"
          style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, textAlign: "left", background: COLORS.amberSoft, color: COLORS.amber, border: "none", borderRadius: 18, padding: "12px 14px", marginBottom: 18, fontSize: 13, fontWeight: 700 }}
        >
          <Download size={17} style={{ flexShrink: 0 }} />
          <span style={{ flex: 1 }}>{backupAge === null ? "Aún no tienes copia de seguridad de tus datos." : `Hace ${backupAge} días de tu última copia de seguridad.`} Toca para hacerla.</span>
          <ChevronRight size={16} />
        </button>
      )}

      <QuickActionGrid onSelect={setActiveSheet} onExportExcel={() => exportAllExcel(data, dailyAgg)} />

      <ActionBottomSheet activeAction={activeSheet} onClose={() => setActiveSheet(null)}>
        {(extraTab) => (
          <>
            {activeSheet === "liquido" && (
              <LiquidForm
                onAdd={(e) => { addLiquid(e); setHistoryFilter("liquido"); setActiveSheet(null); }}
                defaultAmount={settings?.defaultLiquidAmount}
                onSetDefault={(v) => setDefault("defaultLiquidAmount", v)}
              />
            )}
            {activeSheet === "panal" && (
              <DiaperForm
                onAdd={(e) => { addDiaper(e); setHistoryFilter("panal"); setActiveSheet(null); }}
                lastDryWeight={lastDryWeight}
                settings={settings}
                setDefault={setDefault}
              />
            )}
            {activeSheet === "miccion" && (
              <VoidForm onAdd={(e) => { addVoid(e); setHistoryFilter("miccion"); setActiveSheet(null); }} />
            )}
            {(activeSheet === "escape" || activeSheet === "nota") && extraTab === "escape" && (
              <LeakForm onAdd={(e) => { addLeak(e); setHistoryFilter("escape"); setActiveSheet(null); }} />
            )}
            {(activeSheet === "escape" || activeSheet === "nota") && extraTab === "nota" && (
              <DayNoteForm
                dayNotes={data.dayNotes || {}}
                setDayNote={(d, t, x) => { setDayNote(d, t, x); setActiveSheet(null); }}
              />
            )}
          </>
        )}
      </ActionBottomSheet>

      {editing && (
        <EditEntryDialog
          kind={editing.kind}
          entry={editing.entry}
          onClose={() => setEditing(null)}
          onSave={(patch) => { updateEntry(editing.kind, editing.entry.id, patch); setEditing(null); }}
        />
      )}

      <div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
          <span style={{ fontSize: 13, fontWeight: 800, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>
            Cronología
          </span>
          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 2 }}>
            {[
              { id: "todos", label: "Todos", Icon: BookOpen },
              { id: "panal", label: "Pañales", Icon: Scale },
              { id: "liquido", label: "Líquidos", Icon: Droplets },
              { id: "miccion", label: "Micciones", Icon: ToiletIcon },
              { id: "escape", label: "Escapes", Icon: AlertCircle },
            ].map((f) => {
              const active = historyFilter === f.id;
              return (
                <button
                  key={f.id}
                  onClick={() => setHistoryFilter(f.id)}
                  style={{
                    display: "inline-flex", alignItems: "center", gap: 5,
                    padding: "6px 12px", borderRadius: 99, fontSize: 12, fontWeight: 700, border: "none", whiteSpace: "nowrap",
                    background: active ? COLORS.teal : COLORS.card,
                    color: active ? "#FFFFFF" : COLORS.inkSoft,
                    boxShadow: COLORS.shadowSm,
                  }}
                >
                  <f.Icon size={13} /> {f.label}
                </button>
              );
            })}
          </div>
        </div>

        {unifiedTimeline.length === 0 && (
          <EmptyState icon={BookOpen} text="Aún no hay registros en esta vista." />
        )}

        {unifiedTimeline.slice(0, visibleDays).map(([date, items], dayIdx) => {
          const dayAgg = dayAggMap[date];
          const severity = classifyLoss(dayAgg?.diaperTotal);
          const hydration = classifyLiquid(dayAgg?.liquidTotal);
          const voidClass = classifyVoids(dayAgg);
          const isOpen = openDays[date] !== undefined ? openDays[date] : dayIdx === 0;
          const showKind = (k) => historyFilter === "todos" || historyFilter === k;
          const counts = [
            showKind("panal") && dayAgg?.diaperCount ? `${dayAgg.diaperCount} ${dayAgg.diaperCount === 1 ? "pañal" : "pañales"}` : null,
            showKind("liquido") && dayAgg?.liquidCount ? `${dayAgg.liquidCount} ${dayAgg.liquidCount === 1 ? "ingesta" : "ingestas"}` : null,
            showKind("miccion") && dayAgg?.voidCount ? `${dayAgg.voidCount} ${dayAgg.voidCount === 1 ? "micción" : "micciones"}${dayAgg.nightVoids ? ` (${dayAgg.nightVoids} de noche)` : ""}` : null,
            showKind("escape") && dayAgg?.leakCount ? `${dayAgg.leakCount} ${dayAgg.leakCount === 1 ? "escape" : "escapes"}` : null,
          ].filter(Boolean);
          return (
            <div key={date} style={{ marginBottom: isOpen ? 22 : 12 }}>
              <div
                role="button" tabIndex={0} aria-expanded={isOpen}
                onClick={() => setOpenDays((o) => ({ ...o, [date]: !isOpen }))}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setOpenDays((o) => ({ ...o, [date]: !isOpen })); } }}
                style={{ display: "flex", flexDirection: "column", alignItems: "stretch", gap: 7, marginBottom: isOpen ? 4 : 0, padding: isOpen ? "0 4px" : "12px 14px", cursor: "pointer", background: isOpen ? "transparent" : COLORS.card, borderRadius: 18, boxShadow: isOpen ? "none" : COLORS.shadowSm }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, color: COLORS.ink, fontWeight: 800, textTransform: "capitalize" }}>
                  <ChevronRight size={16} color={COLORS.inkSoft} style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 150ms" }} />
                  {date === logicalToday() ? "Hoy" : fmtDateFull(date)}
                </div>
                {(showKind("panal") && severity || showKind("miccion") && voidClass || showKind("liquido") && hydration || showKind("escape") && dayAgg?.leakCount > 0) && (
                <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 6, paddingLeft: 22 }}>
                  {showKind("panal") && severity && (
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 700, color: severity.color, background: severity.bg, padding: "3px 9px", borderRadius: 99 }}>
                      <Scale size={11} /> {severity.label} · {round1(dayAgg.diaperTotal)} g
                    </span>
                  )}
                  {showKind("miccion") && voidClass && (
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 700, color: voidClass.color, background: voidClass.bg, padding: "3px 9px", borderRadius: 99 }}>
                      <ToiletIcon size={11} /> {voidClass.label} · {dayAgg.voidCount} micc.{dayAgg.voidVolume > 0 ? ` · ${round1(dayAgg.voidVolume)} ml` : ""}
                    </span>
                  )}
                  {showKind("escape") && dayAgg?.leakCount > 0 && (
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 700, color: COLORS.rose, background: COLORS.roseSoft, padding: "3px 9px", borderRadius: 99 }}>
                      <AlertCircle size={11} /> {dayAgg.leakCount} {dayAgg.leakCount === 1 ? "escape" : "escapes"}
                    </span>
                  )}
                  {showKind("liquido") && hydration && (
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11, fontWeight: 700, color: hydration.color, background: hydration.bg, padding: "3px 9px", borderRadius: 99 }}>
                      <Droplets size={11} /> {round1(dayAgg.liquidTotal)} ml · {hydration.label}
                    </span>
                  )}
                </div>
                )}
                {!isOpen && (
                  <div style={{ fontSize: 11.5, color: COLORS.inkSoft, lineHeight: 1.4, paddingLeft: 22 }}>
                    {counts.join(" · ")}{dayAgg?.dayNote ? `${counts.length ? " · " : ""}“${dayAgg.dayNote}”` : ""}
                  </div>
                )}
              </div>

              {isOpen && (
                <div style={{ fontSize: 11.5, color: COLORS.inkSoft, padding: "0 4px 10px 26px", lineHeight: 1.4 }}>
                  {counts.join(" · ")}
                </div>
              )}

                          {it.kind === "miccion" && (

                              {it.isFirstMorning ? "1.ª micción al despertar" : isNight ? "Micción nocturna" : "Micción"}{isNight && !it.isFirstMorning ? <Moon size={12} style={{ marginLeft: 6, verticalAlign: "-1px" }} color={COLORS.inkSoft} /> : null}{it.period ? <span style={{ fontSize: 10.5, fontWeight: 700, color: COLORS.inkSoft, marginLeft: 6 }}>(reclasificada)</span> : null}
                              {it.volume ? <> · <span className="num" style={{ color: COLORS.blue }}>{it.volume} ml</span></> : ""}
                            </>
                          )}
                          {it.kind === "escape" && (
                            <>Escape · {(LEAK_TRIGGERS.find((t) => t.id === it.trigger) || {}).short || it.trigger} ({it.amount})</>
                          )}
                        </div>
                        <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>
                          <span className="num">{it.time}</span>
                          {it.kind === "panal" && <span className="num"> · {it.weight} g − {it.dryWeight || 0} g tara</span>}
                          {it.note ? ` · ${it.note}` : ""}
                        </div>
                      </div>
                      <button onClick={() => setEditing({ kind: it.kind, entry: it })} style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 10 }} aria-label="Editar">
                        <Pencil size={15} />
                      </button>
                      <button onClick={removeAction} style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 10 }} aria-label="Eliminar">
                        <Trash2 size={15} />
                      </button>
                    </div>
                  );
                })}
              </div>
              </>)}
            </div>
          );
        })}

        {unifiedTimeline.length > visibleDays && (
          <button
            onClick={() => setVisibleDays((n) => n + 10)}
            className="no-print"
            style={{ width: "100%", background: COLORS.card, color: COLORS.teal, border: "none", borderRadius: 18, padding: "13px", fontSize: 13.5, fontWeight: 700, boxShadow: COLORS.shadowSm }}
          >
            Ver más días ({unifiedTimeline.length - visibleDays} restantes)
          </button>
        )}
      </div>
    </div>
  );
}

          {[...new Set([...(defaultAmount ? [Number(defaultAmount)] : []), 100, 150, 200, 250, 330])].slice(0, 5).map((ml) => (
            <button

              onClick={() => submit(ml)}

        </Field>

            color: isCurrentDefault ? COLORS.teal : COLORS.inkSoft,

          }}

function DiaperForm({ onAdd, lastDryWeight, settings, setDefault }) {
  const COLORS = useTheme();
  const dayDry = settings?.defaultDryWeight ?? (lastDryWeight !== "" ? lastDryWeight : "");
  const nightDry = settings?.nightDryWeight ?? dayDry;

  const [profile, setProfile] = useState(() => (isNightTime(nowTimeStr()) ? "night" : "day"));
  const [weight, setWeight] = useState("");
  const [dryWeight, setDryWeight] = useState(() => (isNightTime(nowTimeStr()) ? nightDry : dayDry));
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState(nowTimeStr());
  const [note, setNote] = useState("");
  const [period, setPeriod] = useState("");

  const selectProfile = (p) => {
    setProfile(p);
    setDryWeight(p === "night" ? nightDry : dayDry);
  };

  const saveProfileTara = () => {
    const w = Number(dryWeight);
    if (!(w >= 0)) return;
    if (profile === "night") setDefault("nightDryWeight", w);
    else setDefault("defaultDryWeight", w);
  };

  const submit = () => {
    const w = Number(weight);
    if (!w || w <= 0) return;
    onAdd({
      weight: w, dryWeight: dryWeight === "" ? "" : Number(dryWeight), date, time,
      note: note.trim() || (profile === "night" ? "Nocturno" : ""), ...(period ? { period } : {}),
    });
  };

  const net = weight !== "" ? netWeight(weight, dryWeight) : null;
  const savedTara = profile === "night" ? nightDry : dayDry;
  const isSaved = savedTara !== "" && Number(savedTara) === Number(dryWeight);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 8, background: COLORS.inputBg, padding: 5, borderRadius: 16 }}>
        <button
          onClick={() => selectProfile("day")}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            padding: "10px", borderRadius: 12, border: "none", fontSize: 13, fontWeight: 700,
            background: profile === "day" ? COLORS.card : "transparent",
            color: profile === "day" ? COLORS.amber : COLORS.inkSoft,
            boxShadow: profile === "day" ? COLORS.shadowSm : "none",
          }}
        >
          <Sun size={15} /> Día (<span className="num">{dayDry === "" ? "sin fijar" : `${dayDry} g`}</span>)
        </button>
        <button
          onClick={() => selectProfile("night")}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            padding: "10px", borderRadius: 12, border: "none", fontSize: 13, fontWeight: 700,
            background: profile === "night" ? COLORS.card : "transparent",
            color: profile === "night" ? COLORS.amber : COLORS.inkSoft,
            boxShadow: profile === "night" ? COLORS.shadowSm : "none",
          }}
        >
          <Moon size={15} /> Noche (<span className="num">{nightDry === "" ? "sin fijar" : `${nightDry} g`}</span>)
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 12 }}>
        <Field label="Peso usado (g)">
          <input type="number" min="0" step="5" value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="240" autoFocus style={{ width: "100%" }} />
        </Field>
        <Field label="Tara seco (g)">
          <input type="number" min="0" step="5" value={dryWeight} onChange={(e) => setDryWeight(e.target.value)} style={{ width: "100%" }} />
        </Field>
      </div>

      {net !== null && (
        <div style={{ background: COLORS.amberSoft, color: COLORS.amber, borderRadius: 16, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: 13.5, fontWeight: 700 }}>Pérdida neta calculada</span>
          <span className="num" style={{ fontSize: 20, fontWeight: 800 }}>{round1(net)} g</span>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 12 }}>
        <Field label="Fecha"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ width: "100%" }} /></Field>
        <Field label="Hora"><input type="time" value={time} onChange={(e) => setTime(e.target.value)} style={{ width: "100%" }} /></Field>
      </div>

      <PeriodPicker value={period} onChange={setPeriod} time={time} />

      <Field label="Nota (opcional)">
        <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Cambio, fuga lateral…" style={{ width: "100%" }} />
      </Field>

      <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
        <button
          onClick={saveProfileTara}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            background: isSaved ? COLORS.amberSoft : COLORS.inputBg,
            color: isSaved ? COLORS.amber : COLORS.inkSoft,
            border: "none", borderRadius: 14, padding: "13px 14px", fontSize: 13, fontWeight: 700,
          }}
        >
          <Pin size={15} /> {isSaved ? "Tara fija" : "Fijar tara"}
        </button>
        <button
          onClick={submit}
          style={{
            flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            background: COLORS.amber, color: "#fff", border: "none",
            borderRadius: 14, padding: "14px", fontWeight: 800, fontSize: 15,
          }}
        >
          <Plus size={18} /> Guardar pesaje
        </button>
      </div>
    </div>
  );
}

  const [err, setErr] = useState("");

    const patch = { date: f.date, time: f.time };
    if (!f.date || !f.time) { setErr("Indica fecha y hora."); return; }
    if (kind === "liquido") {
      const a = Number(f.amount); if (!(a > 0)) { setErr("La cantidad debe ser mayor que 0."); return; }
      patch.amount = a; patch.note = (f.note || "").trim();
    } else if (kind === "panal") {
      const w = Number(f.weight); if (!(w > 0)) { setErr("El peso debe ser mayor que 0."); return; }
      patch.weight = w; patch.dryWeight = f.dryWeight === "" || f.dryWeight === undefined ? "" : Number(f.dryWeight); patch.note = (f.note || "").trim(); patch.period = f.period || "";
    } else if (kind === "miccion") {
      patch.volume = f.volume === "" || f.volume === undefined ? "" : Number(f.volume); patch.note = (f.note || "").trim(); patch.period = f.period || "";
    } else if (kind === "escape") {
      patch.trigger = f.trigger; patch.amount = f.amount; patch.note = (f.note || "").trim();
    }
    onSave(patch);
  };
  return (
    <div role="dialog" aria-modal="true" style={{ position: "fixed", inset: 0, background: "rgba(15, 23, 42, 0.55)", backdropFilter: "blur(4px)", zIndex: 65, display: "flex", alignItems: "center", justifyContent: "center", padding: 18 }} onClick={onClose}>
