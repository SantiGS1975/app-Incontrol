(function installStoragePolyfill() {
  if (window.storage) return;
  const NS = "incontrol:";
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(NS + key);
      if (raw === null) throw new Error("clave no encontrada: " + key);
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(NS + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(NS + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const p = NS + (prefix || "");
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(NS.length));
      return { keys, prefix: prefix || "", shared: false };
    },
  };
})();

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

function noteParts(v) {
  if (!v) return { title: "", detail: "" };
  if (typeof v === "string") return { title: v, detail: "" };
  return { title: v.title || "", detail: v.detail || "" };
}

function beep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    [0, 0.35, 0.7].forEach((t) => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.28);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
    setTimeout(() => ctx.close && ctx.close(), 1500);
  } catch (e) {}
}

async function notifyDrink(time) {
  const title = "Incontrol · hora de beber";
  const opts = { body: `Toca tu toma de líquido de las ${time}.`, tag: "incontrol-" + time, requireInteraction: true, vibrate: [300, 150, 300] };
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg && reg.showNotification) { reg.showNotification(title, opts); return; }
    }
    new Notification(title, opts);
  } catch (e) {}
}

function buildReminderIcs(times) {
  const pad = (n) => String(n).padStart(2, "0");
  const d = new Date();
  const ymd = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const stamp = `${ymd}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Incontrol//Recordatorios//ES", "CALSCALE:GREGORIAN"];
  times.forEach((t) => {
    const [h, m] = t.split(":");
    lines.push(
      "BEGIN:VEVENT",
      `UID:incontrol-${h}${m}@incontrol.app`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${ymd}T${h}${m}00`,
      `DTEND:${ymd}T${h}${m}00`,
      "RRULE:FREQ=DAILY",
      "SUMMARY:Incontrol - Hora de beber",
      "DESCRIPTION:Toma de liquido programada. Anotala en Incontrol.",
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Hora de beber", "TRIGGER:PT0M", "END:VALARM",
      "BEGIN:VALARM", "ACTION:AUDIO", "TRIGGER:PT0M", "END:VALARM",
      "END:VEVENT"
    );
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

function downloadIcs(times) {
  const blob = new Blob([buildReminderIcs(times)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "incontrol-recordatorios.ics";

  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function linreg(values, xs) {
  const n = values.length;
  if (n < 2) return { slope: 0, intercept: values[0] || 0, r2: 0 };
  if (!xs) xs = values.map((_, i) => i);
  const xMean = mean(xs), yMean = mean(values);
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - xMean) * (values[i] - yMean); den += (xs[i] - xMean) ** 2; }
  const slope = den === 0 ? 0 : num / den;
  const intercept = yMean - slope * xMean;
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < n; i++) {
    const pred = intercept + slope * xs[i];
    ssRes += (values[i] - pred) ** 2;
    ssTot += (values[i] - yMean) ** 2;
  }
  const r2 = ssTot === 0 ? 0 : 1 - ssRes / ssTot;
  return { slope, intercept, r2 };
}

// ---------- exportación ----------
function downloadWorkbook(sheets, filename) {
  if (!XLSX) {
    alert("La librería Excel aún se está cargando. Inténtalo en un segundo.");
    return;
  }
  const wb = XLSX.utils.book_new();
  for (const [name, rowsOrSheet] of sheets) {
    const ws = Array.isArray(rowsOrSheet)
      ? XLSX.utils.json_to_sheet(rowsOrSheet.length ? rowsOrSheet : [{ " ": "Sin datos" }])
      : rowsOrSheet;
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  }
  XLSX.writeFile(wb, filename);
}

function buildCoverSheet(subtitle, periodText) {
  const rows = [
    ["Incontrol"],
    ["Diario de control de incontinencia — " + subtitle],
    [""],
    ["Generado el", new Date().toLocaleString("es-ES", { dateStyle: "long", timeStyle: "short" })],
    ["Periodo", periodText],
    [""],
    ["Este documento es un registro personal de seguimiento."],
    ["No sustituye la valoración de un profesional sanitario."],
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 16 }, { wch: 46 }];
  return ws;
}

function generateDemoDataset() {

  const today = new Date();
  const patterns = [
    { l: [250, 300, 200, 250, 200, 150], p: [180, 140, 260], v: [{ t: "02:30", vol: 280 }, { t: "07:15", vol: 310, wake: true }, { t: "12:00", vol: "" }, { t: "17:30", vol: "" }], lk: [], note: "" },

    { l: [200, 250, 200, 200, 150], p: [140, 120, 210], v: [{ t: "04:00", vol: 240 }, { t: "07:10", vol: 260, wake: true }, { t: "11:45", vol: "" }, { t: "16:20", vol: "" }, { t: "20:10", vol: "" }], lk: [], note: "" },
    { l: [250, 300, 250, 200, 150], p: [150, 130, 220], v: [{ t: "02:45", vol: 260 }, { t: "07:30", vol: 290, wake: true }, { t: "12:30", vol: "" }, { t: "18:00", vol: "" }], lk: [], note: "" },
    { l: [300, 350, 300, 250, 300], p: [260, 230, 410], v: [{ t: "01:50", vol: 320 }, { t: "04:40", vol: 290 }, { t: "07:25", vol: 340, wake: true }, { t: "14:00", vol: "" }], lk: [{ t: "15:40", tr: "urgencia", am: "Moderado" }], note: "Café extra y cena tardía" },
    { l: [250, 250, 200, 200, 150], p: [130, 110, 190], v: [{ t: "03:30", vol: 230 }, { t: "07:15", vol: 270, wake: true }, { t: "11:30", vol: "" }, { t: "16:45", vol: "" }], lk: [], note: "" },
    { l: [200, 250, 250, 200, 100], p: [120, 95, 175], v: [{ t: "03:50", vol: 210 }, { t: "07:20", vol: 250, wake: true }, { t: "12:10", vol: "" }, { t: "17:15", vol: "" }, { t: "21:00", vol: "" }], lk: [], note: "Buen descanso" },
  ];

  for (let i = 13; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const iso = toLocalIsoDate(d);
    const pat = patterns[(13 - i) % patterns.length];
    const lTimes = ["08:30", "11:00", "14:00", "17:00", "19:30", "21:15"];
    pat.l.forEach((amt, idx) => liquids.push({ id: uid(), date: iso, time: lTimes[idx] || "12:00", amount: amt, note: idx === 0 ? "Desayuno" : idx === 2 ? "Comida" : "" }));
    const pTimes = ["08:00", "16:30", "23:45"];

      const dry = idx === 2 ? 90 : 40;
      diapers.push({ id: uid(), date: iso, time: pTimes[idx], weight: net + dry, dryWeight: dry, note: idx === 2 ? "Nocturno" : "Día" });
    });
    pat.v.forEach((item) => voids.push({ id: uid(), date: iso, time: item.t, volume: item.vol, isFirstMorning: !!item.wake, note: item.wake ? "Al despertar" : "" }));

  }
  return { liquids, diapers, voids, leaks, dayNotes, settings: { defaultLiquidAmount: 200, defaultDryWeight: 40, nightDryWeight: 90 } };
}

function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}
function stddev(arr) {
  if (arr.length < 2) return 0;
  const m = mean(arr);
  return Math.sqrt(arr.reduce((a, b) => a + (b - m) ** 2, 0) / (arr.length - 1));
}
function statsOf(arr) {
  if (!arr.length) return { mean: 0, median: 0, sd: 0, max: 0, min: 0, n: 0 };
  return { mean: mean(arr), median: median(arr), sd: stddev(arr), max: Math.max(...arr), min: Math.min(...arr), n: arr.length };
}
const round1 = (n) => Math.round(n * 10) / 10;

const SEVERITY_THRESHOLDS = { leve: 100, moderada: 300, severa: 600 };
function classifyLoss(gramsPerDay) {
  if (gramsPerDay === null || gramsPerDay === undefined || gramsPerDay <= 0) return null;
  if (gramsPerDay < SEVERITY_THRESHOLDS.leve) return { label: "Leve", color: "#0D9488", bg: "#CCFBF1" };
  if (gramsPerDay < SEVERITY_THRESHOLDS.moderada) return { label: "Moderada", color: "#D97706", bg: "#FEF3C7" };
  if (gramsPerDay < SEVERITY_THRESHOLDS.severa) return { label: "Severa", color: "#EA580C", bg: "#FFEDD5" };
  return { label: "Muy severa", color: "#DC2626", bg: "#FEE2E2" };
}
const netWeight = (weight, dryWeight) => Math.max(0, (Number(weight) || 0) - (Number(dryWeight) || 0));

const LIQUID_RECOMMENDED = 1500;
const LIQUID_THRESHOLDS = { insuficiente: 1000, poco: 1500, mucho: 2500 };
function classifyLiquid(mlPerDay) {
  if (mlPerDay === null || mlPerDay === undefined || mlPerDay <= 0) return null;
  if (mlPerDay < LIQUID_THRESHOLDS.insuficiente) return { label: "Insuficiente", color: "#DC2626", bg: "#FEE2E2" };
  if (mlPerDay < LIQUID_THRESHOLDS.poco) return { label: "Poco", color: "#D97706", bg: "#FEF3C7" };
  if (mlPerDay <= LIQUID_THRESHOLDS.mucho) return { label: "Adecuado", color: "#0D9488", bg: "#CCFBF1" };
  return { label: "Mucho", color: "#D97706", bg: "#FEF3C7" };
}

// ---------- diario miccional ----------
const NIGHT_START = "23:00", NIGHT_END = "07:00";
const isNightTime = (t) => !!t && (t >= NIGHT_START || t < NIGHT_END);
const LEAK_TRIGGERS = [
  { id: "esfuerzo", label: "Esfuerzo (tos, risa, ejercicio)", short: "Esfuerzo" },
  { id: "urgencia", label: "Urgencia", short: "Urgencia" },
  { id: "sinaviso", label: "Sin aviso", short: "Sin aviso" },
  { id: "otro", label: "Otro", short: "Otro" },
];
const LEAK_AMOUNTS = ["Gotas", "Moderado", "Abundante"];

function summarizeDiary(days) {
  const sum = (arr, f) => arr.reduce((a, d) => a + f(d), 0);
  const withVoid = days.filter((d) => d.voidCount > 0);
  const withDiary = days.filter((d) => d.voidCount > 0 || d.leakCount > 0);
  const nightJarraDays = days.filter((d) => d.nightVoidVol > 0);
  const dayVolCount = sum(days, (d) => d.dayVoidVolCount);
  const night = sum(days, (d) => d.nightUrine);
  const dayU = sum(days, (d) => d.dayUrine);
  const byTrigger = {};
  LEAK_TRIGGERS.forEach((t) => { byTrigger[t.id] = sum(days, (d) => d.leakByTrigger[t.id] || 0); });
  const totalLeaks = sum(days, (d) => d.leakCount);
  const totalVoids = sum(days, (d) => d.voidCount);
  return {
    nVoidDays: withVoid.length, nDiaryDays: withDiary.length, totalVoids, totalLeaks,
    voidsPerDay: withVoid.length ? totalVoids / withVoid.length : null,
    nocturia: withVoid.length ? sum(withVoid, (d) => d.nightVoids) / withVoid.length : null,
    nightVolPerNight: nightJarraDays.length ? sum(nightJarraDays, (d) => d.nightVoidVol) / nightJarraDays.length : null,
    leaksPerDay: withDiary.length ? totalLeaks / withDiary.length : null,
    byTrigger, nightUrine: night, dayUrine: dayU,
    npi: dayVolCount > 0 && night + dayU > 0 ? (night / (night + dayU)) * 100 : null,
  };
}

function leakPattern(sm) {
  if (!sm || sm.totalLeaks < 3) return null;
  const e = sm.byTrigger.esfuerzo / sm.totalLeaks, u = sm.byTrigger.urgencia / sm.totalLeaks;
  if (e >= 0.3 && u >= 0.3) return "Patrón mixto (esfuerzo y urgencia).";
  if (e >= 0.5) return "Predominio de escapes por esfuerzo.";
  if (u >= 0.5) return "Predominio de escapes por urgencia.";
  return "Sin un patrón claro por desencadenante.";
}

function diaryText(filtered) {
  const sm = summarizeDiary(filtered);
  const lines = [];
  if (sm.nDiaryDays > 0) {
    lines.push(`Diario miccional (${sm.nDiaryDays} días con micciones o escapes anotados):`);
    if (sm.voidsPerDay !== null) lines.push(`- Micciones anotadas por día: media ${round1(sm.voidsPerDay)}.`);
    if (sm.nocturia !== null) lines.push(`- Nocturia (micciones entre ${NIGHT_START} y ${NIGHT_END}): media ${round1(sm.nocturia)} por noche.`);
    if (sm.nightVolPerNight !== null) lines.push(`- Volumen nocturno medido en jarra: media ${round1(sm.nightVolPerNight)} ml por noche.`);
    if (sm.npi !== null) lines.push(`- Reparto de la orina estimada: ${round1(sm.npi)} % nocturna frente a ${round1(100 - sm.npi)} % diurna.`);
    if (sm.totalLeaks > 0) lines.push(`- Escapes: ${sm.totalLeaks} en total (${round1(sm.leaksPerDay)} por día); por desencadenante: ${LEAK_TRIGGERS.map((t) => `${t.short} ${sm.byTrigger[t.id]}`).join(", ")}.`);
  }
  return lines.join("\n");
}

const OLD_STORAGE_KEY = "diaper-tracker-entries-v1";
const STORAGE_KEY_LIQUIDS = "diaper-tracker-liquids-v1";
const STORAGE_KEY_DIAPERS = "diaper-tracker-diapers-v1";
const STORAGE_KEY_DAYNOTES = "diaper-tracker-daynotes-v1";
const STORAGE_KEY_SETTINGS = "diaper-tracker-settings-v1";
const STORAGE_KEY_LASTREPORT = "diaper-tracker-lastreport-v1";
const STORAGE_KEY_VOIDS = "diaper-tracker-voids-v1";
const STORAGE_KEY_LEAKS = "diaper-tracker-leaks-v1";
const storageAvailable = () => typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";

async function loadData() {
  if (!storageAvailable()) return { data: { liquids: [], diapers: [], dayNotes: {}, settings: {}, lastReport: null, voids: [], leaks: [] }, storageOk: false };
  const getKey = async (k) => { try { const r = await window.storage.get(k, false); return r && r.value ? JSON.parse(r.value) : null; } catch (e) { return null; } };
  let [voids, leaks, liquids, diapers, dayNotes, settings, lastReport] = await Promise.all([
    getKey(STORAGE_KEY_VOIDS), getKey(STORAGE_KEY_LEAKS), getKey(STORAGE_KEY_LIQUIDS),
    getKey(STORAGE_KEY_DIAPERS), getKey(STORAGE_KEY_DAYNOTES), getKey(STORAGE_KEY_SETTINGS), getKey(STORAGE_KEY_LASTREPORT)
  ]);
  if (liquids === null && diapers === null) {
    const parsed = await getKey(OLD_STORAGE_KEY);
    if (parsed) {
      liquids = parsed.liquids || []; diapers = parsed.diapers || [];
      await window.storage.set(STORAGE_KEY_LIQUIDS, JSON.stringify(liquids), false);
      await window.storage.set(STORAGE_KEY_DIAPERS, JSON.stringify(diapers), false);
    }
  }
  return { data: { liquids: liquids || [], diapers: diapers || [], dayNotes: dayNotes || {}, settings: settings || {}, lastReport: lastReport || null, voids: voids || [], leaks: leaks || [] }, storageOk: true };
}

async function saveData(data) {
  if (!storageAvailable()) return false;
  try {
    const results = await Promise.all([
      window.storage.set(STORAGE_KEY_LIQUIDS, JSON.stringify(data.liquids), false),
      window.storage.set(STORAGE_KEY_DIAPERS, JSON.stringify(data.diapers), false),
      window.storage.set(STORAGE_KEY_DAYNOTES, JSON.stringify(data.dayNotes || {}), false),
      window.storage.set(STORAGE_KEY_SETTINGS, JSON.stringify(data.settings || {}), false),
      window.storage.set(STORAGE_KEY_LASTREPORT, JSON.stringify(data.lastReport || null), false),
      window.storage.set(STORAGE_KEY_VOIDS, JSON.stringify(data.voids || []), false),
      window.storage.set(STORAGE_KEY_LEAKS, JSON.stringify(data.leaks || []), false),
    ]);
    return results.every(Boolean);
  } catch (e) {
    return false;
  }
}

    while (dateSet.has(toLocalIsoDate(cursor))) { count++; cursor.setDate(cursor.getDate() - 1); }

// ---------- anillo circular de progreso ----------
function ProgressRing({ progress, color, size = 56, stroke = 5.5, icon: Icon }) {
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;
  const clamped = Math.max(0, Math.min(100, progress || 0));
  const offset = circumference - (clamped / 100) * circumference;

  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="rgba(255,255,255,0.16)" strokeWidth={stroke} />
        <circle
          cx={size / 2} cy={size / 2} r={radius} fill="none"
          stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={circumference} strokeDashoffset={offset}
          style={{ transition: "stroke-dashoffset 500ms cubic-bezier(0.2, 0.8, 0.2, 1)" }}
        />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <Icon size={20} color={color} strokeWidth={2.2} />
      </div>
    </div>
  );
}

  const severity = displayAgg ? classifyLoss(displayAgg.diaperTotal) : null;

  const liquidPct = displayAgg ? Math.min(100, Math.round((displayAgg.liquidTotal / LIQUID_RECOMMENDED) * 100)) : 0;

  useEffect(() => {
    if (!activeAction) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };

            <button
              onClick={() => setExtraTab("nota")}
              style={{
                flex: 1, padding: "9px", borderRadius: 11, border: "none", fontSize: 13, fontWeight: 700,
                background: extraTab === "nota" ? COLORS.card : "transparent",
                color: extraTab === "nota" ? COLORS.ink : COLORS.inkSoft,
                boxShadow: extraTab === "nota" ? COLORS.shadowSm : "none",
              }}
            >
              Nota del día
            </button>
          </div>
        )}

        {typeof children === "function" ? children(extraTab) : children}
      </div>
    </div>
  );
}

// ---------- Tab: registro ----------
function RegistroTab({ data, addLiquid, addDiaper, removeLiquid, removeDiaper, lastDryWeight, dailyAgg, setDayNote, addVoid, removeVoid, addLeak, removeLeak, updateEntry, settings, setDefault, onLoadDemo }) {
  const COLORS = useTheme();
  const [activeSheet, setActiveSheet] = useState(null);
  const [editing, setEditing] = useState(null);
  const [historyFilter, setHistoryFilter] = useState("panal");
  const [visibleDays, setVisibleDays] = useState(10);
  const [openDays, setOpenDays] = useState({}); // por defecto solo está desplegado el último día
  useEffect(() => { setVisibleDays(10); }, [historyFilter]);
  const totalEntries = data.liquids.length + data.diapers.length + (data.voids || []).length + (data.leaks || []).length;
  const lastBackup = settings?.lastBackup;
  const backupAge = lastBackup ? Math.floor((new Date(todayStr() + "T00:00:00") - new Date(lastBackup + "T00:00:00")) / 86400000) : null;
  const needsBackup = totalEntries >= 10 && (backupAge === null || backupAge > 14);

  useEffect(() => {
    const h = (e) => setActiveSheet(e.detail);
    window.addEventListener("incontrol-goto", h);
    return () => window.removeEventListener("incontrol-goto", h);
  }, []);

  const unifiedTimeline = useMemo(() => {
    const all = [
      ...data.liquids.map((l) => ({ ...l, kind: "liquido" })),
      ...data.diapers.map((p) => ({ ...p, kind: "panal" })),
      ...(data.voids || []).map((v) => ({ ...v, kind: "miccion" })),
      ...(data.leaks || []).map((k) => ({ ...k, kind: "escape" })),
    ];
    const filtered = historyFilter === "todos" ? all : all.filter((it) => it.kind === historyFilter);
    filtered.sort((a, b) => ((b.date || "") + (b.time || "")).localeCompare((a.date || "") + (a.time || "")));
    const byDay = {};
    for (const it of filtered) {
      byDay[it.date] = byDay[it.date] || [];
      byDay[it.date].push(it);
    }
    return Object.entries(byDay).sort((a, b) => b[0].localeCompare(a[0]));
  }, [data, historyFilter]);

  const dayAggMap = useMemo(() => Object.fromEntries(dailyAgg.map((d) => [d.date, d])), [dailyAgg]);
  const todayAgg = dayAggMap[todayStr()];
  const lastAgg = dailyAgg.length ? dailyAgg[dailyAgg.length - 1] : null;

  return (
    <div>
      <TodayCard todayAgg={todayAgg} lastAgg={lastAgg} onOpenAction={setActiveSheet} onLoadDemo={dailyAgg.length === 0 ? onLoadDemo : null} />

      {needsBackup && (
        <button
          onClick={() => window.dispatchEvent(new CustomEvent("incontrol-open-settings"))}
          className="no-print"
          style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, textAlign: "left", background: COLORS.amberSoft, color: COLORS.amber, border: "none", borderRadius: 18, padding: "12px 14px", marginBottom: 18, fontSize: 13, fontWeight: 700 }}
        >
          <Download size={17} style={{ flexShrink: 0 }} />
          <span style={{ flex: 1 }}>{backupAge === null ? "Aún no tienes copia de seguridad de tus datos." : `Hace ${backupAge} días de tu última copia de seguridad.`} Toca para hacerla.</span>
          <ChevronRight size={16} />
        </button>
      )}

      <QuickActionGrid onSelect={setActiveSheet} onExportExcel={() => exportAllExcel(data, dailyAgg)} />

      <ActionBottomSheet activeAction={activeSheet} onClose={() => setActiveSheet(null)}>
        {(extraTab) => (
          <>
            {activeSheet === "liquido" && (
              <LiquidForm
                onAdd={(e) => { addLiquid(e); setActiveSheet(null); }}
                defaultAmount={settings?.defaultLiquidAmount}
                onSetDefault={(v) => setDefault("defaultLiquidAmount", v)}
              />
            )}
            {activeSheet === "panal" && (
              <DiaperForm
                onAdd={(e) => { addDiaper(e); setActiveSheet(null); }}
                lastDryWeight={lastDryWeight}
                settings={settings}
                setDefault={setDefault}
              />
            )}
            {activeSheet === "miccion" && (
              <VoidForm onAdd={(e) => { addVoid(e); setActiveSheet(null); }} />
            )}
            {(activeSheet === "escape" || activeSheet === "nota") && extraTab === "escape" && (
              <LeakForm onAdd={(e) => { addLeak(e); setActiveSheet(null); }} />
            )}
            {(activeSheet === "escape" || activeSheet === "nota") && extraTab === "nota" && (
              <DayNoteForm
                dayNotes={data.dayNotes || {}}
                setDayNote={(d, t, x) => { setDayNote(d, t, x); setActiveSheet(null); }}
              />
            )}
          </>
        )}
      </ActionBottomSheet>

      {editing && (
        <EditEntryDialog
          kind={editing.kind}
          entry={editing.entry}
          onClose={() => setEditing(null)}
          onSave={(patch) => { updateEntry(editing.kind, editing.entry.id, patch); setEditing(null); }}
        />
      )}

      <div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
          <span style={{ fontSize: 13, fontWeight: 800, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>
            Cronología
          </span>
          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 2 }}>
            {[
              { id: "todos", label: "Todos" },
              { id: "panal", label: "Pañales" },
              { id: "liquido", label: "Líquidos" },
              { id: "miccion", label: "Jarra / Baño" },
              { id: "escape", label: "Escapes" },
            ].map((f) => {
              const active = historyFilter === f.id;
              return (
                <button
                  key={f.id}
                  onClick={() => setHistoryFilter(f.id)}
                  style={{
                    padding: "6px 12px", borderRadius: 99, fontSize: 12, fontWeight: 700, border: "none", whiteSpace: "nowrap",
                    background: active ? COLORS.teal : COLORS.card,
                    color: active ? "#FFFFFF" : COLORS.inkSoft,
                    boxShadow: COLORS.shadowSm,
                  }}
                >
                  {f.label}
                </button>
              );
            })}
          </div>
        </div>

        {unifiedTimeline.length === 0 && (
          <EmptyState icon={BookOpen} text="Aún no hay registros en esta vista." />
        )}

        {unifiedTimeline.slice(0, visibleDays).map(([date, items], dayIdx) => {
          const dayAgg = dayAggMap[date];
          const severity = classifyLoss(dayAgg?.diaperTotal);
          const hydration = classifyLiquid(dayAgg?.liquidTotal);
          const isOpen = openDays[date] !== undefined ? openDays[date] : dayIdx === 0;
          const counts = [
            dayAgg?.diaperCount ? `${dayAgg.diaperCount} ${dayAgg.diaperCount === 1 ? "pañal" : "pañales"}` : null,
            dayAgg?.liquidCount ? `${dayAgg.liquidCount} ${dayAgg.liquidCount === 1 ? "ingesta" : "ingestas"}` : null,
            dayAgg?.voidCount ? `${dayAgg.voidCount} ${dayAgg.voidCount === 1 ? "micción" : "micciones"}${dayAgg.nightVoids ? ` (${dayAgg.nightVoids} de noche)` : ""}` : null,
            dayAgg?.leakCount ? `${dayAgg.leakCount} ${dayAgg.leakCount === 1 ? "escape" : "escapes"}` : null,
          ].filter(Boolean);
          return (
            <div key={date} style={{ marginBottom: isOpen ? 22 : 12 }}>
              <div
                role="button" tabIndex={0} aria-expanded={isOpen}
                onClick={() => setOpenDays((o) => ({ ...o, [date]: !isOpen }))}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setOpenDays((o) => ({ ...o, [date]: !isOpen })); } }}
                style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 6, marginBottom: isOpen ? 4 : 0, padding: isOpen ? "0 4px" : "12px 14px", cursor: "pointer", background: isOpen ? "transparent" : COLORS.card, borderRadius: 18, boxShadow: isOpen ? "none" : COLORS.shadowSm }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13.5, color: COLORS.ink, fontWeight: 800, textTransform: "capitalize" }}>
                  <ChevronRight size={16} color={COLORS.inkSoft} style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 150ms" }} />
                  {date === todayStr() ? "Hoy" : fmtDateFull(date)}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  {severity && (
                    <span style={{ fontSize: 11, fontWeight: 700, color: severity.color, background: severity.bg, padding: "3px 9px", borderRadius: 99 }}>
                      {severity.label} · {round1(dayAgg.diaperTotal)} g
                    </span>
                  )}
                  {hydration && (
                    <span style={{ fontSize: 11, fontWeight: 700, color: hydration.color, background: hydration.bg, padding: "3px 9px", borderRadius: 99 }}>
                      {round1(dayAgg.liquidTotal)} ml · {hydration.label}
                    </span>
                  )}
                </div>
                {!isOpen && (
                  <div style={{ flexBasis: "100%", fontSize: 11.5, color: COLORS.inkSoft, lineHeight: 1.4, paddingLeft: 22 }}>
                    {counts.join(" · ")}{dayAgg?.dayNote ? `${counts.length ? " · " : ""}“${dayAgg.dayNote}”` : ""}
                  </div>
                )}
              </div>

              {isOpen && (
                <div style={{ fontSize: 11.5, color: COLORS.inkSoft, padding: "0 4px 10px 26px", lineHeight: 1.4 }}>
                  {counts.join(" · ")}
                </div>
              )}

              {isOpen && (<>
              {(historyFilter === "liquido" || historyFilter === "todos") && hydration && (
                <div style={{ fontSize: 11.5, color: COLORS.inkSoft, margin: "-4px 4px 8px" }}>
                  Recomendado ≈ {fmtEs(LIQUID_RECOMMENDED, 0)} ml/día (orientativo; no restrinjas líquidos sin indicación médica).
                </div>
              )}

              {dayAgg?.dayNote && (
                <div style={{ background: COLORS.tealSoft, color: COLORS.teal, borderRadius: 16, padding: "10px 14px", marginBottom: 8, fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 8 }}>
                  <MessageSquare size={15} />
                  <span>{dayAgg.dayNote}{dayAgg.dayNoteDetail ? ` — ${dayAgg.dayNoteDetail}` : ""}</span>
                </div>
              )}

              <div style={{ background: COLORS.card, borderRadius: 22, overflow: "hidden", boxShadow: COLORS.shadowSm }}>
                {items.map((it, i) => {
                  const isNight = isNightTime(it.time);
                  const badgeMap = {
                    liquido: { icon: Droplets, color: COLORS.teal, bg: COLORS.tealSoft },
                    panal: { icon: Scale, color: COLORS.amber, bg: COLORS.amberSoft },
                    miccion: { icon: isNight ? Moon : Activity, color: COLORS.blue, bg: COLORS.blueSoft },
                    escape: { icon: AlertCircle, color: COLORS.rose, bg: COLORS.roseSoft },
                  };
                  const B = badgeMap[it.kind];
                  const IconComp = B.icon;

                  const removeAction = () => {
                    if (it.kind === "liquido") removeLiquid(it.id);
                    else if (it.kind === "panal") removeDiaper(it.id);
                    else if (it.kind === "miccion") removeVoid(it.id);
                    else if (it.kind === "escape") removeLeak(it.id);
                  };

                  return (
                    <div
                      key={it.id}
                      style={{
                        display: "flex", alignItems: "center", gap: 12,
                        padding: "13px 16px",
                        borderTop: i > 0 ? `1px solid ${COLORS.line}` : "none",
                      }}
                    >
                      <div style={{ width: 38, height: 38, borderRadius: 13, background: B.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        <IconComp size={18} color={B.color} strokeWidth={2.2} />
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.ink, lineHeight: 1.25 }}>
                          {it.kind === "liquido" && <>Ingesta · <span className="num" style={{ color: COLORS.teal }}>{it.amount} ml</span></>}
                          {it.kind === "panal" && <>Pañal · <span className="num" style={{ color: COLORS.amber }}>{round1(netWeight(it.weight, it.dryWeight))} g</span> netos</>}
                          {it.kind === "miccion" && (
                            <>
                              {it.isFirstMorning ? "1.ª micción al despertar" : isNight ? "Jarra nocturna" : "Micción en baño"}
                              {it.volume ? <> · <span className="num" style={{ color: COLORS.blue }}>{it.volume} ml</span></> : ""}
                            </>
                          )}
                          {it.kind === "escape" && (
                            <>Escape · {(LEAK_TRIGGERS.find((t) => t.id === it.trigger) || {}).short || it.trigger} ({it.amount})</>
                          )}
                        </div>
                        <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>
                          <span className="num">{it.time}</span>
                          {it.kind === "panal" && <span className="num"> · {it.weight} g − {it.dryWeight || 0} g tara</span>}
                          {it.note ? ` · ${it.note}` : ""}
                        </div>
                      </div>
                      <button onClick={() => setEditing({ kind: it.kind, entry: it })} style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 10 }} aria-label="Editar">
                        <Pencil size={15} />
                      </button>
                      <button onClick={removeAction} style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 10 }} aria-label="Eliminar">
                        <Trash2 size={15} />
                      </button>
                    </div>
                  );
                })}
              </div>
              </>)}
            </div>
          );
        })}

        {unifiedTimeline.length > visibleDays && (
          <button
            onClick={() => setVisibleDays((n) => n + 10)}
            className="no-print"
            style={{ width: "100%", background: COLORS.card, color: COLORS.teal, border: "none", borderRadius: 18, padding: "13px", fontSize: 13.5, fontWeight: 700, boxShadow: COLORS.shadowSm }}
          >
            Ver más días ({unifiedTimeline.length - visibleDays} restantes)
          </button>
        )}
      </div>
    </div>
  );
}

// ---------- formularios limpios dentro del Bottom Sheet ----------
function LiquidForm({ onAdd, defaultAmount, onSetDefault }) {
  const COLORS = useTheme();
  const [amount, setAmount] = useState(defaultAmount || "");
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState(nowTimeStr());
  const [note, setNote] = useState("");

  const submit = (overrideAmount) => {
    const a = Number(overrideAmount ?? amount);
    if (!a || a <= 0) return;
    onAdd({ amount: a, date, time, note: note.trim() });
  };

  const isCurrentDefault = defaultAmount !== undefined && defaultAmount !== "" && Number(defaultAmount) === Number(amount);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div>
        <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.inkSoft, marginBottom: 8 }}>Registro instantáneo en 1 toque</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8 }}>
          {[...new Set([...(defaultAmount ? [Number(defaultAmount)] : []), 100, 150, 200, 250, 330])].slice(0, 5).map((ml) => (
            <button
              key={ml}
              onClick={() => submit(ml)}
              className="num"
              style={{
                background: COLORS.tealSoft, color: COLORS.teal, border: "none",
                borderRadius: 14, padding: "12px 4px", fontSize: 13.5, fontWeight: 800,
              }}
            >
              +{ml}
            </button>
          ))}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 12 }}>
        <Field label="Cantidad (ml)">
          <input type="number" min="0" step="10" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="200" style={{ width: "100%" }} />
        </Field>
        <Field label="Bebida / Nota">
          <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Agua, café…" style={{ width: "100%" }} />
        </Field>
        <Field label="Fecha"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ width: "100%" }} /></Field>
        <Field label="Hora"><input type="time" value={time} onChange={(e) => setTime(e.target.value)} style={{ width: "100%" }} /></Field>
      </div>

      <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
        <button
          onClick={() => { const a = Number(amount); if (a > 0) onSetDefault(a); }}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            background: isCurrentDefault ? COLORS.tealSoft : COLORS.inputBg,
            color: isCurrentDefault ? COLORS.teal : COLORS.inkSoft,
            border: "none", borderRadius: 14, padding: "13px 14px", fontSize: 13, fontWeight: 700,
          }}
        >
          <Pin size={15} /> {defaultAmount ? `${defaultAmount} ml` : "Fijar"}
        </button>
        <button
          onClick={() => submit()}
          style={{
            flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            background: COLORS.teal, color: "#fff", border: "none",
            borderRadius: 14, padding: "14px", fontWeight: 800, fontSize: 15,
          }}
        >
          <Plus size={18} /> Guardar ingesta
        </button>
      </div>
    </div>
  );
}

function DiaperForm({ onAdd, lastDryWeight, settings, setDefault }) {
  const COLORS = useTheme();
  const dayDry = settings?.defaultDryWeight ?? (lastDryWeight !== "" ? lastDryWeight : "");
  const nightDry = settings?.nightDryWeight ?? dayDry;

  const [profile, setProfile] = useState(() => (isNightTime(nowTimeStr()) ? "night" : "day"));
  const [weight, setWeight] = useState("");
  const [dryWeight, setDryWeight] = useState(() => (isNightTime(nowTimeStr()) ? nightDry : dayDry));
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState(nowTimeStr());
  const [note, setNote] = useState("");

  const selectProfile = (p) => {
    setProfile(p);
    setDryWeight(p === "night" ? nightDry : dayDry);
  };

  const saveProfileTara = () => {
    const w = Number(dryWeight);
    if (!(w >= 0)) return;
    if (profile === "night") setDefault("nightDryWeight", w);
    else setDefault("defaultDryWeight", w);
  };

  const submit = () => {
    const w = Number(weight);
    if (!w || w <= 0) return;
    onAdd({
      weight: w, dryWeight: dryWeight === "" ? "" : Number(dryWeight), date, time,
      note: note.trim() || (profile === "night" ? "Nocturno" : ""),
    });
  };

  const net = weight !== "" ? netWeight(weight, dryWeight) : null;
  const savedTara = profile === "night" ? nightDry : dayDry;
  const isSaved = savedTara !== "" && Number(savedTara) === Number(dryWeight);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 8, background: COLORS.inputBg, padding: 5, borderRadius: 16 }}>
        <button
          onClick={() => selectProfile("day")}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            padding: "10px", borderRadius: 12, border: "none", fontSize: 13, fontWeight: 700,
            background: profile === "day" ? COLORS.card : "transparent",
            color: profile === "day" ? COLORS.amber : COLORS.inkSoft,
            boxShadow: profile === "day" ? COLORS.shadowSm : "none",
          }}
        >
          <Sun size={15} /> Día (<span className="num">{dayDry === "" ? "sin fijar" : `${dayDry} g`}</span>)
        </button>
        <button
          onClick={() => selectProfile("night")}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            padding: "10px", borderRadius: 12, border: "none", fontSize: 13, fontWeight: 700,
            background: profile === "night" ? COLORS.card : "transparent",
            color: profile === "night" ? COLORS.amber : COLORS.inkSoft,
            boxShadow: profile === "night" ? COLORS.shadowSm : "none",
          }}
        >
          <Moon size={15} /> Noche (<span className="num">{nightDry === "" ? "sin fijar" : `${nightDry} g`}</span>)
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 12 }}>
        <Field label="Peso usado (g)">
          <input type="number" min="0" step="5" value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="240" autoFocus style={{ width: "100%" }} />
        </Field>
        <Field label="Tara seco (g)">
          <input type="number" min="0" step="5" value={dryWeight} onChange={(e) => setDryWeight(e.target.value)} style={{ width: "100%" }} />
        </Field>
      </div>

      {net !== null && (
        <div style={{ background: COLORS.amberSoft, color: COLORS.amber, borderRadius: 16, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: 13.5, fontWeight: 700 }}>Pérdida neta calculada</span>
          <span className="num" style={{ fontSize: 20, fontWeight: 800 }}>{round1(net)} g</span>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 12 }}>
        <Field label="Fecha"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ width: "100%" }} /></Field>
        <Field label="Hora"><input type="time" value={time} onChange={(e) => setTime(e.target.value)} style={{ width: "100%" }} /></Field>
      </div>

      <Field label="Nota (opcional)">
        <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Cambio, fuga lateral…" style={{ width: "100%" }} />
      </Field>

      <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
        <button
          onClick={saveProfileTara}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            background: isSaved ? COLORS.amberSoft : COLORS.inputBg,
            color: isSaved ? COLORS.amber : COLORS.inkSoft,
            border: "none", borderRadius: 14, padding: "13px 14px", fontSize: 13, fontWeight: 700,
          }}
        >
          <Pin size={15} /> {isSaved ? "Tara fija" : "Fijar tara"}
        </button>
        <button
          onClick={submit}
          style={{
            flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            background: COLORS.amber, color: "#fff", border: "none",
            borderRadius: 14, padding: "14px", fontWeight: 800, fontSize: 15,
          }}
        >
          <Plus size={18} /> Guardar pesaje
        </button>
      </div>
    </div>
  );
}

function VoidForm({ onAdd }) {
  const COLORS = useTheme();
  const [volume, setVolume] = useState("");
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState(nowTimeStr());
  const [isFirstMorning, setIsFirstMorning] = useState(false);
  const [note, setNote] = useState("");

  const submit = (quickNoVol = false) => {
    onAdd({
      volume: quickNoVol || volume === "" ? "" : Number(volume),
      date, time, isFirstMorning, note: note.trim(),
    });
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <button
        onClick={() => submit(true)}
        style={{
          width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
          background: COLORS.blueSoft, color: COLORS.blue, border: "none",
          borderRadius: 16, padding: "14px", fontSize: 14, fontWeight: 800,
        }}

function EditEntryDialog({ kind, entry, onSave, onClose }) {
  const COLORS = useTheme();
  const [f, setF] = useState({ ...entry });
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const titles = { liquido: "Editar ingesta", panal: "Editar pesaje", miccion: "Editar micción", escape: "Editar escape" };
  const [err, setErr] = useState("");
  const save = () => {
    const patch = { date: f.date, time: f.time };
    if (!f.date || !f.time) { setErr("Indica fecha y hora."); return; }
    if (kind === "liquido") {
      const a = Number(f.amount); if (!(a > 0)) { setErr("La cantidad debe ser mayor que 0."); return; }
      patch.amount = a; patch.note = (f.note || "").trim();
    } else if (kind === "panal") {
      const w = Number(f.weight); if (!(w > 0)) { setErr("El peso debe ser mayor que 0."); return; }
      patch.weight = w; patch.dryWeight = f.dryWeight === "" || f.dryWeight === undefined ? "" : Number(f.dryWeight); patch.note = (f.note || "").trim();
    } else if (kind === "miccion") {
      patch.volume = f.volume === "" || f.volume === undefined ? "" : Number(f.volume); patch.note = (f.note || "").trim();
    } else if (kind === "escape") {
      patch.trigger = f.trigger; patch.amount = f.amount; patch.note = (f.note || "").trim();
    }
    onSave(patch);
  };
  return (
    <div role="dialog" aria-modal="true" style={{ position: "fixed", inset: 0, background: "rgba(15, 23, 42, 0.55)", backdropFilter: "blur(4px)", zIndex: 65, display: "flex", alignItems: "center", justifyContent: "center", padding: 18 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: COLORS.card, borderRadius: 24, padding: 24, width: "100%", maxWidth: 420, boxShadow: COLORS.shadowLg }}>
        <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 16 }}>{titles[kind]}</div>
        <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 12 }}>
          {kind === "liquido" && <Field label="Cantidad (ml)"><input type="number" min="0" step="10" value={f.amount ?? ""} onChange={(e) => set("amount", e.target.value)} style={{ width: "100%" }} /></Field>}
          {kind === "panal" && <>
            <Field label="Peso total (g)"><input type="number" min="0" value={f.weight ?? ""} onChange={(e) => set("weight", e.target.value)} style={{ width: "100%" }} /></Field>
            <Field label="Tara seco (g)"><input type="number" min="0" value={f.dryWeight ?? ""} onChange={(e) => set("dryWeight", e.target.value)} style={{ width: "100%" }} /></Field>
          </>}
          {kind === "miccion" && <Field label="Jarra (ml)"><input type="number" min="0" step="10" value={f.volume ?? ""} onChange={(e) => set("volume", e.target.value)} placeholder="Sin medir" style={{ width: "100%" }} /></Field>}
          {kind === "escape" && <>
            <Field label="Desencadenante">
              <select value={f.trigger} onChange={(e) => set("trigger", e.target.value)} style={{ width: "100%" }}>
                {LEAK_TRIGGERS.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
            </Field>
            <Field label="Cantidad">
              <select value={f.amount} onChange={(e) => set("amount", e.target.value)} style={{ width: "100%" }}>
                {LEAK_AMOUNTS.map((a) => <option key={a} value={a}>{a}</option>)}
              </select>
            </Field>
          </>}
          <Field label="Fecha"><input type="date" value={f.date || ""} onChange={(e) => set("date", e.target.value)} style={{ width: "100%" }} /></Field>
          <Field label="Hora"><input type="time" value={f.time || ""} onChange={(e) => set("time", e.target.value)} style={{ width: "100%" }} /></Field>
        </div>
        <div style={{ marginTop: 12 }}>
          <Field label="Nota"><input type="text" value={f.note || ""} onChange={(e) => set("note", e.target.value)} style={{ width: "100%" }} /></Field>
        </div>
        {err && <div style={{ color: COLORS.rose, fontSize: 12.5, marginTop: 10, fontWeight: 600 }}>{err}</div>}

function BackupPanel({ data, onRestore, settings, setDefault }) {
  const COLORS = useTheme();
  const [pending, setPending] = useState(null);
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);
  const counts = (d) => `${(d.liquids || []).length} líquidos, ${(d.diapers || []).length} pesajes, ${(d.voids || []).length} micciones, ${(d.leaks || []).length} escapes`;

  const exportBackup = () => {
    const payload = {
      app: "incontrol", version: 1, exportedAt: new Date().toISOString(),
      liquids: data.liquids, diapers: data.diapers, voids: data.voids || [], leaks: data.leaks || [],
      dayNotes: data.dayNotes || {}, settings: data.settings || {}, lastReport: data.lastReport || null,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `incontrol-copia-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    setDefault("lastBackup", todayStr());
    setMsg("Copia descargada correctamente.");
  };

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || parsed.app !== "incontrol") throw new Error("archivo no válido");
        setPending(parsed); setMsg("");
      } catch (err) {
        setPending(null); setMsg("Error al leer el archivo.");
      }
    };
    reader.readAsText(file);
  };

  const restore = (mode) => {
    onRestore(pending, mode);
    setPending(null);
    setMsg(mode === "replace" ? "Datos reemplazados." : "Registros fusionados.");
  };

  return (
    <div style={{ background: COLORS.card, borderRadius: 22, padding: 20, boxShadow: COLORS.shadowSm, display: "flex", flexDirection: "column", gap: 14 }}>
      <div>
        <div style={{ fontWeight: 800, fontSize: 15.5 }}>Copia de seguridad local</div>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, lineHeight: 1.5, marginTop: 4 }}>
          Exporta tus registros en un archivo JSON para guardarlos o pasarlos a otro móvil.
        </div>
        <div style={{ fontSize: 12, color: COLORS.teal, fontWeight: 700, marginTop: 8 }}>{counts(data)}</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 10 }}>
        <button onClick={exportBackup} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: COLORS.teal, color: "#fff", border: "none", borderRadius: 14, padding: "12px", fontWeight: 700, fontSize: 13 }}>
          <Download size={15} /> Exportar
        </button>
        <button onClick={() => fileRef.current && fileRef.current.click()} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: COLORS.inputBg, color: COLORS.ink, border: "none", borderRadius: 14, padding: "12px", fontWeight: 700, fontSize: 13 }}>
          <Upload size={15} /> Importar
        </button>
        <input ref={fileRef} type="file" accept="application/json,.json" onChange={onFile} style={{ display: "none" }} />
      </div>
      {pending && (
        <div style={{ borderRadius: 16, padding: 14, background: COLORS.tealSoft }}>
          <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 4 }}>Archivo listo ({counts(pending)})</div>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button onClick={() => restore("merge")} style={{ flex: 1, background: COLORS.teal, color: "#fff", border: "none", borderRadius: 11, padding: "9px", fontWeight: 700, fontSize: 12.5 }}>Fusionar</button>
            <button onClick={() => restore("replace")} style={{ flex: 1, background: COLORS.card, color: COLORS.rose, border: "none", borderRadius: 11, padding: "9px", fontWeight: 700, fontSize: 12.5 }}>Reemplazar</button>
          </div>
        </div>
      )}
      {msg && <div style={{ fontSize: 12.5, color: COLORS.teal, fontWeight: 700 }}>{msg}</div>}
    </div>
  );
}

const PRESETS = [

  { id: "60", label: "60D" },

];

function GraficasTab({ dailyAgg, minDate, maxDate }) {
  const COLORS = useTheme();
  const [preset, setPreset] = useState("14");
  const [customStart, setCustomStart] = useState(minDate);
  const [customEnd, setCustomEnd] = useState(maxDate);
  const [useCustom, setUseCustom] = useState(false);
  const printRef = useRef(null);
  const [printMode, setPrintMode] = useState(false);
  const doPrint = (title) => { setPrintMode(true); setTimeout(() => { printElement(printRef, title); setPrintMode(false); }, 250); };

  const range = useMemo(() => {
    if (useCustom) return { start: customStart, end: customEnd };
    if (preset === "all") return { start: minDate, end: maxDate };
    const days = Number(preset);
    const end = new Date(maxDate + "T00:00:00");
    const start = new Date(end);
    start.setDate(start.getDate() - (days - 1));
    return { start: toLocalIsoDate(start), end: maxDate };
  }, [preset, useCustom, customStart, customEnd, minDate, maxDate]);

  const filtered = useMemo(
    () => dailyAgg.filter((d) => d.date >= range.start && d.date <= range.end),
    [dailyAgg, range]
  );

  const liquidStats = statsOf(filtered.map((d) => d.liquidTotal));
  const diaperStats = statsOf(filtered.map((d) => d.diaperTotal));

  const prevMean = useMemo(() => {
    const n = Math.round((new Date(range.end + "T00:00:00") - new Date(range.start + "T00:00:00")) / 86400000) + 1;
    if (!(n > 0)) return null;
    const prevEnd = addDaysIso(range.start, -1), prevStart = addDaysIso(range.start, -n);
    const vals = dailyAgg.filter((d) => d.date >= prevStart && d.date <= prevEnd && d.diaperCount > 0).map((d) => d.diaperTotal);
    return vals.length >= 3 ? mean(vals) : null;
  }, [dailyAgg, range]);

  const points = filtered.map((d) => ({
    date: d.date,
    label: fmtDateShort(d.date),
    value: round1(d.diaperTotal),
    liquid: round1(d.liquidTotal),
    voids: d.voidCount,
    nightVoids: d.nightVoids,
    note: d.dayNote || d.diaperNotes[0],
  }));

  if (dailyAgg.length === 0) {
    return <EmptyState icon={LineChartIcon} text="Registra datos en el diario para ver tu evolución." />;
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 4, background: COLORS.card, padding: 4, borderRadius: 99, boxShadow: COLORS.shadowSm }}>
          {PRESETS.map((p) => {
            const active = !useCustom && preset === p.id;
            return (
              <button
                key={p.id}
                onClick={() => { setPreset(p.id); setUseCustom(false); }}
                style={{
                  padding: "7px 13px", borderRadius: 99, fontSize: 12.5, fontWeight: 700, border: "none",
                  background: active ? COLORS.teal : "transparent",
                  color: active ? "#fff" : COLORS.inkSoft,
                }}
              >
                {p.label}
              </button>
            );
          })}
        </div>

        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => exportRangeExcel(filtered, liquidStats, diaperStats, range)} style={{ display: "flex", alignItems: "center", gap: 5, background: COLORS.card, color: COLORS.ink, border: "none", borderRadius: 99, padding: "8px 13px", fontSize: 12, fontWeight: 700, boxShadow: COLORS.shadowSm }}>
            <FileSpreadsheet size={14} color={COLORS.teal} /> Excel
          </button>
          <button onClick={() => doPrint("Incontrol · Evolución clínica")} style={{ display: "flex", alignItems: "center", gap: 5, background: COLORS.card, color: COLORS.ink, border: "none", borderRadius: 99, padding: "8px 13px", fontSize: 12, fontWeight: 700, boxShadow: COLORS.shadowSm }}>
            <Printer size={14} color={COLORS.teal} /> PDF
          </button>
        </div>
      </div>

      <div className="no-print" style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 14, fontSize: 12.5, color: COLORS.inkSoft, flexWrap: "wrap" }}>
        <span>Periodo personalizado:</span>
        <input type="date" value={customStart} min={minDate} max={maxDate} onChange={(e) => { setCustomStart(e.target.value); setUseCustom(true); }} />
        <span>a</span>
        <input type="date" value={customEnd} min={minDate} max={maxDate} onChange={(e) => { setCustomEnd(e.target.value); setUseCustom(true); }} />
      </div>

      <ThemeContext.Provider value={printMode ? LIGHT_COLORS : COLORS}>
        <div ref={printRef} style={{ display: "flex", flexDirection: "column", gap: 18, background: printMode ? LIGHT_COLORS.paper : "transparent" }}>
          <PeriodHeadline points={points} days={filtered} prevMean={prevMean} />

          <defs>
            <linearGradient id="liquidWave" x1="0" y1="0" x2="0" y2="1">

function PeriodHeadline({ points, days, prevMean }) {
  const COLORS = useTheme();
  const values = points.map((p) => p.value);
  if (values.length < 2) return null;
  const st = statsOf(values);
  const xs = points.map((p) => dayOffset(points[0].date, p.date));
  const { slope } = linreg(values, xs);
  const sm = summarizeDiary(days);
  const sev = classifyLoss(st.mean);
  const span = xs[xs.length - 1] - xs[0];
  const change = st.mean > 0 ? (slope * span) / st.mean : 0; // cambio relativo estimado a lo largo del periodo
  const trend = Math.abs(change) < 0.1 ? "estable" : change < 0 ? "a la baja" : "al alza";
  const cv = st.mean > 0 ? st.sd / st.mean : 0;
  const variation = cv < 0.3 ? "regular" : cv < 0.6 ? "con variación moderada" : "muy irregular";
  const parts = [];
  parts.push(`En ${values.length} días con registro, la pérdida media es de ${fmtEs(round1(st.mean), 0)} g/día${sev ? ` (${sev.label.toLowerCase()})` : ""}, con tendencia ${trend} y un patrón ${variation}.`);
  if (prevMean && prevMean > 0) {
    const pct = Math.round(((st.mean - prevMean) / prevMean) * 100);
    parts.push(Math.abs(pct) < 5 ? "Es similar al periodo anterior." : `Es un ${Math.abs(pct)} % ${pct < 0 ? "menos" : "más"} que en el periodo anterior.`);
  }
  const diary = [];
  if (sm.nocturia !== null) diary.push(`nocturia de ${fmtEs(round1(sm.nocturia), 1)} por noche`);
  if (sm.npi !== null) diary.push(`${fmtEs(Math.round(sm.npi), 0)} % de la orina de noche`);
  if (sm.leaksPerDay !== null && sm.totalLeaks > 0) diary.push(`${fmtEs(round1(sm.leaksPerDay), 1)} escapes al día`);
  if (diary.length) parts.push(`Diario miccional: ${diary.join(", ")}.`);
  return (
    <div style={{ background: COLORS.tealSoft, borderRadius: 22, padding: "16px 18px", display: "flex", gap: 12, alignItems: "flex-start" }}>
      <Sparkles size={20} color={COLORS.teal} style={{ flexShrink: 0, marginTop: 2 }} />
      <div>
        <div style={{ fontSize: 12, fontWeight: 800, color: COLORS.teal, marginBottom: 4 }}>Resumen del periodo</div>
        <div style={{ fontSize: 13.5, lineHeight: 1.55, color: COLORS.ink }}>{parts.join(" ")}</div>
      </div>
    </div>
  );
}

function SummaryStatCards({ points, unit, prevMean }) {
  const COLORS = useTheme();
  const values = points.map((p) => p.value);
  if (values.length === 0) return null;

  const { mean: m, median: med, sd, max, min } = statsOf(values);
  const xs = points.map((p) => dayOffset(points[0]?.date, p.date));
  const { slope, r2 } = linreg(values, xs);
  const maxPoint = points[values.indexOf(max)];
  const minPoint = points[values.indexOf(min)];

  const trendFlat = Math.abs(slope) < 0.05;
  const trendDown = slope < 0;
  const TrendIcon = trendFlat ? Minus : trendDown ? TrendingDown : TrendingUp;
  const trendColor = trendFlat ? COLORS.inkSoft : trendDown ? COLORS.teal : COLORS.amber;
  const trendBg = trendFlat ? COLORS.inputBg : trendDown ? COLORS.tealSoft : COLORS.amberSoft;
  const trendDesc = trendFlat
    ? `Sin cambios relevantes por día en el periodo (R² = ${fmtEs(r2, 2)}).`
    : `${trendDown ? "Reducción" : "Aumento"} de ${fmtEs(Math.abs(round1(slope)), 2)} ${unit} por cada día natural (R² = ${fmtEs(r2, 2)}).`;

  const medianDesc = med > m * 1.05
    ? `La mitad de los días registran menos de ${fmtEs(round1(med), 0)} ${unit}. Por encima de la media: unos pocos días bajos la reducen.`
    : med < m * 0.95
      ? `La mitad de los días registran menos de ${fmtEs(round1(med), 0)} ${unit}. Por debajo de la media: algún pico puntual la eleva respecto al día típico.`
      : `La mitad de los días registran menos de ${fmtEs(round1(med), 0)} ${unit}. Muy cerca de la media: patrón regular, sin picos que lo distorsionen.`;

  const r2Strong = r2 >= 0.7, r2Mod = r2 >= 0.35 && r2 < 0.7;
  const r2Color = r2Strong ? COLORS.teal : r2Mod ? COLORS.amber : COLORS.inkSoft;
  const r2Bg = r2Strong ? COLORS.tealSoft : r2Mod ? COLORS.amberSoft : COLORS.inputBg;
  const r2Desc = r2Strong
    ? "La tendencia explica una parte muy alta de la variación diaria: patrón temporal consistente."
    : r2Mod
      ? "La tendencia explica una parte moderada de la variación: hay cierto patrón, con bastante dispersión."
      : "La tendencia explica poca variación: los valores fluctúan más por causas puntuales que por una evolución sostenida.";

  const cv = m > 0 ? sd / m : 0;
  const cvPct = cv * 100;
  const sdLow = cv < 0.3, sdMod = cv >= 0.3 && cv < 0.6;
  const sdColor = sdLow ? COLORS.teal : sdMod ? COLORS.amber : COLORS.rose;
  const sdBg = sdLow ? COLORS.tealSoft : sdMod ? COLORS.amberSoft : COLORS.roseSoft;
  const sdDesc = sdLow
    ? `Valores próximos a la media (±${fmtEs(round1(sd), 0)} ${unit}): poca dispersión día a día.`
    : sdMod
      ? `Oscilación moderada respecto a la media (±${fmtEs(round1(sd), 0)} ${unit}): cierta irregularidad entre días.`
      : `Oscilación grande respecto a la media (±${fmtEs(round1(sd), 0)} ${unit}): patrón muy irregular.`;
  const cvDesc = sdLow
    ? `Variación relativa baja (${fmtEs(round1(cvPct), 0)} %): los días se comportan de forma consistente.`
    : sdMod
      ? `Variación relativa moderada (${fmtEs(round1(cvPct), 0)} %): diferencias apreciables entre días.`
      : `Variación relativa alta (${fmtEs(round1(cvPct), 0)} %): comportamiento diario poco predecible.`;

  const cards = [
    { icon: Droplet, color: COLORS.blue, bg: COLORS.card, value: `${fmtEs(round1(m), 0)} ${unit}/día`, label: "Pérdida media diaria", desc: prevMean && prevMean > 0
      ? `${m < prevMean ? "▼" : m > prevMean ? "▲" : "="} ${fmtEs(Math.abs(round1(((m - prevMean) / prevMean) * 100)), 0)} % respecto al periodo anterior (${fmtEs(round1(prevMean), 0)} ${unit}/día).`
      : "Promedio del periodo estudiado." },
    { icon: AlertTriangle, color: COLORS.amber, bg: COLORS.card, value: `${fmtEs(round1(max), 0)} ${unit}`, label: "Pico máximo", desc: `${fmtDateLong(maxPoint.date)}${maxPoint.note ? ` · ${maxPoint.note}` : ""}` },
    { icon: Scale, color: COLORS.inkSoft, bg: COLORS.card, value: `${fmtEs(round1(min), 0)} ${unit}`, label: "Mínimo alcanzado", desc: `${fmtDateLong(minPoint.date)}${minPoint.note ? ` · ${minPoint.note}` : ""}` },
    { icon: TrendIcon, color: trendColor, bg: trendBg, value: `${slope > 0 ? "+" : ""}${fmtEs(round1(slope), 2)} ${unit}/día`, label: trendFlat ? "Tendencia estable" : trendDown ? "Pendiente de mejora" : "Pendiente de aumento", desc: trendDesc },
    { icon: BarChart3, color: COLORS.purple, bg: COLORS.card, value: `${fmtEs(round1(med), 0)} ${unit}/día`, label: "Mediana", desc: medianDesc },
    { icon: Gauge, color: r2Color, bg: r2Bg, value: fmtEs(r2, 2), label: "Ajuste de la tendencia (R²)", desc: r2Desc },
    { icon: Activity, color: sdColor, bg: sdBg, value: `± ${fmtEs(round1(sd), 0)} ${unit}`, label: "Desviación típica", desc: sdDesc },
    { icon: Percent, color: sdColor, bg: sdBg, value: `${fmtEs(round1(cvPct), 0)} %`, label: "Coeficiente de variación", desc: cvDesc },
  ];

  return (
    <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 12 }}>
      {cards.map((c, i) => (
        <div key={i} style={{ background: c.bg, borderRadius: 22, padding: "16px", boxShadow: COLORS.shadowSm }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <div style={{ width: 34, height: 34, borderRadius: 12, background: c.bg === COLORS.card ? COLORS.inputBg : COLORS.card, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <c.icon size={18} color={c.color} strokeWidth={2.4} />
            </div>
            <span style={{ fontSize: 12, fontWeight: 700, color: COLORS.inkSoft, lineHeight: 1.2 }}>{c.label}</span>
          </div>
          <div className="num" style={{ fontSize: 22, fontWeight: 800, color: c.color === COLORS.inkSoft ? COLORS.ink : c.color, lineHeight: 1.15 }}>{c.value}</div>
          <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 6, lineHeight: 1.4 }}>{c.desc}</div>
        </div>
      ))}
    </div>
  );
}

function StatsCard({ title, unit, icon: Icon, color, stats }) {
  const COLORS = useTheme();
  const cv = stats.mean > 0 ? (stats.sd / stats.mean) * 100 : 0;
  const rows = [
    ["Media", `${fmtEs(round1(stats.mean), 1)} ${unit}`],
    ["Mediana", `${fmtEs(round1(stats.median), 1)} ${unit}`],
    ["Desv. típica", `${fmtEs(round1(stats.sd), 1)} ${unit}`],
    ["Coef. de variación", `${fmtEs(round1(cv), 1)} %`],
    ["Máximo", `${fmtEs(round1(stats.max), 1)} ${unit}`],
    ["Mínimo", `${fmtEs(round1(stats.min), 1)} ${unit}`],
  ];
  return (
    <div style={{ background: COLORS.card, borderRadius: 22, padding: 16, boxShadow: COLORS.shadowSm }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Icon size={16} color={color} />
        <span style={{ fontWeight: 700, fontSize: 13.5 }}>{title}</span>
      </div>
      {stats.n === 0 ? <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Sin datos en el periodo.</div> : (
        <div>
          {rows.map(([label, val]) => (
            <div key={label} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderTop: `1px solid ${COLORS.line}` }}>
              <span style={{ fontSize: 12.5, color: COLORS.inkSoft }}>{label}</span>
              <span className="num" style={{ fontSize: 12.5, fontWeight: 700 }}>{val}</span>
            </div>
          ))}
          <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 6 }}>n = {stats.n} días</div>
        </div>
      )}
    </div>
  );
}

// ---------- Tab: informe IA ----------
const GEMINI_MODEL_CANDIDATES = ["gemini-flash-latest", "gemini-2.5-flash-lite", "gemini-2.5-flash"];
const GEMINI_KEY_STORAGE = "incontrol-gemini-api-key";
const GEMINI_RETRYABLE_MSG = /no longer available|not found|not supported|overloaded|high demand|unavailable/i;

async function callGeminiWithFallback(apiKey, contents, attempt = 1) {
  let lastErr = null;
  let allRetryable = true;
  for (const model of GEMINI_MODEL_CANDIDATES) {
    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
          body: JSON.stringify({ contents }),
        }
      );
      if (!response.ok) {
        const errBody = await response.json().catch(() => null);
        const msg = (errBody && errBody.error && errBody.error.message) || `Error ${response.status}`;
        const retryable = response.status === 404 || response.status === 503 || GEMINI_RETRYABLE_MSG.test(msg);
        if (retryable) { lastErr = new Error(msg); continue; }
        allRetryable = false;
        throw new Error(msg);
      }
      const json = await response.json();
      if (!json.candidates || !json.candidates.length) {
        const blockReason = json.promptFeedback && json.promptFeedback.blockReason;
        throw new Error(blockReason ? `Respuesta bloqueada por Gemini (${blockReason}).` : "Respuesta vacía de Gemini.");
      }
      const parts = (json.candidates[0].content && json.candidates[0].content.parts) || [];
      const text = parts.map((p) => p.text || "").filter(Boolean).join("\n");
      if (!text) throw new Error("Respuesta vacía");
      return text;
    } catch (e) {
      if (e && e.message === "Failed to fetch") { lastErr = e; allRetryable = false; break; }
      lastErr = e;
      if (!GEMINI_RETRYABLE_MSG.test(e.message || "")) { allRetryable = false; break; }
    }
  }
  if (allRetryable && attempt < 2) {
    await new Promise((r) => setTimeout(r, 2500));
    return callGeminiWithFallback(apiKey, contents, attempt + 1);
  }
  throw lastErr || new Error("No se pudo generar el informe.");
}

function InformeTab({ dailyAgg, minDate, maxDate, lastReport, setLastReport }) {
  const [printMode, setPrintMode] = useState(false);
  const THEME = useTheme();
  const COLORS = printMode ? LIGHT_COLORS : THEME;
  const [preset, setPreset] = useState(lastReport?.preset || "14");
  const [loading, setLoading] = useState(false);
  const [report, setReport] = useState(lastReport?.report || "");
  const [error, setError] = useState("");
  const [apiKey, setApiKey] = useState(() => localStorage.getItem(GEMINI_KEY_STORAGE) || "");
  const [showKeyField, setShowKeyField] = useState(false);
  const [conversation, setConversation] = useState(lastReport?.conversation || []);
  const [followUpText, setFollowUpText] = useState("");
  const [askLoading, setAskLoading] = useState(false);
  const [askError, setAskError] = useState("");
  const lastPromptRef = useRef(lastReport?.prompt || "");
  const printRef = useRef(null);

  const saveApiKey = (value) => {
    setApiKey(value);
    if (value) localStorage.setItem(GEMINI_KEY_STORAGE, value);
    else localStorage.removeItem(GEMINI_KEY_STORAGE);
  };

  const range = useMemo(() => {
    if (preset === "all") return { start: minDate, end: maxDate };
    const days = Number(preset);
    const end = new Date(maxDate + "T00:00:00");
    const start = new Date(end);
    start.setDate(start.getDate() - (days - 1));
    return { start: toLocalIsoDate(start), end: maxDate };
  }, [preset, minDate, maxDate]);

  const filtered = useMemo(
    () => dailyAgg.filter((d) => d.date >= range.start && d.date <= range.end),
    [dailyAgg, range]
  );

  const liquidStats = statsOf(filtered.map((d) => d.liquidTotal));
  const diaperStats = statsOf(filtered.map((d) => d.diaperTotal));
  const changeStats = statsOf(filtered.map((d) => d.diaperCount));

  const generate = useCallback(async () => {
    if (filtered.length === 0) { setError("No hay datos en el periodo seleccionado."); return; }
    if (!apiKey) {
      setError("Configura tu clave de API de Gemini para generar el informe.");
      setShowKeyField(true);
      return;
    }
    setLoading(true); setError(""); setReport(""); setConversation([]); setAskError("");

    const seriesText = filtered
      .map((d) => `${d.date}: líquido ${round1(d.liquidTotal)} ml, peso neto pañales ${round1(d.diaperTotal)} g, cambios ${d.diaperCount}${d.voidCount ? `, micciones ${d.voidCount} (nocturnas ${d.nightVoids}, jarra noche ${round1(d.nightVoidVol)} ml)` : ""}${d.leakCount ? `, escapes ${d.leakCount}` : ""}${d.dayNote ? `, nota: "${d.dayNote}"` : ""}`)
      .join("\n");

    const diaryBlock = diaryText(filtered);
    const prompt = `Actúa como un panel simulado de especialistas en urología (perfil clínico, con enfoque en incontinencia, manejo de líquidos y diario miccional). Esto es una SIMULACIÓN educativa e informativa, no una consulta médica real.

Datos diarios del diario:
Periodo: ${range.start} a ${range.end} (${filtered.length} días).

Estadísticas:
- Líquido diario: media ${round1(liquidStats.mean)} ml, mediana ${round1(liquidStats.median)} ml, máx ${round1(liquidStats.max)} ml, mín ${round1(liquidStats.min)} ml.
- Peso neto diario de pañales: media ${round1(diaperStats.mean)} g, mediana ${round1(diaperStats.median)} g, máx ${round1(diaperStats.max)} g, mín ${round1(diaperStats.min)} g.
- Cambios diarios: media ${round1(changeStats.mean)}.

Serie diaria:
${seriesText}
${diaryBlock ? `\n${diaryBlock}\n` : ""}
Redacta un informe estructurado en español con:
1. Resumen general del patrón observado.
2. Relación entre ingesta de líquidos y volumen de pérdidas.
3. Valoración orientativa del diario miccional, nocturia y volumen nocturno en jarra.
4. Puntos clave a comentar en consulta médica real.
5. Recomendaciones generales de seguimiento (sin prescripción farmacológica).
6. Nota final indicando que es una simulación educativa generada por IA.

Usa un tono claro, empático y prudente.`;

    lastPromptRef.current = prompt;

    try {
      const text = await callGeminiWithFallback(apiKey, [{ role: "user", parts: [{ text: prompt }] }]);
      setReport(text);
      setLastReport({ report: text, conversation: [], prompt, preset, range, generatedAt: Date.now() });
    } catch (e) {
      setError(e && e.message === "Failed to fetch" ? "Error de conexión con Gemini." : `Error: ${e.message}`);
    } finally {
      setLoading(false);
    }
  }, [filtered, range, liquidStats, diaperStats, changeStats, apiKey, preset, setLastReport]);

  const askFollowUp = useCallback(async () => {
    const q = followUpText.trim();
    if (!q || !apiKey) return;
    setAskLoading(true); setAskError("");
    try {
      const contents = [
        { role: "user", parts: [{ text: lastPromptRef.current }] },
        { role: "model", parts: [{ text: report }] },
        ...conversation.flatMap((qa) => ([
          { role: "user", parts: [{ text: qa.question }] },
          { role: "model", parts: [{ text: qa.answer }] },
        ])),
        { role: "user", parts: [{ text: q }] },
      ];
      const answer = await callGeminiWithFallback(apiKey, contents);
      const nextConversation = [...conversation, { question: q, answer }];
      setConversation(nextConversation);
      setFollowUpText("");
      if (lastReport) setLastReport({ ...lastReport, conversation: nextConversation });
    } catch (e) {
      setAskError(`No se pudo responder: ${e.message}`);
    } finally {
      setAskLoading(false);
    }
  }, [followUpText, apiKey, report, conversation, lastReport, setLastReport]);

  if (dailyAgg.length === 0) {
    return <EmptyState icon={FileText} text="Registra datos en el diario antes de generar un informe." />;
  }

  return (
    <div>
      <div style={{ background: COLORS.card, borderRadius: 24, padding: 20, boxShadow: COLORS.shadowSm, marginBottom: 18 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, gap: 8 }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 17, letterSpacing: "-0.02em" }}>Análisis clínico con IA</div>
            <div style={{ fontSize: 12.5, color: COLORS.inkSoft }}>Periodo: {fmtDateLabel(range.start)} — {fmtDateLabel(range.end)}</div>
          </div>
          <button
            onClick={() => setShowKeyField((s) => !s)}
            style={{
              display: "flex", alignItems: "center", gap: 5,
              padding: "8px 12px", borderRadius: 99, border: "none",
              background: apiKey ? COLORS.tealSoft : COLORS.inputBg,
              color: apiKey ? COLORS.teal : COLORS.inkSoft,
              fontSize: 12, fontWeight: 700,
            }}
          >
            <KeyRound size={13} /> {apiKey ? "API lista" : "Clave API"}
          </button>
        </div>

        {showKeyField && (
          <div style={{ marginBottom: 16, padding: 14, borderRadius: 16, background: COLORS.inputBg }}>
            <Field label="Clave de API de Google Gemini">
              <input type="password" value={apiKey} onChange={(e) => saveApiKey(e.target.value)} placeholder="AIzaSy..." style={{ width: "100%", background: COLORS.card }} />
            </Field>
            <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 8 }}>
              Se guarda solo en tu dispositivo. Obtén una gratis en <span className="num">aistudio.google.com/apikey</span>.
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
          {PRESETS.map((p) => (
            <button
              key={p.id}
              onClick={() => setPreset(p.id)}
              style={{
                padding: "7px 14px", borderRadius: 99, fontSize: 12.5, fontWeight: 700, border: "none",
                background: preset === p.id ? COLORS.teal : COLORS.inputBg,
                color: preset === p.id ? "#fff" : COLORS.inkSoft,
              }}
            >
              {p.label}
            </button>
          ))}
        </div>

        <button
          onClick={generate}
          disabled={loading}
          style={{
            width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            background: COLORS.teal, color: "#fff", border: "none",
            borderRadius: 16, padding: "14px", fontWeight: 800, fontSize: 14.5,
            opacity: loading ? 0.7 : 1,
          }}
        >
          {loading ? <Loader2 size={17} style={{ animation: "spin 1s linear infinite" }} /> : <Sparkles size={17} />}
          {loading ? "Analizando tus registros…" : "Generar informe clínico"}
        </button>
        <style>{`@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }`}</style>
      </div>

      {error && (
        <div style={{ display: "flex", gap: 8, alignItems: "center", background: COLORS.roseSoft, color: COLORS.rose, borderRadius: 16, padding: "12px 16px", marginBottom: 16, fontSize: 13, fontWeight: 600 }}>
          <AlertCircle size={17} /> {error}
        </div>
      )}

      {report && (
        <ThemeContext.Provider value={printMode ? LIGHT_COLORS : COLORS}>
        <div ref={printRef} style={{ background: printMode ? LIGHT_COLORS.paper : "transparent" }}>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }} className="no-print">
            <button onClick={() => { setPrintMode(true); setTimeout(() => { printElement(printRef, "Incontrol · Informe clínico"); setPrintMode(false); }, 250); }} style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.card, color: COLORS.ink, border: "none", borderRadius: 99, padding: "8px 14px", fontSize: 12.5, fontWeight: 700, boxShadow: COLORS.shadowSm }}>
              <Printer size={14} color={COLORS.teal} /> Exportar PDF
            </button>
          </div>
          <div style={{ background: COLORS.card, borderRadius: 24, padding: 22, boxShadow: COLORS.shadowSm }}>
            <div style={{ whiteSpace: "pre-wrap", fontSize: 14.5, lineHeight: 1.7, color: COLORS.ink }}>{report}</div>
          </div>

          {conversation.length > 0 && (
            <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
              {conversation.map((qa, i) => (
                <div key={i} style={{ background: COLORS.card, borderRadius: 20, padding: 18, boxShadow: COLORS.shadowSm }}>
                  <div style={{ fontSize: 13.5, fontWeight: 800, color: COLORS.teal, marginBottom: 8 }}>{qa.question}</div>
                  <div style={{ whiteSpace: "pre-wrap", fontSize: 14, lineHeight: 1.65 }}>{qa.answer}</div>
                </div>
              ))}
            </div>
          )}

          <div className="no-print" style={{ marginTop: 16, background: COLORS.card, borderRadius: 20, padding: 14, boxShadow: COLORS.shadowSm }}>
            {askError && <div style={{ color: COLORS.rose, fontSize: 12.5, marginBottom: 8, fontWeight: 600 }}>{askError}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <input type="text" value={followUpText} onChange={(e) => setFollowUpText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !askLoading) askFollowUp(); }} placeholder="Pregunta algo sobre tu informe…" style={{ flex: 1 }} disabled={askLoading} />
              <button onClick={askFollowUp} disabled={askLoading || !followUpText.trim()} style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 14, padding: "0 18px", fontWeight: 700, fontSize: 13.5, opacity: askLoading || !followUpText.trim() ? 0.5 : 1 }}>
                {askLoading ? "…" : "Enviar"}
              </button>
            </div>
          </div>
        </div>
        </ThemeContext.Provider>
      )}
    </div>
  );
}

function App() {
  return (
    <ErrorBoundary>
      <IncontrolApp />
    </ErrorBoundary>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
