import React, { useState, useEffect, useMemo, useCallback, useRef } from "react";

const XLSX = window.XLSX;

// ---------- almacenamiento local ----------
// Sustituye a `window.storage` (la API propia del entorno de artefactos de Claude)
// por un polyfill con la misma forma, respaldado por localStorage del navegador.
// Así el resto del código de guardado/carga funciona sin ningún cambio.
// IMPORTANTE: a diferencia del almacenamiento de Claude, localStorage vive SOLO en
// este navegador y este dispositivo concreto — no es accesible desde otro
// ordenador, móvil o navegador, y puede borrarse si limpias los datos de
// navegación. Usa "Exportar todo a Excel" con regularidad como copia de seguridad.
(function installStoragePolyfill() {
  if (window.storage) return;
  const NS = "incontrol:";
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(NS + key);
      if (raw === null) throw new Error("clave no encontrada: " + key);
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(NS + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(NS + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const p = NS + (prefix || "");
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(NS.length));
      return { keys, prefix: prefix || "", shared: false };
    },
  };
})();

// ---------- utilidades ----------
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const fmtDateShort = (isoDate) => {

// Calcula la diferencia en días naturales entre dos fechas ISO (YYYY-MM-DD).
// Se usa como eje X real de la regresión, para que la pendiente sea siempre
// "unidad / día natural" aunque falten días sin registro entre medias.
function dayOffset(isoStart, isoDate) {
  const a = new Date(isoStart + "T00:00:00");
  const b = new Date(isoDate + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

// xs opcional: posiciones reales en el eje X (p. ej. días transcurridos desde el
// primer punto). Si no se indica, usa el índice del array como antes.
function linreg(values, xs) {
  const n = values.length;
  if (n < 2) return { slope: 0, intercept: values[0] || 0, r2: 0 };
  if (!xs) xs = values.map((_, i) => i);
  const xMean = mean(xs), yMean = mean(values);
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - xMean) * (values[i] - yMean); den += (xs[i] - xMean) ** 2; }
  const slope = den === 0 ? 0 : num / den;
  const intercept = yMean - slope * xMean;
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < n; i++) {
    const pred = intercept + slope * xs[i];
    ssRes += (values[i] - pred) ** 2;
    ssTot += (values[i] - yMean) ** 2;
  }
  const r2 = ssTot === 0 ? 0 : 1 - ssRes / ssTot;
  return { slope, intercept, r2 };
}

const fmtEs = (n, decimals = 0) => n.toLocaleString("es-ES", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });

const MESES_LARGO = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

// ---------- exportación ----------
function downloadWorkbook(sheets, filename) {
  const wb = XLSX.utils.book_new();
  for (const [name, rowsOrSheet] of sheets) {
    const ws = Array.isArray(rowsOrSheet)
      ? XLSX.utils.json_to_sheet(rowsOrSheet.length ? rowsOrSheet : [{ " ": "Sin datos" }])
      : rowsOrSheet; // ya es una hoja construida a mano (p. ej. la portada)
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  }
  XLSX.writeFile(wb, filename);
}

// Hoja de portada con la marca de la app, fecha de generación y periodo — para
// que el documento tenga un aspecto de informe profesional al compartirlo.
function buildCoverSheet(subtitle, periodText) {
  const rows = [
    ["Incontrol"],
    ["Diario de control de incontinencia — " + subtitle],
    [""],
    ["Generado el", new Date().toLocaleString("es-ES", { dateStyle: "long", timeStyle: "short" })],
    ["Periodo", periodText],
    [""],
    ["Este documento es un registro personal de seguimiento."],
    ["No sustituye la valoración de un profesional sanitario."],
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 16 }, { wch: 46 }];
  return ws;
}

function exportAllExcel(data, dailyAgg) {
  const liquidRows = [...data.liquids]
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((l) => ({ Fecha: l.date, Hora: l.time, "Cantidad (ml)": l.amount, Nota: l.note || "" }));
  const diaperRows = [...data.diapers]
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((p) => ({
      Fecha: p.date, Hora: p.time, "Peso total (g)": p.weight,
      "Peso seco (g)": p.dryWeight === "" || p.dryWeight === undefined ? "" : p.dryWeight,
      "Peso neto (g)": round1(netWeight(p.weight, p.dryWeight)), Nota: p.note || "",
    }));
  const summaryRows = dailyAgg.map((d) => ({
    Fecha: d.date, "Líquido total (ml)": round1(d.liquidTotal), "Tomas de líquido": d.liquidCount,
    "Peso neto pañales (g)": round1(d.diaperTotal), "Cambios de pañal": d.diaperCount, "Nota del día": d.dayNote || "",
    Severidad: classifyLoss(d.diaperTotal)?.label || "",
  }));
  const periodText = dailyAgg.length ? `${dailyAgg[0].date} — ${dailyAgg[dailyAgg.length - 1].date}` : "Sin registros todavía";
  const cover = buildCoverSheet("diario completo", periodText);
  downloadWorkbook(
    [["Portada", cover], ["Líquidos", liquidRows], ["Pañales", diaperRows], ["Resumen diario", summaryRows]],
    `incontrol-diario-${todayStr()}.xlsx`
  );
}

function exportRangeExcel(filtered, liquidStats, diaperStats, range) {
  const rows = filtered.map((d) => ({
    Fecha: d.date, "Líquido (ml)": round1(d.liquidTotal), "Peso neto (g)": round1(d.diaperTotal), Cambios: d.diaperCount, "Nota del día": d.dayNote || "",
    Severidad: classifyLoss(d.diaperTotal)?.label || "",
  }));
  const cvOf = (s) => (s.mean > 0 ? round1((s.sd / s.mean) * 100) : 0);
  const statsRows = [
    { Métrica: "Líquido (ml/día)", Media: round1(liquidStats.mean), Mediana: round1(liquidStats.median), "Desv. típica": round1(liquidStats.sd), "Coef. variación (%)": cvOf(liquidStats), Máximo: round1(liquidStats.max), Mínimo: round1(liquidStats.min) },
    { Métrica: "Peso neto (g/día)", Media: round1(diaperStats.mean), Mediana: round1(diaperStats.median), "Desv. típica": round1(diaperStats.sd), "Coef. variación (%)": cvOf(diaperStats), Máximo: round1(diaperStats.max), Mínimo: round1(diaperStats.min) },
  ];
  const cover = buildCoverSheet("periodo seleccionado", `${range.start} — ${range.end}`);
  downloadWorkbook(
    [["Portada", cover], ["Serie diaria", rows], ["Estadísticas del periodo", statsRows]],
    `incontrol-periodo-${range.start}_a_${range.end}.xlsx`
  );
}

// Exporta a PDF (vía el diálogo de impresión del navegador) únicamente el
// contenido del elemento referenciado. En vez de ocultar el resto de la app con

// reales del gráfico ya calculadas) en una ventana nueva dedicada solo a imprimir.
function printElement(ref, title) {
  const el = ref && ref.current;
  if (!el) return;

  if (!w) {

    return;

  const generatedAt = new Date().toLocaleString("es-ES", { dateStyle: "long", timeStyle: "short" });
  const logoSvg = `<svg width="40" height="40" viewBox="0 0 512 512" style="border-radius:9px;flex-shrink:0;">
    <defs><linearGradient id="pdfBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3C8F86"/><stop offset="100%" stop-color="#173F3C"/></linearGradient></defs>
    <rect width="512" height="512" rx="118" fill="url(#pdfBg)"/>
    <path d="M256 118C256 118 208 190 208 228C208 256.5 229.5 278 256 278C282.5 278 304 256.5 304 228C304 190 256 118 256 118Z" fill="#fff"/>

function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}
function stddev(arr) {
  if (arr.length < 2) return 0;
  const m = mean(arr);
  const variance = arr.reduce((a, b) => a + (b - m) ** 2, 0) / (arr.length - 1);
  return Math.sqrt(variance);
}
function statsOf(arr) {
  if (!arr.length) return { mean: 0, median: 0, sd: 0, max: 0, min: 0, n: 0 };
  return { mean: mean(arr), median: median(arr), sd: stddev(arr), max: Math.max(...arr), min: Math.min(...arr), n: arr.length };
}
const round1 = (n) => Math.round(n * 10) / 10;

// Clasificación orientativa de severidad según el peso neto total absorbido en el día.
// No es un criterio diagnóstico: son umbrales de referencia general, ajustables si el
// profesional sanitario indica otros valores para el caso concreto.
const SEVERITY_THRESHOLDS = { leve: 100, moderada: 300, severa: 600 };
function classifyLoss(gramsPerDay) {
  if (gramsPerDay === null || gramsPerDay === undefined || gramsPerDay <= 0) return null;
  if (gramsPerDay < SEVERITY_THRESHOLDS.leve) return { label: "Leve", color: "#3E8A6D", bg: "#E3F1EA" };
  if (gramsPerDay < SEVERITY_THRESHOLDS.moderada) return { label: "Moderada", color: "#B6841F", bg: "#F5EAD3" };
  if (gramsPerDay < SEVERITY_THRESHOLDS.severa) return { label: "Severa", color: "#C1502E", bg: "#F5E0D6" };
  return { label: "Muy severa", color: "#9A2E20", bg: "#F3DCD8" };
}
const netWeight = (weight, dryWeight) => Math.max(0, (Number(weight) || 0) - (Number(dryWeight) || 0));

// Clasificación orientativa de la ingesta diaria de líquido para una persona con
// incontinencia. La referencia general de hidratación adecuada suele situarse en
// torno a 1500–2500 ml/día; restringir líquidos por debajo de eso no reduce la
// incontinencia y sí aumenta el riesgo de orina concentrada e irritación de la
// vejiga. No es una prescripción médica: los umbrales pueden variar según edad,
// peso, medicación o indicación de un profesional sanitario.
const LIQUID_RECOMMENDED = 1500; // ml/día, valor de referencia mostrado en la etiqueta
const LIQUID_THRESHOLDS = { insuficiente: 1000, poco: 1500, mucho: 2500 };
function classifyLiquid(mlPerDay) {
  if (mlPerDay === null || mlPerDay === undefined || mlPerDay <= 0) return null;
  if (mlPerDay < LIQUID_THRESHOLDS.insuficiente) return { label: "Insuficiente", color: "#9A2E20", bg: "#F3DCD8" };
  if (mlPerDay < LIQUID_THRESHOLDS.poco) return { label: "Poco", color: "#B6841F", bg: "#F5EAD3" };
  if (mlPerDay <= LIQUID_THRESHOLDS.mucho) return { label: "Adecuado", color: "#3E8A6D", bg: "#E3F1EA" };
  return { label: "Mucho", color: "#B6841F", bg: "#F5EAD3" };
}

// ---------- almacenamiento de datos de la app (sobre window.storage) ----------
// Líquidos, pesajes y notas del día se guardan en entradas de almacenamiento independientes
// (nunca mezclados en el mismo registro).
const OLD_STORAGE_KEY = "diaper-tracker-entries-v1"; // formato antiguo combinado, solo para migración
const STORAGE_KEY_LIQUIDS = "diaper-tracker-liquids-v1";
const STORAGE_KEY_DIAPERS = "diaper-tracker-diapers-v1";
const STORAGE_KEY_DAYNOTES = "diaper-tracker-daynotes-v1";
const STORAGE_KEY_SETTINGS = "diaper-tracker-settings-v1";
const storageAvailable = () => typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";

async function loadData() {
  if (!storageAvailable()) return { data: { liquids: [], diapers: [], dayNotes: {}, settings: {} }, storageOk: false };

  let liquids = null;
  let diapers = null;
  let dayNotes = null;
  let settings = null;
  try {
    const res = await window.storage.get(STORAGE_KEY_LIQUIDS, false);
    if (res && res.value) liquids = JSON.parse(res.value);
  } catch (e) { /* la clave aún no existe la primera vez: es normal */ }
  try {
    const res = await window.storage.get(STORAGE_KEY_DIAPERS, false);
    if (res && res.value) diapers = JSON.parse(res.value);
  } catch (e) { /* la clave aún no existe la primera vez: es normal */ }
  try {
    const res = await window.storage.get(STORAGE_KEY_DAYNOTES, false);
    if (res && res.value) dayNotes = JSON.parse(res.value);
  } catch (e) { /* la clave aún no existe la primera vez: es normal */ }
  try {
    const res = await window.storage.get(STORAGE_KEY_SETTINGS, false);
    if (res && res.value) settings = JSON.parse(res.value);
  } catch (e) { /* la clave aún no existe la primera vez: es normal */ }

  // migración: si no hay nada en las claves nuevas, comprueba si existen datos
  // del formato antiguo (un único registro combinado) y sepáralos.
  if (liquids === null && diapers === null) {
    try {
      const old = await window.storage.get(OLD_STORAGE_KEY, false);
      if (old && old.value) {
        const parsed = JSON.parse(old.value);
        liquids = parsed.liquids || [];
        diapers = parsed.diapers || [];
        await window.storage.set(STORAGE_KEY_LIQUIDS, JSON.stringify(liquids), false);
        await window.storage.set(STORAGE_KEY_DIAPERS, JSON.stringify(diapers), false);
      }
    } catch (e) { /* no había datos antiguos que migrar */ }
  }

  return { data: { liquids: liquids || [], diapers: diapers || [], dayNotes: dayNotes || {}, settings: settings || {} }, storageOk: true };
}

async function saveData(data) {
  if (!storageAvailable()) return false;
  try {
    const [resLiquids, resDiapers, resNotes, resSettings] = await Promise.all([
      window.storage.set(STORAGE_KEY_LIQUIDS, JSON.stringify(data.liquids), false),
      window.storage.set(STORAGE_KEY_DIAPERS, JSON.stringify(data.diapers), false),
      window.storage.set(STORAGE_KEY_DAYNOTES, JSON.stringify(data.dayNotes || {}), false),
      window.storage.set(STORAGE_KEY_SETTINGS, JSON.stringify(data.settings || {}), false),
    ]);
    return !!resLiquids && !!resDiapers && !!resNotes && !!resSettings;
  } catch (e) {
    console.error("Error guardando datos", e);
    return false;
  }
}

// Red de seguridad: si algo falla de forma inesperada en tiempo de ejecución,
// muestra un mensaje claro en vez de dejar la pantalla en blanco.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null, info: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error("Incontrol · error no controlado:", error, info);
    this.setState({ info });
  }
  render() {
    if (this.state.hasError) {
      const details = [
        this.state.error && (this.state.error.message || String(this.state.error)),
        this.state.error && this.state.error.stack,
        this.state.info && this.state.info.componentStack,
      ].filter(Boolean).join("\n\n");
      return (
        <div style={{ minHeight: "100vh", background: COLORS.paper, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "Inter, sans-serif" }}>
          <div style={{ maxWidth: 480, textAlign: "center", background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 16, padding: 28, boxShadow: COLORS.shadowMd }}>
            <AlertCircle size={28} color="#B23B2E" style={{ marginBottom: 10 }} />
            <div style={{ fontWeight: 800, fontSize: 16, color: COLORS.ink, marginBottom: 6 }}>Algo ha ido mal</div>
            <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 18, lineHeight: 1.5 }}>
              Ha ocurrido un error inesperado al mostrar la app. Tus datos guardados no se han visto afectados.
            </div>
            <button
              onClick={() => window.location.reload()}
              style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 10, padding: "10px 20px", fontWeight: 700, fontSize: 13, marginBottom: 16 }}
            >
              Recargar la app
            </button>
            {details && (
              <details style={{ textAlign: "left" }}>
                <summary style={{ cursor: "pointer", fontSize: 12, color: COLORS.inkSoft, fontWeight: 600 }}>Detalle técnico (para diagnóstico)</summary>
                <pre className="num" style={{ fontSize: 10.5, lineHeight: 1.5, whiteSpace: "pre-wrap", wordBreak: "break-word", background: "#F6F4EE", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: 10, marginTop: 8, maxHeight: 240, overflow: "auto" }}>
                  {details}
                </pre>
              </details>
            )}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function IncontrolApp() {
  const [data, setData] = useState({ liquids: [], diapers: [], dayNotes: {}, settings: {} });
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("registro");
  const [saveStatus, setSaveStatus] = useState("idle"); // idle | saving | saved | error | unavailable
  const saveTimer = useRef(null);
  const dataRef = useRef(data);
  const skipNextSave = useRef(true); // evita un guardado innecesario justo al cargar los datos
  dataRef.current = data;

  useEffect(() => {
    loadData().then(({ data: d, storageOk }) => {
      setData(d);
      setReady(true);
      if (!storageOk) setSaveStatus("unavailable");
    });
  }, []);

  const flushSave = useCallback(() => {
    if (saveTimer.current) { clearTimeout(saveTimer.current); saveTimer.current = null; }
    setSaveStatus("saving");
    saveData(dataRef.current).then((ok) => setSaveStatus(ok ? "saved" : "error"));
  }, []);

  useEffect(() => {
    if (!ready) return;
    if (saveStatus === "unavailable") return;
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current = setTimeout(() => {
      saveData(data).then((ok) => setSaveStatus(ok ? "saved" : "error"));
    }, 200);
    return () => clearTimeout(saveTimer.current);
  }, [data, ready, saveStatus]);

  // guardado de emergencia si la app se oculta, pierde el foco o se cierra
  useEffect(() => {
    const onHide = () => { if (saveTimer.current) flushSave(); };
    document.addEventListener("visibilitychange", onHide);
    window.addEventListener("pagehide", onHide);
    window.addEventListener("beforeunload", onHide);
    return () => {
      document.removeEventListener("visibilitychange", onHide);
      window.removeEventListener("pagehide", onHide);
      window.removeEventListener("beforeunload", onHide);
    };
  }, [flushSave]);

  const addLiquid = (entry) => setData((d) => ({ ...d, liquids: [...d.liquids, { id: uid(), ...entry }] }));
  const addDiaper = (entry) => setData((d) => ({ ...d, diapers: [...d.diapers, { id: uid(), ...entry }] }));
  const removeLiquid = (id) => setData((d) => ({ ...d, liquids: d.liquids.filter((x) => x.id !== id) }));
  const removeDiaper = (id) => setData((d) => ({ ...d, diapers: d.diapers.filter((x) => x.id !== id) }));
  const setDayNote = (date, text) => setData((d) => {
    const dayNotes = { ...(d.dayNotes || {}) };
    if (text && text.trim()) dayNotes[date] = text.trim(); else delete dayNotes[date];
    return { ...d, dayNotes };
  });
  const setDefault = (key, value) => setData((d) => ({ ...d, settings: { ...(d.settings || {}), [key]: value } }));

  // días con datos, agregados
  const dailyAgg = useMemo(() => {
    const map = {};
    const ensure = (date) => {
      map[date] = map[date] || { date, liquidTotal: 0, liquidCount: 0, diaperTotal: 0, diaperCount: 0, diaperWeights: [], liquidNotes: [], diaperNotes: [], dayNote: "" };
      return map[date];
    };
    for (const l of data.liquids) {
      const row = ensure(l.date);
      row.liquidTotal += Number(l.amount) || 0;
      row.liquidCount += 1;
      if (l.note) row.liquidNotes.push(l.note);
    }
    for (const p of data.diapers) {
      const row = ensure(p.date);
      const net = netWeight(p.weight, p.dryWeight);
      row.diaperTotal += net;
      row.diaperCount += 1;
      row.diaperWeights.push(net);
      if (p.note) row.diaperNotes.push(p.note);
    }
    for (const [date, text] of Object.entries(data.dayNotes || {})) {
      ensure(date).dayNote = text;
    }
    return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
  }, [data]);

  const allDates = dailyAgg.map((d) => d.date);
  const minDate = allDates[0] || todayStr();
  const maxDate = allDates[allDates.length - 1] || todayStr();

  // racha de días consecutivos con al menos un registro, contando hacia atrás
  // desde hoy (si hoy aún no tiene nada, empieza a contar desde ayer para no
  // romper la racha mientras el día está en curso)
  const streak = useMemo(() => {
    if (!allDates.length) return 0;
    const dateSet = new Set(allDates);
    let count = 0;
    const cursor = new Date(todayStr() + "T00:00:00");
    if (!dateSet.has(todayStr())) cursor.setDate(cursor.getDate() - 1);
    while (dateSet.has(cursor.toISOString().slice(0, 10))) {
      count++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return count;
  }, [allDates]);

  const lastDryWeight = useMemo(() => {
    if (!data.diapers.length) return "";
    const sorted = [...data.diapers].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const last = sorted[sorted.length - 1];
    return last.dryWeight ?? "";
  }, [data.diapers]);

  if (!ready) {
    return (
      <div style={{ minHeight: "100vh", background: COLORS.paper, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, fontFamily: "Inter, sans-serif", color: COLORS.inkSoft }}>
        <div style={{ animation: "incontrolPulse 1.4s ease-in-out infinite" }}>
          <LogoMark size={48} />
        </div>
        <div style={{ fontSize: 13, fontWeight: 600 }}>Cargando Incontrol…</div>
        <style>{`@keyframes incontrolPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.94); } }`}</style>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: `linear-gradient(180deg, #F8F7F2 0%, ${COLORS.paper} 260px)`, fontFamily: "Inter, ui-sans-serif, sans-serif", color: COLORS.ink }}>
      <style>{`
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
        input[type="date"], input[type="time"], input[type="number"], input[type="text"], input[type="password"], select {
          font-family: 'JetBrains Mono', monospace;
          border: 1px solid ${COLORS.line};
          background: #FCFBF8;
          border-radius: 8px;
          padding: 9px 11px;
          font-size: 14px;
          color: ${COLORS.ink};
          outline: none;
          transition: border-color 120ms ease, box-shadow 120ms ease;
        }
        input:focus, select:focus { border-color: ${COLORS.teal}; box-shadow: 0 0 0 3px ${COLORS.tealSoft}; }
        button:focus-visible { outline: 2px solid ${COLORS.teal}; outline-offset: 2px; }
        button { cursor: pointer; font-family: inherit; transition: transform 100ms ease, opacity 100ms ease, background 120ms ease, box-shadow 120ms ease; }
        button:active { transform: scale(0.97); }
        @media (hover: hover) {
          button:not(:disabled):hover { filter: brightness(0.97); }
        }
        ::selection { background: ${COLORS.tealSoft}; color: ${COLORS.ink}; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: ${COLORS.line}; border-radius: 20px; border: 2px solid ${COLORS.paper}; }
        ::-webkit-scrollbar-thumb:hover { background: #C9C2AC; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        @keyframes incontrolFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .tab-content { animation: incontrolFadeIn 220ms ease; }
      `}</style>

      <Header daysCount={dailyAgg.length} streak={streak} saveStatus={saveStatus} onRetry={flushSave} />

      <main style={{ maxWidth: 720, margin: "0 auto", padding: "18px 16px 100px" }}>
        <div key={tab} className="tab-content">
        {tab === "registro" && (
          <RegistroTab
            data={data}
            addLiquid={addLiquid}
            addDiaper={addDiaper}
            removeLiquid={removeLiquid}
            removeDiaper={removeDiaper}
            lastDryWeight={lastDryWeight}
            dailyAgg={dailyAgg}
            setDayNote={setDayNote}
            settings={data.settings || {}}
            setDefault={setDefault}
          />
        )}
        {tab === "graficas" && (
          <GraficasTab dailyAgg={dailyAgg} minDate={minDate} maxDate={maxDate} />
        )}
        {tab === "informe" && (
          <InformeTab dailyAgg={dailyAgg} minDate={minDate} maxDate={maxDate} />
        )}
        </div>
      </main>

      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

    saved: { text: "Guardado", color: COLORS.inkSoft, dot: COLORS.teal },
    error: { text: "Error al guardar · toca para reintentar", color: "#B23B2E", dot: "#B23B2E" },

    idle: { text: "Control de incontinencia", color: COLORS.inkSoft, dot: null },

  const clickable = saveStatus === "error";

  return (
    <header className="no-print" style={{ background: COLORS.card, borderBottom: `1px solid ${COLORS.line}`, position: "sticky", top: 0, zIndex: 10, boxShadow: COLORS.shadowSm }}>

          <button
            onClick={clickable ? onRetry : undefined}

            style={{
              display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", padding: 0,
              fontSize: 11.5, color: s.color, fontWeight: saveStatus === "error" || saveStatus === "unavailable" ? 700 : 500,
              cursor: clickable ? "pointer" : "default",
            }}
          >
            {s.dot && (
              <span style={{
                width: 6, height: 6, borderRadius: "50%", background: s.dot, flexShrink: 0,
                animation: saveStatus === "saving" ? "pulse 1s ease-in-out infinite" : "none",
              }} />
            )}
            {s.text}
          </button>
        </div>
        {streak >= 2 && (
          <div style={{
            display: "flex", alignItems: "center", gap: 4, background: COLORS.amberSoft, color: COLORS.amber,

          </div>
        )}
      </div>
      <style>{`@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }`}</style>
    </header>
  );

function RegistroTab({ data, addLiquid, addDiaper, removeLiquid, removeDiaper, lastDryWeight, dailyAgg, setDayNote, settings, setDefault }) {
  const [subtab, setSubtab] = useState("panal");

  // agrupar por día, filtrando solo el tipo de entrada de la subpestaña activa
  const combined = useMemo(() => {
    if (subtab === "nota") return [];
    const items = subtab === "liquido"
      ? data.liquids.map((l) => ({ ...l, kind: "liquido" }))
      : data.diapers.map((p) => ({ ...p, kind: "panal" }));
    items.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
    const byDay = {};
    for (const it of items) {
      byDay[it.date] = byDay[it.date] || [];
      byDay[it.date].push(it);
    }
    return Object.entries(byDay).sort((a, b) => b[0].localeCompare(a[0]));
  }, [data, subtab]);

  const dayNoteEntries = useMemo(
    () => Object.entries(data.dayNotes || {}).sort((a, b) => b[0].localeCompare(a[0])),
    [data.dayNotes]
  );

  const dayAggMap = useMemo(() => Object.fromEntries(dailyAgg.map((d) => [d.date, d])), [dailyAgg]);
  const todayAgg = dayAggMap[todayStr()];
  const lastAgg = dailyAgg.length ? dailyAgg[dailyAgg.length - 1] : null;

  return (
    <div>
      <TodayCard todayAgg={todayAgg} lastAgg={lastAgg} onGoTo={setSubtab} />

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20, justifyContent: "space-between" }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <PillButton active={subtab === "panal"} onClick={() => setSubtab("panal")} icon={Scale} label="Registrar pesaje" />
          <PillButton active={subtab === "liquido"} onClick={() => setSubtab("liquido")} icon={Droplets} label="Registrar líquido" />
          <PillButton active={subtab === "nota"} onClick={() => setSubtab("nota")} icon={MessageSquare} label="Nota del día" />
        </div>
        <ExportButton icon={Download} label="Exportar todo a Excel" onClick={() => exportAllExcel(data, dailyAgg)} />
      </div>

      {subtab === "liquido" && <LiquidForm onAdd={addLiquid} defaultAmount={settings?.defaultLiquidAmount} onSetDefault={(v) => setDefault("defaultLiquidAmount", v)} />}
      {subtab === "panal" && <DiaperForm onAdd={addDiaper} lastDryWeight={lastDryWeight} defaultDryWeight={settings?.defaultDryWeight} onSetDefaultDry={(v) => setDefault("defaultDryWeight", v)} />}
      {subtab === "nota" && <DayNoteForm dayNotes={data.dayNotes || {}} setDayNote={setDayNote} />}

      {subtab !== "nota" && (
        <div style={{ marginTop: 32 }}>
          <h3 style={{ fontFamily: "Inter, sans-serif", fontSize: 16, fontWeight: 800, letterSpacing: "-0.01em", marginBottom: 4 }}>
            {subtab === "liquido" ? "Ingestas de líquido registradas" : "Pesajes de pañal registrados"}
          </h3>
          {subtab === "liquido" && (
            <div style={{ fontSize: 11, color: COLORS.inkSoft, marginBottom: 12, lineHeight: 1.4 }}>
              Clasificación orientativa por día ({fmtEs(LIQUID_THRESHOLDS.insuficiente, 0)}–{fmtEs(LIQUID_THRESHOLDS.mucho, 0)} ml se considera hidratación adecuada). Restringir líquidos no reduce la incontinencia y puede irritar la vejiga: no es un criterio médico, ajústalo si tu profesional sanitario te indica otro objetivo.
            </div>
          )}
          {combined.length === 0 && (
            <EmptyState
              icon={subtab === "liquido" ? Droplets : Scale}
              text={subtab === "liquido"
                ? "Aún no hay ingestas de líquido registradas."
                : "Aún no hay pesajes de pañal registrados."}
            />
          )}
          {combined.map(([date, items]) => {
            const dayAgg = dayAggMap[date];
            const severity = subtab === "panal" ? classifyLoss(dayAgg?.diaperTotal) : null;
            const hydration = subtab === "liquido" ? classifyLiquid(dayAgg?.liquidTotal) : null;
            return (
            <div key={date} style={{ marginBottom: 18 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 6 }}>
                <div style={{ fontSize: 12, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>
                  {fmtDateFull(date)}
                </div>
                {dayAgg && (
                  <span className="num" style={{ fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 600 }}>
                    {round1(dayAgg.liquidTotal)} ml líquido · {round1(dayAgg.diaperTotal)} g peso
                  </span>
                )}
                {severity && (
                  <span style={{ fontSize: 10.5, fontWeight: 700, color: severity.color, background: severity.bg, padding: "2px 8px", borderRadius: 10 }}>
                    {severity.label}
                  </span>
                )}
                {hydration && (
                  <span style={{ fontSize: 10.5, fontWeight: 700, color: hydration.color, background: hydration.bg, padding: "2px 8px", borderRadius: 10 }}>
                    {hydration.label}
                  </span>
                )}
                {subtab === "liquido" && (
                  <span className="num" style={{ fontSize: 10.5, color: COLORS.inkSoft }}>
                    Recomendado ≈ {LIQUID_RECOMMENDED} ml/día
                  </span>
                )}
              </div>
              <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 14, overflow: "hidden", boxShadow: COLORS.shadowSm }}>
                {items.map((it, i) => (
                  <div
                    key={it.id}
                    style={{
                      display: "flex", alignItems: "center", gap: 10,
                      padding: "10px 14px",
                      borderTop: i > 0 ? `1px solid ${COLORS.line}` : "none",
                    }}
                  >
                    {it.kind === "liquido" ? <Droplets size={16} color={COLORS.teal} /> : <Scale size={16} color={COLORS.amber} />}
                    <span className="num" style={{ fontSize: 13, color: COLORS.inkSoft, minWidth: 50 }}>{it.time}</span>
                    <span style={{ flex: 1, fontSize: 14 }}>
                      {it.kind === "liquido"
                        ? <>Ingesta de líquido — <b className="num">{it.amount} ml</b></>
                        : <>Pesaje de pañal — <b className="num">{it.weight} g</b>{it.dryWeight !== undefined && it.dryWeight !== "" ? <span className="num" style={{ color: COLORS.inkSoft }}> (seco {it.dryWeight} g → neto <b>{round1(netWeight(it.weight, it.dryWeight))} g</b>)</span> : null}</>}
                      {it.note ? <span style={{ color: COLORS.inkSoft }}> · {it.note}</span> : null}
                    </span>
                    <button
                      onClick={() => (it.kind === "liquido" ? removeLiquid(it.id) : removeDiaper(it.id))}
                      style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 4, borderRadius: 4 }}
                      aria-label="Eliminar entrada"
                    >
                      <Trash2 size={15} />
                    </button>
                  </div>
                ))}
              </div>
            </div>
            );
          })}
        </div>
      )}

      {subtab === "nota" && (
        <div style={{ marginTop: 32 }}>
          <h3 style={{ fontFamily: "Inter, sans-serif", fontSize: 16, fontWeight: 800, letterSpacing: "-0.01em", marginBottom: 12 }}>
            Notas del día registradas
          </h3>
          {dayNoteEntries.length === 0 && (
            <EmptyState icon={MessageSquare} text="Aún no hay notas del día. Añade una arriba para dar contexto a jornadas concretas (estreñimiento, post-radioterapia, cambio de medicación…)." />
          )}
          {dayNoteEntries.length > 0 && (
            <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 14, overflow: "hidden", boxShadow: COLORS.shadowSm }}>
              {dayNoteEntries.map(([date, text], i) => (
                <div
                  key={date}
                  style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "12px 14px", borderTop: i > 0 ? `1px solid ${COLORS.line}` : "none" }}
                >
                  <MessageSquare size={16} color={COLORS.teal} style={{ marginTop: 2, flexShrink: 0 }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 11, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 2 }}>
                      {fmtDateFull(date)}
                    </div>
                    <div style={{ fontSize: 14, color: COLORS.ink }}>{text}</div>
                  </div>
                  <button
                    onClick={() => setDayNote(date, "")}
                    style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 4, borderRadius: 4 }}
                    aria-label="Eliminar nota"
                  >
                    <Trash2 size={15} />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function LiquidForm({ onAdd, defaultAmount, onSetDefault }) {
  const [amount, setAmount] = useState(defaultAmount || "");
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState(nowTimeStr());
  const [note, setNote] = useState("");

  // si aún no se ha tocado el campo, aplica el valor por defecto en cuanto se cargue
  // (p. ej. la primera vez que termina de leerse el almacenamiento)
  const touched = useRef(false);
  useEffect(() => {
    if (!touched.current) setAmount(defaultAmount || "");
  }, [defaultAmount]);

  const submit = () => {
    const a = Number(amount);
    if (!a || a <= 0) return;
    onAdd({ amount: a, date, time, note: note.trim() });
    setNote(""); setTime(nowTimeStr());
    touched.current = false;
    setAmount(defaultAmount || "");
  };

  const isCurrentDefault = defaultAmount !== undefined && defaultAmount !== "" && Number(defaultAmount) === Number(amount);

  return (
    <FormCard>
      <Field label="Cantidad (ml)">
        <input
          type="number" min="0" step="10" value={amount}
          onChange={(e) => { touched.current = true; setAmount(e.target.value); }}
          placeholder="p. ej. 200" style={{ width: 120 }}
        />
      </Field>
      <Field label="Fecha"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <Field label="Hora"><input type="time" value={time} onChange={(e) => setTime(e.target.value)} /></Field>
      <Field label="Nota (opcional)"><input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="agua, café…" style={{ width: 160 }} /></Field>
      <AddButton onClick={submit} color={COLORS.teal} />
      <button
        onClick={() => { const a = Number(amount); if (a > 0) onSetDefault(a); }}
        title="Usar la cantidad actual como valor por defecto"
        style={{
          display: "flex", alignItems: "center", gap: 5,
          background: isCurrentDefault ? COLORS.tealSoft : COLORS.card,
          color: isCurrentDefault ? COLORS.teal : COLORS.inkSoft,
          border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "9px 12px", fontSize: 12, fontWeight: 600,
        }}
      >
        <Pin size={13} /> {defaultAmount ? `Por defecto: ${defaultAmount} ml` : "Fijar por defecto"}
      </button>
      <div style={{ width: "100%", fontSize: 11, color: COLORS.inkSoft, marginTop: -6 }}>
        El campo se rellena automáticamente con tu cantidad por defecto; puedes escribir otra antes de guardar sin que se pierda el valor fijado.
      </div>
    </FormCard>
  );
}

function DiaperForm({ onAdd, lastDryWeight, defaultDryWeight, onSetDefaultDry }) {
  // el peso seco se rellena con el valor fijado por el usuario si existe;
  // si aún no ha fijado ninguno, recurre al último peso seco registrado
  const effectiveDefaultDry = (defaultDryWeight !== undefined && defaultDryWeight !== "") ? defaultDryWeight : (lastDryWeight ?? "");

  const [weight, setWeight] = useState("");
  const [dryWeight, setDryWeight] = useState(effectiveDefaultDry);
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState(nowTimeStr());
  const [note, setNote] = useState("");

  // si aún no se ha tocado el campo, aplica el valor por defecto (o el último
  // registrado, si no hay uno fijado) en cuanto cambie
  const touchedDry = useRef(false);
  useEffect(() => {
    if (!touchedDry.current) setDryWeight(effectiveDefaultDry);
  }, [effectiveDefaultDry]);

  const submit = () => {
    const w = Number(weight);
    if (!w || w <= 0) return;
    onAdd({ weight: w, dryWeight: dryWeight === "" ? "" : Number(dryWeight), date, time, note: note.trim() });
    setWeight(""); setNote(""); setTime(nowTimeStr());
  };

  const net = weight !== "" ? netWeight(weight, dryWeight) : null;
  const isCurrentDefault = defaultDryWeight !== undefined && defaultDryWeight !== "" && Number(defaultDryWeight) === Number(dryWeight);

  return (
    <FormCard>
      <Field label="Peso total del pañal (g)">
        <input
          type="number" min="0" step="5" value={weight}
          onChange={(e) => setWeight(e.target.value)}
          placeholder="p. ej. 180" style={{ width: 120 }}
        />
      </Field>
      <Field label="Peso del pañal seco (g)">
        <input
          type="number" min="0" step="5" value={dryWeight}
          onChange={(e) => { touchedDry.current = true; setDryWeight(e.target.value); }}
          placeholder="tara"
          style={{ width: 100 }}
        />
      </Field>
      {net !== null && (
        <div style={{ fontSize: 12, color: COLORS.inkSoft, paddingBottom: 9 }}>
          Neto: <b className="num" style={{ color: COLORS.ink }}>{round1(net)} g</b>
        </div>
      )}
      <Field label="Fecha"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <Field label="Hora"><input type="time" value={time} onChange={(e) => setTime(e.target.value)} /></Field>
      <Field label="Nota (opcional)"><input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="solo orina, mixto…" style={{ width: 160 }} /></Field>
      <AddButton onClick={submit} color={COLORS.amber} />
      <button
        onClick={() => { const w = Number(dryWeight); if (w > 0) onSetDefaultDry(w); }}
        title="Usar el peso seco actual como valor por defecto"
        style={{
          display: "flex", alignItems: "center", gap: 5,
          background: isCurrentDefault ? COLORS.amberSoft : COLORS.card,
          color: isCurrentDefault ? COLORS.amber : COLORS.inkSoft,
          border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "9px 12px", fontSize: 12, fontWeight: 600,
        }}
      >
        <Pin size={13} /> {defaultDryWeight ? `Tara por defecto: ${defaultDryWeight} g` : "Fijar tara por defecto"}
      </button>
      <div style={{ width: "100%", fontSize: 11, color: COLORS.inkSoft, marginTop: -6 }}>
        El peso del pañal seco se rellena con tu tara fijada; si no has fijado ninguna, se sugiere a partir del último registrado. El peso total se introduce cada vez, ya que es lo que cambia en cada pesaje.
      </div>
    </FormCard>
  );
}

const PRESETS = [
  { id: "7", label: "7 días" },
  { id: "14", label: "14 días" },
  { id: "30", label: "30 días" },
  { id: "90", label: "90 días" },
  { id: "all", label: "Todo" },
];

function GraficasTab({ dailyAgg, minDate, maxDate }) {
  const [preset, setPreset] = useState("30");
  const [customStart, setCustomStart] = useState(minDate);
  const [customEnd, setCustomEnd] = useState(maxDate);
  const [useCustom, setUseCustom] = useState(false);
  const printRef = useRef(null);

  const range = useMemo(() => {
    if (useCustom) return { start: customStart, end: customEnd };
    if (preset === "all") return { start: minDate, end: maxDate };
    const days = Number(preset);
    const end = new Date(maxDate + "T00:00:00");
    const start = new Date(end);
    start.setDate(start.getDate() - (days - 1));
    return { start: start.toISOString().slice(0, 10), end: maxDate };
  }, [preset, useCustom, customStart, customEnd, minDate, maxDate]);

  const filtered = useMemo(
    () => dailyAgg.filter((d) => d.date >= range.start && d.date <= range.end),
    [dailyAgg, range]
  );

  const liquidStats = statsOf(filtered.map((d) => d.liquidTotal));
  const diaperStats = statsOf(filtered.map((d) => d.diaperTotal));

  const points = filtered.map((d) => ({
    date: d.date,
    label: fmtDateShort(d.date),
    value: round1(d.diaperTotal),
    liquid: round1(d.liquidTotal),
    note: d.dayNote || d.diaperNotes[0],
  }));

  if (dailyAgg.length === 0) {
    return <EmptyState icon={LineChartIcon} text="Todavía no hay datos suficientes para generar gráficas. Registra alguna entrada en el diario." />;
  }

  return (
    <div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18, alignItems: "center" }}>
        {PRESETS.map((p) => (
          <button
            key={p.id}
            onClick={() => { setPreset(p.id); setUseCustom(false); }}
            style={{
              padding: "7px 13px", borderRadius: 20, fontSize: 13, fontWeight: 600,
              border: `1px solid ${!useCustom && preset === p.id ? COLORS.teal : COLORS.line}`,
              background: !useCustom && preset === p.id ? COLORS.tealSoft : COLORS.card,
              color: !useCustom && preset === p.id ? COLORS.teal : COLORS.inkSoft,
              boxShadow: !useCustom && preset === p.id ? "none" : COLORS.shadowSm,
            }}
          >
            {p.label}
          </button>
        ))}
        <span style={{ color: COLORS.line }}>|</span>
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          <input type="date" value={customStart} min={minDate} max={maxDate}
            onChange={(e) => { setCustomStart(e.target.value); setUseCustom(true); }} />
          <span style={{ color: COLORS.inkSoft, fontSize: 13 }}>a</span>
          <input type="date" value={customEnd} min={minDate} max={maxDate}
            onChange={(e) => { setCustomEnd(e.target.value); setUseCustom(true); }} />
        </div>
      </div>

      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 16 }}>
        <ExportButton icon={Download} label="Excel del periodo" onClick={() => exportRangeExcel(filtered, liquidStats, diaperStats, range)} />
        <ExportButton icon={Printer} label="PDF" onClick={() => printElement(printRef, "Incontrol · Control estadístico de pérdidas")} />
      </div>

      <div ref={printRef}>
        <AnnotatedLineChart
          points={points}
          unit="g"
          color={COLORS.amber}
          title="Control Estadístico de Pérdidas Urinarias"
        />

        <SeverityLegend />

        <SummaryStatCards points={points} unit="g" kind="perdida" />

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginTop: 20 }}>
          <StatsCard title="Líquido consumido / día" unit="ml" icon={Droplets} color={COLORS.teal} stats={liquidStats} />
          <StatsCard title="Peso neto absorbido / día" unit="g" icon={Scale} color={COLORS.amber} stats={diaperStats} />
        </div>
      </div>
    </div>
  );
}

// Gráfico anotado inspirado en el estilo de informes clínicos: línea con valores,
// banda de variabilidad esperada (±1σ), línea de tendencia punteada y burbujas
// de anotación sobre días con nota.
function AnnotatedLineChart({ points, unit, color, title }) {
  const values = points.map((p) => p.value);
  const statsAll = statsOf(values);
  const xs = points.map((p) => dayOffset(points[0]?.date, p.date));
  const { slope, intercept } = linreg(values, xs);

  const data = points.map((p, i) => ({
    ...p,
    trend: round1(intercept + slope * xs[i]),
  }));

  const bandLow = round1(Math.max(0, statsAll.mean - statsAll.sd));
  const bandHigh = round1(statsAll.mean + statsAll.sd);

  const calloutFor = (p) => {
    if (!p.note) return null;
    return p.note.length > 34 ? p.note.slice(0, 32) + "…" : p.note;
  };

  function PointLabel(props) {
    const { x, y, index } = props;
    const p = data[index];
    const callout = calloutFor(p);
    if (!callout) {
      return (
        <text x={x} y={y - 12} textAnchor="middle" fontSize={12} fontWeight={600} fill={COLORS.ink} fontFamily="'JetBrains Mono', monospace">
          {p.value}
        </text>
      );
    }
    const boxW = Math.min(160, Math.max(96, callout.length * 6.4 + 16));
    const boxH = 36;
    const dxRaw = index % 2 === 0 ? -boxW / 2 - 14 : boxW / 2 + 14;
    const boxY = y - 80;
    let boxX = x + dxRaw - boxW / 2;

    const cx = boxX + boxW / 2;
    return (
      <g>
        <text x={x} y={y - 12} textAnchor="middle" fontSize={12} fontWeight={600} fill={COLORS.ink} fontFamily="'JetBrains Mono', monospace">
          {p.value}
        </text>
        <line x1={x} y1={y - 24} x2={cx} y2={boxY + boxH} stroke={COLORS.ink} strokeOpacity={0.35} strokeWidth={1.4} />
        <circle cx={x} cy={y - 24} r={2.5} fill={COLORS.ink} fillOpacity={0.5} />
        <rect x={boxX} y={boxY} width={boxW} height={boxH} rx={9} fill="#1E2B2A" fillOpacity={0.94} />
        <foreignObject x={boxX} y={boxY} width={boxW} height={boxH}>
          <div style={{
            width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center",
            textAlign: "center", fontSize: 10.5, lineHeight: 1.2, color: "#F3F1EA", fontWeight: 600,
            fontFamily: "Inter, sans-serif", padding: "0 8px",
          }}>
            {callout}
          </div>
        </foreignObject>
      </g>
    );
  }

  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 16, padding: "22px 14px 10px", boxShadow: COLORS.shadowMd }}>
      <div style={{ fontFamily: "Inter, sans-serif", fontSize: 19, fontWeight: 800, letterSpacing: "-0.015em", padding: "0 10px 4px", color: COLORS.ink }}>
        {title}
      </div>
      <div style={{ display: "flex", gap: 14, padding: "0 10px 14px", fontSize: 11.5, color: COLORS.inkSoft }}>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ width: 10, height: 10, borderRadius: "50%", background: color, display: "inline-block" }} /> Peso neto pañales (g)
        </span>

// Panel "Resumen Estadístico del Período": tarjetas con cifra grande,
// al estilo de un informe ejecutivo (media, pico, mínimo, tendencia, mediana y R²).
function SummaryStatCards({ points, unit, kind }) {
  const values = points.map((p) => p.value);
  if (values.length === 0) return null;

  const { mean: m, median: med, sd, max, min } = statsOf(values);
  const xs = points.map((p) => dayOffset(points[0]?.date, p.date));
  const { slope, r2 } = linreg(values, xs);
  const maxIdx = values.indexOf(max);
  const minIdx = values.indexOf(min);
  const maxPoint = points[maxIdx];
  const minPoint = points[minIdx];

  const isPerdida = kind === "perdida";
  const meanLabel = isPerdida ? "Pérdida Media Diaria" : "Consumo Medio Diario";
  const meanDesc = "Volumen promedio central en el periodo estudiado.";

  const maxDesc = maxPoint.note
    ? `Registrado el ${fmtDateLong(maxPoint.date)}. Nota: "${maxPoint.note}".`
    : `Registrado el ${fmtDateLong(maxPoint.date)}, el valor más alto del periodo.`;
  const minDesc = minPoint.note
    ? `Registrado el ${fmtDateLong(minPoint.date)}. Nota: "${minPoint.note}".`
    : `Registrado el ${fmtDateLong(minPoint.date)}, el valor más bajo del periodo.`;

  const trendFlat = Math.abs(slope) < 0.05;
  const trendDown = slope < 0;
  const TrendIcon = trendFlat ? Minus : trendDown ? TrendingDown : TrendingUp;
  const trendColor = trendFlat ? COLORS.inkSoft : trendDown ? COLORS.teal : COLORS.amber;
  const trendBg = trendFlat ? "#F1F0EA" : trendDown ? COLORS.tealSoft : COLORS.amberSoft;
  const trendLabel = trendFlat ? "Tendencia Estable" : trendDown ? "Pendiente de Mejora" : "Pendiente de Aumento";
  const trendDesc = trendFlat
    ? `La tendencia matemática no muestra cambios relevantes por día en el periodo (R² = ${fmtEs(r2, 2)}).`
    : `La tendencia matemática confirma ${trendDown ? "una reducción" : "un aumento"} constante de ${fmtEs(Math.abs(round1(slope)), 2)} ${unit} por cada día natural que pasa (R² = ${fmtEs(r2, 2)}).`;

  const medianAboveMean = med > m * 1.05;
  const medianBelowMean = med < m * 0.95;
  const medianDesc = medianAboveMean
    ? `La mitad de los días registran menos de ${fmtEs(round1(med), 0)} ${unit}. Al estar por encima de la media, unos pocos días con valores bajos tiran de la media hacia abajo.`
    : medianBelowMean
      ? `La mitad de los días registran menos de ${fmtEs(round1(med), 0)} ${unit}. Al estar por debajo de la media, uno o varios picos puntuales elevan la media respecto al día "típico".`
      : `La mitad de los días registran menos de ${fmtEs(round1(med), 0)} ${unit}. Está muy cerca de la media, lo que indica un patrón diario regular, sin picos que lo distorsionen.`;

  const r2Strong = r2 >= 0.7;
  const r2Moderate = r2 >= 0.35 && r2 < 0.7;
  const r2Color = r2Strong ? COLORS.teal : r2Moderate ? COLORS.amber : COLORS.inkSoft;
  const r2Bg = r2Strong ? COLORS.tealSoft : r2Moderate ? COLORS.amberSoft : "#F1F0EA";
  const r2Desc = r2Strong
    ? "La tendencia explica una parte muy alta de la variación diaria: el patrón temporal es consistente y fiable."
    : r2Moderate
      ? "La tendencia explica una parte moderada de la variación: hay cierto patrón, pero con bastante dispersión día a día."
      : "La tendencia explica poca variación diaria: los valores fluctúan más por causas puntuales que por una evolución sostenida.";

  const cv = m > 0 ? sd / m : 0;
  const sdLow = cv < 0.3;
  const sdModerate = cv >= 0.3 && cv < 0.6;
  const sdColor = sdLow ? COLORS.teal : sdModerate ? COLORS.amber : "#C1502E";
  const sdBg = sdLow ? COLORS.tealSoft : sdModerate ? COLORS.amberSoft : "#F5E0D6";
  const sdDesc = sdLow
    ? `Los valores diarios se mantienen bastante próximos a la media (±${fmtEs(round1(sd), 0)} ${unit}): patrón regular, con poca dispersión día a día.`
    : sdModerate
      ? `Los valores diarios oscilan de forma moderada respecto a la media (±${fmtEs(round1(sd), 0)} ${unit}): hay cierta irregularidad entre días.`
      : `Los valores diarios oscilan mucho respecto a la media (±${fmtEs(round1(sd), 0)} ${unit}): patrón muy irregular, con picos y valles marcados.`;

  const cvPct = cv * 100;
  const cvDesc = sdLow
    ? `La variación relativa respecto a la media es baja (${fmtEs(round1(cvPct), 0)} %): los días se comportan de forma consistente entre sí.`
    : sdModerate
      ? `La variación relativa respecto a la media es moderada (${fmtEs(round1(cvPct), 0)} %): hay diferencias apreciables de un día a otro.`
      : `La variación relativa respecto a la media es alta (${fmtEs(round1(cvPct), 0)} %): el comportamiento diario es poco predecible, con picos y valles muy marcados en proporción a la media.`;

  const cards = [
    {
      icon: Droplet, iconColor: "#2E7BC7", bg: "#FFFFFF", valueColor: "#2E7BC7",
      value: `${fmtEs(round1(m), 0)} ${unit}/día`, label: meanLabel, desc: meanDesc,
    },
    {
      icon: AlertTriangle, iconColor: COLORS.amber, bg: "#FFFFFF", valueColor: COLORS.amber,
      value: `${fmtEs(round1(max), 0)} ${unit}`, label: "Pico Máximo", desc: maxDesc,
    },
    {
      icon: Scale, iconColor: COLORS.inkSoft, bg: "#FFFFFF", valueColor: COLORS.inkSoft,
      value: `${fmtEs(round1(min), 0)} ${unit}`, label: "Mínimo Alcanzado", desc: minDesc,
    },
    {
      icon: TrendIcon, iconColor: trendColor, bg: trendBg, valueColor: trendColor,
      value: `${slope > 0 ? "+" : ""}${fmtEs(round1(slope), 2)} ${unit}/día`, label: trendLabel, desc: trendDesc,
    },
    {
      icon: BarChart3, iconColor: "#6B5CA5", bg: "#FFFFFF", valueColor: "#6B5CA5",
      value: `${fmtEs(round1(med), 0)} ${unit}/día`, label: "Mediana", desc: medianDesc,
    },
    {
      icon: Gauge, iconColor: r2Color, bg: r2Bg, valueColor: r2Color,
      value: fmtEs(r2, 2), label: "Ajuste de la Tendencia (R²)", desc: r2Desc,
    },
    {
      icon: Activity, iconColor: sdColor, bg: sdBg, valueColor: sdColor,
      value: `± ${fmtEs(round1(sd), 0)} ${unit}`, label: "Desviación Típica", desc: sdDesc,
    },
    {
      icon: Percent, iconColor: sdColor, bg: sdBg, valueColor: sdColor,
      value: `${fmtEs(round1(cvPct), 0)} %`, label: "Coeficiente de Variación", desc: cvDesc,
    },
  ];

  return (
    <div style={{ marginTop: 24, background: "linear-gradient(135deg, #F4FBFA 0%, #F6F4EE 100%)", border: `1px solid ${COLORS.line}`, borderRadius: 18, padding: "22px 20px", boxShadow: COLORS.shadowMd }}>
      <div style={{ fontFamily: "Inter, sans-serif", fontSize: 19, fontWeight: 800, letterSpacing: "-0.015em", marginBottom: 16, color: COLORS.ink }}>
        Resumen Estadístico del Período
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        {cards.map((c, i) => (
          <div key={i} style={{ background: c.bg, border: `1px solid ${COLORS.line}`, borderRadius: 14, padding: "18px 18px 16px", boxShadow: COLORS.shadowSm }}>
            <c.icon size={22} color={c.iconColor} strokeWidth={2.2} style={{ marginBottom: 8 }} />
            <div className="num" style={{ fontSize: 34, fontWeight: 700, color: c.valueColor, lineHeight: 1.1, marginBottom: 8 }}>
              {c.value}
            </div>
            <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink, marginBottom: 4 }}>{c.label}</div>
            <div style={{ fontSize: 12.5, color: COLORS.inkSoft, lineHeight: 1.4 }}>{c.desc}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- Tab: informe IA ----------
// Modelo de Gemini usado para generar el informe. Cámbialo aquí si prefieres
// otro modelo de la familia Gemini.
// Modelos de Gemini a probar, en orden de preferencia. "gemini-flash-latest" es
// un alias que Google mantiene siempre apuntando al modelo Flash recomendado
// actual, así que en circunstancias normales resuelve solo. Los siguientes son
// una red de seguridad por si ese alias fallara o cambiara: si un modelo da error
// de "no disponible", se prueba automáticamente con el siguiente de la lista.
const GEMINI_MODEL_CANDIDATES = ["gemini-flash-latest", "gemini-2.5-flash-lite", "gemini-3.6-flash", "gemini-2.5-flash"];
// Clave de la API de Gemini introducida por el propio usuario, guardada SOLO
// en el localStorage de este navegador (nunca se envía a ningún servidor propio,
// solo directamente a la API de Google al pulsar "Generar informe").
const GEMINI_KEY_STORAGE = "incontrol-gemini-api-key";

// Llama a la API de Gemini con una lista de "contents" (soporta conversaciones
// multi-turno con role "user"/"model"), probando cada modelo candidato en
// cascada si el modelo elegido ya no está disponible. La reutilizan tanto la
// generación del informe inicial como las preguntas de seguimiento al panel.
// Errores por los que merece la pena probar con el siguiente modelo candidato:
// modelo retirado/no encontrado, o el servidor saturado por demanda alta
// (frecuente y normalmente muy breve en los modelos gratuitos de Gemini).
const GEMINI_RETRYABLE_MSG = /no longer available|not found|not supported|overloaded|high demand|unavailable/i;

async function callGeminiWithFallback(apiKey, contents, attempt) {
  attempt = attempt || 1;
  let lastErr = null;
  let allRetryable = true;
  for (const model of GEMINI_MODEL_CANDIDATES) {
    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
          body: JSON.stringify({ contents }),
        }
      );
      if (!response.ok) {
        const errBody = await response.json().catch(() => null);
        const msg = (errBody && errBody.error && errBody.error.message) || `Error ${response.status}`;
        const retryable = response.status === 404 || response.status === 503 || GEMINI_RETRYABLE_MSG.test(msg);
        if (retryable) { lastErr = new Error(msg); continue; }
        allRetryable = false;
        throw new Error(msg);
      }
      const json = await response.json();
      if (!json.candidates || !json.candidates.length) {
        const blockReason = json.promptFeedback && json.promptFeedback.blockReason;
        throw new Error(blockReason ? `Respuesta bloqueada por Gemini (${blockReason}).` : "Respuesta vacía de Gemini.");
      }
      const parts = (json.candidates[0].content && json.candidates[0].content.parts) || [];
      const text = parts.map((p) => p.text || "").filter(Boolean).join("\n");
      if (!text) throw new Error("Respuesta vacía");
      return text;
    } catch (e) {
      if (e && e.message === "Failed to fetch") { lastErr = e; allRetryable = false; break; }
      lastErr = e;
      if (!GEMINI_RETRYABLE_MSG.test(e.message || "")) { allRetryable = false; break; }
    }
  }
  // si todos los modelos han fallado por saturación/alta demanda (no por clave
  // inválida ni otro error real), espera un momento y hace un segundo intento
  // completo antes de rendirse, ya que estos picos suelen ser muy breves.
  if (allRetryable && attempt < 2) {
    await new Promise((r) => setTimeout(r, 2500));
    return callGeminiWithFallback(apiKey, contents, attempt + 1);
  }
  throw lastErr || new Error("No se pudo generar el informe.");
}

function InformeTab({ dailyAgg, minDate, maxDate }) {
  const [preset, setPreset] = useState("30");
  const [loading, setLoading] = useState(false);
  const [report, setReport] = useState("");
  const [error, setError] = useState("");
  const [apiKey, setApiKey] = useState(() => localStorage.getItem(GEMINI_KEY_STORAGE) || "");
  const [showKeyField, setShowKeyField] = useState(false);
  const [conversation, setConversation] = useState([]); // [{question, answer}]
  const [followUpText, setFollowUpText] = useState("");
  const [askLoading, setAskLoading] = useState(false);
  const [askError, setAskError] = useState("");
  const lastPromptRef = useRef("");
  const printRef = useRef(null);

  const saveApiKey = (value) => {
    setApiKey(value);
    if (value) localStorage.setItem(GEMINI_KEY_STORAGE, value);
    else localStorage.removeItem(GEMINI_KEY_STORAGE);
  };

  const range = useMemo(() => {
    if (preset === "all") return { start: minDate, end: maxDate };
    const days = Number(preset);
    const end = new Date(maxDate + "T00:00:00");
    const start = new Date(end);
    start.setDate(start.getDate() - (days - 1));
    return { start: start.toISOString().slice(0, 10), end: maxDate };
  }, [preset, minDate, maxDate]);

  const filtered = useMemo(
    () => dailyAgg.filter((d) => d.date >= range.start && d.date <= range.end),
    [dailyAgg, range]
  );

  const liquidStats = statsOf(filtered.map((d) => d.liquidTotal));
  const diaperStats = statsOf(filtered.map((d) => d.diaperTotal));
  const changeStats = statsOf(filtered.map((d) => d.diaperCount));

  const generate = useCallback(async () => {
    if (filtered.length === 0) { setError("No hay datos en el periodo seleccionado."); return; }
    if (!apiKey) {
      setError("Añade tu clave de API de Gemini (botón de arriba) para poder generar el informe.");
      setShowKeyField(true);
      return;
    }
    setLoading(true); setError(""); setReport(""); setConversation([]); setAskError("");

    const seriesText = filtered
      .map((d) => `${d.date}: líquido ${round1(d.liquidTotal)} ml, peso neto pañales ${round1(d.diaperTotal)} g, cambios ${d.diaperCount}${d.dayNote ? `, nota del día: "${d.dayNote}"` : ""}`)
      .join("\n");

    const prompt = `Actúa como un panel simulado de especialistas en urología (perfil académico y clínico de alto nivel, con enfoque en incontinencia y manejo de líquidos). Esto es una SIMULACIÓN con fines educativos e informativos, no una consulta médica real ni un diagnóstico.

Se te proporciona un diario doméstico de control de incontinencia con datos diarios agregados: volumen de líquido ingerido (ml) y peso NETO de los pañales usados (g) —es decir, el peso total del pañal ya usado menos el peso del pañal seco (tara), por lo que representa de forma aproximada el volumen de orina absorbido (~1g ≈ 1ml)—, junto con el número de cambios diarios. Algunos días incluyen además una nota de contexto anotada por la persona cuidadora (p. ej. estreñimiento, post-radioterapia, cambio de medicación); ten muy en cuenta esas notas al interpretar picos o valles atípicos de esos días concretos.

Periodo analizado: ${range.start} a ${range.end} (${filtered.length} días con registro).

Estadísticas del periodo:
- Líquido diario: media ${round1(liquidStats.mean)} ml, mediana ${round1(liquidStats.median)} ml, desviación típica ${round1(liquidStats.sd)} ml, máx ${round1(liquidStats.max)} ml, mín ${round1(liquidStats.min)} ml.
- Peso neto diario de pañales: media ${round1(diaperStats.mean)} g, mediana ${round1(diaperStats.median)} g, desviación típica ${round1(diaperStats.sd)} g, máx ${round1(diaperStats.max)} g, mín ${round1(diaperStats.min)} g.
- Cambios diarios de pañal: media ${round1(changeStats.mean)}, máx ${changeStats.max}, mín ${changeStats.min}.

Serie diaria completa:
${seriesText}

Redacta un informe breve en español con:
1. Resumen general del patrón observado (2-3 frases).
2. Interpretación clínica orientativa de la relación entre ingesta de líquidos y volumen/peso de pañales, y de la variabilidad (desviación típica) día a día.
3. Posibles señales que, de confirmarse en consulta real, podrían merecer atención (p. ej. variabilidad alta, tendencias, picos aislados) — sin diagnosticar.
4. Recomendaciones generales de seguimiento (nunca de tratamiento farmacológico).
5. Una nota final, obligatoria y destacada, aclarando que este informe es generado por IA como simulación educativa, no sustituye la valoración de un profesional sanitario real, y que ante cualquier duda debe consultarse con un urólogo o médico de cabecera.

Usa un tono profesional, claro y prudente. No inventes datos que no estén en la serie proporcionada.`;

    lastPromptRef.current = prompt;

    try {
      const text = await callGeminiWithFallback(apiKey, [{ role: "user", parts: [{ text: prompt }] }]);
      setReport(text);
    } catch (e) {
      const msg = e && e.message === "Failed to fetch"
        ? "No se pudo conectar con la API de Gemini. Revisa tu conexión y tu clave."
        : `No se pudo generar el informe: ${e.message}`;
      setError(msg);
    } finally {
      setLoading(false);
    }
  }, [filtered, range, liquidStats, diaperStats, changeStats, apiKey]);

  const askFollowUp = useCallback(async () => {
    const q = followUpText.trim();
    if (!q) return;
    if (!apiKey) {
      setAskError("Añade tu clave de API de Gemini (botón de arriba) para poder preguntar.");
      setShowKeyField(true);
      return;
    }
    setAskLoading(true); setAskError("");
    try {
      const contents = [
        { role: "user", parts: [{ text: lastPromptRef.current }] },
        { role: "model", parts: [{ text: report }] },
        ...conversation.flatMap((qa) => ([
          { role: "user", parts: [{ text: qa.question }] },
          { role: "model", parts: [{ text: qa.answer }] },
        ])),
        { role: "user", parts: [{ text: q }] },
      ];
      const answer = await callGeminiWithFallback(apiKey, contents);
      setConversation((c) => [...c, { question: q, answer }]);
      setFollowUpText("");
    } catch (e) {
      const msg = e && e.message === "Failed to fetch"
        ? "No se pudo conectar con la API de Gemini. Revisa tu conexión y tu clave."
        : `No se pudo obtener respuesta: ${e.message}`;
      setAskError(msg);
    } finally {
      setAskLoading(false);
    }
  }, [followUpText, apiKey, report, conversation]);

  if (dailyAgg.length === 0) {
    return <EmptyState icon={FileText} text="Registra datos en el diario antes de generar un informe." />;
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}>
        <button
          onClick={() => setShowKeyField((s) => !s)}
          className="no-print"
          style={{
            display: "flex", alignItems: "center", gap: 6,
            padding: "8px 12px", borderRadius: 20, border: `1px solid ${COLORS.line}`,
            background: apiKey ? COLORS.tealSoft : COLORS.card, color: apiKey ? COLORS.teal : COLORS.inkSoft,
            fontSize: 12, fontWeight: 600, boxShadow: COLORS.shadowSm,
          }}
        >
          <KeyRound size={13} /> {apiKey ? "Clave de Gemini configurada" : "Configurar clave de API de Gemini"}
        </button>
      </div>

      {showKeyField && (
        <div style={{ marginBottom: 16 }}>
          <FormCard>
            <Field label="Clave de API de Gemini">
              <input
                type="password" value={apiKey} onChange={(e) => saveApiKey(e.target.value)}
                placeholder="AIzaSy..." style={{ width: 320, maxWidth: "70vw" }}
              />
            </Field>
            <div style={{ width: "100%", fontSize: 11, color: COLORS.inkSoft, lineHeight: 1.5 }}>
              Se guarda solo en este navegador (localStorage) y se usa únicamente para llamar
              directamente desde tu dispositivo a la API de Gemini al generar un informe — nunca
              se envía a ningún otro sitio. No la introduzcas en un ordenador público ni la
              compartas. Puedes crear una clave gratuita en{" "}
              <span className="num" style={{ color: COLORS.ink }}>aistudio.google.com/apikey</span>.
            </div>
          </FormCard>
        </div>
      )}

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18, alignItems: "center" }}>
        {PRESETS.map((p) => (
          <button
            key={p.id}
            onClick={() => setPreset(p.id)}
            style={{
              padding: "7px 13px", borderRadius: 20, fontSize: 13, fontWeight: 600,
              border: `1px solid ${preset === p.id ? COLORS.teal : COLORS.line}`,
              background: preset === p.id ? COLORS.tealSoft : COLORS.card,
              color: preset === p.id ? COLORS.teal : COLORS.inkSoft,
              boxShadow: preset === p.id ? "none" : COLORS.shadowSm,
            }}
          >
            {p.label}
          </button>
        ))}
        <button
          onClick={generate}
          disabled={loading}
          style={{
            marginLeft: "auto", display: "flex", alignItems: "center", gap: 7,
            background: COLORS.ink, color: "#fff", border: "none",
            borderRadius: 10, padding: "10px 18px", fontWeight: 700, fontSize: 13,
            opacity: loading ? 0.7 : 1, boxShadow: "0 6px 16px rgba(30,43,42,0.28)",
          }}
        >
          {loading ? <Loader2 size={15} className="spin" style={{ animation: "spin 1s linear infinite" }} /> : <Sparkles size={15} />}
          {loading ? "Generando…" : "Generar informe"}
        </button>
        <style>{`@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }`}</style>
      </div>

      <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>
        Periodo: {fmtDateLabel(range.start)} — {fmtDateLabel(range.end)} · {filtered.length} días con registro
      </div>

      {error && (
        <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: "#FBEAE5", border: "1px solid #E8B7A8", color: "#8C3A22", borderRadius: 8, padding: 12, marginBottom: 16, fontSize: 13 }}>
          <AlertCircle size={16} style={{ flexShrink: 0, marginTop: 1 }} /> {error}
        </div>
      )}

      {report && (
        <div ref={printRef}>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }} className="no-print">
            <ExportButton icon={Printer} label="Exportar informe a PDF" onClick={() => printElement(printRef, "Incontrol · Informe del panel simulado")} />
          </div>
          <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 16, padding: 22, boxShadow: COLORS.shadowMd }}>
            <div style={{ fontFamily: "Inter, sans-serif", fontSize: 16, fontWeight: 800, letterSpacing: "-0.01em", marginBottom: 4 }}>
              Informe del panel simulado
            </div>
            <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 4 }}>
              Periodo: {fmtDateLabel(range.start)} — {fmtDateLabel(range.end)}
            </div>
            <div style={{ whiteSpace: "pre-wrap", fontSize: 14, lineHeight: 1.65, color: COLORS.ink, marginTop: 12 }}>
              {report}
            </div>
          </div>

          {conversation.length > 0 && (
            <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 12 }}>
              {conversation.map((qa, i) => (
                <div key={i} style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 14, padding: 18, boxShadow: COLORS.shadowSm }}>
                  <div style={{ display: "flex", alignItems: "flex-start", gap: 8, marginBottom: 10 }}>
                    <div style={{ width: 22, height: 22, borderRadius: "50%", background: COLORS.tealSoft, color: COLORS.teal, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800, flexShrink: 0 }}>
                      Tú
                    </div>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink, paddingTop: 2 }}>{qa.question}</div>
                  </div>
                  <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
                    <div style={{ width: 22, height: 22, borderRadius: "50%", background: "#1E2B2A", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <Sparkles size={12} color="#fff" />
                    </div>
                    <div style={{ whiteSpace: "pre-wrap", fontSize: 13.5, lineHeight: 1.6, color: COLORS.ink, paddingTop: 1 }}>{qa.answer}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          <div className="no-print" style={{ marginTop: 16 }}>
            {askError && (
              <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: "#FBEAE5", border: "1px solid #E8B7A8", color: "#8C3A22", borderRadius: 8, padding: 12, marginBottom: 12, fontSize: 13 }}>
                <AlertCircle size={16} style={{ flexShrink: 0, marginTop: 1 }} /> {askError}
              </div>
            )}
            <div style={{ display: "flex", gap: 8, alignItems: "flex-end", flexWrap: "wrap" }}>
              <div style={{ flex: 1, minWidth: 200, display: "flex", flexDirection: "column", gap: 5 }}>
                <label style={{ fontSize: 11, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 600 }}>
                  Pregunta al panel de expertos
                </label>
                <input
                  type="text" value={followUpText}
                  onChange={(e) => setFollowUpText(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter" && !askLoading) askFollowUp(); }}
                  placeholder="p. ej. ¿qué explicaría el pico del día 12?"
                  style={{ width: "100%" }}
                  disabled={askLoading}
                />
              </div>
              <button
                onClick={askFollowUp}
                disabled={askLoading || !followUpText.trim()}
                style={{
                  display: "flex", alignItems: "center", gap: 6,
                  background: COLORS.teal, color: "#fff", border: "none",
                  borderRadius: 10, padding: "10px 18px", fontWeight: 700, fontSize: 13,
                  opacity: askLoading || !followUpText.trim() ? 0.6 : 1,
                  boxShadow: `0 4px 12px ${COLORS.teal}55`,
                }}
              >
                {askLoading ? <Loader2 size={15} style={{ animation: "spin 1s linear infinite" }} /> : <Sparkles size={15} />}
                {askLoading ? "Preguntando…" : "Preguntar"}
              </button>
            </div>
            <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 6 }}>
              El panel responde con el contexto del informe y de los datos ya analizados; puedes seguir preguntando sobre la misma conversación.
            </div>
          </div>
          <div style={{ marginTop: 18, display: "flex", gap: 8, alignItems: "flex-start", fontSize: 12, color: COLORS.inkSoft, borderTop: `1px solid ${COLORS.line}`, paddingTop: 14 }}>
            <AlertCircle size={14} style={{ flexShrink: 0, marginTop: 1 }} />
            <span>
              Este informe es generado por un modelo de IA que simula un panel de especialistas con fines educativos.
              No es un diagnóstico médico ni sustituye la valoración de un profesional sanitario real. Ante cualquier
              duda sobre síntomas, consulta con un urólogo o tu médico de cabecera.
            </span>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- montaje ----------
function App() {
  return (
    <ErrorBoundary>
      <IncontrolApp />
    </ErrorBoundary>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
