function BackupPanel({ data, onRestore, settings, setDefault }) {
  const COLORS = useTheme();
  const [pending, setPending] = useState(null);
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);
  const counts = (d) => `${(d.liquids || []).length} líquidos, ${(d.diapers || []).length} pesajes, ${(d.voids || []).length} micciones`;

  const exportBackup = () => {
    const payload = {
      app: "incontrol", version: 1, exportedAt: new Date().toISOString(),
      liquids: data.liquids, diapers: data.diapers, voids: data.voids || [], leaks: data.leaks || [],
      dayNotes: data.dayNotes || {}, settings: data.settings || {}, lastReport: data.lastReport || null,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `incontrol-copia-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    setDefault("lastBackup", todayStr());
    setMsg("Copia descargada correctamente.");
  };

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || parsed.app !== "incontrol") throw new Error("archivo no válido");
        setPending(parsed); setMsg("");
      } catch (err) {
        setPending(null); setMsg("Error al leer el archivo.");
      }
    };
    reader.readAsText(file);
  };

  const restore = (mode) => {
    onRestore(pending, mode);
    setPending(null);
    setMsg(mode === "replace" ? "Datos reemplazados." : "Registros fusionados.");
  };

  return (
    <div style={{ background: COLORS.card, borderRadius: 22, padding: 20, boxShadow: COLORS.shadowSm, display: "flex", flexDirection: "column", gap: 14 }}>
      <div>
        <div style={{ fontWeight: 800, fontSize: 15.5 }}>Copia de seguridad local</div>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, lineHeight: 1.5, marginTop: 4 }}>
          Exporta tus registros en un archivo JSON para guardarlos o pasarlos a otro móvil.
        </div>
        <div style={{ fontSize: 12, color: COLORS.teal, fontWeight: 700, marginTop: 8 }}>{counts(data)}</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 10 }}>
        <button onClick={exportBackup} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: COLORS.teal, color: "#fff", border: "none", borderRadius: 14, padding: "12px", fontWeight: 700, fontSize: 13 }}>
          <Download size={15} /> Exportar
        </button>
        <button onClick={() => fileRef.current && fileRef.current.click()} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: COLORS.inputBg, color: COLORS.ink, border: "none", borderRadius: 14, padding: "12px", fontWeight: 700, fontSize: 13 }}>
          <Upload size={15} /> Importar
        </button>
        <input ref={fileRef} type="file" accept="application/json,.json" onChange={onFile} style={{ display: "none" }} />
      </div>
      {pending && (
        <div style={{ borderRadius: 16, padding: 14, background: COLORS.tealSoft }}>
          <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 4 }}>Archivo listo ({counts(pending)})</div>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button onClick={() => restore("merge")} style={{ flex: 1, background: COLORS.teal, color: "#fff", border: "none", borderRadius: 11, padding: "9px", fontWeight: 700, fontSize: 12.5 }}>Fusionar</button>
            <button onClick={() => restore("replace")} style={{ flex: 1, background: COLORS.card, color: COLORS.rose, border: "none", borderRadius: 11, padding: "9px", fontWeight: 700, fontSize: 12.5 }}>Reemplazar</button>
          </div>
        </div>
      )}
      {msg && <div style={{ fontSize: 12.5, color: COLORS.teal, fontWeight: 700 }}>{msg}</div>}
    </div>
  );
}

function CalendarExport({ times }) {
  const COLORS = useTheme();
  const today = todayStr();
  const [open, setOpen] = useState(false);
  const [month, setMonth] = useState(today.slice(0, 7) + "-01");
  const [sel, setSel] = useState([]);
  const toggleDay = (iso) => setSel((x) => (x.includes(iso) ? x.filter((d) => d !== iso) : [...x, iso].sort()));
  const [y, mo] = month.split("-").map(Number);
  const first = new Date(y, mo - 1, 1);
  const lead = (first.getDay() + 6) % 7;
  const nDays = new Date(y, mo, 0).getDate();
  const cells = [...Array(lead).fill(null), ...Array.from({ length: nDays }, (_, i) => `${month.slice(0, 7)}-${String(i + 1).padStart(2, "0")}`)];
  const shiftMonth = (n) => { const d = new Date(y, mo - 1 + n, 1); setMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`); };
  const nextDays = (n) => setSel(Array.from({ length: n }, (_, i) => addDaysIso(today, i)));
  const title = first.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
  const chip = { background: COLORS.inputBg, color: COLORS.inkSoft, border: "none", borderRadius: 10, padding: "7px 11px", fontSize: 12, fontWeight: 700 };
  return (
    <div style={{ borderTop: `1px solid ${COLORS.line}`, paddingTop: 12 }}>
      <button onClick={() => setOpen((v) => !v)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", textAlign: "left", background: "none", border: "none", padding: 0, color: COLORS.ink, fontWeight: 800, fontSize: 14 }}>
        <span style={{ display: "flex", alignItems: "center", gap: 8 }}><CalendarDays size={16} color={COLORS.teal} /> Pasar los avisos al calendario del móvil</span>
        <ChevronRight size={16} style={{ transform: open ? "rotate(90deg)" : "none" }} />
      </button>
      {open && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 10 }}>
          <div style={{ fontSize: 12.5, color: COLORS.inkSoft, lineHeight: 1.4 }}>Toca los días en los que quieres alarma. Se crea un evento por cada hora de aviso en cada día elegido.</div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <button onClick={() => shiftMonth(-1)} aria-label="Mes anterior" style={{ ...chip, padding: "6px 10px" }}><ChevronLeft size={16} /></button>
            <div style={{ fontWeight: 800, fontSize: 14 }}>{title.charAt(0).toUpperCase() + title.slice(1).replace(" de ", " ")}</div>
            <button onClick={() => shiftMonth(1)} aria-label="Mes siguiente" style={{ ...chip, padding: "6px 10px" }}><ChevronRight size={16} /></button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 4, textAlign: "center" }}>
            {["L", "M", "X", "J", "V", "S", "D"].map((w) => <div key={w} style={{ fontSize: 11, fontWeight: 700, color: COLORS.inkSoft }}>{w}</div>)}
            {cells.map((iso, i) => {
              if (!iso) return <div key={"e" + i} />;
              const past = iso < today, on = sel.includes(iso);
              return (
                <button key={iso} disabled={past} onClick={() => toggleDay(iso)} className="num" style={{ aspectRatio: "1", border: "none", borderRadius: 10, fontSize: 13, fontWeight: 700, background: on ? COLORS.teal : iso === today ? COLORS.tealSoft : COLORS.inputBg, color: on ? "#fff" : past ? COLORS.line : COLORS.ink, opacity: past ? 0.5 : 1 }}>
                  {Number(iso.slice(8))}
                </button>
              );
            })}
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            <button onClick={() => nextDays(7)} style={chip}>Próximos 7 días</button>
            <button onClick={() => nextDays(14)} style={chip}>14 días</button>
            <button onClick={() => setSel([])} style={chip}>Borrar selección</button>
          </div>
          <button disabled={!sel.length} onClick={() => downloadIcs(times, sel)} style={{ background: sel.length ? COLORS.teal : COLORS.inputBg, color: sel.length ? "#fff" : COLORS.inkSoft, border: "none", borderRadius: 14, padding: "12px", fontWeight: 800, fontSize: 14 }}>
            {sel.length ? `Crear ${sel.length * times.length} eventos (${sel.length} ${sel.length === 1 ? "día" : "días"})` : "Elige al menos un día"}
          </button>
        </div>
      )}
    </div>
  );
}

function EvolutionTab({ dailyAgg, minDate, maxDate, settings, setDefault, setCoverage }) {
  const COLORS = useTheme();
  const [preset, setPreset] = useState("14");
  const [customStart, setCustomStart] = useState(minDate);
  const [customEnd, setCustomEnd] = useState(maxDate);
  const [useCustom, setUseCustom] = useState(false);
  // las fechas muestran por defecto todo el rango existente y se actualizan si cambian los datos
  useEffect(() => { if (!useCustom) { setCustomStart(minDate); setCustomEnd(maxDate); } }, [minDate, maxDate, useCustom]);
  const [showDates, setShowDates] = useState(false);
  const printRef = useRef(null);
  const [printMode, setPrintMode] = useState(false);
  const doPrint = (title) => { setPrintMode(true); setTimeout(() => { printElement(printRef, title); setPrintMode(false); }, 250); };

  const range = useMemo(() => {
    if (useCustom) return { start: customStart, end: customEnd };
    if (preset === "all") return { start: minDate, end: maxDate };
    const days = Number(preset);
    const end = new Date(maxDate + "T00:00:00");
    const start = new Date(end);
    start.setDate(start.getDate() - (days - 1));
    return { start: toLocalIsoDate(start), end: maxDate };
  }, [preset, useCustom, customStart, customEnd, minDate, maxDate]);

  const filtered = useMemo(
    () => dailyAgg.filter((d) => d.date >= range.start && d.date <= range.end),
    [dailyAgg, range]
  );

  const liquidStats = statsOf(filtered.map((d) => d.liquidTotal));
  const diaperStats = statsOf(filtered.map((d) => d.diaperTotal));

  const nPrev = Math.round((new Date(range.end + "T00:00:00") - new Date(range.start + "T00:00:00")) / 86400000) + 1;
  const prevDays = dailyAgg.filter((d) => d.date >= addDaysIso(range.start, -nPrev) && d.date <= addDaysIso(range.start, -1));
  const events = eventsOf(settings);
  const [statKey, setStatKey] = useState("loss");   // serie a analizar en los estadísticos
  const STAT_KEYS = ["loss", "diapers", "voids", "voidsDay", "nocturia", "liquid"];
  const src = PERIOD_SOURCES[statKey];
  const baseUnit = /^(g|ml)/.test(src.unit) ? src.unit.split("/")[0] : ({ nocturia: "levantadas", diapers: "cambios" }[statKey] || "micc.");
  const perDay = src.unit.endsWith("/día") ? "/día" : "";
  const statPoints = filtered.filter(src.ok).map((d) => ({
    date: d.date, label: fmtDateShort(d.date), value: round1(src.val(d)), note: d.dayNote,
  }));
  const prevMean = useMemo(() => {
    const n = Math.round((new Date(range.end + "T00:00:00") - new Date(range.start + "T00:00:00")) / 86400000) + 1;
    if (!(n > 0)) return null;
    const prevEnd = addDaysIso(range.start, -1), prevStart = addDaysIso(range.start, -n);
    const vals = dailyAgg.filter((d) => d.date >= prevStart && d.date <= prevEnd && src.ok(d)).map(src.val);
    return vals.length >= 3 ? mean(vals) : null;
  }, [dailyAgg, range, statKey]);

  if (dailyAgg.length === 0) {

  return (

        <div style={{ display: "flex", flexWrap: "wrap", gap: 4, background: COLORS.card, padding: 4, borderRadius: 22, boxShadow: COLORS.shadowSm, maxWidth: "100%" }}>
          {PRESETS.map((p) => {
            const active = !useCustom && preset === p.id;
            return (
              <button
                key={p.id}
                onClick={() => { setPreset(p.id); setUseCustom(false); setCustomStart(minDate); setCustomEnd(maxDate); }}
                style={{
                  padding: "7px 13px", borderRadius: 99, fontSize: 12.5, fontWeight: 700, border: "none",
                  background: active ? COLORS.teal : "transparent",
                  color: active ? "#fff" : COLORS.inkSoft,

function pearson(a, b) {
  const n = a.length; if (n < 5) return null;
  const ma = mean(a), mb = mean(b);
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < n; i++) { num += (a[i] - ma) * (b[i] - mb); da += (a[i] - ma) ** 2; db += (b[i] - mb) ** 2; }
  return da > 0 && db > 0 ? num / Math.sqrt(da * db) : null;
}

// Análisis para la consulta: texto + puntos a tener en cuenta + preguntas
function buildConsultAnalysis(dailyAgg, maxDate) {
  const N = 30;
  const startCur = addDaysIso(maxDate, -(N - 1)), startPrev = addDaysIso(maxDate, -(2 * N - 1));
  const cur = dailyAgg.filter((d) => d.date >= startCur && d.date <= maxDate);
  const prev = dailyAgg.filter((d) => d.date >= startPrev && d.date < startCur);
  const out = { sections: [], points: [], questions: [], nDays: cur.length };
  if (cur.length < 1) { out.empty = true; return out; }
  const f0 = (v) => fmtEs(Math.round(v), 0), f1 = (v) => fmtEs(round1(v), 1);
  const pct = (a, b) => (b > 0 ? Math.round(((a - b) / b) * 100) : null);
  const smC = summarizeDiary(cur), smP = summarizeDiary(prev);
  const lossC = cur.filter((d) => d.diaperCount > 0), lossP = prev.filter((d) => d.diaperCount > 0);
  const liqC = cur.filter((d) => d.liquidCount > 0), liqP = prev.filter((d) => d.liquidCount > 0);

  { const nn = cur.filter((d) => d.nightCovered).length, nd = cur.filter((d) => d.dayCovered).length, nw = cur.filter((d) => d.diaperCount > 0).length, nl = cur.filter((d) => d.liquidCount > 0).length;
    out.sections.push({ title: "Qué se ha anotado", text: `Últimos ${N} días: ${cur.length} con registros (pañales en ${nw}, líquidos en ${nl}, micciones de día en ${nd} y de noche en ${nn}). Un día sin anotar no cuenta como cero.` }); }

  if (lossC.length >= 1) {
    const lv = lossC.map((d) => d.diaperTotal), m = mean(lv), c = classifyLoss(m);
    let t = "";
    if (lossP.length >= 1) {
      const mp = mean(lossP.map((d) => d.diaperTotal)), p = pct(m, mp);
      if (p !== null && p >= 20) { out.points.push(`La pérdida de orina ha aumentado un ${p} % respecto al mes anterior.`); out.questions.push("Mi pérdida de orina ha subido respecto al mes anterior: ¿conviene revisar el tratamiento, el tipo de absorbente o buscar la causa?"); }
      if (p !== null && p <= -20) out.points.push(`La pérdida de orina ha bajado un ${Math.abs(p)} % respecto al mes anterior.`);
    }
    t += interpretFor("loss", cur, prev, N).join(" ");
    out.sections.push({ title: "Pérdida de orina (peso de los pañales)", text: t });
  }

  if (liqC.length >= 1) {
    const m = mean(liqC.map((d) => d.liquidTotal)), c = classifyLiquid(m);
    let t = interpretFor("liquid", cur, prev, N).join(" ");
    const both = cur.filter((d) => d.liquidCount > 0 && d.diaperCount > 0);
    const r = pearson(both.map((d) => d.liquidTotal), both.map((d) => d.diaperTotal));
    if (r !== null) t += Math.abs(r) < 0.3 ? " No se aprecia una relación clara entre lo que bebes y lo que pierdes." : r > 0 ? " Los días que bebes más tienden a ser también los de más pérdida." : " Los días que bebes más tienden a ser los de menos pérdida.";
    out.sections.push({ title: "Líquidos", text: t });
    if (m < LIQUID_THRESHOLDS.poco) out.points.push(`Bebes por debajo de la referencia (${f0(m)} ml de media frente a ${LIQUID_RECOMMENDED} ml): beber poco puede concentrar la orina e irritar la vejiga.`);
    if (m > LIQUID_THRESHOLDS.mucho) out.points.push(`Bebes bastante (${f0(m)} ml de media): conviene comentar si es lo adecuado en tu caso.`);
  }

  if (smC.voidsPerDay !== null || smC.nocturia !== null || cur.some((d) => d.dayCovered)) {
    const parts = [];
    if (smC.voidsPerDay !== null) parts.push(...interpretFor("voids", cur, prev, N));
    else if (cur.some((d) => d.dayCovered)) parts.push(...interpretFor("voidsDay", cur, prev, N));
    if (smC.nocturia !== null) parts.push(...interpretFor("nocturia", cur, prev, N));
    if (smC.voidsPerDay !== null && smC.voidsPerDay > VOID_DAY_MAX + VOID_NIGHT_MAX) out.points.push(`Frecuencia alta de micciones (${f1(smC.voidsPerDay)} al día).`);
    if (smC.nocturia !== null && smC.nocturia >= 2) { out.points.push(`Te levantas ${f1(smC.nocturia)} veces por noche de media (nocturia; lo normal es 1 como máximo).`); out.questions.push("Me levanto a orinar varias veces por la noche: ¿puede influir lo que bebo por la tarde, algún medicamento o alguna otra causa?"); }
    out.sections.push({ title: "Micciones y noche", text: parts.join(" ") });
  }

  const flagged = cur.filter((d) => dayFlags(d).length > 0);
  if (flagged.length) {
    const last = flagged[flagged.length - 1];
    out.points.push(`${flagged.length} día${flagged.length > 1 ? "s" : ""} con algo destacable (pérdida muy alta o 3 o más levantadas nocturnas). El último fue el ${fmtDateShort(last.date)}${last.dayNote ? `, con la nota «${last.dayNote}»` : ""}.`);
  }
  const withNote = cur.filter((d) => d.dayNote);
  TAGS.forEach((t) => {
    const w = cur.filter((d) => t.re.test(`${d.dayNote || ""} ${d.dayNoteDetail || ""}`) && d.diaperCount > 0);
    const wo = cur.filter((d) => !t.re.test(`${d.dayNote || ""} ${d.dayNoteDetail || ""}`) && d.diaperCount > 0);
    if (w.length >= 3 && wo.length >= 3) {
      const a = mean(w.map((d) => d.diaperTotal)), b = mean(wo.map((d) => d.diaperTotal)), p = pct(a, b);
      if (p !== null && Math.abs(p) >= 25) out.points.push(`Los días con «${t.label.toLowerCase()}» la pérdida es un ${Math.abs(p)} % ${p > 0 ? "mayor" : "menor"} (${f0(a)} g frente a ${f0(b)} g).`);
    }
  });
  if (withNote.length) out.sections.push({ title: "Notas", text: `Has anotado ${withNote.length} nota${withNote.length > 1 ? "s" : ""} del día; sirven para recordar situaciones que pudieron influir.` });
  if (!out.points.length) out.points.push("No hay ningún dato que destaque especialmente en este periodo.");
  out.questions.push("¿Con qué frecuencia me conviene repetir este diario y qué datos le serían más útiles?");
  return out;
}


// Interpretación de una serie: evolución, fiabilidad, comparación con el periodo anterior y cercanía a límites
const LEVELS = {
  loss: { names: ["leve", "moderada", "severa", "muy severa"], at: [SEVERITY_THRESHOLDS.leve, SEVERITY_THRESHOLDS.moderada, SEVERITY_THRESHOLDS.severa], bad: (i) => i >= 2 },
  nocturia: { names: ["normal", "algo por encima de lo normal", "nocturia", "nocturia marcada"], at: [1.01, 2, 3], bad: (i) => i >= 2 },
  voids: { names: ["habitual", "elevada"], at: [VOID_DAY_MAX + VOID_NIGHT_MAX + 0.01], bad: (i) => i >= 1 },
  voidsDay: { names: ["habitual", "elevada"], at: [VOID_DAY_MAX + 0.01], bad: (i) => i >= 1 },
  liquid: { names: ["insuficiente", "escasa", "adecuada", "elevada"], at: [LIQUID_THRESHOLDS.insuficiente, LIQUID_RECOMMENDED, LIQUID_THRESHOLDS.mucho], bad: (i) => i <= 1 || i >= 3 },
};
// p-valor de la pendiente de una regresión lineal (contraste F de la regresión)
function pSlope(vals, xs) {
  const n = vals.length;
  if (n < 4) return null;
  const { r2 } = linreg(vals, xs);
  if (r2 >= 0.9999) return 0;
  const F = (r2 / (1 - r2)) * (n - 2);
  return betaIncFn((n - 2) / ((n - 2) + F), (n - 2) / 2, 0.5);
}
const fmtP = (p) => (p < 0.001 ? "p < 0,001" : `p = ${fmtEs(p, p < 0.01 ? 3 : 2)}`);
const cvClass = (cv) => (cv < 15 ? "muy estable" : cv < 30 ? "variación normal" : cv < 50 ? "variable" : "muy variable");

function interpretFor(key, days, prevDays, periodDays, opts) {
  const detail = !!(opts && opts.detail);
  const src = PERIOD_SOURCES[key];
  if (!src) return [];
  const pts = (days || []).filter(src.ok).map((d) => ({ date: d.date, v: src.val(d) }));
  const isCount = !/^(g|ml)/.test(src.unit);
  const unit = isCount ? ({ nocturia: "levantadas", voids: "micciones", voidsDay: "micciones", diapers: "cambios" }[key] || "veces") : src.unit.split("/")[0];
  const dec = isCount ? 1 : 0;
  const f = (v, d = dec) => fmtEs(round1(Math.abs(v)), d);
  const f2 = (v) => fmtEs(Math.round(Math.abs(v) * 100) / 100, Math.abs(v) < 10 ? 2 : 1);
  if (pts.length === 0) return ["No hay anotaciones de esta serie en el periodo, así que no se puede valorar. Eso no significa que no ocurriera: solo que no se anotó."];
  const vals = pts.map((p) => p.v), xs = pts.map((p) => dayOffset(pts[0].date, p.date));
  const m = mean(vals), sd = stddev(vals), cv = m > 0 ? (sd / m) * 100 : 0;
  const out = [];

  // 1. ¿ES NORMAL? valor, nivel, referencia y cuánto falta
  const L = LEVELS[key];
  const idx = L ? L.at.filter((x) => m >= x).length : -1;
  const lvl = L ? L.names[idx] : null;
  const REF = { nocturia: "lo normal es 1 como máximo", voids: `referencia: hasta ${VOID_DAY_MAX} de día y ${VOID_NIGHT_MAX} de noche`, voidsDay: `referencia: hasta ${VOID_DAY_MAX} de día`, liquid: `referencia: ${fmtEs(LIQUID_RECOMMENDED, 0)} ml` }[key];
  const head = {
    loss: `Pierdes ${f(m)} g al día de media`,
    nocturia: `Te levantas ${f(m)} veces por noche de media`,
    voids: `Orinas ${f(m)} veces al día de media`,
    voidsDay: `Orinas ${f(m)} veces de día de media`,
    liquid: `Bebes ${f(m)} ml al día de media`,
    diapers: `Cambias el pañal ${f(m)} veces al día de media`,
  }[key];
  const inner = [lvl, REF].filter(Boolean).join("; ");
  let sit = head + (inner ? ` (${inner})` : "");
  if (L) {
    if (key === "liquid") {
      if (idx < 2) sit += `: te faltan ${f(LIQUID_RECOMMENDED - m)} ml para llegar a lo adecuado`;
      else if (idx === 2) sit += ": llegas a lo adecuado";
      else sit += `: superas en ${f(m - LIQUID_THRESHOLDS.mucho)} ml el límite recomendado`;
    } else if (L.at[idx] !== undefined) sit += `, a ${f(L.at[idx] - m)} ${unit} de pasar a «${L.names[idx + 1]}»`;
  }
  sit += ".";
  const levelBad = L ? L.bad(idx) : false;

  const tips = {
    loss: "Conviene comentarlo con el médico y revisar que el absorbente sea el adecuado.",
    nocturia: "Conviene comentarlo con el médico; revisa a qué hora bebes y el café, té o alcohol por la tarde.",
    voids: "Si además notas urgencia, coméntalo con el médico.",
    voidsDay: "Si te molesta, coméntalo con el médico.",
    liquid: m < LIQUID_RECOMMENDED ? "Beber poco concentra la orina e irrita la vejiga: no conviene reducir líquidos para tener menos pérdidas." : "Beber mucho aumenta las ganas de orinar y las levantadas nocturnas: comenta si es lo adecuado.",
  };

  // la ingesta de líquidos solo se valora frente a su referencia (su tendencia no tiene lectura médica)
  if (key === "liquid") {
    out.push(sit);
    if (detail && pts.length >= 3) {
      const reach = vals.filter((v) => v >= LIQUID_RECOMMENDED).length;
      out.push(`Llegas a la referencia ${reach} de ${pts.length} días. La variación entre días es del ${Math.round(cv)} % (${cvClass(cv)}): bebes entre ${f(Math.min(...vals))} y ${f(Math.max(...vals))} ml.`);
    }
    if (levelBad) out.push(tips.liquid);
    return out;
  }
  out.push(sit);
  if (pts.length < 3) return out;

  // 2. TENDENCIA: cuánto cambia, si es buena o mala y si es significativa
  const { slope, r2 } = linreg(vals, xs);
  const span = Math.max(1, xs[xs.length - 1] - xs[0]);
  const change = slope * span;
  const rel = m !== 0 ? Math.abs(change) / Math.abs(m) : 0;
  const stable = rel < 0.08;
  const down = change < 0;
  const p = pSlope(vals, xs);
  const sig = p !== null && p < 0.05;
  const lowerGood = ["loss", "nocturia", "voids", "voidsDay"].includes(key);
  let verdict = null, why = "";
  if (!stable && lowerGood) {
    verdict = down ? "buena" : "mala";
    why = {
      loss: down ? "se escapa menos orina" : "se escapa más orina y hay más riesgo de irritación de la piel",
      nocturia: down ? "te levantas menos y duermes más seguido" : "te levantas más y el sueño se interrumpe más",
      voids: down ? "orinas con menos frecuencia" : "orinas con más frecuencia",
      voidsDay: down ? "orinas con menos frecuencia" : "orinas con más frecuencia",
    }[key];
  }
  const slopeTxt = `${f2(slope)} ${unit} al día`;
  const sg = down ? "−" : "+";
  const pctTxt = `${sg}${Math.round(rel * 100)} %`;
  let evo;
  if (stable) evo = `Se mantiene estable: cambia ${sg}${f(change)} ${unit} en el periodo (${pctTxt}), algo sin importancia.`;
  else {
    const base = `${down ? "Baja" : "Sube"} ${f(change)} ${unit} en el periodo (${pctTxt}${detail && Math.abs(slope) >= 0.05 ? `, unos ${slopeTxt}` : ""})`;
    const quality = verdict ? ` ${sig || p === null ? "es una evolución" : "sería una evolución"} ${verdict}, porque ${why}` : "";
    evo = `${base}${verdict ? ":" + quality : ""}.`;
    if (p !== null) evo += sig ? ` Es significativa (${fmtP(p)}): es improbable que sea casualidad.` : ` Pero no es significativa (${fmtP(p)}): puede ser casualidad${cv > 40 ? `, sobre todo porque los días varían mucho (${Math.round(cv)} %)` : ""}.`;
  }

  // comparación con el periodo anterior
  let cmp = "";
  const pv = (prevDays || []).filter(src.ok).map(src.val);
  if (pv.length >= 1) {
    const pm = mean(pv), diff = pm > 0 ? ((m - pm) / pm) * 100 : null;
    if (diff !== null) {
      if (Math.abs(diff) < 8) cmp = "Igual que en el periodo anterior.";
      else {
        const better = lowerGood ? diff < 0 : null;
        cmp = `Frente al periodo anterior (${f(pm)} ${unit}), ${better === null ? "cambia" : better ? "estás mejor" : "estás peor"} (${diff > 0 ? "+" : "−"}${Math.abs(Math.round(diff))} %).`;
      }
    }
  }

  const unfavourable = verdict === "mala" && sig;
  const tail = [];
  if (levelBad && tips[key]) tail.push(tips[key]);
  else if (unfavourable) tail.push("Es una evolución desfavorable y significativa: merece comentarse pronto con el médico.");

  if (!detail) { out.push(cmp ? `${evo} ${cmp}` : evo); return out.concat(tail); }

  // Análisis detallado: variación, media frente a mediana y comparación
  out.push(evo);
  const sorted = [...vals].sort((a, b) => a - b), n = sorted.length;
  const med = n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
  out.push(`Variación entre días: ${Math.round(cv)} % (${cvClass(cv)}); los valores van de ${f(Math.min(...vals))} a ${f(Math.max(...vals))} ${unit}.${cv >= 50 ? " Con tanta variación, la media dice poco de un día concreto." : cv < 15 ? " Un día cualquiera se parece mucho a la media." : ""}`);
  const gap = m > 0 ? Math.abs(m - med) / m : 0;
  if (gap < 0.05) out.push(`La media (${f(m)}) y la mediana (${f(med)}) casi coinciden: no hay días extremos que distorsionen los datos.`);
  else if (m > med) out.push(`La media (${f(m)}) es mayor que la mediana (${f(med)}): unos pocos días muy altos la suben; un día típico se parece más a ${f(med)}.`);
  else out.push(`La media (${f(m)}) es menor que la mediana (${f(med)}): unos pocos días muy bajos la bajan; un día típico se parece más a ${f(med)}.`);
  if (cmp) out.push(cmp);
  return out.concat(tail);
}

// Estima cuándo se alcanzará un objetivo si la tendencia de los últimos días continúa (regresión lineal)
// Día en que la MEDIA del periodo alcanzaría el objetivo, suponiendo que los días futuros siguen la tendencia actual
function goalETA(g, goalVal, days) {
  const pts = days.filter(g.pool).map((d) => ({ date: d.date, v: g.get(d) }));
  if (pts.length < 5) return null;
  const vals = pts.map((p) => p.v), xs = pts.map((p) => dayOffset(pts[0].date, p.date));
  const { slope, intercept } = linreg(vals, xs);
  const p = pSlope(vals, xs);
  const reliable = p !== null && p < 0.05;
  const meets = (m) => (g.max ? m <= goalVal : m >= goalVal);
  let sum = vals.reduce((a, v) => a + v, 0), n = vals.length;
  if (meets(sum / n)) return { text: "La media del periodo ya está dentro del objetivo.", good: true, kind: "ok" };
  const toward = g.max ? slope < 0 : slope > 0;
  const away = { text: `Con la tendencia actual la media no llega al objetivo: ${Math.abs(slope) < 1e-9 ? "los días se mantienen igual" : g.max ? "los días van subiendo" : "los días van bajando"}.`, good: false, kind: "away" };
  if (!toward || Math.abs(slope) < 1e-9) return away;
  const x0 = xs[xs.length - 1];
  for (let k = 1; k <= 365; k++) {
    sum += Math.max(0, intercept + slope * (x0 + k)); n += 1;
    if (meets(sum / n)) {
      const eta = addDaysIso(pts[pts.length - 1].date, k);
      const left = Math.max(0, dayOffset(todayStr(), eta));
      const when = left === 0 ? "hoy" : `en ${left} ${left === 1 ? "día" : "días"}`;
      return { text: `A este ritmo la media del periodo llegará al objetivo el ${fmtDateLong(eta)} (${when}).${reliable ? "" : " Es una estimación poco fiable: la tendencia no es significativa y puede cambiar."}`, good: true, kind: "date", date: eta, left, reliable };
    }
  }
  return { text: "A este ritmo la media tardaría más de un año en llegar al objetivo.", good: false, kind: "far" };
}

function GoalsCard({ days, prevDays, settings, setDefault }) {
  const COLORS = useTheme();
  const goals = goalDefs(COLORS);
  return (

      {goals.map((g) => {
        const val = settings[g.key];
        const has = val !== undefined && val !== "" && val !== null && !Number.isNaN(Number(val));
        const pool = days.filter(g.pool);
        const ok = has ? pool.filter((d) => g.test(d, Number(val))).length : 0;
        const pct = pool.length ? Math.round((ok / pool.length) * 100) : 0;
        return (
          <div key={g.key}>
            <div className="no-print" style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, fontWeight: 700, flex: 1, minWidth: 130 }}>{g.label}</span>
              <input type="number" inputMode="decimal" min="0" value={has ? val : ""} placeholder={g.ph} onChange={(e) => setDefault(g.key, e.target.value === "" ? "" : Number(e.target.value))} style={{ width: 84, textAlign: "right" }} />
              <span style={{ fontSize: 12, color: COLORS.inkSoft, minWidth: 60 }}>{g.unit}</span>
            </div>
            {has && (
              <div style={{ marginTop: 8 }}>
                <div style={{ height: 10, borderRadius: 99, background: COLORS.inputBg, overflow: "hidden" }}>
                  <div style={{ width: `${pct}%`, height: "100%", background: g.color, borderRadius: 99 }} />
                </div>
                <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 4 }}>
                  {pool.length ? <><b className="num" style={{ color: COLORS.ink }}>{ok} de {pool.length} días</b> cumplen el objetivo ({pct} %) en este periodo.</> : "Sin datos de esta serie en el periodo."}
                </div>
                {(() => { const eta = goalETA(g, Number(val), days); return eta ? <div style={{ fontSize: 12.5, fontWeight: 700, marginTop: 5, color: eta.good ? COLORS.teal : COLORS.amber, lineHeight: 1.4 }}>{eta.text}</div> : null; })()}
              </div>
            )}
          </div>
        );
      })}
      {(() => {
        const lines = [];
        goals.forEach((g) => {
          const val = settings[g.key];
          if (val === undefined || val === "" || val === null || Number.isNaN(Number(val))) return;
          const pool = days.filter(g.pool), pp = (prevDays || []).filter(g.pool);
          if (!pool.length) return;
          const now = Math.round((pool.filter((d) => g.test(d, Number(val))).length / pool.length) * 100);
          let t = `${g.label} (${val} ${g.unit}): lo cumples el ${now} % de los días`;
          if (pp.length >= 3) { const before = Math.round((pp.filter((d) => g.test(d, Number(val))).length / pp.length) * 100); t += Math.abs(now - before) < 8 ? `, igual que antes (${before} %).` : `, ${now > before ? "mejor" : "peor"} que antes (${before} %).`; } else t += ".";
          if (now < 50) t += " Es menos de la mitad: revisa tus hábitos o comenta con tu profesional si el objetivo es realista.";
          else if (now < 80) t += " Vas en camino, pero aún puedes mejorar.";
          else t += " Buen cumplimiento.";
          lines.push(t);
        });
        return lines.length ? <Explain title="Interpretación">{lines}</Explain> : <Explain title="Interpretación">Aún no has puesto ningún objetivo. Cuando lo hagas, aquí verás si lo cumples y si vas mejor o peor que antes.</Explain>;
      })()}
      <div style={{ fontSize: 11.5, color: COLORS.inkSoft, lineHeight: 1.45 }}>Pon solo los objetivos que te interesen. Se guardan en este dispositivo. Conviene acordarlos con tu profesional sanitario.</div>
    </div>
  );
}

  const items = defs.map(([k, l, fmt, unit, Icon, color, bg]) => {
    const src = PERIOD_SOURCES[k];
    const cur = (days || []).filter(src.ok).map(src.val), pv = (prevDays || []).filter(src.ok).map(src.val);
    if (!cur.length) return null;
    const m = mean(cur);
    const base = { k, l, Icon, color, bg, val: fmt(m), unit, state: null };
    if (pv.length < 3) return base;
    const pm = mean(pv), diff = pm > 0 ? ((m - pm) / pm) * 100 : null;
    if (diff === null) return base;
    return { ...base, diff, state: Math.abs(diff) < 8 ? "igual" : diff < 0 ? "mejor" : "peor" };
  }).filter(Boolean);
  if (!items.length) return null;
  const st = items.map((i) => i.state).filter(Boolean);
  const nb = st.filter((x) => x === "mejor").length, nw = st.filter((x) => x === "peor").length;
  let verdict, color = COLORS.inkSoft, VIcon = Activity;
  if (!st.length) verdict = "Así estás en este periodo";
  else if (nb && nw) verdict = "Resultados mixtos: unas cosas mejoran y otras empeoran";
  else if (nb) { verdict = "Vas mejor que en el periodo anterior"; color = COLORS.teal; VIcon = CheckCircle2; }
  else if (nw) { verdict = "Estás peor que en el periodo anterior: conviene comentarlo con el médico"; color = COLORS.rose; VIcon = AlertTriangle; }
  else verdict = "Todo se mantiene igual que en el periodo anterior";
  const sc = { mejor: COLORS.teal, peor: COLORS.rose, igual: COLORS.inkSoft };

  // pendiente de la pérdida y fecha estimada del objetivo
  const pts = (days || []).filter((d) => d.diaperCount > 0);
  let slopeTxt = null;
  if (pts.length >= 3) {
    const vals = pts.map((d) => d.diaperTotal), xs = pts.map((d) => dayOffset(pts[0].date, d.date));
    const { slope } = linreg(vals, xs);
    slopeTxt = Math.abs(slope) < 0.5 ? "estable" : `${slope < 0 ? "↓" : "↑"} ${fmtEs(Math.abs(round1(slope)), 1)} g cada día`;
  }
  const gv = settings && settings.goalLoss;
  const hasGoal = gv !== undefined && gv !== "" && gv !== null && !Number.isNaN(Number(gv));
  const eta = hasGoal ? goalETA(goalDefs(COLORS)[0], Number(gv), days) : null;
  let etaTile = { value: "—", unit: "", sub: hasGoal ? "Sin tendencia suficiente" : "Fija un objetivo en el Diario", color: COLORS.inkSoft };
  if (eta) {
    if (eta.kind === "date") etaTile = { value: fmtDateShort(eta.date), unit: "", sub: `la media llega ${eta.left === 0 ? "hoy" : `en ${eta.left} ${eta.left === 1 ? "día" : "días"}`}${eta.reliable ? "" : " · poco fiable"}`, color: COLORS.teal };
    else if (eta.kind === "ok") etaTile = { value: "Cumplido", unit: "", sub: "la media ya está dentro", color: COLORS.teal };
    else if (eta.kind === "far") etaTile = { value: "> 1 año", unit: "", sub: "para que la media llegue", color: COLORS.rose };
    else etaTile = { value: "No se acerca", unit: "", sub: "la media no llega al objetivo", color: COLORS.rose };
  }
  const tile = { borderRadius: 16, padding: "11px 12px", minWidth: 0 };
  const lab = (Icon, c, t) => <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, fontWeight: 800, color: c }}><Icon size={14} strokeWidth={2.4} /> {t}</div>;
  const bigNum = { fontSize: 22, fontWeight: 800, lineHeight: 1.1, marginTop: 4, color: COLORS.ink, whiteSpace: "nowrap" };
  const unitS = { fontSize: 11.5, fontWeight: 600, color: COLORS.inkSoft };
  const loss = items.find((i) => i.k === "loss");
  const others = items.filter((i) => i.k !== "loss");
  return (
    <div style={{ background: COLORS.card, borderRadius: 24, padding: "14px 14px 14px", boxShadow: COLORS.shadowSm }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14.5, fontWeight: 800, color, marginBottom: 10, lineHeight: 1.3 }}><VIcon size={18} strokeWidth={2.4} style={{ flexShrink: 0 }} /> {verdict}</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 8 }}>
        {loss && (
          <div style={{ ...tile, background: loss.bg }}>
            {lab(Scale, loss.color, "Pérdida")}
            <div className="num" style={bigNum}>{loss.val}<span style={unitS}> g/día</span></div>
            <div style={{ fontSize: 11, fontWeight: 700, marginTop: 3, color: loss.state ? sc[loss.state] : COLORS.inkSoft }}>{loss.state ? (loss.state === "igual" ? "= igual que antes" : `${loss.diff < 0 ? "↓" : "↑"} ${Math.abs(Math.round(loss.diff))} % · ${loss.state}`) : "media del periodo"}</div>
            {slopeTxt && <div style={{ fontSize: 11, fontWeight: 600, color: COLORS.inkSoft, marginTop: 1 }}>Tendencia: {slopeTxt}</div>}
          </div>
        )}
        <div style={{ ...tile, background: COLORS.tealSoft }}>
          {lab(Target, COLORS.teal, hasGoal ? `Objetivo ≤ ${Number(gv)} g` : "Objetivo")}
          <div className="num" style={{ ...bigNum, fontSize: etaTile.value.length > 8 ? 17 : 22, color: etaTile.color === COLORS.inkSoft ? COLORS.ink : etaTile.color }}>{etaTile.value}</div>
          <div style={{ fontSize: 11, fontWeight: 700, marginTop: 3, color: COLORS.inkSoft }}>{etaTile.sub}</div>
        </div>
        {others.map((i) => (
          <div key={i.k} style={{ ...tile, background: i.bg }}>
            {lab(i.Icon, i.color, i.l)}
            <div className="num" style={bigNum}>{i.val}<span style={unitS}> {i.unit}</span></div>
            <div style={{ fontSize: 11, fontWeight: 700, marginTop: 3, color: i.state ? sc[i.state] : COLORS.inkSoft }}>{i.state ? (i.state === "igual" ? "= igual que antes" : `${i.diff < 0 ? "↓" : "↑"} ${Math.abs(Math.round(i.diff))} % · ${i.state}`) : "media del periodo"}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function goalDefs(COLORS) {
  return [
    { key: "goalLoss", label: "Pérdida máxima", short: "Pérdida ≤", unit: "g/día", ph: "300", test: (d, g) => d.diaperTotal <= g, get: (d) => d.diaperTotal, max: true, pool: (d) => d.diaperCount > 0, color: COLORS.amber },
    { key: "goalNocturia", label: "Levantadas nocturnas máx.", short: "Noches ≤", unit: "por noche", ph: "1", test: (d, g) => d.nightVoids <= g, get: (d) => d.nightVoids, max: true, pool: (d) => d.nightCovered, color: COLORS.purple },
    { key: "goalLiquid", label: "Líquido mínimo", short: "Líquido ≥", unit: "ml/día", ph: "1500", test: (d, g) => d.liquidTotal >= g, get: (d) => d.liquidTotal, max: false, pool: (d) => d.liquidCount > 0, color: "#0EA5E9" },
  ];
}

const cardBox = (C) => ({ background: C.card, borderRadius: 24, padding: 20, boxShadow: C.shadowSm });

function ReviewCard({ days }) {
  const COLORS = useTheme();
  const issues = [];
  days.forEach((d) => {
    const w = d.diaperWeights || [];
    if (d.diaperTotal > 3000) issues.push([d.date, `Pérdida de ${Math.round(d.diaperTotal)} g en un día: ¿hay un peso mal anotado?`]);
    if (w.some((x) => x > 1500)) issues.push([d.date, "Un pañal pesa más de 1,5 kg: revisa el peso."]);
    if (d.liquidTotal > 6000) issues.push([d.date, `Líquido de ${Math.round(d.liquidTotal)} ml en un día: ¿está bien anotado?`]);
    if (d.voidCount > 25) issues.push([d.date, `${d.voidCount} micciones en un día: ¿alguna repetida?`]);
  });
  if (!issues.length) return null;
  return (
    <div style={{ ...cardBox(COLORS), borderLeft: `4px solid ${COLORS.amber}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 15, fontWeight: 800, marginBottom: 8 }}><AlertTriangle size={16} color={COLORS.amber} /> Datos a revisar</div>
      {issues.slice(0, 8).map(([date, msg], i) => (
        <div key={i} style={{ display: "flex", gap: 8, fontSize: 12.5, padding: "6px 0", borderTop: i ? `1px solid ${COLORS.line}` : "none", lineHeight: 1.4 }}>
          <span className="num" style={{ fontWeight: 800, minWidth: 54 }}>{fmtDateShort(date)}</span><span style={{ color: COLORS.inkSoft }}>{msg}</span>
        </div>
      ))}
      <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 6 }}>Un valor muy alto puede ser un error al teclear y falsea las medias. Corrígelo desde el Diario si es un error.</div>
    </div>
  );
}

function LossChart({ days, prevDays, periodDays, events }) {
  const COLORS = useTheme();
  const pts = days.filter((d) => d.diaperCount > 0 || d.liquidCount > 0).map((d) => ({
    date: d.date, label: fmtDateShort(d.date), value: round1(d.diaperTotal), liquid: round1(d.liquidTotal), note: d.dayNote || "",
  }));
  if (pts.length < 2) return <EmptyState icon={Scale} text="Aún no hay evolución que dibujar: anota pesajes de pañal o líquidos en más de un día." />;
  return (
    <>
      <AnnotatedLineChart points={pts} unit="g" color={COLORS.amber} title="Pérdidas e ingesta diaria" events={events} />
      <Explain title="Interpretación">{labeled("Pérdida", interpretFor("loss", days, prevDays, periodDays))}{labeled("Ingesta", interpretFor("liquid", days, prevDays, periodDays))}</Explain>
    </>
  );
}

            ))}

        <div className="no-print" style={{ display: "flex", gap: 6, flexWrap: "wrap", padding: "8px 0 0" }}>

              <span style={{ width: 9, height: 9, borderRadius: 3, background: show[k] ? c : "transparent", boxShadow: `inset 0 0 0 1.5px ${c}` }} />{l}
            </button>
          ))}

      </div>

}

function PeriodComparisonCard({ dailyAgg, minDate, maxDate, sources, sourceKey: fixedKey }) {
  const COLORS = useTheme();
  // filtro propio, independiente del que usa el gráfico
  const [cmpPreset, setCmpPreset] = useState("30");
  const [cmpCustom, setCmpCustom] = useState(false);
  const [cmpStart, setCmpStart] = useState(minDate);
  const [cmpEnd, setCmpEnd] = useState(maxDate);
  useEffect(() => { if (!cmpCustom) { setCmpStart(minDate); setCmpEnd(maxDate); } }, [minDate, maxDate, cmpCustom]);
  const range = useMemo(() => {
    if (cmpCustom && cmpStart && cmpEnd && cmpStart <= cmpEnd) return { start: cmpStart, end: cmpEnd };
    const days = Number(cmpPreset) || 30;
    return { start: addDaysIso(maxDate, -(days - 1)), end: maxDate };
  }, [cmpPreset, cmpCustom, cmpStart, cmpEnd, maxDate]);
  const sourceList = sources && sources.length ? sources : Object.keys(PERIOD_SOURCES);
  const [ownKey, setSourceKey] = useState(sourceList[0]);
  const sourceKey = fixedKey || ownKey;
  const [measureKey, setMeasureKey] = useState("mean");
  const src = PERIOD_SOURCES[sourceKey], meas = PERIOD_MEASURES[measureKey];
  const unit = meas.pct ? "%" : meas.sq ? `(${src.unit})²` : src.unit;
  const rv = (v) => (meas.slope ? Math.round(v * 100) / 100 : round1(v));
  const fmtV = (v) => (v === null || v === undefined ? "—" : fmtEs(rv(v), meas.slope ? 2 : 1));

    const VISIBLE = 6;
  const [shift, setShift] = useState(0);   // cuántos periodos hacia atrás está la ventana
  const { n, blocks: allBlocks } = useMemo(() => buildPeriodBlocks(dailyAgg, range, sourceKey, 1000), [dailyAgg, range, sourceKey]);
  const allWithData = allBlocks.filter((b) => b.vals.length > 0);
  useEffect(() => { setShift(0); }, [range.start, range.end, sourceKey]);
  const maxShift = Math.max(0, allWithData.length - VISIBLE);   // nunca se muestran menos de 6 si hay al menos 6
  const sh = Math.min(shift, maxShift);
  // ventana: se muestran VISIBLE periodos y se carga uno más para calcular el cambio del último
  const blocks = allBlocks.filter((b) => b.vals.length > 0).slice(sh, sh + VISIBLE + 1);
  const withData = blocks;
  const shown = withData.slice(0, VISIBLE);
  const chartData = [...shown].reverse().map((b) => ({ name: b.i === 0 ? "Actual" : `−${b.i}`, value: rv(measureValue(b, measureKey)), i: b.i }));

  const wrap = { background: COLORS.card, borderRadius: 24, padding: "20px 18px", boxShadow: COLORS.shadowSm };
  const title = (
    <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 17, fontWeight: 800, letterSpacing: "-0.02em", marginBottom: 4 }}>
      <BarChart3 size={18} color={COLORS.teal} /> Evolución por periodos
    </div>
  );
  const selectors = (
    <div className="no-print" style={{ margin: "10px 0 14px" }}>
      <div style={{ fontSize: 11.5, fontWeight: 700, color: COLORS.inkSoft, marginBottom: 6 }}>Duración de cada periodo a comparar</div>
      <div style={{ display: "flex", gap: 4, background: COLORS.inputBg, padding: 4, borderRadius: 22, width: "fit-content", maxWidth: "100%", flexWrap: "wrap", marginBottom: 8 }}>
        {PRESETS.filter((x) => x.id !== "all" && x.id !== "1").map((x) => {
          const active = !cmpCustom && cmpPreset === x.id;
          return (
            <button key={x.id} onClick={() => { setCmpPreset(x.id); setCmpCustom(false); setCmpStart(minDate); setCmpEnd(maxDate); }}
              style={{ padding: "6px 12px", borderRadius: 99, fontSize: 12, fontWeight: 700, border: "none", background: active ? COLORS.teal : "transparent", color: active ? "#fff" : COLORS.inkSoft }}>
              {x.label}
            </button>
          );
        })}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
      {!fixedKey && <select value={sourceKey} onChange={(e) => setSourceKey(e.target.value)}>
        {sourceList.map((k) => <option key={k} value={k}>{PERIOD_SOURCES[k].label}</option>)}
      </select>}
      <select value={measureKey} onChange={(e) => setMeasureKey(e.target.value)}>
        {Object.entries(PERIOD_MEASURES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
      </select>
      </div>
    </div>
  );

  if (!(n >= 3) || withData.length < 2 || blocks[0].vals.length === 0) {
    return (
      <div style={wrap}>
        {title}
        {selectors}
        <div style={{ fontSize: 13, color: COLORS.inkSoft, lineHeight: 1.5 }}>
          Aún no hay dos periodos seguidos de esa duración con datos de «{src.label.toLowerCase()}». Prueba con una duración más corta; con «Todo» no hay periodo anterior.
        </div>
      </div>
    );
  }

  const cmp = compareBlocks(blocks[0], blocks[1], measureKey, sourceKey);
  const goodDir = (diff) => (src.lower === null ? null : (diff < 0) === src.lower);
  const dirColor = (diff, big) => {
    if (!big) return COLORS.inkSoft;
    const g = goodDir(diff);
    return g === null ? COLORS.inkSoft : g ? "#2F7D4F" : "#B3492F";
  };

  // ---------- interpretación en lenguaje llano ----------
  const THING = { loss: "lo que pierdes", liquid: "lo que bebes", voidsDay: "las veces que orinas de día", nocturia: "las veces que te levantas de noche", voids: "las veces que orinas al día", diapers: "los cambios de pañal" };
  const thing = THING[sourceKey] || src.label.toLowerCase();
  const plural = ["voidsDay", "nocturia", "voids", "diapers"].includes(sourceKey);
  const dec = sourceKey === "nocturia" || sourceKey === "diapers" || sourceKey === "voids" || sourceKey === "voidsDay" ? 1 : 0;
  const u1 = src.unit.replace("/día", "").replace("por noche", "").replace("al día", "").trim();
  const num = (v) => fmtEs(round1(v), dec);
  const withU = (v) => `${num(v)}${u1 ? " " + u1 : ""}`;
  const pctWord = (pct) => `${fmtEs(round1(Math.abs(pct)), 0)} % ${pct < 0 ? "menos" : "más"}`;
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  const lines = [];
  if (!cmp) {
    lines.push("Aún no hay 3 días con datos en cada periodo para poder compararlos.");
  } else {
    const absPct = cmp.pct === null ? 0 : Math.abs(cmp.pct);
    const g = goodDir(cmp.diff);
    if (measureKey === "slope") {
      const sa = cmp.a, sb = cmp.b;
      const dirW = (x) => (Math.abs(x) < 0.5 ? (plural ? "se mantienen estables" : "se mantiene estable") : x > 0 ? (plural ? "van subiendo" : "va subiendo") : (plural ? "van bajando" : "va bajando"));
      const gd = Math.abs(sa) < 0.5 || src.lower === null ? null : (sa < 0) === src.lower;
      lines.push(`En este periodo ${thing} ${dirW(sa)}${Math.abs(sa) >= 0.5 ? ` (unos ${num(Math.abs(sa))} ${u1} cada día)` : ""}${gd === null ? "" : gd ? ": es buena señal" : ": conviene vigilarlo"}. En el periodo anterior ${dirW(sb)}.`);
    } else {
      const which = { mean: "de media", median: "en un día típico", max: "el día más alto", min: "el día más bajo" }[measureKey];
      lines.push(`${cap(thing)}, ${which}: ${withU(cmp.a)}, frente a ${withU(cmp.b)} en el periodo anterior (${cmp.pct === null ? "—" : pctWord(cmp.pct)}).`);
      const verdict = g === null ? "" : g ? " y es buena señal" : " y conviene vigilarlo";
      if (cmp.p !== null) lines.push(cmp.p < 0.05 ? `Es un cambio real: es improbable que se deba a la casualidad${verdict}.` : "Es una diferencia pequeña comparada con lo que varían tus días: puede ser casualidad.");
      else lines.push(`${cap(periodBand(absPct))}${absPct >= 10 && g !== null ? (g ? ": buena señal" : ": conviene vigilarlo") : ""}.`);
    }
  }
  // tendencia entre todos los bloques
  const trendBlocks = withData.filter((b) => b.vals.length >= 3).reverse(); // antiguo → reciente
  if (trendBlocks.length >= 3) {
    const vals = trendBlocks.map((b) => measureValue(b, measureKey));
    const diffs = vals.slice(1).map((v, i) => v - vals[i]);
    const allDown = diffs.every((d) => d < 0), allUp = diffs.every((d) => d > 0);
    lines.push(allDown || allUp ? `Mirando todos los periodos, ${allDown ? "va bajando" : "va subiendo"} de forma continua (${vals.length} seguidos).` : "Mirando todos los periodos no hay una dirección clara: sube y baja.");
  }

  return (
    <div style={wrap}>
      {title}
      <div style={{ fontSize: 12, color: COLORS.inkSoft }}>
        {meas.label} · {src.label} · bloques de {n} días
      </div>
      {selectors}

      {allWithData.length > VISIBLE && (
        <div className="no-print" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8 }}>
          <button onClick={() => setShift(Math.min(maxShift, sh + 1))} disabled={sh >= maxShift} aria-label="Ver periodos más antiguos"
            style={{ display: "inline-flex", alignItems: "center", gap: 4, background: COLORS.inputBg, color: sh >= maxShift ? COLORS.line : COLORS.ink, border: "none", borderRadius: 99, padding: "8px 12px", fontSize: 12.5, fontWeight: 700 }}>
            <ChevronLeft size={16} /> Antes
          </button>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: COLORS.inkSoft, textAlign: "center" }}>
            Periodos {sh + 1}–{Math.min(sh + VISIBLE, allWithData.length)} de {allWithData.length}
          </div>
          <button onClick={() => setShift(Math.max(0, sh - 1))} disabled={sh <= 0} aria-label="Ver periodos más recientes"
            style={{ display: "inline-flex", alignItems: "center", gap: 4, background: COLORS.inputBg, color: sh <= 0 ? COLORS.line : COLORS.ink, border: "none", borderRadius: 99, padding: "8px 12px", fontSize: 12.5, fontWeight: 700 }}>
            Después <ChevronRight size={16} />
          </button>
        </div>
      )}

      <div style={{ width: "100%", height: 220 }}>
        <ResponsiveContainer>

function SummaryStatCards({ points, unit, prevMean, meanLabel = "Media", dec = 0, perDay = "/día" }) {
  const COLORS = useTheme();
  const values = points.map((p) => p.value);
  if (values.length === 0) return null;
  const { mean: m, sd, max, min } = statsOf(values);
  const xs = points.map((p) => dayOffset(points[0]?.date, p.date));
  const { slope } = linreg(values, xs);
  const maxPoint = points[values.indexOf(max)], minPoint = points[values.indexOf(min)];
  const f = (v, d = dec) => fmtEs(round1(v), d);
  const flat = Math.abs(slope) * Math.max(1, xs[xs.length - 1] - xs[0]) < 0.08 * Math.abs(m);
  const down = slope < 0;
  const cv = m > 0 ? (sd / m) * 100 : 0;
  const cvCol = cv < 30 ? COLORS.teal : cv < 50 ? COLORS.amber : COLORS.rose;
  const cards = [
    { icon: Droplet, color: COLORS.blue, label: meanLabel, value: `${f(m)} ${unit}${perDay}`,
      desc: prevMean && prevMean > 0 ? `${m < prevMean ? "▼" : m > prevMean ? "▲" : "="} ${fmtEs(Math.abs(Math.round(((m - prevMean) / prevMean) * 100)), 0)} % frente al periodo anterior (${f(prevMean)}).` : "Valor medio del periodo." },
    { icon: flat ? Minus : down ? TrendingDown : TrendingUp, color: flat ? COLORS.inkSoft : down ? COLORS.teal : COLORS.amber, label: "Tendencia", value: flat ? "Estable" : `${down ? "−" : "+"}${f(Math.abs(slope) * Math.max(1, xs[xs.length - 1] - xs[0]))} ${unit}`,
      desc: flat ? "No sube ni baja de forma apreciable." : `${down ? "Baja" : "Sube"} en el periodo (unos ${fmtEs(Math.abs(slope), Math.abs(slope) < 10 ? 2 : 1)} ${unit} al día).` },
    { icon: Activity, color: cvCol, label: "Variación entre días", value: `${fmtEs(Math.round(cv), 0)} %`, desc: cvClass(cv).replace(/^./, (c) => c.toUpperCase()) + (cv >= 50 ? ": la media dice poco de un día concreto." : cv < 15 ? ": los días se parecen mucho." : ".") },
    { icon: BarChart3, color: COLORS.purple, label: "Más bajo – más alto", value: `${f(min)} – ${f(max)}`, desc: `Más bajo: ${fmtDateShort(minPoint.date)}. Más alto: ${fmtDateShort(maxPoint.date)}${maxPoint.note ? ` (${maxPoint.note})` : ""}.` },
  ];
  return (
    <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 10 }}>
      {cards.map((c, i) => (
        <div key={i} style={{ background: COLORS.card, borderRadius: 20, padding: "13px 14px", boxShadow: COLORS.shadowSm, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 6 }}>
            <c.icon size={15} color={c.color} strokeWidth={2.4} />
            <span style={{ fontSize: 11.5, fontWeight: 800, color: COLORS.inkSoft }}>{c.label}</span>
          </div>
          <div className="num" style={{ fontSize: 19, fontWeight: 800, color: c.color === COLORS.inkSoft ? COLORS.ink : c.color, lineHeight: 1.15 }}>{c.value}</div>
          <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 4, lineHeight: 1.35 }}>{c.desc}</div>
        </div>
      ))}
    </div>
  );
}

const GEMINI_MODEL_FALLBACKS = ["gemini-3.8-flash", "gemini-flash-latest", "gemini-2.5-flash-lite", "gemini-2.5-flash"];
const GEMINI_KEY_STORAGE = "incontrol-gemini-api-key";
const GEMINI_MODELS_CACHE = "incontrol-gemini-models";
const GEMINI_RETRYABLE_MSG = /no longer available|not found|not supported|overloaded|high demand|unavailable|deprecated|quota|exhausted|try again/i;

// Pregunta a Google qué modelos puede usar esta clave y elige los Flash más recientes
async function discoverGeminiModels(apiKey) {
  try {
    const cached = JSON.parse(localStorage.getItem(GEMINI_MODELS_CACHE) || "null");
    if (cached && Date.now() - cached.at < 6 * 3600 * 1000 && cached.list && cached.list.length) return cached.list;
  } catch (e) { /* sin caché */ }
  try {
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": apiKey } });
    if (!r.ok) return [];
    const j = await r.json();
    const names = (j.models || [])
      .filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map((m) => String(m.name).replace(/^models\//, ""))
      .filter((n) => /^gemini-/.test(n) && !/(image|tts|live|embedding|audio|robotics|computer|vision|learnlm|aqa|-exp|customtools)/i.test(n));
    const ver = (n) => { const m = n.match(/^gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
    const tier = (n) => (/flash-lite/.test(n) ? 2 : /flash/.test(n) ? 1 : /pro/.test(n) ? 3 : 4);
    const preview = (n) => (/preview|\d{2}-\d{2,4}$|-\d{3}$/.test(n) ? 1 : 0);
    const list = names.sort((x, y) => tier(x) - tier(y) || preview(x) - preview(y) || ver(y) - ver(x)).slice(0, 6);
    try { localStorage.setItem(GEMINI_MODELS_CACHE, JSON.stringify({ at: Date.now(), list })); } catch (e) { /* sin caché */ }
    return list;
  } catch (e) {
    return [];
  }
}

async function callGeminiWithFallback(apiKey, contents, attempt = 1) {
  const discovered = await discoverGeminiModels(apiKey);
  const queue = [...new Set([...discovered, ...GEMINI_MODEL_FALLBACKS])];
  const tried = new Set();
  let lastErr = null;
  let allRetryable = true;
  while (queue.length) {
    const model = queue.shift();
    if (tried.has(model)) continue;
    tried.add(model);
    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
          body: JSON.stringify({ contents }),
        }
      );
      if (!response.ok) {
        const errBody = await response.json().catch(() => null);
        const msg = (errBody && errBody.error && errBody.error.message) || `Error ${response.status}`;
        const retryable = response.status === 404 || response.status === 429 || response.status === 503 || GEMINI_RETRYABLE_MSG.test(msg);
        if (retryable) {
          lastErr = new Error(msg);
          // Si Google sugiere otro modelo en el mensaje, pruébalo el primero
          const suggested = (msg.match(/models\/(gemini-[\w.\-]+)/g) || []).map((x) => x.replace("models/", "")).filter((x) => !tried.has(x));
          if (suggested.length) queue.unshift(...suggested);
          try { localStorage.removeItem(GEMINI_MODELS_CACHE); } catch (e) { /* ok */ }
          continue;
        }
        allRetryable = false;
        throw new Error(msg);
      }
      const json = await response.json();
      if (!json.candidates || !json.candidates.length) {
        const blockReason = json.promptFeedback && json.promptFeedback.blockReason;
        throw new Error(blockReason ? `Respuesta bloqueada por Gemini (${blockReason}).` : "Respuesta vacía de Gemini.");
      }
      const parts = (json.candidates[0].content && json.candidates[0].content.parts) || [];
      const text = parts.filter((p) => !p.thought).map((p) => p.text || "").filter(Boolean).join("\n");
      if (!text) throw new Error("Respuesta vacía");
      return text;
    } catch (e) {
      if (e && e.message === "Failed to fetch") { lastErr = e; allRetryable = false; break; }
      lastErr = e;
      if (!GEMINI_RETRYABLE_MSG.test(e.message || "")) { allRetryable = false; break; }
    }
  }
  if (allRetryable && attempt < 2) {
    await new Promise((r) => setTimeout(r, 2500));
    return callGeminiWithFallback(apiKey, contents, attempt + 1);
  }
  throw lastErr || new Error("No se pudo generar el informe.");
}

function RichText({ text, size = 14.5 }) {
  const COLORS = useTheme();
  const inline = (t, key) => t.split(/(\*\*[^*]+\*\*)/g).map((part, i) =>
    part.startsWith("**") && part.endsWith("**") && part.length > 4
      ? <strong key={key + "-" + i}>{part.slice(2, -2)}</strong>
      : <React.Fragment key={key + "-" + i}>{part.replace(/\*/g, "")}</React.Fragment>
  );
  const lines = String(text || "").split("\n");
  const out = [];
  let list = [];
  const flush = () => { if (list.length) { out.push(<ul key={"ul" + out.length} style={{ margin: "4px 0 10px", paddingLeft: 20 }}>{list}</ul>); list = []; } };
  lines.forEach((raw, i) => {
    const line = raw.trim();
    if (!line) { flush(); return; }
    const h = line.match(/^#{1,4}\s+(.*)$/);
    const b = line.match(/^[-*•]\s+(.*)$/);
    if (h) {
      flush();
      out.push(<div key={i} style={{ fontSize: size + 2, fontWeight: 800, letterSpacing: "-0.01em", color: COLORS.teal, margin: "18px 0 6px" }}>{inline(h[1], "h" + i)}</div>);
    } else if (b) {
      list.push(<li key={i} style={{ marginBottom: 4 }}>{inline(b[1], "l" + i)}</li>);
    } else {
      flush();
      out.push(<p key={i} style={{ margin: "0 0 8px" }}>{inline(line, "p" + i)}</p>);
    }
  });
  flush();
  return <div style={{ fontSize: size, lineHeight: 1.65, color: COLORS.ink }}>{out}</div>;
}

function ConsultCard({ dailyAgg, maxDate, events = [] }) {
  const COLORS = useTheme();

  const an = useMemo(() => buildConsultAnalysis(dailyAgg, maxDate), [dailyAgg, maxDate]);
  const [printMode, setPrintMode] = useState(false);
  const ref = useRef(null);
  const wins = [30, 90].map((n) => {
    const start = addDaysIso(maxDate, -(n - 1));
    const days = dailyAgg.filter((d) => d.date >= start && d.date <= maxDate);
    const loss = days.filter((d) => d.diaperCount > 0);
    const liq = days.filter((d) => d.liquidCount > 0);
    const lv = loss.map((d) => d.diaperTotal);
    const slope = lv.length >= 4 ? linreg(lv, loss.map((d) => dayOffset(loss[0].date, d.date))).slope : null;
    return { n, days, lv, liq, sm: summarizeDiary(days), slope, flagged: days.filter((d) => dayFlags(d).length > 0).length };
  });
  const f0 = (v) => fmtEs(Math.round(v), 0);
  const f1 = (v) => fmtEs(round1(v), 1);
  const recent = wins[0].days.filter((d) => d.dayNote || dayFlags(d).length > 0).slice(-8).reverse();
  const dash = (v, fn) => (v === null || v === undefined || Number.isNaN(v) ? "—" : fn(v));
  const rows = [
    ["Días con pesajes", (w) => String(w.lv.length)],
    ["Pérdida media", (w) => (w.lv.length ? `${f0(mean(w.lv))} g/día${classifyLoss(mean(w.lv)) ? ` · ${classifyLoss(mean(w.lv)).label}` : ""}` : "—")],
    ["Pérdida mediana · máxima", (w) => (w.lv.length ? `${f0(median(w.lv))} · ${f0(Math.max(...w.lv))} g` : "—")],
    ["Tendencia de la pérdida", (w) => dash(w.slope, (v) => (Math.abs(v) < 0.5 ? "estable" : `${v < 0 ? "baja" : "sube"} ${f1(Math.abs(v))} g cada día`))],
    ["Líquido medio", (w) => (w.liq.length ? `${f0(mean(w.liq.map((d) => d.liquidTotal)))} ml/día` : "—")],
    ["Micciones por día", (w) => dash(w.sm.voidsPerDay, f1)],
    ["Nocturia (por noche)", (w) => dash(w.sm.nocturia, f1)],
    ["Días para comentar", (w) => String(w.flagged)],
  ];
  const doPrint = () => { setOpen(true); setPrintMode(true); setTimeout(() => { printElement(ref, "Incontrol · Resumen para la consulta"); setPrintMode(false); }, 300); };
  const C = printMode ? LIGHT_COLORS : COLORS;
  const compact = printMode;   // el PDF es una sola página: análisis, tabla clave y eventos
  const COMPACT_ROWS = ["Pérdida media", "Tendencia de la pérdida", "Líquido medio", "Micciones por día", "Nocturia (por noche)"];
  const shownRows = compact ? rows.filter(([l]) => COMPACT_ROWS.includes(l)) : rows;
  const cols = compact ? "minmax(0, 1.4fr) minmax(0, 1fr)" : "minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr)";
  const recentEvents = events.filter((e) => e.date >= addDaysIso(maxDate, -89) && e.date <= maxDate).slice(-8);
  return (
    <div style={{ ...cardBox(COLORS), marginBottom: 18 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontWeight: 800, fontSize: 17, letterSpacing: "-0.02em", display: "flex", alignItems: "center", gap: 8 }}><FileText size={18} color={COLORS.teal} /> Resumen para la consulta</div>
          <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 2 }}>Un análisis en palabras sencillas, con los datos que lo respaldan, para explicárselo a tu médico.</div>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => setOpen((v) => !v)} style={{ background: COLORS.inputBg, color: COLORS.ink, border: "none", borderRadius: 99, padding: "8px 13px", fontSize: 12.5, fontWeight: 700 }}>{open ? "Ocultar" : "Ver"}</button>
          <button onClick={doPrint} style={{ display: "flex", alignItems: "center", gap: 5, background: COLORS.teal, color: "#fff", border: "none", borderRadius: 99, padding: "8px 13px", fontSize: 12.5, fontWeight: 700 }}><Printer size={14} /> PDF 1 página</button>
        </div>
      </div>
      {open && (
        <div ref={ref} style={{ marginTop: 14, background: printMode ? LIGHT_COLORS.paper : "transparent", color: C.ink, zoom: compact ? 0.86 : 1 }}>
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 8 }}>Resumen y análisis de los últimos 30 días</div>
            {an.empty ? (
              <div style={{ fontSize: 13, color: C.inkSoft, lineHeight: 1.5 }}>No hay registros en los últimos 30 días. Cuando anotes algo, aquí aparecerá el análisis.</div>

              <div>Indicador</div><div>Últimos 30 días</div>{!compact && <div>Últimos 90 días</div>}
            </div>
            {shownRows.map(([label, fn]) => (
