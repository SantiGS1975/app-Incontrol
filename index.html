// ---------- almacenamiento local ----------
(function installStoragePolyfill() {
  if (window.storage) return;
  const NS = "incontrol:";
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(NS + key);
      if (raw === null) throw new Error("clave no encontrada: " + key);
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(NS + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(NS + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const p = NS + (prefix || "");
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(NS.length));
      return { keys, prefix: prefix || "", shared: false };
    },
  };
})();

function noteParts(v) {

try { if (typeof navigator !== "undefined" && "serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("./sw.js").catch(() => {}); } catch (e) {}
let _audioCtx = null;
function getAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!_audioCtx) _audioCtx = new AC();
    if (_audioCtx.state === "suspended") _audioCtx.resume();
    return _audioCtx;
  } catch (e) { return null; }
}
// los navegadores solo dejan sonar tras un toque del usuario: se desbloquea con el primero
if (typeof window !== "undefined") {
  const unlock = () => { getAudio(); window.removeEventListener("pointerdown", unlock); window.removeEventListener("keydown", unlock); };
  window.addEventListener("pointerdown", unlock); window.addEventListener("keydown", unlock);
}
function beep() {
  const ctx = getAudio();
  if (!ctx) return;
  try {
    [0, 0.4, 0.8].forEach((t) => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = "square"; o.frequency.value = 988;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.32);
    });
  } catch (e) {}
}

// devuelve "ok" o un texto con el motivo del fallo
async function notifyDrink(time) {
  const title = "Incontrol · hora de beber";
  const opts = { body: `Toca tu toma de líquido de las ${time}.`, tag: "incontrol-drink", renotify: true, requireInteraction: true, vibrate: [300, 150, 300] };
  if (!("Notification" in window)) return "Este navegador no admite notificaciones.";
  if (Notification.permission !== "granted") return "El permiso de notificaciones no está concedido.";
  let swErr = "";
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error("el service worker (sw.js) no se activa: ¿está en la misma carpeta que index.html?")), 4000))]);
      await reg.showNotification(title, opts);
      return "ok";
    }
  } catch (e) { swErr = e && e.message ? e.message : String(e); }
  try { new Notification(title, opts); return "ok"; } catch (e) { return swErr || (e && e.message) || "No se pudo mostrar la notificación."; }
}

function buildReminderIcs(times, dates) {
  const pad = (n) => String(n).padStart(2, "0");
  const d = new Date();
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Incontrol//Recordatorios//ES", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Incontrol"];
  dates.forEach((iso) => {
    const ymd = iso.replace(/-/g, "");
    times.forEach((t) => {
      const [h, m] = t.split(":");
      lines.push(
        "BEGIN:VEVENT",
        `UID:incontrol-${ymd}-${h}${m}@incontrol.app`,
        `DTSTAMP:${stamp}`,
        `DTSTART:${ymd}T${h}${m}00`,
        `DTEND:${ymd}T${h}${m}00`,
        "TRANSP:TRANSPARENT",
        "SUMMARY:Incontrol - Hora de beber",
        "DESCRIPTION:Toma de liquido programada. Anotala en Incontrol.",
        "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Hora de beber", "TRIGGER:PT0M", "END:VALARM",
        "END:VEVENT"
      );
    });
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

function downloadIcs(times, dates) {
  const blob = new Blob([buildReminderIcs(times, dates)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "incontrol-recordatorios.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function toLocalIsoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
const todayStr = () => toLocalIsoDate(new Date());
// Inicio de la jornada (Ajustes → Horarios). Un registro hecho antes de esa hora cuenta para el día anterior.
let DAY_START = "00:00";
const dayOf = (rec) => {
  if (!rec || !rec.date) return rec && rec.date;
  if (DAY_START === "00:00" || !rec.time || rec.time >= DAY_START) return rec.date;
  return addDaysIso(rec.date, -1);
};
const logicalToday = () => dayOf({ date: todayStr(), time: nowTimeStr() });
const nowTimeStr = () => new Date().toTimeString().slice(0, 5);
const fmtDateLabel = (isoDate) => {

const fmtDateFull = (isoDate) => {
  const d = new Date(isoDate + "T00:00:00");
  const t = d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
  return t.charAt(0).toUpperCase() + t.slice(1);
};

const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const fmtDateShort = (isoDate) => {

};

function dayOffset(isoStart, isoDate) {
  const a = new Date(isoStart + "T00:00:00");
  const b = new Date(isoDate + "T00:00:00");

}
function addDaysIso(isoStart, n) {
  const d = new Date(isoStart + "T00:00:00");
  d.setDate(d.getDate() + Math.round(n));
  return toLocalIsoDate(d);
}

function linreg(values, xs) {
  const n = values.length;
  if (n < 2) return { slope: 0, intercept: values[0] || 0, r2: 0 };
  if (!xs) xs = values.map((_, i) => i);
  const xMean = mean(xs), yMean = mean(values);
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - xMean) * (values[i] - yMean); den += (xs[i] - xMean) ** 2; }
  const slope = den === 0 ? 0 : num / den;
  const intercept = yMean - slope * xMean;
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < n; i++) {
    const pred = intercept + slope * xs[i];
    ssRes += (values[i] - pred) ** 2;
    ssTot += (values[i] - yMean) ** 2;
  }
  const r2 = ssTot === 0 ? 0 : 1 - ssRes / ssTot;
  return { slope, intercept, r2 };
}

const fmtEs = (n, decimals = 0) => n.toLocaleString("es-ES", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
const MESES_LARGO = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

// ---------- exportación ----------
function downloadWorkbook(sheets, filename) {
  if (!XLSX) {
    alert("La librería Excel aún se está cargando. Inténtalo en un segundo.");
    return;
  }
  const wb = XLSX.utils.book_new();
  for (const [name, rowsOrSheet] of sheets) {
    const ws = Array.isArray(rowsOrSheet)
      ? XLSX.utils.json_to_sheet(rowsOrSheet.length ? rowsOrSheet : [{ " ": "Sin datos" }])
      : rowsOrSheet;
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  }
  XLSX.writeFile(wb, filename);
}

function buildCoverSheet(subtitle, periodText) {
  const rows = [
    ["Incontrol"],
    ["Diario de control de incontinencia — " + subtitle],
    [""],
    ["Generado el", new Date().toLocaleString("es-ES", { dateStyle: "long", timeStyle: "short" })],
    ["Periodo", periodText],
    [""],
    ["Este documento es un registro personal de seguimiento."],
    ["No sustituye la valoración de un profesional sanitario."],
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 16 }, { wch: 46 }];
  return ws;
}

function exportAllExcel(data, dailyAgg) {
  const liquidRows = [...data.liquids]
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))

  const diaperRows = [...data.diapers]
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((p) => ({
      Fecha: p.date, Hora: p.time, "Peso total (g)": p.weight,
      "Peso seco (g)": p.dryWeight === "" || p.dryWeight === undefined ? "" : p.dryWeight,
      "Peso neto (g)": round1(netWeight(p.weight, p.dryWeight)), Nocturno: voidIsNight(p) ? "Sí" : "No", Nota: p.note || "",
    }));
  const summaryRows = dailyAgg.map((d) => ({
    Fecha: d.date, "Líquido total (ml)": round1(d.liquidTotal), "Tomas de líquido": d.liquidCount,
    "Peso neto pañales (g)": round1(d.diaperTotal), "Cambios de pañal": d.diaperCount, "Nota del día": d.dayNote || "", "Detalle de la nota": d.dayNoteDetail || "",
    Severidad: classifyLoss(d.diaperTotal)?.label || "",
    Micciones: d.voidCount, "Micciones nocturnas": d.nightVoids,
  }));
  const voidRows = [...(data.voids || [])].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((v) => ({ Fecha: v.date, Hora: v.time, Nocturna: voidIsNight(v) || v.isFirstMorning ? "Sí" : "No", Nota: v.note || "" }));
  const periodText = dailyAgg.length ? `${dailyAgg[0].date} — ${dailyAgg[dailyAgg.length - 1].date}` : "Sin registros todavía";
  const cover = buildCoverSheet("diario completo", periodText);
  downloadWorkbook(
    [["Portada", cover], ["Líquidos", liquidRows], ["Pañales", diaperRows], ["Micciones", voidRows], ["Resumen diario", summaryRows]],
    `incontrol-diario-${todayStr()}.xlsx`
  );
}

function exportRangeExcel(filtered, liquidStats, diaperStats, range) {

    Severidad: classifyLoss(d.diaperTotal)?.label || "",
  }));
  const cvOf = (s) => (s.mean > 0 ? round1((s.sd / s.mean) * 100) : 0);
  const statsRows = [
    { Métrica: "Líquido (ml/día)", Media: round1(liquidStats.mean), Mediana: round1(liquidStats.median), "Desv. típica": round1(liquidStats.sd), "Coef. variación (%)": cvOf(liquidStats), Máximo: round1(liquidStats.max), Mínimo: round1(liquidStats.min) },
    { Métrica: "Peso neto (g/día)", Media: round1(diaperStats.mean), Mediana: round1(diaperStats.median), "Desv. típica": round1(diaperStats.sd), "Coef. variación (%)": cvOf(diaperStats), Máximo: round1(diaperStats.max), Mínimo: round1(diaperStats.min) },
  ];
  const cover = buildCoverSheet("periodo seleccionado", `${range.start} — ${range.end}`);
  downloadWorkbook(
    [["Portada", cover], ["Serie diaria", rows], ["Estadísticas del periodo", statsRows]],
    `incontrol-periodo-${range.start}_a_${range.end}.xlsx`

}

// ---------- datos de demostración ----------
function generateDemoDataset() {
  const liquids = [], diapers = [], voids = [], dayNotes = {};
  const today = new Date();
  const patterns = [
    { l: [250, 300, 200, 250, 200, 150], p: [180, 140, 260], v: [{ t: "02:30" }, { t: "07:15", wake: true }, { t: "12:00" }, { t: "17:30" }], note: "" },
    { l: [250, 350, 250, 300, 250, 200], p: [220, 190, 340], v: [{ t: "03:10" }, { t: "07:20", wake: true }, { t: "13:15" }], note: "Caminata larga" },
    { l: [200, 250, 200, 200, 150], p: [140, 120, 210], v: [{ t: "04:00" }, { t: "07:10", wake: true }, { t: "11:45" }, { t: "16:20" }, { t: "20:10" }], note: "" },
    { l: [250, 300, 250, 200, 150], p: [150, 130, 220], v: [{ t: "02:45" }, { t: "07:30", wake: true }, { t: "12:30" }, { t: "18:00" }], note: "" },
    { l: [300, 350, 300, 250, 300], p: [260, 230, 410], v: [{ t: "01:50" }, { t: "04:40" }, { t: "07:25", wake: true }, { t: "14:00" }], note: "Café extra y cena tardía" },
    { l: [250, 250, 200, 200, 150], p: [130, 110, 190], v: [{ t: "03:30" }, { t: "07:15", wake: true }, { t: "11:30" }, { t: "16:45" }], note: "" },
    { l: [200, 250, 250, 200, 100], p: [120, 95, 175], v: [{ t: "03:50" }, { t: "07:20", wake: true }, { t: "12:10" }, { t: "17:15" }, { t: "21:00" }], note: "Buen descanso" },
  ];

  for (let i = 13; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const iso = toLocalIsoDate(d);
    const pat = patterns[(13 - i) % patterns.length];
    const lTimes = ["08:30", "11:00", "14:00", "17:00", "19:30", "21:15"];
    pat.l.forEach((amt, idx) => liquids.push({ id: uid(), date: iso, time: lTimes[idx] || "12:00", amount: amt, note: idx === 0 ? "Desayuno" : idx === 2 ? "Comida" : "" }));
    const pTimes = ["08:00", "16:30", "23:45"];
    pat.p.forEach((net, idx) => {
      const dry = idx === 2 ? 90 : 40;
      diapers.push({ id: uid(), date: iso, time: pTimes[idx], weight: net + dry, dryWeight: dry, note: idx === 2 ? "Nocturno" : "Día" });
    });
    pat.v.forEach((item) => voids.push({ id: uid(), date: iso, time: item.t, isFirstMorning: !!item.wake, note: item.wake ? "Al despertar" : "" }));
    if (pat.note) dayNotes[iso] = { title: pat.note, detail: "" };
  }

function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}
function stddev(arr) {
  if (arr.length < 2) return 0;
  const m = mean(arr);
  return Math.sqrt(arr.reduce((a, b) => a + (b - m) ** 2, 0) / (arr.length - 1));
}
function statsOf(arr) {
  if (!arr.length) return { mean: 0, median: 0, sd: 0, max: 0, min: 0, n: 0 };
  return { mean: mean(arr), median: median(arr), sd: stddev(arr), max: Math.max(...arr), min: Math.min(...arr), n: arr.length };
}
const round1 = (n) => Math.round(n * 10) / 10;

// ---------- comparativa por periodos ----------
function lgammaFn(x) {
  const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = x, tmp = x + 5.5;
  tmp -= (x + 0.5) * Math.log(tmp);
  let ser = 1.000000000190015;
  for (let j = 0; j < 6; j++) ser += c[j] / ++y;
  return -tmp + Math.log((2.5066282746310005 * ser) / x);
}
function betacfFn(a, b, x) {
  const MAXIT = 200, EPS = 3e-12, FPMIN = 1e-30;
  const qab = a + b, qap = a + 1, qam = a - 1;
  let c = 1, d = 1 - (qab * x) / qap;
  if (Math.abs(d) < FPMIN) d = FPMIN;
  d = 1 / d;
  let h = d;
  for (let m = 1; m <= MAXIT; m++) {
    const m2 = 2 * m;
    let aa = (m * (b - m) * x) / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d; h *= d * c;
    aa = (-(a + m) * (qab + m) * x) / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d;
    const del = d * c; h *= del;
    if (Math.abs(del - 1) < EPS) break;
  }
  return h;
}
function betaIncFn(x, a, b) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const bt = Math.exp(lgammaFn(a + b) - lgammaFn(a) - lgammaFn(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? (bt * betacfFn(a, b, x)) / a : 1 - (bt * betacfFn(b, a, 1 - x)) / b;
}
const tTwoSidedP = (t, df) => betaIncFn(df / (df + t * t), df / 2, 0.5);
const PERIOD_SOURCES = {
  loss: { label: "Pérdida (peso neto)", unit: "g/día", ok: (d) => d.diaperCount > 0, val: (d) => d.diaperTotal, lower: true },
  diapers: { label: "Pañales (cambios)", unit: "al día", ok: (d) => d.diaperCount > 0, val: (d) => d.diaperCount, lower: null },
  liquid: { label: "Líquido ingerido", unit: "ml/día", ok: (d) => d.liquidCount > 0, val: (d) => d.liquidTotal, lower: null },
  voids: { label: "Micciones (total)", unit: "al día", ok: (d) => d.voidsCovered, val: (d) => d.voidCount, lower: true },
  voidsDay: { label: "Micciones de día", unit: "al día", ok: (d) => d.dayCovered, val: (d) => d.dayVoids, lower: true },
  nocturia: { label: "Micciones de noche (nocturia)", unit: "por noche", ok: (d) => d.nightCovered, val: (d) => d.nightVoids, lower: true },
};
const PERIOD_MEASURES = {
  mean: { label: "Media", f: (v) => mean(v), test: "t" },
  median: { label: "Día típico (mediana)", f: (v) => median(v), test: null },
  max: { label: "Día más alto", f: (v) => Math.max(...v), test: null },
  min: { label: "Día más bajo", f: (v) => Math.min(...v), test: null },
  slope: { label: "Tendencia por día", f: (v, rows) => (v.length < 2 ? 0 : linreg(v, rows.map((r) => dayOffset(rows[0].date, r.date))).slope), test: null, slope: true },
};

// Divide el pasado en bloques de la misma duración que el periodo elegido (el actual primero)
function buildPeriodBlocks(dailyAgg, range, sourceKey, maxBlocks = 6) {
  const src = PERIOD_SOURCES[sourceKey];
  const n = Math.round((new Date(range.end + "T00:00:00") - new Date(range.start + "T00:00:00")) / 86400000) + 1;
  if (!(n >= 3) || !dailyAgg.length) return { n: n > 0 ? n : 0, blocks: [] };
  const firstDate = dailyAgg[0].date;
  const blocks = [];
  for (let i = 0; i < maxBlocks; i++) {
    const end = addDaysIso(range.end, -i * n), start = addDaysIso(range.start, -i * n);
    if (end < firstDate) break;
    const rows = dailyAgg.filter((d) => d.date >= start && d.date <= end && src.ok(d)).map((d) => ({ date: d.date, v: src.val(d) }));
    blocks.push({ i, start, end, rows, vals: rows.map((r) => r.v) });
  }
  return { n, blocks };
}

function measureValue(block, measureKey) {
  return block.vals.length ? PERIOD_MEASURES[measureKey].f(block.vals, block.rows) : null;
}

// Compara dos bloques: devuelve cambio %, prueba estadística si procede y veredicto
function compareBlocks(cur, prev, measureKey, sourceKey) {
  const m = PERIOD_MEASURES[measureKey], src = PERIOD_SOURCES[sourceKey];
  if (cur.vals.length < 3 || prev.vals.length < 3) return null;
  const a = m.f(cur.vals, cur.rows), b = m.f(prev.vals, prev.rows);
  const diff = a - b;
  const pct = !m.slope && b !== 0 ? (diff / Math.abs(b)) * 100 : null;
  const out = { a, b, diff, pct, p: null };
  const n1 = cur.vals.length, n2 = prev.vals.length;
  const s1 = stddev(cur.vals), s2 = stddev(prev.vals);
  if (m.test === "t" && (s1 > 0 || s2 > 0)) {
    const se = Math.sqrt((s1 * s1) / n1 + (s2 * s2) / n2);
    const t = diff / se;
    const df = (se ** 4) / (((s1 * s1) / n1) ** 2 / (n1 - 1) + ((s2 * s2) / n2) ** 2 / (n2 - 1));
    out.p = tTwoSidedP(t, df);
  }
  out.lower = src.lower;
  return out;
}

function periodBand(absPct) {
  return absPct < 5 ? "sin cambio apreciable" : absPct < 10 ? "cambio leve" : absPct < 20 ? "cambio moderado" : "cambio importante";
}

const SEVERITY_THRESHOLDS = { leve: 100, moderada: 300, severa: 600 };
function classifyLoss(gramsPerDay) {
  if (gramsPerDay === null || gramsPerDay === undefined || gramsPerDay <= 0) return null;
  if (gramsPerDay < SEVERITY_THRESHOLDS.leve) return { label: "Leve", color: "#0D9488", bg: "#CCFBF1" };
  if (gramsPerDay < SEVERITY_THRESHOLDS.moderada) return { label: "Moderada", color: "#D97706", bg: "#FEF3C7" };
  if (gramsPerDay < SEVERITY_THRESHOLDS.severa) return { label: "Severa", color: "#EA580C", bg: "#FFEDD5" };
  return { label: "Muy severa", color: "#DC2626", bg: "#FEE2E2" };
}
const netWeight = (weight, dryWeight) => Math.max(0, (Number(weight) || 0) - (Number(dryWeight) || 0));

// Clasificación orientativa de las micciones del día: hasta 8 de día y 1 de noche se considera normal
const VOID_DAY_MAX = 8, VOID_NIGHT_MAX = 1;
function classifyVoids(d) {
  if (!d || !d.voidCount) return null;
  const night = d.nightVoids || 0, day = d.voidCount - night;
  if (night >= 3) return { label: "Nocturia marcada", color: "#DC2626", bg: "#FEE2E2" };
  if (night > VOID_NIGHT_MAX) return { label: "Nocturia", color: "#EA580C", bg: "#FFEDD5" };
  if (day > VOID_DAY_MAX) return { label: "Frecuentes", color: "#D97706", bg: "#FEF3C7" };
  if (d.voidsCovered === false) return { label: "Anotación parcial", color: "#64748B", bg: "#F1F5F9" };
  return { label: "Normal", color: "#0D9488", bg: "#CCFBF1" };
}

// Días que conviene comentar con el médico (orientativo): pérdida muy severa o 3+ levantadas nocturnas
function dayFlags(d) {
  if (!d) return [];
  const f = [];
  if (d.diaperTotal > SEVERITY_THRESHOLDS.severa) f.push("pérdida muy severa");
  if (d.nightVoids >= 3) f.push(`${d.nightVoids} levantadas nocturnas`);
  return f;
}
const LIQUID_THRESHOLDS = { insuficiente: 1000, poco: 1500, mucho: 2500 };
const LIQUID_RECOMMENDED = LIQUID_THRESHOLDS.poco;
function classifyLiquid(mlPerDay) {
  if (mlPerDay === null || mlPerDay === undefined || mlPerDay <= 0) return null;
  if (mlPerDay < LIQUID_THRESHOLDS.insuficiente) return { label: "Insuficiente", color: "#DC2626", bg: "#FEE2E2" };
  if (mlPerDay < LIQUID_THRESHOLDS.poco) return { label: "Escasa", color: "#D97706", bg: "#FEF3C7" };
  if (mlPerDay <= LIQUID_THRESHOLDS.mucho) return { label: "Adecuada", color: "#0D9488", bg: "#CCFBF1" };
  return { label: "Elevada", color: "#D97706", bg: "#FEF3C7" };
}

// ---------- diario miccional ----------
// Horario de noche configurable (Ajustes → Noche). Se actualiza desde la app antes de calcular nada.
let NIGHT_START = "23:00", NIGHT_END = "07:00";
const isNightTime = (t) => {
  if (!t) return false;
  return NIGHT_START > NIGHT_END ? (t >= NIGHT_START || t < NIGHT_END) : (t >= NIGHT_START && t < NIGHT_END);
};
// Una micción puede reclasificarse a mano: period = "night" | "day" | (vacío = automático según la hora)
const voidIsNight = (v) => (v.period === "night" ? true : v.period === "day" ? false : isNightTime(v.time));
function summarizeDiary(days) {
  const sum = (arr, f) => arr.reduce((a, d) => a + f(d), 0);
  const withVoid = days.filter((d) => d.voidCount > 0);
  const nightDays = days.filter((d) => d.nightCovered), fullDays = days.filter((d) => d.voidsCovered);
  const totalVoids = sum(days, (d) => d.voidCount);
  return {
    nVoidDays: withVoid.length, nDiaryDays: withVoid.length, totalVoids,
    nNightDays: nightDays.length, nFullDays: fullDays.length,
    voidsPerDay: fullDays.length ? sum(fullDays, (d) => d.voidCount) / fullDays.length : null,
    nocturia: nightDays.length ? sum(nightDays, (d) => d.nightVoids) / nightDays.length : null,
  };
}

function diaryText(filtered) {
  const sm = summarizeDiary(filtered);
  const lines = [];
  if (sm.nDiaryDays > 0) {
    lines.push(`Diario miccional (${sm.nDiaryDays} días con micciones anotadas):`);
    if (sm.voidsPerDay !== null) lines.push(`- Micciones anotadas por día: media ${round1(sm.voidsPerDay)}.`);
    if (sm.nocturia !== null) lines.push(`- Nocturia (micciones entre ${NIGHT_START} y ${NIGHT_END}): media ${round1(sm.nocturia)} por noche.`);
  }
  return lines.join("\n");
}

const OLD_STORAGE_KEY = "diaper-tracker-entries-v1";
const STORAGE_KEY_LIQUIDS = "diaper-tracker-liquids-v1";
const STORAGE_KEY_DIAPERS = "diaper-tracker-diapers-v1";
const STORAGE_KEY_DAYNOTES = "diaper-tracker-daynotes-v1";
const STORAGE_KEY_SETTINGS = "diaper-tracker-settings-v1";
const STORAGE_KEY_LASTREPORT = "diaper-tracker-lastreport-v1";
const STORAGE_KEY_VOIDS = "diaper-tracker-voids-v1";
const STORAGE_KEY_LEAKS = "diaper-tracker-leaks-v1";
const storageAvailable = () => typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";

async function loadData() {
  if (!storageAvailable()) return { data: { liquids: [], diapers: [], dayNotes: {}, settings: {}, lastReport: null, voids: [], leaks: [] }, storageOk: false };
  const getKey = async (k) => { try { const r = await window.storage.get(k, false); return r && r.value ? JSON.parse(r.value) : null; } catch (e) { return null; } };
  let [voids, leaks, liquids, diapers, dayNotes, settings, lastReport] = await Promise.all([
    getKey(STORAGE_KEY_VOIDS), getKey(STORAGE_KEY_LEAKS), getKey(STORAGE_KEY_LIQUIDS),
    getKey(STORAGE_KEY_DIAPERS), getKey(STORAGE_KEY_DAYNOTES), getKey(STORAGE_KEY_SETTINGS), getKey(STORAGE_KEY_LASTREPORT)
  ]);
  if (liquids === null && diapers === null) {
    const parsed = await getKey(OLD_STORAGE_KEY);
    if (parsed) {
      liquids = parsed.liquids || []; diapers = parsed.diapers || [];
      await window.storage.set(STORAGE_KEY_LIQUIDS, JSON.stringify(liquids), false);
      await window.storage.set(STORAGE_KEY_DIAPERS, JSON.stringify(diapers), false);
    }
  }
  return { data: { liquids: liquids || [], diapers: diapers || [], dayNotes: dayNotes || {}, settings: settings || {}, lastReport: lastReport || null, voids: voids || [], leaks: leaks || [] }, storageOk: true };
}

async function saveData(data) {
  if (!storageAvailable()) return false;
  try {
    const results = await Promise.all([
      window.storage.set(STORAGE_KEY_LIQUIDS, JSON.stringify(data.liquids), false),
      window.storage.set(STORAGE_KEY_DIAPERS, JSON.stringify(data.diapers), false),
      window.storage.set(STORAGE_KEY_DAYNOTES, JSON.stringify(data.dayNotes || {}), false),
      window.storage.set(STORAGE_KEY_SETTINGS, JSON.stringify(data.settings || {}), false),
      window.storage.set(STORAGE_KEY_LASTREPORT, JSON.stringify(data.lastReport || null), false),
      window.storage.set(STORAGE_KEY_VOIDS, JSON.stringify(data.voids || []), false),
      window.storage.set(STORAGE_KEY_LEAKS, JSON.stringify(data.leaks || []), false),
    ]);
    return results.every(Boolean);
  } catch (e) {
    return false;
  }
}

    const target = dataRef.current.liquids.find((x) => x.id === id);
    setData((d) => ({ ...d, liquids: d.liquids.filter((x) => x.id !== id) }));
    if (target) notifyAction(`Eliminada ingesta de ${target.amount} ml`, () => setData((d) => ({ ...d, liquids: [...d.liquids, target] })));
  };
  const removeDiaper = (id) => {
    const target = dataRef.current.diapers.find((x) => x.id === id);
    setData((d) => ({ ...d, diapers: d.diapers.filter((x) => x.id !== id) }));
    if (target) notifyAction("Eliminado pesaje de pañal", () => setData((d) => ({ ...d, diapers: [...d.diapers, target] })));
  };
  const ENTRY_KEYS = { liquido: "liquids", panal: "diapers", miccion: "voids" };
  const updateEntry = (kind, id, patch) => setData((d) => {
    const key = ENTRY_KEYS[kind];
    if (!key) return d;
    return { ...d, [key]: (d[key] || []).map((x) => (x.id === id ? { ...x, ...patch } : x)) };
  });
  const restoreData = (incoming, mode) => setData((d) => {
    const arr = (v) => (Array.isArray(v) ? v.filter((x) => x && x.id && x.date) : []);
    const inc = {
      liquids: arr(incoming.liquids), diapers: arr(incoming.diapers), voids: arr(incoming.voids), leaks: arr(incoming.leaks),
      dayNotes: incoming.dayNotes && typeof incoming.dayNotes === "object" ? incoming.dayNotes : {},
      settings: incoming.settings && typeof incoming.settings === "object" ? incoming.settings : {},
    };
    if (mode === "replace") return { ...d, ...inc, lastReport: incoming.lastReport || null };
    const union = (a, b) => { const ids = new Set(a.map((x) => x.id)); return [...a, ...b.filter((x) => !ids.has(x.id))]; };
    return {
      ...d,
      liquids: union(d.liquids || [], inc.liquids), diapers: union(d.diapers || [], inc.diapers),
      voids: union(d.voids || [], inc.voids), leaks: union(d.leaks || [], inc.leaks),
      dayNotes: { ...inc.dayNotes, ...(d.dayNotes || {}) },
      settings: { ...inc.settings, ...(d.settings || {}) },
    };
  });
  const addVoid = (entry) => {
    const id = uid();
    setData((d) => ({ ...d, voids: [...(d.voids || []), { id, ...entry }] }));
    notifyAction("Micción anotada", () => setData((d) => ({ ...d, voids: (d.voids || []).filter((x) => x.id !== id) })));
  };
  const removeVoid = (id) => {
    const target = (dataRef.current.voids || []).find((x) => x.id === id);
    setData((d) => ({ ...d, voids: (d.voids || []).filter((x) => x.id !== id) }));
    if (target) notifyAction("Micción eliminada", () => setData((d) => ({ ...d, voids: [...(d.voids || []), target] })));
  };
  const setDayNote = (date, title, detail) => setData((d) => {
    const dayNotes = { ...(d.dayNotes || {}) };
    const t = (title || "").trim(), x = (detail || "").trim();
    if (t || x) dayNotes[date] = { title: t, detail: x }; else delete dayNotes[date];
    return { ...d, dayNotes };
  });
  const setCoverage = (date, key, value) => setData((d) => {
    const cov = { ...((d.settings && d.settings.coverage) || {}) };
    const cur = { ...(cov[date] || {}) };
    if (value) cur[key] = true; else delete cur[key];
    if (Object.keys(cur).length) cov[date] = cur; else delete cov[date];
    return { ...d, settings: { ...(d.settings || {}), coverage: cov } };
  });
  const setDefault = (key, value) => setData((d) => ({ ...d, settings: { ...(d.settings || {}), [key]: value } }));
  const setLastReport = (report) => setData((d) => ({ ...d, lastReport: report }));

  const loadDemoData = () => {
    const demo = generateDemoDataset();
    setData((d) => ({
      ...d, liquids: demo.liquids, diapers: demo.diapers, voids: demo.voids, dayNotes: demo.dayNotes,
      settings: { ...(d.settings || {}), ...demo.settings },
    }));
    notifyAction("Cargados 14 días de ejemplo", () => setData((d) => ({ ...d, liquids: [], diapers: [], voids: [], leaks: [], dayNotes: {} })));
  };

  const dailyAgg = useMemo(() => {
    const map = {};
    const ensure = (date) => {
      map[date] = map[date] || { date, liquidTotal: 0, liquidCount: 0, diaperTotal: 0, diaperCount: 0, diaperWeights: [], liquidNotes: [], diaperNotes: [], dayNote: "", voidCount: 0, nightVoids: 0 };
      return map[date];
    };
    for (const l of data.liquids) {
      const row = ensure(dayOf(l));
      row.liquidTotal += Number(l.amount) || 0; row.liquidCount += 1;
      if (l.note) row.liquidNotes.push(l.note);
    }
    for (const p of data.diapers) {
      const row = ensure(dayOf(p));
      const net = netWeight(p.weight, p.dryWeight);
      row.diaperTotal += net; row.diaperCount += 1; row.diaperWeights.push(net);
      if (p.note) row.diaperNotes.push(p.note);
    }
    for (const v of (data.voids || [])) {
      const row = ensure(dayOf(v));
      row.voidCount += 1;
      const night = voidIsNight(v);
      if (night) row.nightVoids += 1;
    }
    for (const [date, v] of Object.entries(data.dayNotes || {})) {
      const n = noteParts(v);
      const row = ensure(date);
      row.dayNote = n.title; row.dayNoteDetail = n.detail;
    }
    const out = Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
    const cov = (data.settings && data.settings.coverage) || {};
    out.forEach((r) => {
      const c = cov[r.date] || {};
      r.dayVoids = r.voidCount - r.nightVoids;
      r.covDay = !!c.day; r.covNight = !!c.night;
      r.dayCovered = r.dayVoids > 0 || r.covDay;        // hay anotaciones de día (o se marcó "todas anotadas")
      r.nightCovered = r.nightVoids > 0 || r.covNight;  // hay anotaciones de noche (o se marcó "todas anotadas")
      r.voidsCovered = r.dayCovered && r.nightCovered;
    });
    return out;
  }, [data]);

  const allDates = dailyAgg.map((d) => d.date);
  const minDate = allDates[0] || todayStr();
  const maxDate = allDates[allDates.length - 1] || todayStr();

  const streak = useMemo(() => {
    if (!allDates.length) return 0;
    const dateSet = new Set(allDates);
    let count = 0;
    const cursor = new Date(logicalToday() + "T00:00:00");
    if (!dateSet.has(logicalToday())) cursor.setDate(cursor.getDate() - 1);
    while (dateSet.has(toLocalIsoDate(cursor))) { count++; cursor.setDate(cursor.getDate() - 1); }
    return count;
  }, [allDates]);

  const lastDryWeight = useMemo(() => {
    if (!data.diapers.length) return "";
    const sorted = [...data.diapers].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    return sorted[sorted.length - 1].dryWeight ?? "";
  }, [data.diapers]);

  if (!ready) {
    return (
      <div style={{ minHeight: "100vh", background: COLORS.paper, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, fontFamily: "'Plus Jakarta Sans', sans-serif", color: COLORS.inkSoft }}>
        <LogoMark size={52} />
        <div style={{ fontSize: 14, fontWeight: 600 }}>Cargando Incontrol…</div>
      </div>
    );
  }

  return (
    <ThemeContext.Provider value={COLORS}>
      <div style={{ minHeight: "100vh", background: COLORS.paper, fontFamily: "'Plus Jakarta Sans', ui-sans-serif, sans-serif", color: COLORS.ink, transition: "background 250ms ease, color 250ms ease" }}>
        <style>{`
          * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
          .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
          input[type="date"], input[type="time"], input[type="number"], input[type="text"], input[type="password"], select, textarea {
            font-family: 'Plus Jakarta Sans', sans-serif;
            border: 1.5px solid transparent;
            background: ${COLORS.inputBg};
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 600;
            color: ${COLORS.ink};
            outline: none;
            transition: all 160ms ease;
          }
          input[type="number"], input[type="date"], input[type="time"] { font-family: 'JetBrains Mono', monospace; }
          input:focus, select:focus, textarea:focus {
            background: ${COLORS.card};
            border-color: ${COLORS.teal};
            box-shadow: 0 0 0 4px ${COLORS.tealSoft};
          }
          button { cursor: pointer; font-family: inherit; transition: transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1), background 160ms ease, opacity 160ms ease; }
          button:active { transform: scale(0.96); }
          @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
          @keyframes sheetUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
          body { zoom: ${fontZoom}; }
          .tab-view { animation: fadeSlideUp 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
          .bottom-sheet { animation: sheetUp 280ms cubic-bezier(0.16, 1, 0.3, 1); }
        `}</style>

        {dueReminder && (
          <div className="no-print" role="alert" style={{ position: "fixed", top: 14, left: 14, right: 14, zIndex: 55, maxWidth: 480, margin: "0 auto", background: COLORS.card, borderRadius: 20, padding: "14px 16px", display: "flex", alignItems: "center", gap: 12, boxShadow: COLORS.shadowLg }}>
            <div style={{ width: 42, height: 42, borderRadius: 14, background: COLORS.tealSoft, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <Bell size={20} color={COLORS.teal} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 800, fontSize: 14.5 }}>Hora de beber ({dueReminder})</div>
              <div style={{ fontSize: 12.5, color: COLORS.inkSoft }}>Anota tu toma cuando la realices.</div>
            </div>
            <button onClick={() => { setTab("registro"); setDueReminder(null); window.dispatchEvent(new CustomEvent("incontrol-goto", { detail: "liquido" })); }} style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 12, padding: "9px 14px", fontSize: 13, fontWeight: 700 }}>Anotar</button>
            <button onClick={() => setDueReminder(null)} aria-label="Cerrar" style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 4 }}><X size={18} /></button>
          </div>
        )}

        <Header
          daysCount={dailyAgg.length}
          streak={streak}
          saveStatus={saveStatus}
          onRetry={flushSave}
          isDark={isDark}
          onToggleDark={() => setDefault("darkMode", !isDark)}
          onOpenSettings={() => setShowSettingsModal(true)}
        />

        {toast && (
          <div className="no-print" role="status" style={{ position: "fixed", bottom: 88, left: 16, right: 16, zIndex: 50, maxWidth: 420, margin: "0 auto", background: "#0F172A", color: "#F8FAFC", borderRadius: 18, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, boxShadow: COLORS.shadowLg, animation: "fadeSlideUp 200ms ease-out" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <CheckCircle2 size={17} color="#2DD4BF" />
              <span style={{ fontSize: 13.5, fontWeight: 600 }}>{toast.label}</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {toast.undoFn && (
                <button
                  onClick={() => { toast.undoFn(); setToast(null); }}
                  style={{ display: "flex", alignItems: "center", gap: 4, background: "rgba(255,255,255,0.14)", color: "#fff", border: "none", borderRadius: 10, padding: "6px 11px", fontSize: 12, fontWeight: 700 }}
                >
                  <Undo2 size={13} /> Deshacer
                </button>
              )}
              <button onClick={() => setToast(null)} aria-label="Cerrar" style={{ background: "none", border: "none", color: "#94A3B8", padding: 2, display: "flex" }}>
                <X size={16} />
              </button>
            </div>
          </div>
        )}

        {showSettingsModal && (
          <SettingsModal
            onClose={() => setShowSettingsModal(false)}
            settings={data.settings || {}}
            setDefault={setDefault}
            data={data}
            onRestore={restoreData}
            onLoadDemo={loadDemoData}
          />
        )}

        <main style={{ maxWidth: 680, margin: "0 auto", padding: "12px 18px 112px" }}>
          <div key={tab} className="tab-view">
            {tab === "registro" && (
              <RegistroTab
                data={data}
                addLiquid={addLiquid}
                addDiaper={addDiaper}
                removeLiquid={removeLiquid}
                removeDiaper={removeDiaper}
                updateEntry={updateEntry}
                lastDryWeight={lastDryWeight}
                dailyAgg={dailyAgg}
                setDayNote={setDayNote}
                setCoverage={setCoverage}
                addVoid={addVoid} removeVoid={removeVoid}
                settings={data.settings || {}}
                setDefault={setDefault}
                onLoadDemo={loadDemoData}
              />
            )}
            {tab === "evolucion" && (
              <EvolutionTab dailyAgg={dailyAgg} minDate={minDate} maxDate={maxDate} settings={data.settings || {}} setDefault={setDefault} setCoverage={setCoverage} />
            )}
            {tab === "informe" && (
              <InformeTab events={eventsOf(data.settings)} dailyAgg={dailyAgg} minDate={minDate} maxDate={maxDate} lastReport={data.lastReport} setLastReport={setLastReport} />
            )}
          </div>
        </main>

        <BottomNav tab={tab} setTab={setTab} />
      </div>
    </ThemeContext.Provider>
  );
}

            <div style={{ fontSize: 12, color: COLORS.inkSoft, fontWeight: 500, marginTop: 1 }}>

        {streak >= 2 && (
          <div title="Racha de días seguidos" style={{ display: "flex", alignItems: "center", gap: 4, background: COLORS.amberSoft, color: COLORS.amber, fontSize: 12.5, fontWeight: 800, padding: "7px 11px", borderRadius: 99 }}>
            <Flame size={14} strokeWidth={2.5} />

          </div>

        <button

            display: "flex", alignItems: "center", justifyContent: "center",

          {isDark ? <Sun size={17} /> : <Moon size={17} />}

            display: "flex", alignItems: "center", justifyContent: "center",

            boxShadow: COLORS.shadowSm,
          }}
        >
          <Settings size={17} />
        </button>
      </div>
    </header>
  );
}

// ---------- tarjeta resumen HOY ----------
function TodayCard({ todayAgg, lastAgg, onOpenAction, onLoadDemo, settings, goalDays }) {
  const COLORS = useTheme();
  const hasToday = todayAgg && (todayAgg.liquidCount > 0 || todayAgg.diaperCount > 0 || todayAgg.voidCount > 0);
  const d = hasToday ? todayAgg : lastAgg;
  const past = !hasToday && !!d;
  const card = { background: COLORS.card, borderRadius: 22, padding: 16, boxShadow: COLORS.shadowSm, marginBottom: 14 };
  if (!d) {
    return (
      <div style={card}>
        <div style={{ fontSize: 17, fontWeight: 800, marginBottom: 4, letterSpacing: "-0.02em" }}>Empieza tu seguimiento</div>
        <div style={{ fontSize: 13, color: COLORS.inkSoft, lineHeight: 1.5, marginBottom: onLoadDemo ? 12 : 0 }}>Anota líquidos, el peso de los pañales o las micciones en segundos con los botones de abajo.</div>
        {onLoadDemo && <button onClick={onLoadDemo} style={{ display: "inline-flex", alignItems: "center", gap: 7, background: COLORS.inputBg, color: COLORS.ink, border: "none", borderRadius: 14, padding: "10px 14px", fontSize: 13, fontWeight: 700 }}><Database size={15} /> Ver ejemplo (14 días)</button>}
      </div>
    );
  }
  const loss = classifyLoss(d.diaperTotal), hyd = classifyLiquid(d.liquidTotal), vc = classifyVoids(d);
  const flags = dayFlags(d);
  const dayV = d.dayVoids || 0, nightV = d.nightVoids || 0;
  const vSt = !d.dayCovered ? null : dayV > VOID_DAY_MAX ? { label: "Frecuentes", color: "#D97706" } : { label: "Normal", color: COLORS.teal };
  const nSt = nightV >= 3 ? { label: "Nocturia marcada", color: "#DC2626" } : nightV > VOID_NIGHT_MAX ? { label: "Nocturia", color: "#EA580C" } : { label: "Normal", color: COLORS.teal };
  const tiles = [
    { id: "loss", label: "Pérdida", Icon: Scale, color: COLORS.amber, bg: COLORS.amberSoft, has: d.diaperCount > 0, value: fmtEs(round1(d.diaperTotal), 0), unit: "g", num: d.diaperTotal, ref: SEVERITY_THRESHOLDS.moderada, max: true, ru: "g", st: loss, sub: `${d.diaperCount} ${d.diaperCount === 1 ? "pañal" : "pañales"}` },
    { id: "liquid", label: "Líquido", Icon: Droplets, color: "#0EA5E9", bg: COLORS.blueSoft, has: d.liquidCount > 0, value: fmtEs(round1(d.liquidTotal), 0), unit: "ml", num: d.liquidTotal, ref: LIQUID_RECOMMENDED, max: false, ru: "ml", st: hyd, sub: "" },
    { id: "voids", label: "Micciones", Icon: ToiletIcon, color: COLORS.teal, bg: COLORS.tealSoft, has: d.dayCovered, value: String(dayV), unit: dayV === 1 ? "vez de día" : "veces de día", num: dayV, ref: VOID_DAY_MAX, max: true, ru: "", st: vSt, sub: "" },
    { id: "night", label: "Nocturia", Icon: Moon, color: COLORS.purple, bg: COLORS.purpleSoft || COLORS.inputBg, has: d.nightCovered, value: String(nightV), unit: nightV === 1 ? "levantada" : "levantadas", num: nightV, ref: VOID_NIGHT_MAX, max: true, ru: "", st: nSt, sub: "" },
  ];
  const goalFor = (key) => {
    const g = goalDefs(COLORS).find((x) => x.key === key);
    const val = settings && settings[key];
    if (!g || val === undefined || val === "" || val === null || Number.isNaN(Number(val))) return null;
    return { g, val, ok: g.pool(d) ? g.test(d, Number(val)) : null };
  };
  const goalOf = { loss: goalFor("goalLoss"), liquid: goalFor("goalLiquid"), night: goalFor("goalNocturia") };
  return (
    <div style={{ ...card, padding: "12px 12px 12px", marginBottom: 10 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8 }}>
        <div style={{ fontSize: 12.5, fontWeight: 800, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{past ? `Último registro · ${fmtDateShort(d.date)}` : "Hoy"}</div>
        <div style={{ fontSize: 11, fontWeight: 600, color: COLORS.inkSoft, whiteSpace: "nowrap" }}>Círculo lleno = referencia</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 8 }}>
        {tiles.map((t) => {
          const gl = goalOf[t.id];
          const R = 22, CIRC = 2 * Math.PI * R;
          const ref = gl ? Number(gl.val) : t.ref;
          const over = t.has && (t.max ? t.num > ref : false);
          const gap = !t.has ? null : t.max ? (t.num > ref ? { ok: false, txt: `${fmtEs(round1(t.num - ref), t.ru ? 0 : 0)}${t.ru ? " " + t.ru : ""} por encima` } : { ok: true, txt: "dentro del límite" }) : (t.num < ref ? { ok: false, txt: `faltan ${fmtEs(round1(ref - t.num), 0)} ${t.ru}` } : { ok: true, txt: "alcanzado" });
          const pct = t.has ? Math.min(100, ref > 0 ? (t.num / ref) * 100 : (t.num > 0 ? 100 : 0)) : 0;
          const ringColor = over ? "#DC2626" : t.color;
          return (
            <div key={t.id} style={{ background: t.bg, borderRadius: 16, padding: "10px 11px", minWidth: 0, opacity: t.has ? 1 : 0.6 }}>
              <div style={{ fontSize: 11.5, fontWeight: 800, color: t.color }}>{t.label}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 9, marginTop: 6 }}>
                <div style={{ position: "relative", width: 54, height: 54, flexShrink: 0 }}>
                  <svg width="54" height="54" viewBox="0 0 54 54" style={{ transform: "rotate(-90deg)" }}>
                    <circle cx="27" cy="27" r={R} fill="none" stroke="rgba(100,116,139,0.2)" strokeWidth="6" />
                    <circle cx="27" cy="27" r={R} fill="none" stroke={ringColor} strokeWidth="6" strokeLinecap="round" strokeDasharray={`${(CIRC * pct) / 100} ${CIRC}`} />
                  </svg>
                  <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}><t.Icon size={18} color={t.color} strokeWidth={2.3} /></div>
                </div>
                <div style={{ minWidth: 0 }}>
                  <div className="num" style={{ fontSize: 22, fontWeight: 800, lineHeight: 1.05, color: COLORS.ink, whiteSpace: "nowrap" }}>{t.has ? t.value : "—"}</div>
                  <div style={{ fontSize: 11, fontWeight: 600, color: COLORS.inkSoft, lineHeight: 1.2, whiteSpace: "nowrap" }}>{t.has ? t.unit : "sin anotar"}</div>
                </div>
              </div>
              <div style={{ fontSize: 11, fontWeight: 700, marginTop: 7, lineHeight: 1.3, color: COLORS.inkSoft }}>
                {gl ? "Objetivo" : "Referencia"} {t.max ? "≤" : "≥"} {fmtEs(ref, 0)}{t.ru ? " " + t.ru : ""}
              </div>
              {t.has && gap && (
                <div style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11.5, fontWeight: 800, marginTop: 3, color: gap.ok ? COLORS.teal : "#DC2626" }}>
                  {gap.ok ? <Check size={12} /> : <X size={12} />} {gap.txt}
                </div>
              )}
              {t.has && t.st && <div style={{ fontSize: 11, fontWeight: 700, marginTop: 2, color: t.st.color }}>{t.st.label}{t.sub ? <span style={{ color: COLORS.inkSoft, fontWeight: 600 }}> · {t.sub}</span> : null}</div>}
            </div>
          );
        })}
      </div>
      {flags.length > 0 && (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8, fontSize: 11.5, fontWeight: 700, color: COLORS.rose, background: COLORS.roseSoft, borderRadius: 10, padding: "6px 9px", lineHeight: 1.3 }}>
          <AlertTriangle size={13} style={{ flexShrink: 0 }} /> Comentar con el médico: {flags.join(" · ")}
        </div>
      )}
    </div>
  );
}

// Taza de váter (SVG propio con el mismo trazo que lucide)

      <path d="M7 3h10v5H7z" />
      <path d="M4 11h16" />

function Notice({ icon: Icon, tone = "amber", onClick, onClose, children }) {

// ---------- Bottom Sheet modal para formularios ----------
function ActionBottomSheet({ activeAction, onClose, children }) {
  const COLORS = useTheme();
  useEffect(() => {
    if (!activeAction) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [activeAction, onClose]);

  if (!activeAction) return null;

  const titles = {
    panal: "Registrar pesaje de pañal",
    liquido: "Registrar ingesta de líquido",
    miccion: "Registrar micción",
    nota: "Nota del día",
  };

  return (
    <div
      role="dialog"
      aria-modal="true"
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, zIndex: 60,
        background: "rgba(15, 23, 42, 0.55)", backdropFilter: "blur(4px)",
        display: "flex", alignItems: "flex-end", justifyContent: "center",
      }}
    >
      <div
        className="bottom-sheet"
        onClick={(e) => e.stopPropagation()}
        style={{
          width: "100%", maxWidth: 640, maxHeight: "90vh", overflowY: "auto",
          background: COLORS.card, borderTopLeftRadius: 28, borderTopRightRadius: 28,
          padding: "12px 20px calc(24px + env(safe-area-inset-bottom, 0px))",
          boxShadow: COLORS.shadowLg,
        }}
      >
        <div style={{ width: 40, height: 4, borderRadius: 99, background: COLORS.line, margin: "0 auto 14px" }} />
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
          <div style={{ fontSize: 18, fontWeight: 800, letterSpacing: "-0.02em" }}>{titles[activeAction]}</div>
          <button onClick={onClose} aria-label="Cerrar" style={{ width: 34, height: 34, borderRadius: 99, border: "none", background: COLORS.inputBg, color: COLORS.inkSoft, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <X size={18} />
          </button>
        </div>

        {typeof children === "function" ? children("nota") : children}
      </div>
    </div>
  );
}

// ---------- Tab: registro ----------
function RegistroTab({ data, addLiquid, addDiaper, removeLiquid, removeDiaper, lastDryWeight, dailyAgg, setDayNote, setCoverage, addVoid, removeVoid, updateEntry, settings, setDefault, onLoadDemo }) {
  const COLORS = useTheme();
  const [activeSheet, setActiveSheet] = useState(null);
  const [editing, setEditing] = useState(null);
  const [noteDate, setNoteDate] = useState(null);   // día cuya nota se está editando
  const [historyFilter, setHistoryFilter] = useState("todos");
  const [visibleDays, setVisibleDays] = useState(10);
  const [view, setView] = useState("cronologia");
  const [openDays, setOpenDays] = useState({}); // por defecto solo está desplegado el último día
  useEffect(() => { setVisibleDays(10); }, [historyFilter]);
  const totalEntries = data.liquids.length + data.diapers.length + (data.voids || []).length;
  const lastBackup = settings?.lastBackup;
  const backupAge = lastBackup ? Math.floor((new Date(todayStr() + "T00:00:00") - new Date(lastBackup + "T00:00:00")) / 86400000) : null;
  const needsBackup = totalEntries >= 10 && (backupAge === null || backupAge > 14);

  useEffect(() => {
    const h = (e) => setActiveSheet(e.detail);
    window.addEventListener("incontrol-goto", h);
    return () => window.removeEventListener("incontrol-goto", h);
  }, []);

  const unifiedTimeline = useMemo(() => {
    const all = [
      ...data.liquids.map((l) => ({ ...l, kind: "liquido" })),
      ...data.diapers.map((p) => ({ ...p, kind: "panal" })),
      ...(data.voids || []).map((v) => ({ ...v, kind: "miccion" })),
    ];
    const filtered = historyFilter === "todos" ? all : all.filter((it) => it.kind === historyFilter);
    filtered.sort((a, b) => ((b.date || "") + (b.time || "")).localeCompare((a.date || "") + (a.time || "")));
    const byDay = {};
    for (const it of filtered) {
      const dk = dayOf(it);
      byDay[dk] = byDay[dk] || [];
      byDay[dk].push(it);
    }
    return Object.entries(byDay).sort((a, b) => b[0].localeCompare(a[0]));
  }, [data, historyFilter]);

  const dayAggMap = useMemo(() => Object.fromEntries(dailyAgg.map((d) => [d.date, d])), [dailyAgg]);
  const todayAgg = dayAggMap[logicalToday()];
  const lastAgg = dailyAgg.length ? dailyAgg[dailyAgg.length - 1] : null;

  const lastD = dailyAgg.length ? dailyAgg[dailyAgg.length - 1].date : todayStr();
  const goalDays = dailyAgg.filter((d) => d.date > addDaysIso(lastD, -30) && d.date <= lastD);
  const goalPrev = dailyAgg.filter((d) => d.date > addDaysIso(lastD, -60) && d.date <= addDaysIso(lastD, -30));
  const VIEWS = [["cronologia", "Cronología", BookOpen], ["calendario", "Calendario", CalendarDays], ["objetivos", "Objetivos", Target]];

  return (
    <div>
      <TodayCard todayAgg={todayAgg} lastAgg={lastAgg} onOpenAction={setActiveSheet} onLoadDemo={dailyAgg.length === 0 ? onLoadDemo : null} settings={settings || {}} goalDays={goalDays} />

      <QuickActionGrid
        onSelect={setActiveSheet}
        lastLiquid={[...data.liquids].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time))[0]}
        onRepeat={() => {
          const last = [...data.liquids].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time))[0];
          if (!last) return;
          addLiquid({ amount: last.amount, date: todayStr(), time: nowTimeStr(), note: "" });
          setHistoryFilter("liquido");
        }}
      />

      {needsBackup && (
        <Notice icon={Download} onClick={() => window.dispatchEvent(new CustomEvent("incontrol-open-settings"))}>
          {backupAge === null ? "Aún no tienes copia de seguridad." : `Hace ${backupAge} días de tu última copia.`} Toca para hacerla.
        </Notice>
      )}
      <div className="no-print" style={{ display: "flex", gap: 4, background: COLORS.card, padding: 4, borderRadius: 99, boxShadow: COLORS.shadowSm, marginBottom: 10 }}>
        {VIEWS.map(([id, label, Ic]) => {
          const active = view === id;
          return (
            <button key={id} onClick={() => setView(id)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 5, padding: "7px 6px", borderRadius: 99, border: "none", fontSize: 12, fontWeight: 800, background: active ? COLORS.teal : "transparent", color: active ? "#fff" : COLORS.inkSoft }}>
              <Ic size={14} /> {label}
            </button>
          );
        })}
      </div>

      <ActionBottomSheet activeAction={activeSheet} onClose={() => { setActiveSheet(null); setNoteDate(null); }}>
        {(extraTab) => (
          <>
            {activeSheet === "liquido" && (
              <LiquidForm
                onAdd={(e) => { addLiquid(e); setHistoryFilter("liquido"); setActiveSheet(null); }}
                defaultAmount={settings?.defaultLiquidAmount}
                onSetDefault={(v) => setDefault("defaultLiquidAmount", v)}
              />
            )}
            {activeSheet === "panal" && (
              <DiaperForm
                onAdd={(e) => { addDiaper(e); setHistoryFilter("panal"); setActiveSheet(null); }}
                lastDryWeight={lastDryWeight}
                settings={settings}
                setDefault={setDefault}
              />
            )}
            {activeSheet === "miccion" && (
              <VoidForm onAdd={(e) => { addVoid(e); setHistoryFilter("miccion"); setActiveSheet(null); }} />
            )}
            {activeSheet === "nota" && (
              <DayNoteForm
                key={noteDate || "hoy"}
                initialDate={noteDate}
                dayNotes={data.dayNotes || {}}
                setDayNote={(d, t, x) => { setDayNote(d, t, x); setNoteDate(null); setActiveSheet(null); }}
              />
            )}
          </>
        )}
      </ActionBottomSheet>

      {editing && (
        <EditEntryDialog
          kind={editing.kind}
          entry={editing.entry}
          onClose={() => setEditing(null)}
          onSave={(patch) => { updateEntry(editing.kind, editing.entry.id, patch); setEditing(null); }}
        />
      )}

      {view === "calendario" && <CalendarCard dailyAgg={dailyAgg} maxDate={lastD} setCoverage={setCoverage} events={eventsOf(settings)} setDefault={setDefault} />}
      {view === "objetivos" && <GoalsCard days={goalDays} prevDays={goalPrev} settings={settings || {}} setDefault={setDefault} />}

      {view === "cronologia" && (
      <div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
          {[
            { id: "todos", label: "Todo", Icon: BookOpen },
            { id: "panal", label: "Pañales", Icon: Scale },
            { id: "liquido", label: "Líquidos", Icon: Droplets },
            { id: "miccion", label: "Micciones", Icon: ToiletIcon },
          ].map((f) => {
            const active = historyFilter === f.id;
            return (
              <button key={f.id} onClick={() => setHistoryFilter(f.id)} style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "6px 12px", borderRadius: 99, fontSize: 12, fontWeight: 700, border: "none", whiteSpace: "nowrap", background: active ? COLORS.ink : COLORS.card, color: active ? COLORS.card : COLORS.inkSoft, boxShadow: COLORS.shadowSm }}>
                <f.Icon size={13} /> {f.label}
              </button>
            );
          })}
        </div>

        {unifiedTimeline.length === 0 && <EmptyState icon={BookOpen} text="Aún no hay registros en esta vista." />}

        {unifiedTimeline.slice(0, visibleDays).map(([date, items], dayIdx) => {
          const dayAgg = dayAggMap[date];
          const severity = classifyLoss(dayAgg?.diaperTotal);
          const hydration = classifyLiquid(dayAgg?.liquidTotal);
          const flags = dayFlags(dayAgg);
          const isOpen = !!openDays[date];
          const showKind = (k) => historyFilter === "todos" || historyFilter === k;
          const toggle = () => setOpenDays((o) => ({ ...o, [date]: !isOpen }));
          const stats = [
            showKind("panal") && dayAgg?.diaperCount > 0 && { Icon: Scale, color: severity ? severity.color : COLORS.amber, text: `${fmtEs(round1(dayAgg.diaperTotal), 0)} g` },
            showKind("liquido") && dayAgg?.liquidCount > 0 && { Icon: Droplets, color: hydration ? hydration.color : "#0EA5E9", text: `${fmtEs(round1(dayAgg.liquidTotal), 0)} ml` },
            showKind("miccion") && dayAgg?.voidCount > 0 && { Icon: ToiletIcon, color: COLORS.purple, text: `${dayAgg.voidCount}${dayAgg.nightVoids ? ` (${dayAgg.nightVoids} de noche)` : ""}` },
          ].filter(Boolean);
          return (
            <div key={date} style={{ background: COLORS.card, borderRadius: 22, boxShadow: COLORS.shadowSm, marginBottom: 8, overflow: "hidden" }}>
              <div role="button" tabIndex={0} aria-expanded={isOpen} onClick={toggle}
                onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } }}
                style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", cursor: "pointer" }}>
                <ChevronRight size={16} color={COLORS.inkSoft} style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 150ms", flexShrink: 0 }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 14, fontWeight: 800 }}>
                    {date === logicalToday() ? "Hoy" : fmtDateFull(date)}
                    {flags.length > 0 && <AlertTriangle size={13} color={COLORS.rose} aria-label="Día a comentar" />}
                  </div>
                  {stats.length > 0 && (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: "3px 14px", marginTop: 4 }}>
                      {stats.map((x, i) => (
                        <span key={i} className="num" style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 12.5, fontWeight: 800, color: x.color }}><x.Icon size={12} strokeWidth={2.4} /> {x.text}</span>
                      ))}
                    </div>
                  )}
                  {!isOpen && dayAgg?.dayNote && <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>“{dayAgg.dayNote}”</div>}
                </div>
              </div>

              {isOpen && (
                <div style={{ borderTop: `1px solid ${COLORS.line}` }}>
                  {flags.length > 0 && (
                    <div style={{ display: "flex", alignItems: "center", gap: 7, margin: "10px 14px 0", fontSize: 12, fontWeight: 700, color: COLORS.rose, background: COLORS.roseSoft, borderRadius: 12, padding: "7px 10px" }}>
                      <AlertTriangle size={13} style={{ flexShrink: 0 }} /> Comentar con el médico: {flags.join(" · ")}
                    </div>
                  )}
                  <CoverageToggles date={date} d={dayAgg} setCoverage={setCoverage} pad="10px 14px 4px" />
                  <div style={{ padding: "4px 14px 8px" }}>
                    {dayAgg?.dayNote ? (
                      <div style={{ background: COLORS.tealSoft, color: COLORS.teal, borderRadius: 14, padding: "8px 12px", fontSize: 12.5, fontWeight: 700, display: "flex", alignItems: "center", gap: 8 }}>
                        <MessageSquare size={14} style={{ flexShrink: 0 }} />
                        <span style={{ flex: 1, minWidth: 0 }}>{dayAgg.dayNote}{dayAgg.dayNoteDetail ? ` — ${dayAgg.dayNoteDetail}` : ""}</span>
                        <button onClick={() => { setNoteDate(date); setActiveSheet("nota"); }} aria-label="Editar nota del día" style={{ border: "none", background: COLORS.card, color: COLORS.teal, borderRadius: 99, padding: "4px 10px", fontSize: 11.5, fontWeight: 800 }}>Editar</button>
                      </div>
                    ) : (
                      <button onClick={() => { setNoteDate(date); setActiveSheet("nota"); }} style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "transparent", color: COLORS.inkSoft, border: `1px dashed ${COLORS.line}`, borderRadius: 99, padding: "5px 12px", fontSize: 12, fontWeight: 700 }}>
                        <MessageSquare size={13} /> Añadir nota
                      </button>
                    )}
                  </div>
                  {items.map((it) => {
                    const isNight = it.kind === "miccion" || it.kind === "panal" ? voidIsNight(it) : isNightTime(it.time);
                    const badgeMap = {
                      liquido: { icon: Droplets, color: "#0EA5E9", bg: COLORS.blueSoft },
                      panal: { icon: Scale, color: COLORS.amber, bg: COLORS.amberSoft },
                      miccion: { icon: ToiletIcon, color: COLORS.purple, bg: COLORS.purpleSoft || COLORS.inputBg },
                    };
                    const B = badgeMap[it.kind];
                    const IconComp = B.icon;
                    const removeAction = () => {
                      if (it.kind === "liquido") removeLiquid(it.id);
                      else if (it.kind === "panal") removeDiaper(it.id);
                      else if (it.kind === "miccion") removeVoid(it.id);
                    };
                    return (
                      <div key={it.id} style={{ display: "flex", alignItems: "center", gap: 11, padding: "10px 6px 10px 14px", borderTop: `1px solid ${COLORS.line}` }}>
                        <div style={{ width: 34, height: 34, borderRadius: 11, background: B.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                          <IconComp size={16} color={B.color} strokeWidth={2.2} />
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 13.5, fontWeight: 700, color: COLORS.ink, lineHeight: 1.25 }}>
                            {it.kind === "liquido" && <>Ingesta · <span className="num" style={{ color: B.color }}>{it.amount} ml</span></>}
                            {it.kind === "panal" && <>Pañal · <span className="num" style={{ color: B.color }}>{round1(netWeight(it.weight, it.dryWeight))} g</span>{isNight ? <Moon size={12} style={{ marginLeft: 6, verticalAlign: "-1px" }} color={COLORS.inkSoft} /> : null}</>}
                            {it.kind === "miccion" && <>{it.isFirstMorning ? "1.ª micción al despertar" : isNight ? "Micción nocturna" : "Micción"}{isNight && !it.isFirstMorning ? <Moon size={12} style={{ marginLeft: 6, verticalAlign: "-1px" }} color={COLORS.inkSoft} /> : null}</>}
                          </div>
                          <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 1 }}>
                            <span className="num">{it.time}</span>
                            {it.kind === "panal" && <span className="num"> · {it.weight} g − {it.dryWeight || 0} g tara</span>}
                            {it.note ? ` · ${it.note}` : ""}
                          </div>
                        </div>
                        <button onClick={() => setEditing({ kind: it.kind, entry: it })} style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 9 }} aria-label="Editar"><Pencil size={15} /></button>
                        <button onClick={removeAction} style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 9 }} aria-label="Eliminar"><Trash2 size={15} /></button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}

        {unifiedTimeline.length > visibleDays && (
          <button onClick={() => setVisibleDays((n) => n + 10)} className="no-print" style={{ width: "100%", background: COLORS.card, color: COLORS.teal, border: "none", borderRadius: 18, padding: "13px", fontSize: 13.5, fontWeight: 700, boxShadow: COLORS.shadowSm }}>
            Ver más días ({unifiedTimeline.length - visibleDays} restantes)
          </button>
        )}
        {dailyAgg.length > 0 && (
          <button onClick={() => exportAllExcel(data, dailyAgg)} className="no-print" style={{ display: "flex", alignItems: "center", gap: 6, margin: "14px auto 0", background: "transparent", border: "none", color: COLORS.inkSoft, fontSize: 12, fontWeight: 700 }}>
            <FileSpreadsheet size={14} /> Exportar todo a Excel
          </button>
        )}
      </div>
      )}
    </div>
  );
}

// ---------- formularios limpios dentro del Bottom Sheet ----------
function LiquidForm({ onAdd, defaultAmount, onSetDefault }) {
  const COLORS = useTheme();
  const [amount, setAmount] = useState(defaultAmount || "");
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState(nowTimeStr());
  const [note, setNote] = useState("");

  const submit = (overrideAmount) => {
    const a = Number(overrideAmount ?? amount);
    if (!a || a <= 0) return;
    onAdd({ amount: a, date, time, note: note.trim() });
  };

  const isCurrentDefault = defaultAmount !== undefined && defaultAmount !== "" && Number(defaultAmount) === Number(amount);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div>
        <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.inkSoft, marginBottom: 8 }}>Registro instantáneo en 1 toque</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8 }}>
          {[...new Set([...(defaultAmount ? [Number(defaultAmount)] : []), 100, 150, 200, 250, 330])].slice(0, 5).map((ml) => (
            <button
              key={ml}
              onClick={() => submit(ml)}
              className="num"
              style={{
                background: COLORS.tealSoft, color: COLORS.teal, border: "none",
                borderRadius: 14, padding: "12px 4px", fontSize: 13.5, fontWeight: 800,
              }}
            >
              +{ml}
            </button>
          ))}
        </div>
      </div>

function DiaperForm({ onAdd, lastDryWeight, settings, setDefault }) {
  const COLORS = useTheme();
  const dayDry = settings?.defaultDryWeight ?? (lastDryWeight !== "" ? lastDryWeight : "");
  const nightDry = settings?.nightDryWeight ?? dayDry;

  const [profile, setProfile] = useState(() => (isNightTime(nowTimeStr()) ? "night" : "day"));
  const [weight, setWeight] = useState("");
  const [dryWeight, setDryWeight] = useState(() => (isNightTime(nowTimeStr()) ? nightDry : dayDry));
  const [date, setDate] = useState(todayStr());
  const [time, setTime] = useState(nowTimeStr());
  const [note, setNote] = useState("");
  const [period, setPeriod] = useState("");

  const selectProfile = (p) => {
    setProfile(p);
    setDryWeight(p === "night" ? nightDry : dayDry);
  };

  const saveProfileTara = () => {
    const w = Number(dryWeight);
    if (!(w >= 0)) return;
    if (profile === "night") setDefault("nightDryWeight", w);
    else setDefault("defaultDryWeight", w);
  };

  const submit = () => {
    const w = Number(weight);
    if (!w || w <= 0) return;
    onAdd({
      weight: w, dryWeight: dryWeight === "" ? "" : Number(dryWeight), date, time,
      note: note.trim() || (profile === "night" ? "Nocturno" : ""), ...(period ? { period } : {}),
    });
  };

  const net = weight !== "" ? netWeight(weight, dryWeight) : null;
  const savedTara = profile === "night" ? nightDry : dayDry;
  const isSaved = savedTara !== "" && Number(savedTara) === Number(dryWeight);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 120px), 1fr))", gap: 8, background: COLORS.inputBg, padding: 5, borderRadius: 16 }}>
        <button
          onClick={() => selectProfile("day")}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            padding: "10px", borderRadius: 12, border: "none", fontSize: 13, fontWeight: 700,
            background: profile === "day" ? COLORS.card : "transparent",
            color: profile === "day" ? COLORS.amber : COLORS.inkSoft,
            boxShadow: profile === "day" ? COLORS.shadowSm : "none",
          }}
        >
          <Sun size={15} /><span style={{ whiteSpace: "nowrap" }}>Día (<span className="num">{dayDry === "" ? "sin fijar" : `${dayDry} g`}</span>)</span>
        </button>
        <button
          onClick={() => selectProfile("night")}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            padding: "10px", borderRadius: 12, border: "none", fontSize: 13, fontWeight: 700,
            background: profile === "night" ? COLORS.card : "transparent",
            color: profile === "night" ? COLORS.amber : COLORS.inkSoft,
            boxShadow: profile === "night" ? COLORS.shadowSm : "none",
          }}
        >
          <Moon size={15} /><span style={{ whiteSpace: "nowrap" }}>Noche (<span className="num">{nightDry === "" ? "sin fijar" : `${nightDry} g`}</span>)</span>
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 130px), 1fr))", gap: 12 }}>
        <Field label="Peso usado (g)">
          <input type="number" min="0" step="5" value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="240" autoFocus style={{ width: "100%" }} />
        </Field>
        <Field label="Tara seco (g)">
          <input type="number" min="0" step="5" value={dryWeight} onChange={(e) => setDryWeight(e.target.value)} style={{ width: "100%" }} />
        </Field>
      </div>

      {net !== null && (
        <div style={{ background: COLORS.amberSoft, color: COLORS.amber, borderRadius: 16, padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: 13.5, fontWeight: 700 }}>Pérdida neta calculada</span>
          <span className="num" style={{ fontSize: 20, fontWeight: 800 }}>{round1(net)} g</span>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 155px), 1fr))", gap: 12 }}>
        <Field label="Fecha"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ width: "100%" }} /></Field>
        <Field label="Hora"><input type="time" value={time} onChange={(e) => setTime(e.target.value)} style={{ width: "100%" }} /></Field>
      </div>

      <PeriodPicker value={period} onChange={setPeriod} time={time} />

      <Field label="Nota (opcional)">
        <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Cambio, fuga lateral…" style={{ width: "100%" }} />
      </Field>

      <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
        <button
          onClick={saveProfileTara}
          style={{
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
            background: isSaved ? COLORS.amberSoft : COLORS.inputBg,
            color: isSaved ? COLORS.amber : COLORS.inkSoft,
            border: "none", borderRadius: 14, padding: "13px 14px", fontSize: 13, fontWeight: 700,
          }}
        >
          <Pin size={15} /> {isSaved ? "Tara fija" : "Fijar tara"}
        </button>
        <button
          onClick={submit}
          style={{
            flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            background: COLORS.amber, color: "#fff", border: "none",
            borderRadius: 14, padding: "14px", fontWeight: 800, fontSize: 15,
          }}
        >
          <Plus size={18} /> Guardar pesaje
        </button>
      </div>
    </div>
  );
}

function PeriodPicker({ value, onChange, time }) {
  const COLORS = useTheme();
  const auto = isNightTime(time) ? "noche" : "día";
  const opts = [
    { id: "", label: "Automática", hint: `según la hora (${auto})` },
    { id: "night", label: "Noche", hint: "cuenta como nocturna" },
    { id: "day", label: "Día", hint: "cuenta como diurna" },
  ];
  const cur = opts.find((o) => o.id === (value || "")) || opts[0];
  return (
    <div>
      <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.inkSoft, marginBottom: 6 }}>Cuenta como</div>
      <div style={{ display: "flex", gap: 4, background: COLORS.inputBg, padding: 4, borderRadius: 14 }}>
        {opts.map((o) => {
          const active = o.id === (value || "");

              style={{ flex: 1, padding: "9px 6px", borderRadius: 10, border: "none", fontSize: 12.5, fontWeight: 700, background: active ? COLORS.blue : "transparent", color: active ? "#fff" : COLORS.inkSoft }}>

  );
}

// ---------- modal de edición ----------
function EditEntryDialog({ kind, entry, onSave, onClose }) {
  const COLORS = useTheme();
  const [f, setF] = useState({ ...entry });
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const titles = { liquido: "Editar ingesta", panal: "Editar pesaje", miccion: "Editar micción" };
  const [err, setErr] = useState("");
  const save = () => {
    const patch = { date: f.date, time: f.time };
    if (!f.date || !f.time) { setErr("Indica fecha y hora."); return; }
    if (kind === "liquido") {
      const a = Number(f.amount); if (!(a > 0)) { setErr("La cantidad debe ser mayor que 0."); return; }
      patch.amount = a; patch.note = (f.note || "").trim();
    } else if (kind === "panal") {
      const w = Number(f.weight); if (!(w > 0)) { setErr("El peso debe ser mayor que 0."); return; }
      patch.weight = w; patch.dryWeight = f.dryWeight === "" || f.dryWeight === undefined ? "" : Number(f.dryWeight); patch.note = (f.note || "").trim(); patch.period = f.period || "";
    } else if (kind === "miccion") {
      patch.note = (f.note || "").trim(); patch.period = f.period || "";
    }
    onSave(patch);
  };
  return (
    <div role="dialog" aria-modal="true" style={{ position: "fixed", inset: 0, background: "rgba(15, 23, 42, 0.55)", backdropFilter: "blur(4px)", zIndex: 65, display: "flex", alignItems: "center", justifyContent: "center", padding: 18 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: COLORS.card, borderRadius: 24, padding: 24, width: "100%", maxWidth: 420, boxShadow: COLORS.shadowLg }}>
        <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 16 }}>{titles[kind]}</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 130px), 1fr))", gap: 12 }}>
          {kind === "liquido" && <Field label="Cantidad (ml)"><input type="number" min="0" step="10" value={f.amount ?? ""} onChange={(e) => set("amount", e.target.value)} style={{ width: "100%" }} /></Field>}
          {kind === "panal" && <>
            <Field label="Peso total (g)"><input type="number" min="0" value={f.weight ?? ""} onChange={(e) => set("weight", e.target.value)} style={{ width: "100%" }} /></Field>
            <Field label="Tara seco (g)"><input type="number" min="0" value={f.dryWeight ?? ""} onChange={(e) => set("dryWeight", e.target.value)} style={{ width: "100%" }} /></Field>
          </>}
          <Field label="Fecha"><input type="date" value={f.date || ""} onChange={(e) => set("date", e.target.value)} style={{ width: "100%" }} /></Field>
          <Field label="Hora"><input type="time" value={f.time || ""} onChange={(e) => set("time", e.target.value)} style={{ width: "100%" }} /></Field>
        </div>
        {(kind === "miccion" || kind === "panal") && <div style={{ marginTop: 12 }}><PeriodPicker value={f.period} onChange={(v) => set("period", v)} time={f.time} /></div>}
        <div style={{ marginTop: 12 }}>
          <Field label="Nota"><input type="text" value={f.note || ""} onChange={(e) => set("note", e.target.value)} style={{ width: "100%" }} /></Field>
        </div>
        {err && <div style={{ color: COLORS.rose, fontSize: 12.5, marginTop: 10, fontWeight: 600 }}>{err}</div>}
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 20 }}>
          <button onClick={onClose} style={{ background: COLORS.inputBg, color: COLORS.inkSoft, border: "none", borderRadius: 12, padding: "11px 16px", fontWeight: 700, fontSize: 13.5 }}>Cancelar</button>
          <button onClick={save} style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 12, padding: "11px 20px", fontWeight: 700, fontSize: 13.5 }}>Guardar</button>
        </div>
      </div>
    </div>
  );
}
