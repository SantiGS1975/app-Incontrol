  );
}

function InformeTab({ events, dailyAgg, minDate, maxDate, lastReport, setLastReport }) {
  const [printMode, setPrintMode] = useState(false);
  const THEME = useTheme();
  const COLORS = printMode ? LIGHT_COLORS : THEME;
  const [preset, setPreset] = useState(lastReport?.preset || "14");
  const [loading, setLoading] = useState(false);
  const [report, setReport] = useState(lastReport?.report || "");
  const [error, setError] = useState("");
  const [apiKey, setApiKey] = useState(() => localStorage.getItem(GEMINI_KEY_STORAGE) || "");
  const [showKeyField, setShowKeyField] = useState(false);
  const [conversation, setConversation] = useState(lastReport?.conversation || []);
  const [followUpText, setFollowUpText] = useState("");
  const [askLoading, setAskLoading] = useState(false);
  const [askError, setAskError] = useState("");
  const lastPromptRef = useRef(lastReport?.prompt || "");
  const printRef = useRef(null);

  const saveApiKey = (value) => {
    setApiKey(value);
    if (value) localStorage.setItem(GEMINI_KEY_STORAGE, value);
    else localStorage.removeItem(GEMINI_KEY_STORAGE);
  };

  const range = useMemo(() => {
    if (preset === "all") return { start: minDate, end: maxDate };
    const days = Number(preset);
    const end = new Date(maxDate + "T00:00:00");
    const start = new Date(end);
    start.setDate(start.getDate() - (days - 1));
    return { start: toLocalIsoDate(start), end: maxDate };
  }, [preset, minDate, maxDate]);

  const filtered = useMemo(
    () => dailyAgg.filter((d) => d.date >= range.start && d.date <= range.end),
    [dailyAgg, range]
  );

  const liquidStats = statsOf(filtered.map((d) => d.liquidTotal));
  const diaperStats = statsOf(filtered.map((d) => d.diaperTotal));
  const changeStats = statsOf(filtered.map((d) => d.diaperCount));

  const generate = useCallback(async () => {
    if (filtered.length === 0) { setError("No hay datos en el periodo seleccionado."); return; }
    if (!apiKey) {
      setError("Configura tu clave de API de Gemini para generar el informe.");
      setShowKeyField(true);
      return;
    }
    setLoading(true); setError(""); setReport(""); setConversation([]); setAskError("");

    const seriesText = filtered
      .map((d) => `${d.date}: líquido ${round1(d.liquidTotal)} ml, peso neto pañales ${round1(d.diaperTotal)} g, cambios ${d.diaperCount}${d.voidCount ? `, micciones ${d.voidCount} (nocturnas ${d.nightVoids})` : ""}${d.dayNote ? `, nota: "${d.dayNote}"` : ""}${d.dayNoteDetail ? ` (detalle: ${d.dayNoteDetail})` : ""}`)
      .join("\n");

    // evolución: pendiente, primera mitad frente a segunda y días extremos
    const withLoss = filtered.filter((d) => d.diaperCount > 0);
    let evolutionText = "No hay suficientes días con pañales pesados para valorar la evolución.";
    if (withLoss.length >= 4) {
      const vals = withLoss.map((d) => d.diaperTotal);
      const xs = withLoss.map((d) => dayOffset(withLoss[0].date, d.date));
      const { slope, r2 } = linreg(vals, xs);
      const half = Math.floor(vals.length / 2);
      const m1 = mean(vals.slice(0, half)), m2 = mean(vals.slice(vals.length - half));
      const sorted = [...withLoss].sort((a, b) => b.diaperTotal - a.diaperTotal);
      const fmtDay = (d) => `${d.date} (${round1(d.diaperTotal)} g${d.dayNote ? `, nota: ${d.dayNote}` : ""})`;
      evolutionText = `Pendiente de la pérdida: ${slope > 0 ? "+" : ""}${round1(slope)} g por día (R² ${round1(r2 * 100) / 100}). Media de la primera mitad del periodo: ${round1(m1)} g/día; de la segunda mitad: ${round1(m2)} g/día. Días con más pérdida: ${sorted.slice(0, 3).map(fmtDay).join("; ")}. Días con menos pérdida: ${sorted.slice(-3).reverse().map(fmtDay).join("; ")}.`;
    }
    const coverage = `${filtered.length} días con algún registro dentro del periodo (${withLoss.length} con pañales pesados, ${filtered.filter((d) => d.liquidCount > 0).length} con líquidos anotados, ${filtered.filter((d) => d.voidCount > 0).length} con micciones).`;

    const diaryBlock = diaryText(filtered);

    // comparativa por bloques de la misma duración que el periodo elegido
    let periodsText = "No hay un periodo anterior de la misma duración con datos para comparar.";
    {
      const pb = buildPeriodBlocks(dailyAgg, range, "loss");
      const ok = pb.blocks.filter((b) => b.vals.length >= 3);
      if (ok.length >= 2) {
        const desc = ok.map((b) => `${b.start} a ${b.end}: media ${round1(mean(b.vals))} g/día, mediana ${round1(median(b.vals))}, desviación típica ${round1(stddev(b.vals))}, ${b.vals.length} días`).join(" | ");
        const c = compareBlocks(pb.blocks[0], pb.blocks[1], "mean", "loss");
        const ct = c && pb.blocks[0].vals.length >= 3 && pb.blocks[1].vals.length >= 3
          ? ` Cambio de la media frente al periodo anterior: ${c.pct !== null ? `${c.pct > 0 ? "+" : ""}${round1(c.pct)} %` : "sin porcentaje"}${c.p !== null ? `, p = ${round1(c.p * 1000) / 1000} (${c.p < 0.05 ? "significativo" : "no significativo"})` : ""}.`
          : "";
        periodsText = `bloques de ${pb.n} días, del más reciente al más antiguo (pérdida diaria): ${desc}.${ct}`;
      }
    }
    // evolución por meses naturales de TODO el historial (últimos 6)
    let monthsText = "No hay suficientes meses con datos para comparar.";
    {
      const byMonth = {};
      dailyAgg.forEach((d) => { const k = d.date.slice(0, 7); (byMonth[k] = byMonth[k] || []).push(d); });
      const keys = Object.keys(byMonth).sort().slice(-6);
      const MES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
      const rowsM = keys.map((k) => {
        const ds = byMonth[k];
        const loss = ds.filter((d) => d.diaperCount > 0).map((d) => d.diaperTotal);
        const liq = ds.filter((d) => d.liquidCount > 0).map((d) => d.liquidTotal);
        const noc = ds.filter((d) => d.nightCovered).map((d) => d.nightVoids);
        const sl = loss.length >= 4 ? linreg(ds.filter((d) => d.diaperCount > 0).map((d) => d.diaperTotal), ds.filter((d) => d.diaperCount > 0).map((d) => dayOffset(ds[0].date, d.date))).slope : null;
        const name = `${MES[Number(k.slice(5, 7)) - 1]} ${k.slice(0, 4)}${k === maxDate.slice(0, 7) ? " (mes en curso, datos hasta el " + maxDate + ")" : ""}`;
        return { name, loss, text: `${name}: ${loss.length ? `pérdida media ${round1(mean(loss))} g/día (mediana ${round1(median(loss))}, desv. típica ${round1(stddev(loss))}, ${loss.length} días${sl !== null ? `, pendiente ${sl > 0 ? "+" : ""}${round1(sl)} g/día cada día` : ""})` : "sin pañales pesados"}; ${liq.length ? `líquido medio ${round1(mean(liq))} ml/día` : "sin líquidos"}${noc.length ? `; ${round1(mean(noc))} levantadas nocturnas por noche` : ""}` };
      });
      if (rowsM.length >= 2) {
        const ch = rowsM.slice(1).map((r, i) => {
          const a = rowsM[i];
          return a.loss.length && r.loss.length && mean(a.loss) ? `${a.name.split(" (")[0]} → ${r.name.split(" (")[0]}: ${((mean(r.loss) - mean(a.loss)) / mean(a.loss) * 100 > 0 ? "+" : "")}${round1((mean(r.loss) - mean(a.loss)) / mean(a.loss) * 100)} %` : null;
        }).filter(Boolean);
        monthsText = rowsM.map((r) => "- " + r.text).join("\n") + (ch.length ? `\nVariación mensual de la pérdida media: ${ch.join("; ")}.` : "");
      }
    }
    const prompt = `Eres un equipo multidisciplinar SIMULADO, de nivel de excelencia, que revisa el diario de una persona con incontinencia urinaria. El equipo lo forman cuatro profesionales:
- Urología (incontinencia y vejiga)
- Oncología (efectos de tratamientos oncológicos sobre la vejiga y señales de alarma)
- Medicina física y rehabilitación
- Fisioterapia de suelo pélvico
Es una SIMULACIÓN educativa generada por IA: no son médicos reales ni una consulta médica.

CÓMO DEBES ESCRIBIR
- Habla a la persona de tú, con lenguaje claro y cercano, sin tecnicismos. Si necesitas un término médico, explícalo entre paréntesis en pocas palabras (por ejemplo: nocturia, es decir, levantarse a orinar de noche).
- Sé concreto: cita cifras y fechas de los datos. No inventes datos ni supongas lo que no aparece. Si faltan datos para opinar, dilo y explica qué convendría anotar.
- No diagnostiques ni prescribas fármacos ni dosis. No recomiendes restringir líquidos de forma estricta; aconseja repartir la ingesta a lo largo del día y comentar con su médico las cantidades.
- Oncología: no des por hecho que la persona tiene cáncer. Interviene solo si las notas del diario mencionan tratamientos como radioterapia, cirugía o quimioterapia; si no, limítate a las señales de alarma generales.
- Tono empático, prudente y alentador, sin alarmar.
- Formato: usa títulos con "## ", listas con "- " y negrita con **texto**. Extensión orientativa: entre 600 y 900 palabras.

ESTRUCTURA DEL INFORME
## En pocas palabras
Tres o cuatro frases con lo esencial de la situación.
## Qué muestran tus datos
Líquidos, pérdidas (según el peso neto de los pañales), micciones (número de día y de noche). Relaciona lo que bebe con lo que pierde.
## Cómo ha ido evolucionando
Primero la evolución dentro del periodo elegido (si mejora, empeora o está estable, con cifras; días más altos y más bajos y lo que pudo influir según las notas). Después, la evolución POR MESES de todo el historial: comenta mes a mes los últimos meses (pérdida, líquido, noches), di si la tendencia es de mejora, empeoramiento o estabilidad y qué pudo influir según las notas. Si el mes en curso está incompleto, adviértelo y no lo compares como si estuviera entero. Explica la tendencia con palabras sencillas (por ejemplo «cada mes pierdes algo menos que el anterior»), no solo con porcentajes.
## Qué opina cada especialista
- **Urología:** ...
- **Oncología:** ...
- **Rehabilitación:** ...
- **Fisioterapia:** ...
(Dos o tres frases útiles de cada uno, sin repetirse.)
## Consejos prácticos
Entre 5 y 8 consejos concretos y realizables: reparto de líquidos, bebidas que irritan la vejiga, hábitos al ir al baño, ejercicios de suelo pélvico en términos generales, estreñimiento, cuidado de la piel, anotaciones que convendría añadir al diario.
## Cuándo consultar sin esperar
Señales de alarma: sangre en la orina, fiebre o dolor al orinar, imposibilidad de orinar, aumento brusco de las pérdidas, entre otras.
## Preguntas para llevar a tu consulta
Tres o cuatro preguntas concretas basadas en estos datos.
## Nota final
Recuerda en una frase que es una simulación educativa generada por IA y que no sustituye a su equipo médico.

DATOS
Periodo: ${range.start} a ${range.end}. Cobertura: ${coverage}

Estadísticas del periodo:
- Líquido diario: media ${round1(liquidStats.mean)} ml, mediana ${round1(liquidStats.median)} ml, máximo ${round1(liquidStats.max)} ml, mínimo ${round1(liquidStats.min)} ml.
- Peso neto diario de pañales (pérdida): media ${round1(diaperStats.mean)} g, mediana ${round1(diaperStats.median)} g, máximo ${round1(diaperStats.max)} g, mínimo ${round1(diaperStats.min)} g.
- Cambios de pañal al día: media ${round1(changeStats.mean)}.
- Clasificación orientativa de la pérdida media: ${(classifyLoss(diaperStats.mean) || {}).label || "sin datos"}. Referencia de ingesta: unos ${LIQUID_RECOMMENDED} ml al día.

Evolución: ${evolutionText}

Comparativa entre periodos: ${periodsText}

${DAY_START !== "00:00" ? `Nota importante: cada «día» de los datos va desde las ${DAY_START} hasta las ${DAY_START} del día siguiente (no es el día natural), así que la noche pertenece al día que acaba de terminar.\n\n` : ""}Evolución por meses (todo el historial, últimos meses):
${monthsText}

Serie diaria:
${seriesText}
${diaryBlock ? `\n${diaryBlock}\n` : ""}`;

    lastPromptRef.current = prompt;

    try {
      const text = await callGeminiWithFallback(apiKey, [{ role: "user", parts: [{ text: prompt }] }]);
      setReport(text);
      setLastReport({ report: text, conversation: [], prompt, preset, range, generatedAt: Date.now() });
    } catch (e) {
      setError(e && e.message === "Failed to fetch" ? "Error de conexión con Gemini." : `Error: ${e.message}`);
    } finally {
      setLoading(false);
    }
  }, [filtered, range, liquidStats, diaperStats, changeStats, apiKey, preset, setLastReport, dailyAgg]);

  const askFollowUp = useCallback(async () => {
    const q = followUpText.trim();
    if (!q) return;
    if (!apiKey) { setAskError("Falta la clave de API de Gemini. Introdúcela arriba, en «Clave de Gemini»."); setShowKeyField(true); return; }
    setAskLoading(true); setAskError("");
    try {
      // Un único mensaje con todo el contexto: funciona con cualquier modelo y también con informes guardados de versiones anteriores
      const ctx = lastPromptRef.current || (lastReport && lastReport.prompt) || "";
      const previous = conversation.map((qa, i) => `Pregunta ${i + 1}: ${qa.question}\nRespuesta ${i + 1}: ${qa.answer}`).join("\n\n");
      const text = `${ctx ? `CONTEXTO (datos y petición originales):\n${ctx}\n\n` : ""}INFORME QUE YA SE ENTREGÓ:\n${report || "(no disponible)"}\n\n${previous ? `CONVERSACIÓN PREVIA:\n${previous}\n\n` : ""}NUEVA PREGUNTA DE LA PERSONA: ${q}\n\nResponde como el mismo equipo (urología, oncología, rehabilitación y fisioterapia), con lenguaje sencillo y sin tecnicismos, de forma breve y prudente, sin diagnosticar ni recetar. Indica qué especialista responde cuando sea relevante. Responde solo a la nueva pregunta.`;
      const answer = await callGeminiWithFallback(apiKey, [{ role: "user", parts: [{ text }] }]);
      const nextConversation = [...conversation, { question: q, answer }];
      setConversation(nextConversation);
      setFollowUpText("");
      setLastReport({ ...(lastReport || {}), report, prompt: ctx, preset, range, conversation: nextConversation, generatedAt: (lastReport && lastReport.generatedAt) || Date.now() });
    } catch (e) {
      setAskError(e && e.message === "Failed to fetch" ? "No hay conexión con Gemini. Revisa tu conexión e inténtalo de nuevo." : `No se pudo responder: ${e.message}`);
    } finally {
      setAskLoading(false);
    }
  }, [followUpText, apiKey, report, conversation, lastReport, setLastReport, preset, range]);

  if (dailyAgg.length === 0) {
    return <EmptyState icon={FileText} text="Registra datos en el diario antes de generar un informe." />;
  }

  return (
    <div>
      <ConsultCard dailyAgg={dailyAgg} maxDate={maxDate} events={events || []} />
      <div style={{ ...cardBox(COLORS), marginBottom: 18 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, gap: 8 }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 17, letterSpacing: "-0.02em" }}>Informe del equipo clínico</div>
            <div style={{ fontSize: 12.5, color: COLORS.inkSoft }}>Periodo: {fmtDateLabel(range.start)} — {fmtDateLabel(range.end)}</div>
          </div>
          <button
            onClick={() => setShowKeyField((s) => !s)}
            style={{
              display: "flex", alignItems: "center", gap: 5,
              padding: "8px 12px", borderRadius: 99, border: "none",
              background: apiKey ? COLORS.tealSoft : COLORS.inputBg,
              color: apiKey ? COLORS.teal : COLORS.inkSoft,
              fontSize: 12, fontWeight: 700,
            }}
          >
            <KeyRound size={13} /> {apiKey ? "API lista" : "Clave API"}
          </button>
        </div>

        <div style={{ fontSize: 12, color: COLORS.inkSoft, lineHeight: 1.45, marginBottom: 14 }}>
          Una IA revisa tus datos con la mirada de varias especialidades y te los explica sin tecnicismos. Es información educativa: no sustituye a tu médico.
        </div>

        {showKeyField && (
          <div style={{ marginBottom: 16, padding: 14, borderRadius: 16, background: COLORS.inputBg }}>
            <Field label="Clave de API de Google Gemini">
              <input type="password" value={apiKey} onChange={(e) => saveApiKey(e.target.value)} placeholder="AIzaSy..." style={{ width: "100%", background: COLORS.card }} />
            </Field>
            <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 8 }}>
              Se guarda solo en tu dispositivo. Obtén una gratis en <span className="num">aistudio.google.com/apikey</span>.
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
          {PRESETS.map((p) => (
            <button
              key={p.id}
              onClick={() => setPreset(p.id)}
              style={{
                padding: "7px 14px", borderRadius: 99, fontSize: 12.5, fontWeight: 700, border: "none",
                background: preset === p.id ? COLORS.teal : COLORS.inputBg,
                color: preset === p.id ? "#fff" : COLORS.inkSoft,
              }}
            >
              {p.label}
            </button>
          ))}
        </div>

        <button
          onClick={generate}
          disabled={loading}
          style={{
            width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            background: COLORS.teal, color: "#fff", border: "none",
            borderRadius: 16, padding: "14px", fontWeight: 800, fontSize: 14.5,
            opacity: loading ? 0.7 : 1,
          }}
        >
          {loading ? <Loader2 size={17} style={{ animation: "spin 1s linear infinite" }} /> : <Sparkles size={17} />}
          {loading ? "El equipo está revisando tus registros…" : "Generar informe del equipo"}
        </button>
        <style>{`@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }`}</style>
      </div>

      {error && (
        <div style={{ display: "flex", gap: 8, alignItems: "center", background: COLORS.roseSoft, color: COLORS.rose, borderRadius: 16, padding: "12px 16px", marginBottom: 16, fontSize: 13, fontWeight: 600 }}>
          <AlertCircle size={17} /> {error}
        </div>
      )}

      {report && (
        <ThemeContext.Provider value={printMode ? LIGHT_COLORS : COLORS}>
        <div ref={printRef} style={{ background: printMode ? LIGHT_COLORS.paper : "transparent" }}>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }} className="no-print">
            <button onClick={() => { setPrintMode(true); setTimeout(() => { printElement(printRef, "Incontrol · Informe clínico"); setPrintMode(false); }, 250); }} style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.card, color: COLORS.ink, border: "none", borderRadius: 99, padding: "8px 14px", fontSize: 12.5, fontWeight: 700, boxShadow: COLORS.shadowSm }}>
              <Printer size={14} color={COLORS.teal} /> Exportar PDF
            </button>
          </div>
          <div style={{ background: COLORS.card, borderRadius: 24, padding: 22, boxShadow: COLORS.shadowSm }}>
            <RichText text={report} />
            <div style={{ marginTop: 16, paddingTop: 12, borderTop: `1px solid ${COLORS.line}`, fontSize: 11.5, color: COLORS.inkSoft, lineHeight: 1.5 }}>
              Informe generado con IA. Es información educativa y no sustituye la valoración de un profesional sanitario.
            </div>
          </div>

          {conversation.length > 0 && (
            <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
              {conversation.map((qa, i) => (
                <div key={i} style={{ background: COLORS.card, borderRadius: 20, padding: 18, boxShadow: COLORS.shadowSm }}>
                  <div style={{ fontSize: 13.5, fontWeight: 800, color: COLORS.teal, marginBottom: 8 }}>{qa.question}</div>
                  <RichText text={qa.answer} size={14} />
                </div>
              ))}
            </div>
          )}

          <div className="no-print" style={{ marginTop: 16, background: COLORS.card, borderRadius: 20, padding: 14, boxShadow: COLORS.shadowSm }}>
            {askError && <div style={{ color: COLORS.rose, fontSize: 12.5, marginBottom: 8, fontWeight: 600 }}>{askError}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <input type="text" value={followUpText} onChange={(e) => setFollowUpText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !askLoading) askFollowUp(); }} placeholder="Pregunta algo sobre tu informe…" style={{ flex: 1 }} disabled={askLoading} />
              <button onClick={askFollowUp} disabled={askLoading || !followUpText.trim()} style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 14, padding: "0 18px", fontWeight: 700, fontSize: 13.5, opacity: askLoading || !followUpText.trim() ? 0.5 : 1 }}>
                {askLoading ? "…" : "Enviar"}
              </button>
            </div>
          </div>
        </div>
        </ThemeContext.Provider>
      )}
    </div>
  );
}

function App() {
  return (
    <ErrorBoundary>
      <IncontrolApp />
    </ErrorBoundary>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
