        <div style={{ fontWeight: 800, fontSize: 18, marginBottom: 16 }}>{titles[kind]}</div>
        <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 12 }}>
          {kind === "liquido" && <Field label="Cantidad (ml)"><input type="number" min="0" step="10" value={f.amount ?? ""} onChange={(e) => set("amount", e.target.value)} style={{ width: "100%" }} /></Field>}
          {kind === "panal" && <>
            <Field label="Peso total (g)"><input type="number" min="0" value={f.weight ?? ""} onChange={(e) => set("weight", e.target.value)} style={{ width: "100%" }} /></Field>
            <Field label="Tara seco (g)"><input type="number" min="0" value={f.dryWeight ?? ""} onChange={(e) => set("dryWeight", e.target.value)} style={{ width: "100%" }} /></Field>
          </>}
          {kind === "miccion" && <Field label="Jarra (ml)"><input type="number" min="0" step="10" value={f.volume ?? ""} onChange={(e) => set("volume", e.target.value)} placeholder="Sin medir" style={{ width: "100%" }} /></Field>}
          {kind === "escape" && <>
            <Field label="Desencadenante">
              <select value={f.trigger} onChange={(e) => set("trigger", e.target.value)} style={{ width: "100%" }}>
                {LEAK_TRIGGERS.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
            </Field>
            <Field label="Cantidad">
              <select value={f.amount} onChange={(e) => set("amount", e.target.value)} style={{ width: "100%" }}>
                {LEAK_AMOUNTS.map((a) => <option key={a} value={a}>{a}</option>)}
              </select>
            </Field>
          </>}
          <Field label="Fecha"><input type="date" value={f.date || ""} onChange={(e) => set("date", e.target.value)} style={{ width: "100%" }} /></Field>
          <Field label="Hora"><input type="time" value={f.time || ""} onChange={(e) => set("time", e.target.value)} style={{ width: "100%" }} /></Field>
        </div>
        {(kind === "miccion" || kind === "panal") && <div style={{ marginTop: 12 }}><PeriodPicker value={f.period} onChange={(v) => set("period", v)} time={f.time} /></div>}
        <div style={{ marginTop: 12 }}>
          <Field label="Nota"><input type="text" value={f.note || ""} onChange={(e) => set("note", e.target.value)} style={{ width: "100%" }} /></Field>
        </div>
        {err && <div style={{ color: COLORS.rose, fontSize: 12.5, marginTop: 10, fontWeight: 600 }}>{err}</div>}
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 20 }}>
          <button onClick={onClose} style={{ background: COLORS.inputBg, color: COLORS.inkSoft, border: "none", borderRadius: 12, padding: "11px 16px", fontWeight: 700, fontSize: 13.5 }}>Cancelar</button>

        </div>
      </div>
    </div>
  );
}

function BackupPanel({ data, onRestore, settings, setDefault }) {
  const COLORS = useTheme();
  const [pending, setPending] = useState(null);
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);
  const counts = (d) => `${(d.liquids || []).length} líquidos, ${(d.diapers || []).length} pesajes, ${(d.voids || []).length} micciones, ${(d.leaks || []).length} escapes`;

  const exportBackup = () => {
    const payload = {
      app: "incontrol", version: 1, exportedAt: new Date().toISOString(),
      liquids: data.liquids, diapers: data.diapers, voids: data.voids || [], leaks: data.leaks || [],
      dayNotes: data.dayNotes || {}, settings: data.settings || {}, lastReport: data.lastReport || null,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `incontrol-copia-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    setDefault("lastBackup", todayStr());
    setMsg("Copia descargada correctamente.");
  };

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || parsed.app !== "incontrol") throw new Error("archivo no válido");
        setPending(parsed); setMsg("");
      } catch (err) {
        setPending(null); setMsg("Error al leer el archivo.");
      }
    };
    reader.readAsText(file);
  };

  const restore = (mode) => {
    onRestore(pending, mode);
    setPending(null);
    setMsg(mode === "replace" ? "Datos reemplazados." : "Registros fusionados.");
  };

  return (
    <div style={{ background: COLORS.card, borderRadius: 22, padding: 20, boxShadow: COLORS.shadowSm, display: "flex", flexDirection: "column", gap: 14 }}>
      <div>
        <div style={{ fontWeight: 800, fontSize: 15.5 }}>Copia de seguridad local</div>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, lineHeight: 1.5, marginTop: 4 }}>
          Exporta tus registros en un archivo JSON para guardarlos o pasarlos a otro móvil.
        </div>
        <div style={{ fontSize: 12, color: COLORS.teal, fontWeight: 700, marginTop: 8 }}>{counts(data)}</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1fr)", gap: 10 }}>
        <button onClick={exportBackup} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: COLORS.teal, color: "#fff", border: "none", borderRadius: 14, padding: "12px", fontWeight: 700, fontSize: 13 }}>
          <Download size={15} /> Exportar
        </button>
        <button onClick={() => fileRef.current && fileRef.current.click()} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: COLORS.inputBg, color: COLORS.ink, border: "none", borderRadius: 14, padding: "12px", fontWeight: 700, fontSize: 13 }}>
          <Upload size={15} /> Importar
        </button>
        <input ref={fileRef} type="file" accept="application/json,.json" onChange={onFile} style={{ display: "none" }} />
      </div>
      {pending && (
        <div style={{ borderRadius: 16, padding: 14, background: COLORS.tealSoft }}>
          <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 4 }}>Archivo listo ({counts(pending)})</div>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button onClick={() => restore("merge")} style={{ flex: 1, background: COLORS.teal, color: "#fff", border: "none", borderRadius: 11, padding: "9px", fontWeight: 700, fontSize: 12.5 }}>Fusionar</button>
            <button onClick={() => restore("replace")} style={{ flex: 1, background: COLORS.card, color: COLORS.rose, border: "none", borderRadius: 11, padding: "9px", fontWeight: 700, fontSize: 12.5 }}>Reemplazar</button>
          </div>
        </div>
      )}
      {msg && <div style={{ fontSize: 12.5, color: COLORS.teal, fontWeight: 700 }}>{msg}</div>}
    </div>
  );
}

const PRESETS = [
  { id: "7", label: "7D" },
  { id: "14", label: "14D" },
  { id: "30", label: "30D" },
  { id: "60", label: "60D" },
  { id: "90", label: "90D" },
  { id: "all", label: "Todo" },
];

function GraficasTab({ dailyAgg, minDate, maxDate }) {
  const COLORS = useTheme();
  const [preset, setPreset] = useState("14");
  const [customStart, setCustomStart] = useState(minDate);
  const [customEnd, setCustomEnd] = useState(maxDate);
  const [useCustom, setUseCustom] = useState(false);
  // las fechas muestran por defecto todo el rango existente y se actualizan si cambian los datos
  useEffect(() => { if (!useCustom) { setCustomStart(minDate); setCustomEnd(maxDate); } }, [minDate, maxDate, useCustom]);
  const printRef = useRef(null);
  const [printMode, setPrintMode] = useState(false);
  const doPrint = (title) => { setPrintMode(true); setTimeout(() => { printElement(printRef, title); setPrintMode(false); }, 250); };

  const range = useMemo(() => {
    if (useCustom) return { start: customStart, end: customEnd };
    if (preset === "all") return { start: minDate, end: maxDate };
    const days = Number(preset);
    const end = new Date(maxDate + "T00:00:00");
    const start = new Date(end);
    start.setDate(start.getDate() - (days - 1));
    return { start: toLocalIsoDate(start), end: maxDate };
  }, [preset, useCustom, customStart, customEnd, minDate, maxDate]);

  const filtered = useMemo(
    () => dailyAgg.filter((d) => d.date >= range.start && d.date <= range.end),
    [dailyAgg, range]
  );

  const liquidStats = statsOf(filtered.map((d) => d.liquidTotal));
  const diaperStats = statsOf(filtered.map((d) => d.diaperTotal));

  const prevMean = useMemo(() => {
    const n = Math.round((new Date(range.end + "T00:00:00") - new Date(range.start + "T00:00:00")) / 86400000) + 1;
    if (!(n > 0)) return null;
    const prevEnd = addDaysIso(range.start, -1), prevStart = addDaysIso(range.start, -n);
    const vals = dailyAgg.filter((d) => d.date >= prevStart && d.date <= prevEnd && d.diaperCount > 0).map((d) => d.diaperTotal);
    return vals.length >= 3 ? mean(vals) : null;
  }, [dailyAgg, range]);

  const points = filtered.map((d) => ({
    date: d.date,
    label: fmtDateShort(d.date),
    value: round1(d.diaperTotal),
    liquid: round1(d.liquidTotal),
    voids: d.voidCount,
    nightVoids: d.nightVoids,
    note: d.dayNote || d.diaperNotes[0],
  }));

  if (dailyAgg.length === 0) {
    return <EmptyState icon={LineChartIcon} text="Registra datos en el diario para ver tu evolución." />;
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 4, background: COLORS.card, padding: 4, borderRadius: 99, boxShadow: COLORS.shadowSm }}>
          {PRESETS.map((p) => {
            const active = !useCustom && preset === p.id;
            return (
              <button
                key={p.id}
                onClick={() => { setPreset(p.id); setUseCustom(false); setCustomStart(minDate); setCustomEnd(maxDate); }}
                style={{
                  padding: "7px 13px", borderRadius: 99, fontSize: 12.5, fontWeight: 700, border: "none",

function AnnotatedLineChart({ points, unit, color, title }) {
  const COLORS = useTheme();
  const values = points.map((p) => p.value);
  const statsAll = statsOf(values);
  const xs = points.map((p) => dayOffset(points[0]?.date, p.date));
  const { slope, intercept } = linreg(values, xs);

  const data = points.map((p, i) => ({
    ...p,
    trend: round1(intercept + slope * xs[i]),
    dayOffset: xs[i],
  }));

  const isCompact = points.length > 15;

  function PointLabel(props) {
    const { x, y, index } = props;
    const p = data[index];
    const noteTxt = p.note ? (p.note.length > 22 ? p.note.slice(0, 20) + "…" : p.note) : "";
    if (isCompact) {
      // Muchos puntos: cada valor va en vertical sobre su punto; con más de 45 puntos se muestran
      // solo algunos (uno de cada varios) más el máximo y el mínimo
      const n = data.length;
      const step = n > 45 ? Math.ceil(n / 30) : 1;
      const vals = data.map((d) => d.value);
      const show = index % step === 0 || index === vals.indexOf(Math.max(...vals)) || index === vals.indexOf(Math.min(...vals));
      return (
        <g>
          {show && (
            <text x={x} y={y - 9} transform={`rotate(-90 ${x} ${y - 9})`} textAnchor="start" dominantBaseline="middle" fontSize={10} fontWeight={700} fill={COLORS.ink} fontFamily="'JetBrains Mono', monospace">

          {p.note && <circle cx={x} cy={y} r={6} fill="none" stroke={COLORS.teal} strokeWidth={2} />}
        </g>
      );
    }
    return (
      <g>
        <text x={x} y={y - 11} textAnchor="middle" fontSize={11} fontWeight={700} fill={COLORS.ink} fontFamily="'JetBrains Mono', monospace">
          {p.value}
        </text>
        {p.note && <circle cx={x} cy={y} r={7} fill="none" stroke={COLORS.teal} strokeWidth={2} />}
        {p.note && <text x={x} y={y - 26} textAnchor="middle" fontSize={10.5} fontWeight={700} fill={COLORS.teal}>{noteTxt}</text>}
      </g>
    );
  }

  const maxLiquid = Math.max(1, ...points.map((p) => p.liquid || 0));

        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 9, height: 9, borderRadius: "50%", background: color }} /> Pañales (g)
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 9, height: 9, borderRadius: "50%", background: "#38BDF8" }} /> Líquido (ml)
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 12, borderTop: `2px dashed ${COLORS.teal}` }} /> Tendencia
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 12, borderTop: `2px dashed ${COLORS.purple}` }} /> Media
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 12, borderTop: `2px dotted ${COLORS.amber}` }} /> Mediana
        </span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 12, height: 8, background: COLORS.inkSoft, opacity: 0.2 }} /> ±1σ
        </span>
      </div>
      <ResponsiveContainer width="100%" height={isCompact ? 350 : 310}>
        <ComposedChart data={data} margin={{ top: isCompact ? 56 : 38, right: 54, left: 10, bottom: 2 }}>
          <defs>
            <linearGradient id="liquidWave" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#38BDF8" stopOpacity={0.35} />

function PeriodHeadline({ points, days, prevMean }) {
  const COLORS = useTheme();
  const values = points.map((p) => p.value);
  if (values.length < 2) return null;
  const st = statsOf(values);
  const xs = points.map((p) => dayOffset(points[0].date, p.date));
  const { slope } = linreg(values, xs);
  const sm = summarizeDiary(days);
  const sev = classifyLoss(st.mean);
  const span = xs[xs.length - 1] - xs[0];
  const change = st.mean > 0 ? (slope * span) / st.mean : 0; // cambio relativo estimado a lo largo del periodo
  const trend = Math.abs(change) < 0.1 ? "estable" : change < 0 ? "a la baja" : "al alza";
  const cv = st.mean > 0 ? st.sd / st.mean : 0;
  const variation = cv < 0.3 ? "regular" : cv < 0.6 ? "con variación moderada" : "muy irregular";
  const parts = [];
  parts.push(`En ${values.length} días con registro, la pérdida media es de ${fmtEs(round1(st.mean), 0)} g/día${sev ? ` (${sev.label.toLowerCase()})` : ""}, con tendencia ${trend} y un patrón ${variation}.`);
  if (prevMean && prevMean > 0) {
    const pct = Math.round(((st.mean - prevMean) / prevMean) * 100);
    parts.push(Math.abs(pct) < 5 ? "Es similar al periodo anterior." : `Es un ${Math.abs(pct)} % ${pct < 0 ? "menos" : "más"} que en el periodo anterior.`);
  }
  const diary = [];
  if (sm.nocturia !== null) diary.push(`nocturia de ${fmtEs(round1(sm.nocturia), 1)} por noche`);
  if (sm.npi !== null) diary.push(`${fmtEs(Math.round(sm.npi), 0)} % de la orina de noche`);
  if (sm.leaksPerDay !== null && sm.totalLeaks > 0) diary.push(`${fmtEs(round1(sm.leaksPerDay), 1)} escapes al día`);
  if (diary.length) parts.push(`Diario miccional: ${diary.join(", ")}.`);
  return (
    <div style={{ background: COLORS.tealSoft, borderRadius: 22, padding: "16px 18px", display: "flex", gap: 12, alignItems: "flex-start" }}>
      <Sparkles size={20} color={COLORS.teal} style={{ flexShrink: 0, marginTop: 2 }} />
      <div>
        <div style={{ fontSize: 12, fontWeight: 800, color: COLORS.teal, marginBottom: 4 }}>Resumen del periodo</div>
        <div style={{ fontSize: 13.5, lineHeight: 1.55, color: COLORS.ink }}>{parts.join(" ")}</div>
      </div>
    </div>
  );
}

function effectWord(d) {
  if (d === null || d === undefined) return "";
  const a = Math.abs(d);
  return a < 0.2 ? "tamaño del efecto despreciable" : a < 0.5 ? "efecto pequeño" : a < 0.8 ? "efecto moderado" : "efecto grande";
}

    if (cmpCustom && cmpStart && cmpEnd && cmpStart <= cmpEnd) return { start: cmpStart, end: cmpEnd };
    const days = Number(cmpPreset) || 30;
    return { start: addDaysIso(maxDate, -(days - 1)), end: maxDate };
  }, [cmpPreset, cmpCustom, cmpStart, cmpEnd, maxDate]);
  const [sourceKey, setSourceKey] = useState("loss");
  const [measureKey, setMeasureKey] = useState("mean");
  const src = PERIOD_SOURCES[sourceKey], meas = PERIOD_MEASURES[measureKey];

  const fmtV = (v) => (v === null || v === undefined ? "—" : fmtEs(round1(v), meas.sq ? 0 : 1));

    const VISIBLE = 6;

              style={{ padding: "6px 12px", borderRadius: 99, fontSize: 12, fontWeight: 700, border: "none", background: active ? COLORS.teal : "transparent", color: active ? "#fff" : COLORS.inkSoft }}>
              {x.label}
            </button>
          );
        })}
      </div>
      <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 4 }}>Personalizado:</div>
      <div style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 12, color: COLORS.inkSoft, marginBottom: 10 }}>

      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
      <select value={sourceKey} onChange={(e) => setSourceKey(e.target.value)}>
        {Object.entries(PERIOD_SOURCES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
      </select>
      <select value={measureKey} onChange={(e) => setMeasureKey(e.target.value)}>
        {Object.entries(PERIOD_MEASURES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
      </select>
      </div>
    </div>
  );

  if (!(n >= 3) || withData.length < 2 || blocks[0].vals.length === 0) {
    return (
      <div style={wrap}>
        {title}
        {selectors}
        <div style={{ fontSize: 13, color: COLORS.inkSoft, lineHeight: 1.5 }}>
          Para comparar necesito el periodo actual y al menos otro anterior de la misma duración con datos de «{src.label.toLowerCase()}». Elige 7D, 14D, 30D, 60D o 90D arriba; con «Todo» no hay periodo anterior con el que comparar.
        </div>
      </div>
    );
  }

  const cmp = compareBlocks(blocks[0], blocks[1], measureKey, sourceKey);
  const goodDir = (diff) => {
    if (["sd", "variance", "cv"].includes(measureKey)) return diff < 0;
    if (src.lower === null) return null;
    return (diff < 0) === src.lower;
  };
  const dirColor = (diff, big) => {
    if (!big) return COLORS.inkSoft;
    const g = goodDir(diff);
    return g === null ? COLORS.inkSoft : g ? "#2F7D4F" : "#B3492F";
  };

  // ---------- interpretación en lenguaje llano ----------
  const NOUNS = {
    loss: { thing: "lo que pierdes (el peso de los pañales)", hi: "el día de más pérdida", lo: "el día de menos pérdida", more: "mucha pérdida", less: "poca pérdida" },
    liquid: { thing: "lo que bebes", hi: "el día que más bebiste", lo: "el día que menos bebiste", more: "mucho líquido", less: "poco líquido" },
    nocturia: { thing: "las veces que te levantas a orinar de noche", hi: "la noche con más levantadas", lo: "la noche con menos levantadas", more: "muchas levantadas", less: "pocas levantadas" },
    leaks: { thing: "los escapes", hi: "el día con más escapes", lo: "el día con menos escapes", more: "muchos escapes", less: "pocos escapes" },
  };
  const N = NOUNS[sourceKey];
  const dec = sourceKey === "nocturia" || sourceKey === "leaks" ? 1 : 0;
  const u1 = src.unit.replace("/día", "").replace("por noche", "").replace("al día", "").trim();
  const num = (v) => fmtEs(round1(v), dec);
  const withU = (v) => `${num(v)}${u1 ? " " + u1 : ""}`;
  const pctWord = (pct) => `${fmtEs(round1(Math.abs(pct)), 0)} % ${pct < 0 ? "menos" : "más"}`;
  const dateWord = (iso) => fmtDateShort(iso);
  const extremes = (blk) => {
    if (!blk.rows.length) return null;
    const hi = blk.rows.reduce((x, y) => (y.v > x.v ? y : x)), lo = blk.rows.reduce((x, y) => (y.v < x.v ? y : x));
    return { hi, lo };
  };
  const cur = blocks[0], prev = blocks[1];
  const isVar = ["sd", "variance", "cv"].includes(measureKey);

  const summary = [];  // frase destacada
  const lines = [];    // explicación
  let verdictBig = false;

  if (!cmp) {
    summary.push("Todavía no se puede comparar con fiabilidad.");
    lines.push("El periodo actual o el anterior tienen menos de 3 días con datos. Sigue anotando unos días más y aparecerá la comparación.");
  } else {
    const absPct = cmp.pct === null ? 0 : Math.abs(cmp.pct);
    // ¿cambio claro?
    if (cmp.p !== null) verdictBig = cmp.p < 0.05;
    else verdictBig = absPct >= 10;
    const g = goodDir(cmp.diff);
    const goodTxt = verdictBig && g !== null && cmp.diff !== 0 ? (g ? " Es una buena señal." : " Conviene vigilarlo.") : "";

    // frase destacada
    if (measureKey === "slope") {
      const sl = (blk) => measureValue(blk, "slope");
      const sa = cmp.a, sb = cmp.b;
      const dirW = (x) => (Math.abs(x) < 0.5 ? "se ha mantenido estable" : x > 0 ? "ha ido subiendo" : "ha ido bajando");
      const gd = (x) => (Math.abs(x) < 0.5 || src.lower === null ? null : (x < 0) === src.lower);
      summary.push(`En este periodo ${N.thing} ${dirW(sa)}${Math.abs(sa) >= 0.5 ? `: unos ${num(Math.abs(sa))} ${u1} cada día` : ""}.`);
      if (Math.abs(sa) >= 0.5) lines.push(`Dicho de otra forma: si el ritmo se mantuviera, en una semana habría ${Math.abs(sa) * 7 < 1 ? "un cambio muy pequeño" : `${num(Math.abs(sa) * 7)} ${u1} ${sa > 0 ? "más" : "menos"} al día`}, y en ${n} días, ${num(Math.abs(sa) * n)} ${u1} ${sa > 0 ? "más" : "menos"} al día. ${gd(sa) === null ? "" : gd(sa) ? "Es una buena señal." : "Conviene vigilarlo."}`);
      else lines.push("La línea de tendencia es casi plana: ni sube ni baja de forma apreciable.");
      lines.push(`En el periodo anterior ${N.thing} ${dirW(sb)}${Math.abs(sb) >= 0.5 ? ` (unos ${num(Math.abs(sb))} ${u1} cada día)` : ""}.`);
      const rr = ((cur.vals.length >= 2) ? linreg(cur.vals, cur.rows.map((r) => dayOffset(cur.rows[0].date, r.date))).r2 : 0);
      lines.push(rr >= 0.3 ? "La tendencia es bastante clara: los días siguen una dirección reconocible." : "Ojo: los días varían mucho unos de otros, así que esta tendencia es débil y puede cambiar con unos pocos días.");
      verdictBig = Math.abs(sa) >= 0.5 && rr >= 0.3;
    } else if (isVar) {
      summary.push(verdictBig ? (cmp.diff > 0 ? "Tus datos son ahora más irregulares que en el periodo anterior." : "Tus datos son ahora más uniformes que en el periodo anterior.") : "Tus datos son igual de regulares que en el periodo anterior." );
    } else {
      const what = { mean: "El valor medio", median: "El día típico", max: "El peor día", min: "El mejor día" }[measureKey];
      summary.push(verdictBig ? `${what} ha ${cmp.diff > 0 ? "subido" : "bajado"} de forma clara respecto al periodo anterior.` : `${what} se mantiene parecido al del periodo anterior.`);
    }
    if (goodTxt && measureKey !== "slope") summary[0] += goodTxt;

    // explicación de la medida
    const ec = extremes(cur), ep = extremes(prev);
    if (measureKey === "slope") {
      // explicado arriba
    } else if (measureKey === "mean") {
      lines.push(`En un día normal de este periodo, ${N.thing}: de media ${withU(cmp.a)}. En el periodo anterior fue ${withU(cmp.b)}, así que ahora es ${cmp.pct === null ? "distinto" : pctWord(cmp.pct)}.`);
    } else if (measureKey === "median") {
      lines.push(`El día «típico» (el valor central: la mitad de los días queda por encima y la otra mitad por debajo) fue de ${withU(cmp.a)}, frente a ${withU(cmp.b)} en el periodo anterior (${cmp.pct === null ? "—" : pctWord(cmp.pct)}). Sirve para saber cómo es un día corriente sin que un día muy raro lo distorsione.`);
    } else if (measureKey === "max") {
      lines.push(`${N.hi.charAt(0).toUpperCase() + N.hi.slice(1)} de este periodo fue el ${dateWord(ec.hi.date)} con ${withU(cmp.a)}; en el periodo anterior fue el ${dateWord(ep.hi.date)} con ${withU(cmp.b)} (${cmp.pct === null ? "—" : pctWord(cmp.pct)}). Los picos suelen deberse a algo puntual: mira si ese día anotaste algo en la nota del día.`);
    } else if (measureKey === "min") {
      lines.push(`${N.lo.charAt(0).toUpperCase() + N.lo.slice(1)} de este periodo fue el ${dateWord(ec.lo.date)} con ${withU(cmp.a)}; en el periodo anterior fue el ${dateWord(ep.lo.date)} con ${withU(cmp.b)} (${cmp.pct === null ? "—" : pctWord(cmp.pct)}).`);
    } else {
      // medidas de variabilidad
      const sdA = stddev(cur.vals), sdB = stddev(prev.vals);
      if (measureKey === "sd") {
        lines.push(`La desviación típica mide lo parecidos o distintos que son unos días de otros. Ahora es ${num(cmp.a)} frente a ${num(cmp.b)} del periodo anterior (${cmp.pct === null ? "—" : pctWord(cmp.pct)}).`);
      } else if (measureKey === "variance") {
        lines.push(`La varianza es otra forma de medir lo irregulares que son tus días. Sus números salen muy grandes porque es la desviación típica elevada al cuadrado, así que no te fijes en la cifra sino en si sube o baja. En palabras más fáciles: tus días se separan del valor medio unos ±${num(sdA)} ${u1} ahora, frente a ±${num(sdB)} ${u1} antes.`);
      } else {
        lines.push(`El coeficiente de variación mide la irregularidad en proporción a lo que sueles tener: ${fmtEs(round1(cmp.a), 0)} % ahora frente a ${fmtEs(round1(cmp.b), 0)} % antes. Por debajo del 30 % los días se parecen bastante entre sí; entre 30 y 60 % hay diferencias claras; por encima del 60 % son muy irregulares.`);
      }
      if (verdictBig && cmp.diff > 0) {
        lines.push(`En la práctica: tus datos son más erráticos. Hay días con ${N.more} y otros con ${N.less}, por eso hay más variación que en el periodo anterior, cuando los días eran más parecidos entre sí.`);
      } else if (verdictBig && cmp.diff < 0) {
        lines.push(`En la práctica: tus datos son más uniformes. Los días se parecen más entre sí que en el periodo anterior, con menos saltos entre días de ${N.more} y días de ${N.less}.`);
      } else {
        lines.push(`En la práctica: los días se parecen entre sí más o menos igual que en el periodo anterior.`);
      }
      if (ec && ep) {
        lines.push(`Por ejemplo, en este periodo los valores van de ${withU(ec.lo.v)} (${dateWord(ec.lo.date)}) a ${withU(ec.hi.v)} (${dateWord(ec.hi.date)}); en el anterior, de ${withU(ep.lo.v)} (${dateWord(ep.lo.date)}) a ${withU(ep.hi.v)} (${dateWord(ep.hi.date)}).`);
      }
    }

    // ¿es casualidad?
    if (cmp.p !== null) {
      const ps = cmp.p < 0.001 ? "< 0,001" : fmtEs(Math.round(cmp.p * 1000) / 1000, 3);
      if (cmp.p < 0.05) lines.push(`¿Puede ser casualidad? Es poco probable: la diferencia es lo bastante grande como para destacar sobre lo que varían normalmente tus días (dato técnico: p = ${ps}).`);
      else if (cmp.p < 0.1) lines.push(`¿Puede ser casualidad? Es posible: hay indicios de cambio, pero no son concluyentes todavía (dato técnico: p = ${ps}).`);
      else lines.push(`¿Puede ser casualidad? Sí, es muy posible: la diferencia es pequeña comparada con lo que ya varían tus días de uno a otro, así que no se puede asegurar que haya un cambio real (dato técnico: p = ${ps}).`);
    } else if (cmp.pct !== null) {
      const band = periodBand(absPct);
      lines.push(`¿Cuánto ha cambiado? ${band.charAt(0).toUpperCase() + band.slice(1)}${absPct < 5 ? ": los valores son prácticamente iguales" : ""}. Para esta medida no se puede calcular una prueba estadística, así que lo valoramos por el tamaño del cambio (menos de 5 %: ninguno; hasta 10 %: leve; hasta 20 %: moderado; más: importante).`);
    }
    if (cmp.kind === "t" && cmp.mdc !== null) {
      lines.push(`Para que un cambio sea fiable debería superar unos ±${fmtEs(round1(cmp.mdc), dec)} ${u1}; las diferencias más pequeñas pueden deberse al día a día normal.`);
    }
    if (blocks[0].vals.length < 7 || blocks[1].vals.length < 7) {
      lines.push(`Ojo: hay pocos días con datos (${blocks[0].vals.length} en este periodo y ${blocks[1].vals.length} en el anterior). Con menos de una semana, las conclusiones son poco fiables.`);
    }
  }
  // tendencia entre todos los bloques
  const trendBlocks = withData.filter((b) => b.vals.length >= 3).reverse(); // antiguo → reciente
  if (trendBlocks.length >= 3) {
    const vals = trendBlocks.map((b) => measureValue(b, measureKey));
    const diffs = vals.slice(1).map((v, i) => v - vals[i]);
    const allDown = diffs.every((d) => d < 0), allUp = diffs.every((d) => d > 0);
    const first = vals[0], last = vals[vals.length - 1];
    const total = first !== 0 ? ((last - first) / Math.abs(first)) * 100 : null;
    const word = isVar ? (allDown ? "tus datos se van volviendo más uniformes" : "tus datos se van volviendo más irregulares") : (allDown ? "va bajando" : "va subiendo");
    if (allDown || allUp) {
      lines.push(`Mirando todos los periodos: ${word} cada vez durante ${vals.length} periodos seguidos${total !== null ? ` (${pctWord(total)} desde el primero)` : ""}.`);
    } else {
      lines.push(`Mirando todos los periodos: no hay una dirección clara; sube y baja de un periodo a otro${total !== null ? ` (${pctWord(total)} entre el primero y el último)` : ""}.`);
    }
  }

  return (
    <div style={wrap}>
      {title}
      <div style={{ fontSize: 12, color: COLORS.inkSoft }}>
        {meas.label} · {src.label} · bloques de {n} días
      </div>
      {selectors}

      {allWithData.length > VISIBLE && (
        <div className="no-print" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8 }}>
          <button onClick={() => setShift(Math.min(maxShift, sh + 1))} disabled={sh >= maxShift} aria-label="Ver periodos más antiguos"
            style={{ display: "inline-flex", alignItems: "center", gap: 4, background: COLORS.inputBg, color: sh >= maxShift ? COLORS.line : COLORS.ink, border: "none", borderRadius: 99, padding: "8px 12px", fontSize: 12.5, fontWeight: 700 }}>
            <ChevronLeft size={16} /> Antes
          </button>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: COLORS.inkSoft, textAlign: "center" }}>
            Periodos {sh + 1}–{Math.min(sh + VISIBLE, allWithData.length)} de {allWithData.length}
          </div>
          <button onClick={() => setShift(Math.max(0, sh - 1))} disabled={sh <= 0} aria-label="Ver periodos más recientes"
            style={{ display: "inline-flex", alignItems: "center", gap: 4, background: COLORS.inputBg, color: sh <= 0 ? COLORS.line : COLORS.ink, border: "none", borderRadius: 99, padding: "8px 12px", fontSize: 12.5, fontWeight: 700 }}>
            Después <ChevronRight size={16} />
          </button>
        </div>
      )}

      <div style={{ width: "100%", height: 220 }}>
        <ResponsiveContainer>
          <BarChart data={chartData} margin={{ top: 22, right: 8, left: -14, bottom: 0 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.line} vertical={false} />
            <XAxis dataKey="name" tick={{ fontSize: 11.5, fill: COLORS.inkSoft, fontWeight: 700 }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fontSize: 11, fill: COLORS.inkSoft }} axisLine={false} tickLine={false} width={46} domain={meas.slope ? ["auto", "auto"] : [0, (m) => Math.ceil((m * 1.15) / 10) * 10]} />
            <Bar dataKey="value" radius={[8, 8, 0, 0]} isAnimationActive={false}>
              {chartData.map((c) => <Cell key={c.i} fill={c.i === shown[0].i ? COLORS.teal : (COLORS.card === LIGHT_COLORS.card ? "#C5CDD8" : "#4A5865")} />)}
              <LabelList dataKey="value" position="top" style={{ fontSize: 11, fontWeight: 700, fill: COLORS.ink, fontFamily: "'JetBrains Mono', monospace" }} />
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>

      <div style={{ marginTop: 6, border: `1px solid ${COLORS.line}`, borderRadius: 16, overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1.35fr) 38px minmax(0,0.85fr) minmax(0,1fr)", gap: 6, padding: "8px 12px", background: COLORS.inputBg, fontSize: 10.5, fontWeight: 700, color: COLORS.inkSoft }}>
          <div>Periodo</div><div>Días</div><div>{meas.label}</div><div>Cambio</div>
        </div>
        {shown.map((b, k) => {
          const older = withData[k + 1];
          const v = measureValue(b, measureKey);
          const ov = older && older.vals.length ? measureValue(older, measureKey) : null;
          const pct = !meas.slope && ov !== null && ov !== 0 ? ((v - ov) / Math.abs(ov)) * 100 : null;
          const big = pct !== null && Math.abs(pct) >= 10;
          const slopeBig = meas.slope && Math.abs(v) >= 0.5;
          return (
            <div key={b.i} style={{ display: "grid", gridTemplateColumns: "minmax(0,1.35fr) 38px minmax(0,0.85fr) minmax(0,1fr)", gap: 6, padding: "9px 12px", borderTop: `1px solid ${COLORS.line}`, fontSize: 12, alignItems: "center", background: b.i === 0 ? COLORS.tealSoft : "transparent" }}>
              <div style={{ fontWeight: 700 }}>{b.i === 0 ? "Actual" : `Anterior ${b.i}`}<div style={{ fontWeight: 500, color: COLORS.inkSoft, fontSize: 11 }}>{fmtDateShort(b.start)} – {fmtDateShort(b.end)}</div></div>
              <div className="num" style={{ color: COLORS.inkSoft, whiteSpace: "nowrap" }}>{b.vals.length} d</div>
              <div className="num" style={{ fontWeight: 800 }}>{fmtV(v)}</div>
              <div className="num" style={{ fontWeight: 700, whiteSpace: "nowrap", fontSize: 11.5, color: meas.slope ? dirColor(v, slopeBig) : pct === null ? COLORS.inkSoft : dirColor(v - ov, big) }}>
                {meas.slope ? (Math.abs(v) < 0.5 ? "= estable" : v > 0 ? "▲ sube" : "▼ baja") : pct === null ? "—" : `${pct > 0 ? "▲ +" : pct < 0 ? "▼ −" : "= "}${fmtEs(round1(Math.abs(pct)), 0)} %`}
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ marginTop: 14, background: verdictBig ? COLORS.tealSoft : COLORS.inputBg, borderRadius: 18, padding: "14px 16px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12.5, fontWeight: 800, color: COLORS.teal, marginBottom: 6 }}>
          <Sparkles size={15} /> Interpretación
        </div>
        {summary.map((l, i) => <p key={"s" + i} style={{ margin: "0 0 9px", fontSize: 14, lineHeight: 1.5, fontWeight: 800, color: COLORS.ink }}>{l}</p>)}
        {lines.map((l, i) => <p key={i} style={{ margin: "0 0 8px", fontSize: 13, lineHeight: 1.6, color: COLORS.ink }}>{l}</p>)}
        <div style={{ fontSize: 11, color: COLORS.inkSoft, lineHeight: 1.45 }}>Lectura orientativa de tus datos, no un diagnóstico. Que un cambio no sea casualidad no significa que sea importante para tu salud: coméntalo con tu médico.</div>
      </div>

      <details className="no-print" style={{ marginTop: 14 }}>
        <summary style={{ cursor: "pointer", fontSize: 13, fontWeight: 800, color: COLORS.teal }}>Experimentos que pueden ayudar</summary>
        <div style={{ fontSize: 12.5, lineHeight: 1.6, color: COLORS.ink, marginTop: 10 }}>
          <p style={{ margin: "0 0 8px" }}>La idea es probar un cambio cada vez y dejar que estas comparaciones digan si funciona:</p>
          <ul style={{ margin: "0 0 8px", paddingLeft: 20 }}>
            <li><b>Prueba por fases (A-B-A).</b> 2 semanas como siempre, 2 semanas cambiando una sola cosa y 2 semanas volviendo a lo anterior. Si la medida mejora solo en la fase del cambio y vuelve a empeorar al retirarlo, el cambio probablemente es el responsable. Elige 14D para comparar fase con fase.</li>
            <li><b>Última bebida más temprana.</b> Adelanta 2–3 horas la última bebida de la noche y mira nocturia y la jarra nocturna.</li>
            <li><b>Cafeína, gaseosas y alcohol.</b> Retíralos 14 días y compara pérdida y escapes con las 2 semanas anteriores.</li>
            <li><b>Reparto de líquidos.</b> Misma cantidad total, repartida a lo largo del día frente a concentrada en pocas tomas.</li>
            <li><b>Ejercicios de suelo pélvico o micción programada.</b> Empieza una rutina y compara periodos iguales antes y después; los efectos suelen verse tras 4–8 semanas, así que usa 30D o 60D.</li>
            <li><b>Semanas completas.</b> Compara con 7D para que el fin de semana no distorsione.</li>
          </ul>
          <p style={{ margin: 0, color: COLORS.inkSoft }}>Reglas: cambia una sola cosa, mantén al menos 14 días por fase, apunta la fecha del cambio en la nota del día y no cambies a la vez de pañal ni de forma de pesar. Comenta con tu médico cualquier cambio de líquidos o de tratamiento antes de empezar.</p>
        </div>
      </details>
    </div>
  );
}

function SeverityLegend() {
  const COLORS = useTheme();
  const items = [
    { label: "Leve", range: `< ${SEVERITY_THRESHOLDS.leve} g`, ...classifyLoss(1) },
    { label: "Moderada", range: `${SEVERITY_THRESHOLDS.leve}–${SEVERITY_THRESHOLDS.moderada} g`, ...classifyLoss(SEVERITY_THRESHOLDS.leve + 1) },
    { label: "Severa", range: `${SEVERITY_THRESHOLDS.moderada}–${SEVERITY_THRESHOLDS.severa} g`, ...classifyLoss(SEVERITY_THRESHOLDS.moderada + 1) },
    { label: "Muy severa", range: `> ${SEVERITY_THRESHOLDS.severa} g`, ...classifyLoss(SEVERITY_THRESHOLDS.severa + 1) },
  ];
  return (
    <div style={{ background: COLORS.card, borderRadius: 22, padding: "14px 16px", boxShadow: COLORS.shadowSm }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: COLORS.inkSoft, fontWeight: 700, marginBottom: 8 }}><Gauge size={15} color={COLORS.amber} /> Clasificación de severidad (peso neto diario)</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
        {items.map((it) => (
          <div key={it.label} style={{ background: it.bg, color: it.color, padding: "4px 10px", borderRadius: 99, fontSize: 12, fontWeight: 700 }}>
            {it.label} <span className="num" style={{ fontWeight: 500, opacity: 0.85 }}>{it.range}</span>
          </div>
        ))}
      </div>
      <div style={{ fontSize: 11, color: COLORS.inkSoft, lineHeight: 1.4 }}>Clasificación orientativa según el volumen absorbido en el día; no es un criterio diagnóstico.</div>
    </div>
  );
}

function SummaryStatCards({ points, unit, prevMean }) {
  const COLORS = useTheme();
  const values = points.map((p) => p.value);
  if (values.length === 0) return null;

  const { mean: m, median: med, sd, max, min } = statsOf(values);
  const xs = points.map((p) => dayOffset(points[0]?.date, p.date));
  const { slope, r2 } = linreg(values, xs);
  const maxPoint = points[values.indexOf(max)];
  const minPoint = points[values.indexOf(min)];

  const trendFlat = Math.abs(slope) < 0.05;
  const trendDown = slope < 0;
  const TrendIcon = trendFlat ? Minus : trendDown ? TrendingDown : TrendingUp;
  const trendColor = trendFlat ? COLORS.inkSoft : trendDown ? COLORS.teal : COLORS.amber;
  const trendBg = trendFlat ? COLORS.inputBg : trendDown ? COLORS.tealSoft : COLORS.amberSoft;
  const trendDesc = trendFlat
    ? `Sin cambios relevantes por día en el periodo (R² = ${fmtEs(r2, 2)}).`
    : `${trendDown ? "Reducción" : "Aumento"} de ${fmtEs(Math.abs(round1(slope)), 2)} ${unit} por cada día natural (R² = ${fmtEs(r2, 2)}).`;

  const medianDesc = med > m * 1.05
    ? `La mitad de los días registran menos de ${fmtEs(round1(med), 0)} ${unit}. Por encima de la media: unos pocos días bajos la reducen.`

const GEMINI_MODEL_FALLBACKS = ["gemini-3.8-flash", "gemini-flash-latest", "gemini-2.5-flash-lite", "gemini-2.5-flash"];
const GEMINI_KEY_STORAGE = "incontrol-gemini-api-key";
const GEMINI_MODELS_CACHE = "incontrol-gemini-models";
const GEMINI_RETRYABLE_MSG = /no longer available|not found|not supported|overloaded|high demand|unavailable|deprecated|quota|exhausted|try again/i;

// Pregunta a Google qué modelos puede usar esta clave y elige los Flash más recientes
async function discoverGeminiModels(apiKey) {
  try {
    const cached = JSON.parse(localStorage.getItem(GEMINI_MODELS_CACHE) || "null");
    if (cached && Date.now() - cached.at < 6 * 3600 * 1000 && cached.list && cached.list.length) return cached.list;
  } catch (e) { /* sin caché */ }
  try {
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": apiKey } });
    if (!r.ok) return [];
    const j = await r.json();
    const names = (j.models || [])
      .filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
      .map((m) => String(m.name).replace(/^models\//, ""))
      .filter((n) => /^gemini-/.test(n) && !/(image|tts|live|embedding|audio|robotics|computer|vision|learnlm|aqa|-exp|customtools)/i.test(n));
    const ver = (n) => { const m = n.match(/^gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
    const tier = (n) => (/flash-lite/.test(n) ? 2 : /flash/.test(n) ? 1 : /pro/.test(n) ? 3 : 4);
    const preview = (n) => (/preview|\d{2}-\d{2,4}$|-\d{3}$/.test(n) ? 1 : 0);
    const list = names.sort((x, y) => tier(x) - tier(y) || preview(x) - preview(y) || ver(y) - ver(x)).slice(0, 6);
    try { localStorage.setItem(GEMINI_MODELS_CACHE, JSON.stringify({ at: Date.now(), list })); } catch (e) { /* sin caché */ }
    return list;
  } catch (e) {
    return [];
  }
}

async function callGeminiWithFallback(apiKey, contents, attempt = 1) {
  const discovered = await discoverGeminiModels(apiKey);
  const queue = [...new Set([...discovered, ...GEMINI_MODEL_FALLBACKS])];
  const tried = new Set();
  let lastErr = null;
  let allRetryable = true;
  while (queue.length) {
    const model = queue.shift();
    if (tried.has(model)) continue;
    tried.add(model);
    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
          body: JSON.stringify({ contents }),
        }
      );
      if (!response.ok) {
        const errBody = await response.json().catch(() => null);
        const msg = (errBody && errBody.error && errBody.error.message) || `Error ${response.status}`;
        const retryable = response.status === 404 || response.status === 429 || response.status === 503 || GEMINI_RETRYABLE_MSG.test(msg);
        if (retryable) {
          lastErr = new Error(msg);
          // Si Google sugiere otro modelo en el mensaje, pruébalo el primero
          const suggested = (msg.match(/models\/(gemini-[\w.\-]+)/g) || []).map((x) => x.replace("models/", "")).filter((x) => !tried.has(x));
          if (suggested.length) queue.unshift(...suggested);
          try { localStorage.removeItem(GEMINI_MODELS_CACHE); } catch (e) { /* ok */ }
          continue;
        }
        allRetryable = false;
        throw new Error(msg);
      }
      const json = await response.json();
      if (!json.candidates || !json.candidates.length) {
        const blockReason = json.promptFeedback && json.promptFeedback.blockReason;
        throw new Error(blockReason ? `Respuesta bloqueada por Gemini (${blockReason}).` : "Respuesta vacía de Gemini.");
      }
      const parts = (json.candidates[0].content && json.candidates[0].content.parts) || [];
      const text = parts.filter((p) => !p.thought).map((p) => p.text || "").filter(Boolean).join("\n");
      if (!text) throw new Error("Respuesta vacía");
      return text;
    } catch (e) {
      if (e && e.message === "Failed to fetch") { lastErr = e; allRetryable = false; break; }
      lastErr = e;
      if (!GEMINI_RETRYABLE_MSG.test(e.message || "")) { allRetryable = false; break; }
    }
  }
  if (allRetryable && attempt < 2) {
    await new Promise((r) => setTimeout(r, 2500));
    return callGeminiWithFallback(apiKey, contents, attempt + 1);
  }
  throw lastErr || new Error("No se pudo generar el informe.");
}

function RichText({ text, size = 14.5 }) {
  const COLORS = useTheme();
  const inline = (t, key) => t.split(/(\*\*[^*]+\*\*)/g).map((part, i) =>
    part.startsWith("**") && part.endsWith("**") && part.length > 4
      ? <strong key={key + "-" + i}>{part.slice(2, -2)}</strong>
      : <React.Fragment key={key + "-" + i}>{part.replace(/\*/g, "")}</React.Fragment>
  );
  const lines = String(text || "").split("\n");
  const out = [];
  let list = [];
  const flush = () => { if (list.length) { out.push(<ul key={"ul" + out.length} style={{ margin: "4px 0 10px", paddingLeft: 20 }}>{list}</ul>); list = []; } };
  lines.forEach((raw, i) => {
    const line = raw.trim();
    if (!line) { flush(); return; }
    const h = line.match(/^#{1,4}\s+(.*)$/);
    const b = line.match(/^[-*•]\s+(.*)$/);
    if (h) {
      flush();
      out.push(<div key={i} style={{ fontSize: size + 2, fontWeight: 800, letterSpacing: "-0.01em", color: COLORS.teal, margin: "18px 0 6px" }}>{inline(h[1], "h" + i)}</div>);
    } else if (b) {
      list.push(<li key={i} style={{ marginBottom: 4 }}>{inline(b[1], "l" + i)}</li>);
    } else {
      flush();
      out.push(<p key={i} style={{ margin: "0 0 8px" }}>{inline(line, "p" + i)}</p>);
    }
  });
  flush();
  return <div style={{ fontSize: size, lineHeight: 1.65, color: COLORS.ink }}>{out}</div>;
}

Primero la evolución dentro del periodo elegido (si mejora, empeora o está estable, con cifras; días más altos y más bajos y lo que pudo influir según las notas). Después, la evolución POR MESES de todo el historial: comenta mes a mes los últimos meses (pérdida, líquido, noches, escapes), di si la tendencia es de mejora, empeoramiento o estabilidad y qué pudo influir según las notas. Si el mes en curso está incompleto, adviértelo y no lo compares como si estuviera entero. Explica la tendencia con palabras sencillas (por ejemplo «cada mes pierdes algo menos que el anterior»), no solo con porcentajes.
## Qué opina cada especialista
- **Urología:** ...
- **Oncología:** ...
- **Rehabilitación:** ...
- **Fisioterapia:** ...
(Dos o tres frases útiles de cada uno, sin repetirse.)
## Consejos prácticos
Entre 5 y 8 consejos concretos y realizables: reparto de líquidos, bebidas que irritan la vejiga, hábitos al ir al baño, ejercicios de suelo pélvico en términos generales, estreñimiento, cuidado de la piel, anotaciones que convendría añadir al diario.
## Cuándo consultar sin esperar
Señales de alarma: sangre en la orina, fiebre o dolor al orinar, imposibilidad de orinar, aumento brusco de las pérdidas, entre otras.
## Preguntas para llevar a tu consulta
Tres o cuatro preguntas concretas basadas en estos datos.
## Nota final
Recuerda en una frase que es una simulación educativa generada por IA y que no sustituye a su equipo médico.

DATOS

- Cambios de pañal al día: media ${round1(changeStats.mean)}.

Evolución: ${evolutionText}

Comparativa entre periodos: ${periodsText}

${DAY_START !== "00:00" ? `Nota importante: cada «día» de los datos va desde las ${DAY_START} hasta las ${DAY_START} del día siguiente (no es el día natural), así que la noche pertenece al día que acaba de terminar.\n\n` : ""}Evolución por meses (todo el historial, últimos meses):

Serie diaria:
${seriesText}
${diaryBlock ? `\n${diaryBlock}\n` : ""}`;

    lastPromptRef.current = prompt;

    try {
      const text = await callGeminiWithFallback(apiKey, [{ role: "user", parts: [{ text: prompt }] }]);
      setReport(text);
      setLastReport({ report: text, conversation: [], prompt, preset, range, generatedAt: Date.now() });
    } catch (e) {
      setError(e && e.message === "Failed to fetch" ? "Error de conexión con Gemini." : `Error: ${e.message}`);
    } finally {
      setLoading(false);
    }
  }, [filtered, range, liquidStats, diaperStats, changeStats, apiKey, preset, setLastReport, dailyAgg]);

  const askFollowUp = useCallback(async () => {
    const q = followUpText.trim();
    if (!q) return;
    if (!apiKey) { setAskError("Falta la clave de API de Gemini. Introdúcela arriba, en «Clave de Gemini»."); setShowKeyField(true); return; }
    setAskLoading(true); setAskError("");
    try {
      // Un único mensaje con todo el contexto: funciona con cualquier modelo y también con informes guardados de versiones anteriores
      const ctx = lastPromptRef.current || (lastReport && lastReport.prompt) || "";
      const previous = conversation.map((qa, i) => `Pregunta ${i + 1}: ${qa.question}\nRespuesta ${i + 1}: ${qa.answer}`).join("\n\n");
      const text = `${ctx ? `CONTEXTO (datos y petición originales):\n${ctx}\n\n` : ""}INFORME QUE YA SE ENTREGÓ:\n${report || "(no disponible)"}\n\n${previous ? `CONVERSACIÓN PREVIA:\n${previous}\n\n` : ""}NUEVA PREGUNTA DE LA PERSONA: ${q}\n\nResponde como el mismo equipo (urología, oncología, rehabilitación y fisioterapia), con lenguaje sencillo y sin tecnicismos, de forma breve y prudente, sin diagnosticar ni recetar. Indica qué especialista responde cuando sea relevante. Responde solo a la nueva pregunta.`;
      const answer = await callGeminiWithFallback(apiKey, [{ role: "user", parts: [{ text }] }]);
      const nextConversation = [...conversation, { question: q, answer }];
      setConversation(nextConversation);
      setFollowUpText("");
      setLastReport({ ...(lastReport || {}), report, prompt: ctx, preset, range, conversation: nextConversation, generatedAt: (lastReport && lastReport.generatedAt) || Date.now() });
    } catch (e) {
      setAskError(e && e.message === "Failed to fetch" ? "No hay conexión con Gemini. Revisa tu conexión e inténtalo de nuevo." : `No se pudo responder: ${e.message}`);
    } finally {
      setAskLoading(false);
    }
  }, [followUpText, apiKey, report, conversation, lastReport, setLastReport, preset, range]);

  if (dailyAgg.length === 0) {
    return <EmptyState icon={FileText} text="Registra datos en el diario antes de generar un informe." />;
  }

  return (
    <div>
      <div style={{ background: COLORS.card, borderRadius: 24, padding: 20, boxShadow: COLORS.shadowSm, marginBottom: 18 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, gap: 8 }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 17, letterSpacing: "-0.02em" }}>Informe del equipo clínico</div>
            <div style={{ fontSize: 12.5, color: COLORS.inkSoft }}>Periodo: {fmtDateLabel(range.start)} — {fmtDateLabel(range.end)}</div>
          </div>
          <button
            onClick={() => setShowKeyField((s) => !s)}
            style={{
              display: "flex", alignItems: "center", gap: 5,
              padding: "8px 12px", borderRadius: 99, border: "none",
              background: apiKey ? COLORS.tealSoft : COLORS.inputBg,
              color: apiKey ? COLORS.teal : COLORS.inkSoft,
              fontSize: 12, fontWeight: 700,
            }}
          >
            <KeyRound size={13} /> {apiKey ? "API lista" : "Clave API"}
          </button>
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
          {[["Urología", Activity], ["Oncología", Pill], ["Rehabilitación", Gauge], ["Fisioterapia", Sparkles]].map(([n, Ic]) => (
            <span key={n} style={{ display: "inline-flex", alignItems: "center", gap: 5, background: COLORS.tealSoft, color: COLORS.teal, borderRadius: 99, padding: "4px 10px", fontSize: 11.5, fontWeight: 700 }}>
              <Ic size={12} /> {n}
            </span>
          ))}
        </div>
        <div style={{ fontSize: 11.5, color: COLORS.inkSoft, lineHeight: 1.45, marginBottom: 14 }}>
          Equipo simulado con IA que analiza tus datos y te lo explica sin tecnicismos. No son médicos reales: es información educativa que no sustituye a tu equipo médico.
        </div>

        {showKeyField && (
          <div style={{ marginBottom: 16, padding: 14, borderRadius: 16, background: COLORS.inputBg }}>
            <Field label="Clave de API de Google Gemini">
              <input type="password" value={apiKey} onChange={(e) => saveApiKey(e.target.value)} placeholder="AIzaSy..." style={{ width: "100%", background: COLORS.card }} />
            </Field>
            <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 8 }}>
              Se guarda solo en tu dispositivo. Obtén una gratis en <span className="num">aistudio.google.com/apikey</span>.
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
          {PRESETS.map((p) => (
            <button
              key={p.id}
              onClick={() => setPreset(p.id)}
              style={{
                padding: "7px 14px", borderRadius: 99, fontSize: 12.5, fontWeight: 700, border: "none",
                background: preset === p.id ? COLORS.teal : COLORS.inputBg,
                color: preset === p.id ? "#fff" : COLORS.inkSoft,
              }}
            >
              {p.label}
            </button>
          ))}
        </div>

        <button
          onClick={generate}
          disabled={loading}
          style={{
            width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
            background: COLORS.teal, color: "#fff", border: "none",
            borderRadius: 16, padding: "14px", fontWeight: 800, fontSize: 14.5,
            opacity: loading ? 0.7 : 1,
          }}
        >
          {loading ? <Loader2 size={17} style={{ animation: "spin 1s linear infinite" }} /> : <Sparkles size={17} />}
          {loading ? "El equipo está revisando tus registros…" : "Generar informe del equipo"}
        </button>
        <style>{`@keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }`}</style>
      </div>

      {error && (
        <div style={{ display: "flex", gap: 8, alignItems: "center", background: COLORS.roseSoft, color: COLORS.rose, borderRadius: 16, padding: "12px 16px", marginBottom: 16, fontSize: 13, fontWeight: 600 }}>
          <AlertCircle size={17} /> {error}
        </div>
      )}

      {report && (
        <ThemeContext.Provider value={printMode ? LIGHT_COLORS : COLORS}>
        <div ref={printRef} style={{ background: printMode ? LIGHT_COLORS.paper : "transparent" }}>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }} className="no-print">
            <button onClick={() => { setPrintMode(true); setTimeout(() => { printElement(printRef, "Incontrol · Informe clínico"); setPrintMode(false); }, 250); }} style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.card, color: COLORS.ink, border: "none", borderRadius: 99, padding: "8px 14px", fontSize: 12.5, fontWeight: 700, boxShadow: COLORS.shadowSm }}>
              <Printer size={14} color={COLORS.teal} /> Exportar PDF
            </button>
          </div>
          <div style={{ background: COLORS.card, borderRadius: 24, padding: 22, boxShadow: COLORS.shadowSm }}>
            <RichText text={report} />
            <div style={{ marginTop: 16, paddingTop: 12, borderTop: `1px solid ${COLORS.line}`, fontSize: 11.5, color: COLORS.inkSoft, lineHeight: 1.5 }}>
              Informe generado por un equipo simulado con IA (urología, oncología, rehabilitación y fisioterapia). Es una simulación educativa y no sustituye la valoración de un profesional sanitario.
            </div>
          </div>

          {conversation.length > 0 && (
            <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 10 }}>
              {conversation.map((qa, i) => (
                <div key={i} style={{ background: COLORS.card, borderRadius: 20, padding: 18, boxShadow: COLORS.shadowSm }}>
                  <div style={{ fontSize: 13.5, fontWeight: 800, color: COLORS.teal, marginBottom: 8 }}>{qa.question}</div>
                  <RichText text={qa.answer} size={14} />
                </div>
              ))}
            </div>
          )}

          <div className="no-print" style={{ marginTop: 16, background: COLORS.card, borderRadius: 20, padding: 14, boxShadow: COLORS.shadowSm }}>
            {askError && <div style={{ color: COLORS.rose, fontSize: 12.5, marginBottom: 8, fontWeight: 600 }}>{askError}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <input type="text" value={followUpText} onChange={(e) => setFollowUpText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !askLoading) askFollowUp(); }} placeholder="Pregunta algo sobre tu informe…" style={{ flex: 1 }} disabled={askLoading} />
              <button onClick={askFollowUp} disabled={askLoading || !followUpText.trim()} style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 14, padding: "0 18px", fontWeight: 700, fontSize: 13.5, opacity: askLoading || !followUpText.trim() ? 0.5 : 1 }}>
                {askLoading ? "…" : "Enviar"}
              </button>
            </div>
          </div>
        </div>
        </ThemeContext.Provider>
      )}
    </div>
  );
}

function App() {
  return (
    <ErrorBoundary>
      <IncontrolApp />
    </ErrorBoundary>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
