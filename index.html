const XLSX = window.XLSX;

// ---------- almacenamiento local ----------
// Sustituye a `window.storage` (la API propia del entorno de artefactos de Claude)
// por un polyfill con la misma forma, respaldado por localStorage del navegador.
// Así el resto del código de guardado/carga funciona sin ningún cambio.
// IMPORTANTE: a diferencia del almacenamiento de Claude, localStorage vive SOLO en
// este navegador y este dispositivo concreto — no es accesible desde otro
// ordenador, móvil o navegador, y puede borrarse si limpias los datos de
// navegación. Usa "Exportar todo a Excel" con regularidad como copia de seguridad.
(function installStoragePolyfill() {
  if (window.storage) return;
  const NS = "incontrol:";
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(NS + key);
      if (raw === null) throw new Error("clave no encontrada: " + key);
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(NS + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(NS + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const p = NS + (prefix || "");
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(NS.length));
      return { keys, prefix: prefix || "", shared: false };
    },
  };
})();

// ---------- utilidades ----------
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
// Formatea un objeto Date usando sus componentes LOCALES (no toISOString, que
// convierte a UTC y puede desplazar la fecha un día en husos horarios positivos
// como el de España, sobre todo en las primeras horas del día).
// Una nota del día puede ser texto antiguo (solo título) o {title, detail}
function noteParts(v) {
  if (!v) return { title: "", detail: "" };
  if (typeof v === "string") return { title: v, detail: "" };
  return { title: v.title || "", detail: v.detail || "" };
}

// ---------- recordatorios de toma de líquido ----------
function beep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    [0, 0.35, 0.7].forEach((t) => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.28);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
    });
    setTimeout(() => ctx.close && ctx.close(), 1500);
  } catch (e) {}
}

async function notifyDrink(time) {
  const title = "Incontrol · hora de beber";
  const opts = { body: `Toca tu toma de líquido de las ${time}.`, tag: "incontrol-" + time, requireInteraction: true, vibrate: [300, 150, 300] };
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg && reg.showNotification) { reg.showNotification(title, opts); return; }
    }
    new Notification(title, opts);
  } catch (e) {}
}

function buildReminderIcs(times) {
  const pad = (n) => String(n).padStart(2, "0");
  const d = new Date();
  const ymd = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const stamp = `${ymd}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Incontrol//Recordatorios//ES", "CALSCALE:GREGORIAN"];
  times.forEach((t) => {
    const [h, m] = t.split(":");
    lines.push(
      "BEGIN:VEVENT",
      `UID:incontrol-${h}${m}@incontrol.app`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${ymd}T${h}${m}00`,
      `DTEND:${ymd}T${h}${m}00`,
      "RRULE:FREQ=DAILY",
      "SUMMARY:Incontrol - Hora de beber",
      "DESCRIPTION:Toma de liquido programada. Anotala en Incontrol.",
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Hora de beber", "TRIGGER:PT0M", "END:VALARM",
      "BEGIN:VALARM", "ACTION:AUDIO", "TRIGGER:PT0M", "END:VALARM",
      "END:VEVENT"
    );
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

function downloadIcs(times) {
  const blob = new Blob([buildReminderIcs(times)], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "incontrol-recordatorios.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function toLocalIsoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
const todayStr = () => toLocalIsoDate(new Date());
const nowTimeStr = () => new Date().toTimeString().slice(0, 5);
const fmtDateLabel = (isoDate) => {

};
const fmtDateFull = (isoDate) => {
  const d = new Date(isoDate + "T00:00:00");
  return d.toLocaleDateString("es-ES", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
};

const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const fmtDateShort = (isoDate) => {
  const d = new Date(isoDate + "T00:00:00");
  return `${String(d.getDate()).padStart(2, "0")}-${MESES[d.getMonth()]}`;
};

// Calcula la diferencia en días naturales entre dos fechas ISO (YYYY-MM-DD).
// Se usa como eje X real de la regresión, para que la pendiente sea siempre
// "unidad / día natural" aunque falten días sin registro entre medias.
function dayOffset(isoStart, isoDate) {
  const a = new Date(isoStart + "T00:00:00");
  const b = new Date(isoDate + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
// Inversa de dayOffset: dada una fecha de inicio y un número de días transcurridos,
// devuelve la fecha ISO resultante. Se usa para etiquetar el eje X numérico del
// gráfico (proporcional al tiempo real, no a la posición en la lista de puntos).
function addDaysIso(isoStart, n) {
  const d = new Date(isoStart + "T00:00:00");
  d.setDate(d.getDate() + Math.round(n));
  return toLocalIsoDate(d);
}

// xs opcional: posiciones reales en el eje X (p. ej. días transcurridos desde el
// primer punto). Si no se indica, usa el índice del array como antes.
function linreg(values, xs) {
  const n = values.length;
  if (n < 2) return { slope: 0, intercept: values[0] || 0, r2: 0 };
  if (!xs) xs = values.map((_, i) => i);
  const xMean = mean(xs), yMean = mean(values);
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - xMean) * (values[i] - yMean); den += (xs[i] - xMean) ** 2; }
  const slope = den === 0 ? 0 : num / den;
  const intercept = yMean - slope * xMean;
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < n; i++) {
    const pred = intercept + slope * xs[i];
    ssRes += (values[i] - pred) ** 2;
    ssTot += (values[i] - yMean) ** 2;
  }
  const r2 = ssTot === 0 ? 0 : 1 - ssRes / ssTot;
  return { slope, intercept, r2 };
}

const fmtEs = (n, decimals = 0) => n.toLocaleString("es-ES", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });

const MESES_LARGO = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const fmtDateLong = (isoDate) => {
  const d = new Date(isoDate + "T00:00:00");
  return `${d.getDate()} de ${MESES_LARGO[d.getMonth()]}`;
};

// ---------- exportación ----------
function downloadWorkbook(sheets, filename) {
  const wb = XLSX.utils.book_new();
  for (const [name, rowsOrSheet] of sheets) {
    const ws = Array.isArray(rowsOrSheet)
      ? XLSX.utils.json_to_sheet(rowsOrSheet.length ? rowsOrSheet : [{ " ": "Sin datos" }])
      : rowsOrSheet; // ya es una hoja construida a mano (p. ej. la portada)
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  }
  XLSX.writeFile(wb, filename);
}

// Hoja de portada con la marca de la app, fecha de generación y periodo — para
// que el documento tenga un aspecto de informe profesional al compartirlo.
function buildCoverSheet(subtitle, periodText) {
  const rows = [
    ["Incontrol"],
    ["Diario de control de incontinencia — " + subtitle],
    [""],
    ["Generado el", new Date().toLocaleString("es-ES", { dateStyle: "long", timeStyle: "short" })],
    ["Periodo", periodText],
    [""],
    ["Este documento es un registro personal de seguimiento."],
    ["No sustituye la valoración de un profesional sanitario."],
  ];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 16 }, { wch: 46 }];
  return ws;
}

function exportAllExcel(data, dailyAgg) {
  const liquidRows = [...data.liquids]
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((l) => ({ Fecha: l.date, Hora: l.time, "Cantidad (ml)": l.amount, Nota: l.note || "" }));
  const diaperRows = [...data.diapers]
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((p) => ({
      Fecha: p.date, Hora: p.time, "Peso total (g)": p.weight,
      "Peso seco (g)": p.dryWeight === "" || p.dryWeight === undefined ? "" : p.dryWeight,
      "Peso neto (g)": round1(netWeight(p.weight, p.dryWeight)), Nota: p.note || "",
    }));
  const summaryRows = dailyAgg.map((d) => ({
    Fecha: d.date, "Líquido total (ml)": round1(d.liquidTotal), "Tomas de líquido": d.liquidCount,
    "Peso neto pañales (g)": round1(d.diaperTotal), "Cambios de pañal": d.diaperCount, "Nota del día": d.dayNote || "", "Detalle de la nota": d.dayNoteDetail || "",
    Severidad: classifyLoss(d.diaperTotal)?.label || "",
    Micciones: d.voidCount, "Micciones nocturnas": d.nightVoids, Escapes: d.leakCount,
    "Orina nocturna (%)": d.nightUrine + d.dayUrine > 0 ? round1((d.nightUrine / (d.nightUrine + d.dayUrine)) * 100) : "",
  }));
  const voidRows = [...(data.voids || [])].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((v) => ({ Fecha: v.date, Hora: v.time, "Volumen (ml)": v.volume === "" ? "" : v.volume, Nocturna: isNightTime(v.time) ? "Sí" : "No", Nota: v.note || "" }));
  const leakRows = [...(data.leaks || [])].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .map((l) => ({ Fecha: l.date, Hora: l.time, Desencadenante: (LEAK_TRIGGERS.find((t) => t.id === l.trigger) || {}).label || l.trigger, Cantidad: l.amount, Nota: l.note || "" }));
  const periodText = dailyAgg.length ? `${dailyAgg[0].date} — ${dailyAgg[dailyAgg.length - 1].date}` : "Sin registros todavía";
  const cover = buildCoverSheet("diario completo", periodText);
  downloadWorkbook(
    [["Portada", cover], ["Líquidos", liquidRows], ["Pañales", diaperRows], ["Micciones", voidRows], ["Escapes", leakRows], ["Resumen diario", summaryRows]],
    `incontrol-diario-${todayStr()}.xlsx`
  );
}

function exportRangeExcel(filtered, liquidStats, diaperStats, range) {
  const rows = filtered.map((d) => ({
    Fecha: d.date, "Líquido (ml)": round1(d.liquidTotal), "Peso neto (g)": round1(d.diaperTotal), Cambios: d.diaperCount, "Nota del día": d.dayNote || "", "Detalle de la nota": d.dayNoteDetail || "",
    Severidad: classifyLoss(d.diaperTotal)?.label || "",
  }));
  const cvOf = (s) => (s.mean > 0 ? round1((s.sd / s.mean) * 100) : 0);
  const statsRows = [
    { Métrica: "Líquido (ml/día)", Media: round1(liquidStats.mean), Mediana: round1(liquidStats.median), "Desv. típica": round1(liquidStats.sd), "Coef. variación (%)": cvOf(liquidStats), Máximo: round1(liquidStats.max), Mínimo: round1(liquidStats.min) },
    { Métrica: "Peso neto (g/día)", Media: round1(diaperStats.mean), Mediana: round1(diaperStats.median), "Desv. típica": round1(diaperStats.sd), "Coef. variación (%)": cvOf(diaperStats), Máximo: round1(diaperStats.max), Mínimo: round1(diaperStats.min) },
  ];
  const cover = buildCoverSheet("periodo seleccionado", `${range.start} — ${range.end}`);
  downloadWorkbook(
    [["Portada", cover], ["Serie diaria", rows], ["Estadísticas del periodo", statsRows]],
    `incontrol-periodo-${range.start}_a_${range.end}.xlsx`
  );
}

// Exporta a PDF (vía el diálogo de impresión del navegador) únicamente el
// contenido del elemento referenciado. En vez de ocultar el resto de la app con
// CSS (visibilty:hidden), que en muchos navegadores producía páginas en blanco
// al imprimir gráficos SVG, clona el HTML ya renderizado (con las dimensiones
// reales del gráfico ya calculadas) en una ventana nueva dedicada solo a imprimir.
function printElement(ref, title) {
  const el = ref && ref.current;
  if (!el) return;
  const w = window.open("", "_blank", "width=900,height=1200");
  if (!w) {
    alert("El navegador ha bloqueado la ventana emergente necesaria para exportar a PDF. Permite ventanas emergentes para este sitio e inténtalo de nuevo.");
    return;

  const docTitle = title || "Incontrol";
  const generatedAt = new Date().toLocaleString("es-ES", { dateStyle: "long", timeStyle: "short" });
  const logoSvg = `<svg width="40" height="40" viewBox="0 0 512 512" style="border-radius:9px;flex-shrink:0;">
    <defs><linearGradient id="pdfBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3C8F86"/><stop offset="100%" stop-color="#173F3C"/></linearGradient></defs>
    <rect width="512" height="512" rx="118" fill="url(#pdfBg)"/>
    <path d="M256 118C256 118 208 190 208 228C208 256.5 229.5 278 256 278C282.5 278 304 256.5 304 228C304 190 256 118 256 118Z" fill="#fff"/>
    <rect x="234" y="262" width="44" height="150" rx="22" fill="#fff"/>
  </svg>`;
  w.document.open();
  w.document.write(`<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; background: #fff; font-family: Inter, ui-sans-serif, sans-serif; color: #1E2B2A; }
  .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .no-print { display: none !important; }
  .pdf-header { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; margin-bottom: 22px; border-bottom: 2px solid #E4E0D4; }
  .pdf-header .brand { font-weight: 800; font-size: 19px; letter-spacing: -0.01em; color: #1E2B2A; }

<body>
  <div class="pdf-header">
    ${logoSvg}
    <div>
      <div class="brand">Incontrol</div>
      <div class="meta">${docTitle} · Generado el ${generatedAt}</div>
    </div>
  </div>
  ${el.outerHTML}
  <div class="pdf-footer">
    Documento generado automáticamente por Incontrol a partir del registro personal del usuario. Este contenido, incluido cualquier análisis o informe de apoyo generado por IA, tiene fines informativos y de seguimiento; no constituye un diagnóstico médico ni sustituye la valoración de un profesional sanitario.
  </div>
</body>
</html>`);
  w.document.close();
  // Espera a que las fuentes y el layout (incluido el SVG del gráfico) se
  // asienten antes de abrir el diálogo de impresión.
  const doPrint = () => setTimeout(() => { w.focus(); w.print(); }, 350);
  if (w.document.readyState === "complete") doPrint();
  else w.addEventListener("load", doPrint);
}

function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}
function stddev(arr) {
  if (arr.length < 2) return 0;
  const m = mean(arr);
  const variance = arr.reduce((a, b) => a + (b - m) ** 2, 0) / (arr.length - 1);
  return Math.sqrt(variance);
}
function statsOf(arr) {
  if (!arr.length) return { mean: 0, median: 0, sd: 0, max: 0, min: 0, n: 0 };
  return { mean: mean(arr), median: median(arr), sd: stddev(arr), max: Math.max(...arr), min: Math.min(...arr), n: arr.length };
}
const round1 = (n) => Math.round(n * 10) / 10;

// Clasificación orientativa de severidad según el peso neto total absorbido en el día.
// No es un criterio diagnóstico: son umbrales de referencia general, ajustables si el
// profesional sanitario indica otros valores para el caso concreto.
const SEVERITY_THRESHOLDS = { leve: 100, moderada: 300, severa: 600 };
function classifyLoss(gramsPerDay) {
  if (gramsPerDay === null || gramsPerDay === undefined || gramsPerDay <= 0) return null;
  if (gramsPerDay < SEVERITY_THRESHOLDS.leve) return { label: "Leve", color: "#3E8A6D", bg: "#E3F1EA" };
  if (gramsPerDay < SEVERITY_THRESHOLDS.moderada) return { label: "Moderada", color: "#B6841F", bg: "#F5EAD3" };
  if (gramsPerDay < SEVERITY_THRESHOLDS.severa) return { label: "Severa", color: "#C1502E", bg: "#F5E0D6" };
  return { label: "Muy severa", color: "#9A2E20", bg: "#F3DCD8" };
}
const netWeight = (weight, dryWeight) => Math.max(0, (Number(weight) || 0) - (Number(dryWeight) || 0));

// Clasificación orientativa de la ingesta diaria de líquido para una persona con
// incontinencia. La referencia general de hidratación adecuada suele situarse en
// torno a 1500–2500 ml/día; restringir líquidos por debajo de eso no reduce la
// incontinencia y sí aumenta el riesgo de orina concentrada e irritación de la
// vejiga. No es una prescripción médica: los umbrales pueden variar según edad,
// peso, medicación o indicación de un profesional sanitario.
const LIQUID_RECOMMENDED = 1500; // ml/día, valor de referencia mostrado en la etiqueta
const LIQUID_THRESHOLDS = { insuficiente: 1000, poco: 1500, mucho: 2500 };
function classifyLiquid(mlPerDay) {
  if (mlPerDay === null || mlPerDay === undefined || mlPerDay <= 0) return null;
  if (mlPerDay < LIQUID_THRESHOLDS.insuficiente) return { label: "Insuficiente", color: "#9A2E20", bg: "#F3DCD8" };
  if (mlPerDay < LIQUID_THRESHOLDS.poco) return { label: "Poco", color: "#B6841F", bg: "#F5EAD3" };
  if (mlPerDay <= LIQUID_THRESHOLDS.mucho) return { label: "Adecuado", color: "#3E8A6D", bg: "#E3F1EA" };
  return { label: "Mucho", color: "#B6841F", bg: "#F5EAD3" };
}

// ---------- almacenamiento de datos de la app (sobre window.storage) ----------
// Líquidos, pesajes y notas del día se guardan en entradas de almacenamiento independientes
// (nunca mezclados en el mismo registro).
// ---------- diario miccional: constantes y análisis ----------
const NIGHT_START = "23:00", NIGHT_END = "07:00"; // ventana nocturna orientativa
const isNightTime = (t) => !!t && (t >= NIGHT_START || t < NIGHT_END);
const LEAK_TRIGGERS = [
  { id: "esfuerzo", label: "Esfuerzo (tos, risa, ejercicio)", short: "Esfuerzo" },
  { id: "urgencia", label: "Urgencia", short: "Urgencia" },
  { id: "sinaviso", label: "Sin aviso", short: "Sin aviso" },
  { id: "otro", label: "Otro", short: "Otro" },
];
const LEAK_AMOUNTS = ["Gotas", "Moderado", "Abundante"];

function summarizeDiary(days) {
  const sum = (arr, f) => arr.reduce((a, d) => a + f(d), 0);
  const withVoid = days.filter((d) => d.voidCount > 0);
  const withDiary = days.filter((d) => d.voidCount > 0 || d.leakCount > 0);
  const nightJarraDays = days.filter((d) => d.nightVoidVol > 0);
  const dayVolCount = sum(days, (d) => d.dayVoidVolCount);
  const night = sum(days, (d) => d.nightUrine);
  const dayU = sum(days, (d) => d.dayUrine);
  const byTrigger = {};
  LEAK_TRIGGERS.forEach((t) => { byTrigger[t.id] = sum(days, (d) => d.leakByTrigger[t.id] || 0); });
  const totalLeaks = sum(days, (d) => d.leakCount);
  const totalVoids = sum(days, (d) => d.voidCount);
  return {
    nVoidDays: withVoid.length,
    nDiaryDays: withDiary.length,
    totalVoids, totalLeaks,
    voidsPerDay: withVoid.length ? totalVoids / withVoid.length : null,
    nocturia: withVoid.length ? sum(withVoid, (d) => d.nightVoids) / withVoid.length : null,
    nightVolPerNight: nightJarraDays.length ? sum(nightJarraDays, (d) => d.nightVoidVol) / nightJarraDays.length : null,
    leaksPerDay: withDiary.length ? totalLeaks / withDiary.length : null,
    byTrigger,
    nightUrine: night, dayUrine: dayU,
    npi: dayVolCount > 0 && night + dayU > 0 ? (night / (night + dayU)) * 100 : null,
  };
}

function leakPattern(sm) {
  if (!sm || sm.totalLeaks < 3) return null;
  const e = sm.byTrigger.esfuerzo / sm.totalLeaks, u = sm.byTrigger.urgencia / sm.totalLeaks;
  if (e >= 0.3 && u >= 0.3) return "Patrón mixto (esfuerzo y urgencia).";
  if (e >= 0.5) return "Predominio de escapes por esfuerzo.";
  if (u >= 0.5) return "Predominio de escapes por urgencia.";
  return "Sin un patrón claro por desencadenante.";
}

function diaryText(filtered) {
  const sm = summarizeDiary(filtered);
  const lines = [];
  if (sm.nDiaryDays > 0) {
    lines.push(`Diario miccional (${sm.nDiaryDays} días con micciones o escapes anotados):`);
    if (sm.voidsPerDay !== null) lines.push(`- Micciones anotadas por día: media ${round1(sm.voidsPerDay)}. Las nocturnas se recogen en jarra y se miden; las diurnas se anotan sin volumen.`);
    if (sm.nocturia !== null) lines.push(`- Nocturia (micciones entre ${NIGHT_START} y ${NIGHT_END}): media ${round1(sm.nocturia)} por noche.`);
    if (sm.nightVolPerNight !== null) lines.push(`- Volumen nocturno medido en jarra: media ${round1(sm.nightVolPerNight)} ml por noche.`);
    if (sm.npi !== null) lines.push(`- Reparto de la orina estimada: ${round1(sm.npi)} % nocturna frente a ${round1(100 - sm.npi)} % diurna.`);
    if (sm.totalLeaks > 0) lines.push(`- Escapes: ${sm.totalLeaks} en total (${round1(sm.leaksPerDay)} por día); por desencadenante: ${LEAK_TRIGGERS.map((t) => `${t.short} ${sm.byTrigger[t.id]}`).join(", ")}.`);
  }
  return lines.join("\n");
}

const OLD_STORAGE_KEY = "diaper-tracker-entries-v1"; // formato antiguo combinado, solo para migración
const STORAGE_KEY_LIQUIDS = "diaper-tracker-liquids-v1";
const STORAGE_KEY_DIAPERS = "diaper-tracker-diapers-v1";
const STORAGE_KEY_DAYNOTES = "diaper-tracker-daynotes-v1";
const STORAGE_KEY_SETTINGS = "diaper-tracker-settings-v1";
const STORAGE_KEY_LASTREPORT = "diaper-tracker-lastreport-v1";
const STORAGE_KEY_VOIDS = "diaper-tracker-voids-v1";
const STORAGE_KEY_LEAKS = "diaper-tracker-leaks-v1";
const storageAvailable = () => typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";

async function loadData() {
  if (!storageAvailable()) return { data: { liquids: [], diapers: [], dayNotes: {}, settings: {}, lastReport: null, voids: [], leaks: [] }, storageOk: false };

  let liquids = null;
  let diapers = null;
  let dayNotes = null;
  let settings = null;
  let lastReport = null;
  let voids = null, leaks = null;
  try {
    const res = await window.storage.get(STORAGE_KEY_VOIDS, false);
    if (res && res.value) voids = JSON.parse(res.value);
  } catch (e) { /* normal la primera vez */ }
  try {
    const res = await window.storage.get(STORAGE_KEY_LEAKS, false);
    if (res && res.value) leaks = JSON.parse(res.value);
  } catch (e) { /* normal la primera vez */ }
  try {
    const res = await window.storage.get(STORAGE_KEY_LIQUIDS, false);
    if (res && res.value) liquids = JSON.parse(res.value);
  } catch (e) { /* la clave aún no existe la primera vez: es normal */ }
  try {
    const res = await window.storage.get(STORAGE_KEY_DIAPERS, false);
    if (res && res.value) diapers = JSON.parse(res.value);
  } catch (e) { /* la clave aún no existe la primera vez: es normal */ }
  try {
    const res = await window.storage.get(STORAGE_KEY_DAYNOTES, false);
    if (res && res.value) dayNotes = JSON.parse(res.value);
  } catch (e) { /* la clave aún no existe la primera vez: es normal */ }
  try {
    const res = await window.storage.get(STORAGE_KEY_SETTINGS, false);
    if (res && res.value) settings = JSON.parse(res.value);
  } catch (e) { /* la clave aún no existe la primera vez: es normal */ }
  try {
    const res = await window.storage.get(STORAGE_KEY_LASTREPORT, false);
    if (res && res.value) lastReport = JSON.parse(res.value);
  } catch (e) { /* la clave aún no existe la primera vez: es normal */ }

  // migración: si no hay nada en las claves nuevas, comprueba si existen datos
  // del formato antiguo (un único registro combinado) y sepáralos.
  if (liquids === null && diapers === null) {
    try {
      const old = await window.storage.get(OLD_STORAGE_KEY, false);
      if (old && old.value) {
        const parsed = JSON.parse(old.value);
        liquids = parsed.liquids || [];
        diapers = parsed.diapers || [];
        await window.storage.set(STORAGE_KEY_LIQUIDS, JSON.stringify(liquids), false);
        await window.storage.set(STORAGE_KEY_DIAPERS, JSON.stringify(diapers), false);
      }
    } catch (e) { /* no había datos antiguos que migrar */ }
  }

  return { data: { liquids: liquids || [], diapers: diapers || [], dayNotes: dayNotes || {}, settings: settings || {}, lastReport: lastReport || null, voids: voids || [], leaks: leaks || [] }, storageOk: true };
}

async function saveData(data) {
  if (!storageAvailable()) return false;
  try {
    const [resLiquids, resDiapers, resNotes, resSettings, resReport, resVoids, resLeaks] = await Promise.all([
      window.storage.set(STORAGE_KEY_LIQUIDS, JSON.stringify(data.liquids), false),
      window.storage.set(STORAGE_KEY_DIAPERS, JSON.stringify(data.diapers), false),
      window.storage.set(STORAGE_KEY_DAYNOTES, JSON.stringify(data.dayNotes || {}), false),
      window.storage.set(STORAGE_KEY_SETTINGS, JSON.stringify(data.settings || {}), false),
      window.storage.set(STORAGE_KEY_LASTREPORT, JSON.stringify(data.lastReport || null), false),
      window.storage.set(STORAGE_KEY_VOIDS, JSON.stringify(data.voids || []), false),
      window.storage.set(STORAGE_KEY_LEAKS, JSON.stringify(data.leaks || []), false),
    ]);
    return !!resLiquids && !!resDiapers && !!resNotes && !!resSettings && !!resReport && !!resVoids && !!resLeaks;
  } catch (e) {
    console.error("Error guardando datos", e);
    return false;
  }
}

// Red de seguridad: si algo falla de forma inesperada en tiempo de ejecución,
// muestra un mensaje claro en vez de dejar la pantalla en blanco.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null, info: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error("Incontrol · error no controlado:", error, info);
    this.setState({ info });
  }
  render() {
    if (this.state.hasError) {
      const details = [
        this.state.error && (this.state.error.message || String(this.state.error)),
        this.state.error && this.state.error.stack,
        this.state.info && this.state.info.componentStack,
      ].filter(Boolean).join("\n\n");
      return (
        <div style={{ minHeight: "100vh", background: COLORS.paper, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "Inter, sans-serif" }}>
          <div style={{ maxWidth: 480, textAlign: "center", background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 16, padding: 28, boxShadow: COLORS.shadowMd }}>
            <AlertCircle size={28} color="#B23B2E" style={{ marginBottom: 10 }} />
            <div style={{ fontWeight: 800, fontSize: 16, color: COLORS.ink, marginBottom: 6 }}>Algo ha ido mal</div>
            <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 18, lineHeight: 1.5 }}>
              Ha ocurrido un error inesperado al mostrar la app. Tus datos guardados no se han visto afectados.
            </div>
            <button
              onClick={() => window.location.reload()}
              style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 10, padding: "10px 20px", fontWeight: 700, fontSize: 13, marginBottom: 16 }}
            >
              Recargar la app
            </button>
            {details && (
              <details style={{ textAlign: "left" }}>
                <summary style={{ cursor: "pointer", fontSize: 12, color: COLORS.inkSoft, fontWeight: 600 }}>Detalle técnico (para diagnóstico)</summary>
                <pre className="num" style={{ fontSize: 10.5, lineHeight: 1.5, whiteSpace: "pre-wrap", wordBreak: "break-word", background: "#F7F9F9", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: 10, marginTop: 8, maxHeight: 240, overflow: "auto" }}>
                  {details}
                </pre>
              </details>
            )}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function IncontrolApp() {
  const [data, setData] = useState({ liquids: [], diapers: [], dayNotes: {}, settings: {}, lastReport: null, voids: [], leaks: [] });
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("registro");
  const [saveStatus, setSaveStatus] = useState("idle"); // idle | saving | saved | error | unavailable
  const saveTimer = useRef(null);
  const dataRef = useRef(data);
  const skipNextSave = useRef(true); // evita un guardado innecesario justo al cargar los datos
  dataRef.current = data;

  useEffect(() => {
    loadData().then(({ data: d, storageOk }) => {
      setData(d);
      setReady(true);
      if (!storageOk) setSaveStatus("unavailable");
    });
  }, []);

  // recordatorios: comprueba cada 15 s si toca una toma (solo con la app abierta)
  const [dueReminder, setDueReminder] = useState(null);
  const firedRef = useRef({});
  useEffect(() => {
    if (!ready) return;
    const check = () => {
      const r = (dataRef.current.settings || {}).reminders;
      if (!r || !r.enabled || !r.times || !r.times.length) return;
      const now = new Date();
      const day = toLocalIsoDate(now);
      const nowMin = now.getHours() * 60 + now.getMinutes();
      for (const t of r.times) {
        const [h, m] = t.split(":").map(Number);
        const diff = nowMin - (h * 60 + m);
        const key = day + " " + t;
        if (diff >= 0 && diff < 10 && !firedRef.current[key]) {
          firedRef.current[key] = true;
          setDueReminder(t);
          beep();
          try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
          notifyDrink(t);
        }
      }
    };
    check();
    const id = setInterval(check, 15000);
    document.addEventListener("visibilitychange", check);
    return () => { clearInterval(id); document.removeEventListener("visibilitychange", check); };
  }, [ready]);

  const flushSave = useCallback(() => {
    if (saveTimer.current) { clearTimeout(saveTimer.current); saveTimer.current = null; }
    setSaveStatus("saving");
    saveData(dataRef.current).then((ok) => setSaveStatus(ok ? "saved" : "error"));
  }, []);

  useEffect(() => {
    if (!ready) return;
    if (saveStatus === "unavailable") return;
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current = setTimeout(() => {
      saveData(data).then((ok) => setSaveStatus(ok ? "saved" : "error"));
    }, 200);
    return () => clearTimeout(saveTimer.current);
  }, [data, ready, saveStatus]);

  // guardado de emergencia si la app se oculta, pierde el foco o se cierra
  useEffect(() => {
    const onHide = () => { if (saveTimer.current) flushSave(); };
    document.addEventListener("visibilitychange", onHide);
    window.addEventListener("pagehide", onHide);
    window.addEventListener("beforeunload", onHide);
    return () => {
      document.removeEventListener("visibilitychange", onHide);
      window.removeEventListener("pagehide", onHide);
      window.removeEventListener("beforeunload", onHide);
    };
  }, [flushSave]);

  const addLiquid = (entry) => setData((d) => ({ ...d, liquids: [...d.liquids, { id: uid(), ...entry }] }));
  const addDiaper = (entry) => setData((d) => ({ ...d, diapers: [...d.diapers, { id: uid(), ...entry }] }));
  const removeLiquid = (id) => setData((d) => ({ ...d, liquids: d.liquids.filter((x) => x.id !== id) }));
  const removeDiaper = (id) => setData((d) => ({ ...d, diapers: d.diapers.filter((x) => x.id !== id) }));
  const ENTRY_KEYS = { liquido: "liquids", panal: "diapers", miccion: "voids", escape: "leaks" };
  const updateEntry = (kind, id, patch) => setData((d) => {
    const key = ENTRY_KEYS[kind];
    if (!key) return d;
    return { ...d, [key]: (d[key] || []).map((x) => (x.id === id ? { ...x, ...patch } : x)) };
  });
  const restoreData = (incoming, mode) => setData((d) => {
    const arr = (v) => (Array.isArray(v) ? v.filter((x) => x && x.id && x.date) : []);
    const inc = {
      liquids: arr(incoming.liquids), diapers: arr(incoming.diapers), voids: arr(incoming.voids), leaks: arr(incoming.leaks),
      dayNotes: incoming.dayNotes && typeof incoming.dayNotes === "object" ? incoming.dayNotes : {},
      settings: incoming.settings && typeof incoming.settings === "object" ? incoming.settings : {},
    };
    if (mode === "replace") return { ...d, ...inc, lastReport: incoming.lastReport || null };
    const union = (a, b) => { const ids = new Set(a.map((x) => x.id)); return [...a, ...b.filter((x) => !ids.has(x.id))]; };
    return {
      ...d,
      liquids: union(d.liquids || [], inc.liquids), diapers: union(d.diapers || [], inc.diapers),
      voids: union(d.voids || [], inc.voids), leaks: union(d.leaks || [], inc.leaks),
      dayNotes: { ...inc.dayNotes, ...(d.dayNotes || {}) },
      settings: { ...inc.settings, ...(d.settings || {}) },
    };
  });
  const addVoid = (entry) => setData((d) => ({ ...d, voids: [...(d.voids || []), { id: uid(), ...entry }] }));
  const removeVoid = (id) => setData((d) => ({ ...d, voids: (d.voids || []).filter((x) => x.id !== id) }));
  const addLeak = (entry) => setData((d) => ({ ...d, leaks: [...(d.leaks || []), { id: uid(), ...entry }] }));
  const removeLeak = (id) => setData((d) => ({ ...d, leaks: (d.leaks || []).filter((x) => x.id !== id) }));
  const setDayNote = (date, title, detail) => setData((d) => {
    const dayNotes = { ...(d.dayNotes || {}) };
    const t = (title || "").trim(), x = (detail || "").trim();
    if (t || x) dayNotes[date] = { title: t, detail: x }; else delete dayNotes[date];
    return { ...d, dayNotes };
  });
  const setDefault = (key, value) => setData((d) => ({ ...d, settings: { ...(d.settings || {}), [key]: value } }));
  const setLastReport = (report) => setData((d) => ({ ...d, lastReport: report }));

  // días con datos, agregados
  const dailyAgg = useMemo(() => {
    const map = {};
    const ensure = (date) => {
      map[date] = map[date] || { date, liquidTotal: 0, liquidCount: 0, diaperTotal: 0, diaperCount: 0, diaperWeights: [], liquidNotes: [], diaperNotes: [], dayNote: "", voidCount: 0, voidVolume: 0, voidVolCount: 0, nightVoids: 0, nightVoidVol: 0, dayVoidVolCount: 0, urgencySum: 0, leakCount: 0, leakByTrigger: {}, nightUrine: 0, dayUrine: 0 };
      return map[date];
    };
    for (const l of data.liquids) {
      const row = ensure(l.date);
      row.liquidTotal += Number(l.amount) || 0;
      row.liquidCount += 1;
      if (l.note) row.liquidNotes.push(l.note);
    }
    for (const p of data.diapers) {
      const row = ensure(p.date);
      const net = netWeight(p.weight, p.dryWeight);
      row.diaperTotal += net;
      row.diaperCount += 1;
      row.diaperWeights.push(net);
      if (p.note) row.diaperNotes.push(p.note);
      if (isNightTime(p.time)) row.nightUrine += net; else row.dayUrine += net;
    }
    for (const v of (data.voids || [])) {
      const row = ensure(v.date);
      row.voidCount += 1;
      const night = isNightTime(v.time);
      if (night) row.nightVoids += 1;
      const vol = Number(v.volume);
      if (vol > 0) {
        row.voidVolume += vol; row.voidVolCount += 1;
        if (night) { row.nightUrine += vol; row.nightVoidVol += vol; }
        else { row.dayUrine += vol; row.dayVoidVolCount += 1; }
      }
    }
    for (const l of (data.leaks || [])) {
      const row = ensure(l.date);
      row.leakCount += 1;
      row.leakByTrigger[l.trigger] = (row.leakByTrigger[l.trigger] || 0) + 1;
    }
    for (const [date, v] of Object.entries(data.dayNotes || {})) {
      const n = noteParts(v);
      const row = ensure(date);
      row.dayNote = n.title;
      row.dayNoteDetail = n.detail;
    }
    return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
  }, [data]);

  const allDates = dailyAgg.map((d) => d.date);
  const minDate = allDates[0] || todayStr();
  const maxDate = allDates[allDates.length - 1] || todayStr();

  // racha de días consecutivos con al menos un registro, contando hacia atrás
  // desde hoy (si hoy aún no tiene nada, empieza a contar desde ayer para no
  // romper la racha mientras el día está en curso)
  const streak = useMemo(() => {
    if (!allDates.length) return 0;
    const dateSet = new Set(allDates);
    let count = 0;
    const cursor = new Date(todayStr() + "T00:00:00");
    if (!dateSet.has(todayStr())) cursor.setDate(cursor.getDate() - 1);
    while (dateSet.has(toLocalIsoDate(cursor))) {
      count++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return count;
  }, [allDates]);

  const lastDryWeight = useMemo(() => {
    if (!data.diapers.length) return "";
    const sorted = [...data.diapers].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const last = sorted[sorted.length - 1];
    return last.dryWeight ?? "";
  }, [data.diapers]);

  if (!ready) {
    return (
      <div style={{ minHeight: "100vh", background: COLORS.paper, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, fontFamily: "Inter, sans-serif", color: COLORS.inkSoft }}>
        <div style={{ animation: "incontrolPulse 1.4s ease-in-out infinite" }}>
          <LogoMark size={48} />
        </div>
        <div style={{ fontSize: 13, fontWeight: 600 }}>Cargando Incontrol…</div>
        <style>{`@keyframes incontrolPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.94); } }`}</style>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: COLORS.paper, fontFamily: "Inter, ui-sans-serif, sans-serif", color: COLORS.ink }}>
      <style>{`
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
        input[type="date"], input[type="time"], input[type="number"], input[type="text"], input[type="password"], select {
          font-family: 'JetBrains Mono', monospace;
          border: 1px solid ${COLORS.line};
          background: #F6F9F8;
          border-radius: 8px;
          padding: 9px 11px;
          font-size: 14px;
          color: ${COLORS.ink};
          outline: none;
          transition: border-color 120ms ease, box-shadow 120ms ease;
        }
        input:focus, select:focus { border-color: ${COLORS.teal}; box-shadow: 0 0 0 3px ${COLORS.tealSoft}; }
        button:focus-visible { outline: 2px solid ${COLORS.teal}; outline-offset: 2px; }
        button { cursor: pointer; font-family: inherit; transition: transform 100ms ease, opacity 100ms ease, background 120ms ease, box-shadow 120ms ease; }
        button:active { transform: scale(0.97); }
        @media (hover: hover) {
          button:not(:disabled):hover { filter: brightness(0.97); }
        }
        ::selection { background: ${COLORS.tealSoft}; color: ${COLORS.ink}; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: ${COLORS.line}; border-radius: 20px; border: 2px solid ${COLORS.paper}; }
        ::-webkit-scrollbar-thumb:hover { background: #C9C2AC; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
        @keyframes incontrolFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .tab-content { }
      `}</style>

      {dueReminder && (
        <div className="no-print" role="alert" style={{ position: "fixed", top: 12, left: 12, right: 12, zIndex: 50, maxWidth: 520, margin: "0 auto", background: COLORS.card, border: `1px solid ${COLORS.teal}`, borderRadius: 14, padding: "12px 14px", display: "flex", alignItems: "center", gap: 12, boxShadow: COLORS.shadowLg }}>
          <Bell size={22} color={COLORS.teal} style={{ flexShrink: 0 }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 14 }}>Hora de beber ({dueReminder})</div>
            <div style={{ fontSize: 12, color: COLORS.inkSoft }}>Anota la toma cuando la hagas.</div>
          </div>
          <button onClick={() => { setTab("registro"); setDueReminder(null); window.dispatchEvent(new CustomEvent("incontrol-goto", { detail: "liquido" })); }} style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 10, padding: "8px 12px", fontSize: 12.5, fontWeight: 700 }}>Registrar</button>
          <button onClick={() => setDueReminder(null)} aria-label="Cerrar aviso" style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 4 }}><X size={18} /></button>
        </div>
      )}

      <Header daysCount={dailyAgg.length} streak={streak} saveStatus={saveStatus} onRetry={flushSave} />

      <main style={{ maxWidth: 720, margin: "0 auto", padding: "18px 16px 100px" }}>
        <div key={tab} className="tab-content">
        {tab === "registro" && (
          <RegistroTab
            data={data}
            addLiquid={addLiquid}
            addDiaper={addDiaper}
            removeLiquid={removeLiquid}
            removeDiaper={removeDiaper}
            updateEntry={updateEntry}
            restoreData={restoreData}
            lastDryWeight={lastDryWeight}
            dailyAgg={dailyAgg}
            setDayNote={setDayNote}
            addVoid={addVoid} removeVoid={removeVoid} addLeak={addLeak} removeLeak={removeLeak}
            settings={data.settings || {}}
            setDefault={setDefault}
          />
        )}
        {tab === "graficas" && (
          <GraficasTab dailyAgg={dailyAgg} minDate={minDate} maxDate={maxDate} />
        )}
        {tab === "informe" && (
          <InformeTab dailyAgg={dailyAgg} minDate={minDate} maxDate={maxDate} lastReport={data.lastReport} setLastReport={setLastReport} />
        )}
        </div>
      </main>

      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

      <path d="M 152 336 A 150 150 0 0 1 214 218" fill="none" stroke="#FFFFFF" strokeOpacity="0.55" strokeWidth="20" strokeLinecap="round" />
      <rect x="234" y="262" width="44" height="150" rx="22" fill="url(#incontrolDrop)" />
      <path
        d="M256 118 C256 118 208 190 208 228 C208 256.5 229.5 278 256 278 C282.5 278 304 256.5 304 228 C304 190 256 118 256 118 Z"

  );
}

// ---------- cabecera compacta (app bar) ----------
function Header({ daysCount, streak, saveStatus, onRetry }) {
  const statusMap = {
    saving: { text: "Guardando…", color: COLORS.inkSoft, dot: "#B8B2A0" },
    saved: { text: "Guardado", color: COLORS.inkSoft, dot: COLORS.teal },
    error: { text: "Error al guardar · toca para reintentar", color: "#B23B2E", dot: "#B23B2E" },
    unavailable: { text: "Sin almacenamiento persistente en este entorno", color: "#B23B2E", dot: "#B23B2E" },
    idle: { text: "Control de incontinencia", color: COLORS.inkSoft, dot: null },
  };
  const s = statusMap[saveStatus] || statusMap.idle;
  const clickable = saveStatus === "error";

  return (
    <header className="no-print" style={{ background: COLORS.card, borderBottom: `1px solid ${COLORS.line}`, position: "sticky", top: 0, zIndex: 10, boxShadow: COLORS.shadowSm }}>
      <div style={{ maxWidth: 720, margin: "0 auto", padding: "14px 16px", display: "flex", alignItems: "center", gap: 12 }}>
        <LogoMark size={36} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontWeight: 800, fontSize: 17, letterSpacing: "-0.01em", color: COLORS.ink, lineHeight: 1.15 }}>
            Incontrol
          </div>
          <button
            onClick={clickable ? onRetry : undefined}
            disabled={!clickable}
            style={{
              display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", padding: 0,
              fontSize: 11.5, color: s.color, fontWeight: saveStatus === "error" || saveStatus === "unavailable" ? 700 : 500,
              cursor: clickable ? "pointer" : "default",
            }}
          >
            {s.dot && (
              <span style={{
                width: 6, height: 6, borderRadius: "50%", background: s.dot, flexShrink: 0,
                animation: saveStatus === "saving" ? "pulse 1s ease-in-out infinite" : "none",
              }} />
            )}
            {s.text}
          </button>
        </div>
        {streak >= 2 && (
          <div style={{
            display: "flex", alignItems: "center", gap: 4, background: COLORS.amberSoft, color: COLORS.amber,
            fontSize: 12, fontWeight: 700, padding: "6px 9px", borderRadius: 20, flexShrink: 0,
          }}>
            <Flame size={12} strokeWidth={2.4} />
            <span className="num">{streak}</span>
          </div>
        )}
        {daysCount > 0 && (
          <div style={{
            display: "flex", alignItems: "center", gap: 5, background: COLORS.tealSoft, color: COLORS.teal,
            fontSize: 12, fontWeight: 700, padding: "6px 10px", borderRadius: 20, flexShrink: 0,
          }}>
            <span className="num">{daysCount}</span> {daysCount === 1 ? "día" : "días"}
          </div>
        )}
      </div>
      <style>{`@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }`}</style>
    </header>
  );
}

// ---------- Tab: registro ----------
// Tarjeta de resumen a golpe de vista: cómo va el día de hoy antes de entrar en
// los formularios de registro. Da al diario un punto de partida tipo "panel",
// en vez de aterrizar directamente sobre un formulario vacío.
function TodayCard({ todayAgg, lastAgg, onGoTo }) {
  const hasToday = todayAgg && (todayAgg.liquidCount > 0 || todayAgg.diaperCount > 0);
  const displayAgg = hasToday ? todayAgg : lastAgg;
  const showingPast = !hasToday && !!displayAgg;

  const severity = displayAgg ? classifyLoss(displayAgg.diaperTotal) : null;
  const hydration = displayAgg ? classifyLiquid(displayAgg.liquidTotal) : null;

  return (
    <div style={{
      marginBottom: 20, borderRadius: 16, padding: "18px 18px 16px",
      background: COLORS.tealSoft, border: `1px solid ${COLORS.line}`,
      boxShadow: COLORS.shadowMd, color: COLORS.ink,
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: displayAgg ? 14 : 8 }}>
        <div style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 600 }}>
          {showingPast ? `Último registro · ${fmtDateFull(displayAgg.date)}` : `Hoy · ${fmtDateFull(todayStr())}`}
        </div>
      </div>

      {!displayAgg ? (
        <div>
          <div style={{ fontSize: 14, opacity: 0.9, marginBottom: 12, lineHeight: 1.5 }}>
            Todavía no has registrado nada hoy. Añade tu primera ingesta o pesaje del día ahí abajo.
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button
              onClick={() => onGoTo("panal")}
              style={{ display: "flex", alignItems: "center", gap: 6, background: "#fff", color: COLORS.teal, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "8px 14px", fontSize: 12.5, fontWeight: 700 }}
            >
              <Scale size={14} /> Registrar pesaje
            </button>
            <button
              onClick={() => onGoTo("liquido")}
              style={{ display: "flex", alignItems: "center", gap: 6, background: "#fff", color: COLORS.teal, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "8px 14px", fontSize: 12.5, fontWeight: 700 }}
            >
              <Droplets size={14} /> Registrar líquido
            </button>
          </div>
        </div>
      ) : (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                <Droplets size={14} color="#4B9CC8" />
                <span style={{ fontSize: 11, opacity: 0.75, fontWeight: 600 }}>Líquido</span>
              </div>
              <div className="num" style={{ fontSize: 26, fontWeight: 700, lineHeight: 1.1, marginBottom: 6 }}>
                {round1(displayAgg.liquidTotal)} <span style={{ fontSize: 14, fontWeight: 500, opacity: 0.75 }}>ml</span>
              </div>
              {hydration && (
                <span style={{ fontSize: 10.5, fontWeight: 700, color: "#fff", background: hydration.color, padding: "2px 8px", borderRadius: 10 }}>
                  {hydration.label}
                </span>
              )}
            </div>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                <Scale size={14} color={COLORS.amber} />
                <span style={{ fontSize: 11, opacity: 0.75, fontWeight: 600 }}>Peso neto</span>
              </div>
              <div className="num" style={{ fontSize: 26, fontWeight: 700, lineHeight: 1.1, marginBottom: 6 }}>
                {round1(displayAgg.diaperTotal)} <span style={{ fontSize: 14, fontWeight: 500, opacity: 0.75 }}>g</span>
              </div>
              {severity && (
                <span style={{ fontSize: 10.5, fontWeight: 700, color: "#fff", background: severity.color, padding: "2px 8px", borderRadius: 10 }}>
                  {severity.label}
                </span>
              )}
            </div>
          </div>

          {showingPast && (
            <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${COLORS.line}` }}>
              <div style={{ fontSize: 13, opacity: 0.9, marginBottom: 10, lineHeight: 1.4 }}>
                Todavía no has registrado nada hoy.
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button
                  onClick={() => onGoTo("panal")}
                  style={{ display: "flex", alignItems: "center", gap: 6, background: "#fff", color: COLORS.teal, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "8px 14px", fontSize: 12.5, fontWeight: 700 }}
                >
                  <Scale size={14} /> Registrar pesaje
                </button>
                <button
                  onClick={() => onGoTo("liquido")}
                  style={{ display: "flex", alignItems: "center", gap: 6, background: "#fff", color: COLORS.teal, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "8px 14px", fontSize: 12.5, fontWeight: 700 }}
                >
                  <Droplets size={14} /> Registrar líquido
                </button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function RegistroTab({ data, addLiquid, addDiaper, removeLiquid, removeDiaper, lastDryWeight, dailyAgg, setDayNote, addVoid, removeVoid, addLeak, removeLeak, updateEntry, restoreData, settings, setDefault }) {
  const [subtab, setSubtab] = useState("panal");
  const [editing, setEditing] = useState(null); // { kind, entry }
  useEffect(() => {
    const h = (e) => setSubtab(e.detail);
    window.addEventListener("incontrol-goto", h);
    return () => window.removeEventListener("incontrol-goto", h);
  }, []);

  // agrupar por día, filtrando solo el tipo de entrada de la subpestaña activa
  const combined = useMemo(() => {
    if (subtab === "nota") return [];
    const items = subtab === "liquido"
      ? data.liquids.map((l) => ({ ...l, kind: "liquido" }))
      : data.diapers.map((p) => ({ ...p, kind: "panal" }));
    items.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
    const byDay = {};
    for (const it of items) {
      byDay[it.date] = byDay[it.date] || [];
      byDay[it.date].push(it);
    }
    return Object.entries(byDay).sort((a, b) => b[0].localeCompare(a[0]));
  }, [data, subtab]);

  const dayNoteEntries = useMemo(
    () => Object.entries(data.dayNotes || {}).sort((a, b) => b[0].localeCompare(a[0])),
    [data.dayNotes]
  );

  const dayAggMap = useMemo(() => Object.fromEntries(dailyAgg.map((d) => [d.date, d])), [dailyAgg]);
  const todayAgg = dayAggMap[todayStr()];
  const lastAgg = dailyAgg.length ? dailyAgg[dailyAgg.length - 1] : null;

  return (
    <div>
      <TodayCard todayAgg={todayAgg} lastAgg={lastAgg} onGoTo={setSubtab} />

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20, justifyContent: "space-between" }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <PillButton active={subtab === "panal"} onClick={() => setSubtab("panal")} icon={Scale} label="Registrar pesaje" />
          <PillButton active={subtab === "liquido"} onClick={() => setSubtab("liquido")} icon={Droplets} label="Registrar líquido" />
          <PillButton active={subtab === "miccion"} onClick={() => setSubtab("miccion")} icon={Activity} label="Micción" />
          <PillButton active={subtab === "escape"} onClick={() => setSubtab("escape")} icon={AlertCircle} label="Escape" />
          <PillButton active={subtab === "nota"} onClick={() => setSubtab("nota")} icon={MessageSquare} label="Nota del día" />
          <PillButton active={subtab === "avisos"} onClick={() => setSubtab("avisos")} icon={Bell} label="Recordatorios" />
          <PillButton active={subtab === "copia"} onClick={() => setSubtab("copia")} icon={Download} label="Copia de seguridad" />
        </div>
        <ExportButton icon={Download} label="Exportar todo a Excel" onClick={() => exportAllExcel(data, dailyAgg)} />
      </div>

      {subtab === "liquido" && <LiquidForm onAdd={addLiquid} defaultAmount={settings?.defaultLiquidAmount} onSetDefault={(v) => setDefault("defaultLiquidAmount", v)} />}
      {subtab === "panal" && <DiaperForm onAdd={addDiaper} lastDryWeight={lastDryWeight} defaultDryWeight={settings?.defaultDryWeight} onSetDefaultDry={(v) => setDefault("defaultDryWeight", v)} />}
      {subtab === "miccion" && <VoidForm onAdd={addVoid} />}
      {subtab === "escape" && <LeakForm onAdd={addLeak} />}
      {subtab === "miccion" && <SimpleEntryList title="Micciones registradas" icon={Activity} items={data.voids || []} onRemove={removeVoid} onEdit={(it) => setEditing({ kind: "miccion", entry: it })} empty="Aún no hay micciones registradas." describe={(v) => (<>
        <b className="num">{v.volume ? `${v.volume} ml` : "sin medir"}</b>
        {isNightTime(v.time) && <span style={{ color: COLORS.teal }}> · nocturna</span>}
        {v.note ? <span style={{ color: COLORS.inkSoft }}> · {v.note}</span> : null}
      </>)} />}
      {subtab === "escape" && <SimpleEntryList title="Escapes registrados" icon={AlertCircle} items={data.leaks || []} onRemove={removeLeak} onEdit={(it) => setEditing({ kind: "escape", entry: it })} empty="Aún no hay escapes registrados." describe={(l) => (<>
        <b>{(LEAK_TRIGGERS.find((t) => t.id === l.trigger) || {}).short || l.trigger}</b>
        <span style={{ color: COLORS.inkSoft }}> · {l.amount}{l.note ? ` · ${l.note}` : ""}</span>
      </>)} />}
      {subtab === "avisos" && <RemindersPanel settings={settings} setDefault={setDefault} />}
      {subtab === "copia" && <BackupPanel data={data} onRestore={restoreData} settings={settings} setDefault={setDefault} />}
      {editing && <EditEntryDialog kind={editing.kind} entry={editing.entry} onClose={() => setEditing(null)} onSave={(patch) => { updateEntry(editing.kind, editing.entry.id, patch); setEditing(null); }} />}
      {subtab === "nota" && <DayNoteForm dayNotes={data.dayNotes || {}} setDayNote={setDayNote} />}

      {!["nota", "avisos", "miccion", "escape", "copia"].includes(subtab) && (
        <div style={{ marginTop: 32 }}>
          <h3 style={{ fontFamily: "Inter, sans-serif", fontSize: 16, fontWeight: 800, letterSpacing: "-0.01em", marginBottom: 4 }}>
            {subtab === "liquido" ? "Ingestas de líquido registradas" : "Pesajes de pañal registrados"}
          </h3>
          {subtab === "liquido" && (
            <div style={{ fontSize: 11, color: COLORS.inkSoft, marginBottom: 12, lineHeight: 1.4 }}>
              Clasificación orientativa por día ({fmtEs(LIQUID_THRESHOLDS.insuficiente, 0)}–{fmtEs(LIQUID_THRESHOLDS.mucho, 0)} ml se considera hidratación adecuada). Restringir líquidos no reduce la incontinencia y puede irritar la vejiga: no es un criterio médico, ajústalo si tu profesional sanitario te indica otro objetivo.
            </div>
          )}
          {combined.length === 0 && (
            <EmptyState
              icon={subtab === "liquido" ? Droplets : Scale}
              text={subtab === "liquido"
                ? "Aún no hay ingestas de líquido registradas."
                : "Aún no hay pesajes de pañal registrados."}
            />
          )}
          {combined.map(([date, items]) => {
            const dayAgg = dayAggMap[date];
            const severity = subtab === "panal" ? classifyLoss(dayAgg?.diaperTotal) : null;
            const hydration = subtab === "liquido" ? classifyLiquid(dayAgg?.liquidTotal) : null;
            return (
            <div key={date} style={{ marginBottom: 18 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 6 }}>
                <div style={{ fontSize: 12, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>
                  {fmtDateFull(date)}
                </div>
                {dayAgg && (
                  <span className="num" style={{ fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 600 }}>
                    {round1(dayAgg.liquidTotal)} ml líquido · {round1(dayAgg.diaperTotal)} g peso
                  </span>
                )}
                {severity && (
                  <span style={{ fontSize: 10.5, fontWeight: 700, color: severity.color, background: severity.bg, padding: "2px 8px", borderRadius: 10 }}>
                    {severity.label}
                  </span>
                )}
                {hydration && (
                  <span style={{ fontSize: 10.5, fontWeight: 700, color: hydration.color, background: hydration.bg, padding: "2px 8px", borderRadius: 10 }}>
                    {hydration.label}
                  </span>
                )}
                {subtab === "liquido" && (
                  <span className="num" style={{ fontSize: 10.5, color: COLORS.inkSoft }}>
                    Recomendado ≈ {LIQUID_RECOMMENDED} ml/día
                  </span>
                )}
              </div>
              <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 14, overflow: "hidden", boxShadow: COLORS.shadowSm }}>
                {items.map((it, i) => (
                  <div
                    key={it.id}
                    style={{
                      display: "flex", alignItems: "center", gap: 10,
                      padding: "10px 14px",
                      borderTop: i > 0 ? `1px solid ${COLORS.line}` : "none",
                    }}
                  >

function EditEntryDialog({ kind, entry, onSave, onClose }) {
  const [f, setF] = useState({ ...entry });
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));
  const titles = { liquido: "Editar ingesta de líquido", panal: "Editar pesaje de pañal", miccion: "Editar micción", escape: "Editar escape" };
  const [err, setErr] = useState("");
  const save = () => {
    const patch = { date: f.date, time: f.time };
    if (!f.date || !f.time) { setErr("Indica fecha y hora."); return; }
    if (kind === "liquido") {
      const a = Number(f.amount); if (!(a > 0)) { setErr("La cantidad debe ser mayor que 0."); return; }
      patch.amount = a; patch.note = (f.note || "").trim();
    } else if (kind === "panal") {
      const w = Number(f.weight); if (!(w > 0)) { setErr("El peso debe ser mayor que 0."); return; }
      patch.weight = w; patch.dryWeight = f.dryWeight === "" || f.dryWeight === undefined ? "" : Number(f.dryWeight); patch.note = (f.note || "").trim();
    } else if (kind === "miccion") {
      patch.volume = f.volume === "" || f.volume === undefined ? "" : Number(f.volume);
    } else if (kind === "escape") {
      patch.trigger = f.trigger; patch.amount = f.amount; patch.note = (f.note || "").trim();
    }
    onSave(patch);
  };
  return (
    <div role="dialog" aria-modal="true" style={{ position: "fixed", inset: 0, background: "rgba(24,35,34,0.35)", zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: COLORS.card, borderRadius: 16, padding: 20, width: "100%", maxWidth: 420, boxShadow: COLORS.shadowLg }}>
        <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 14 }}>{titles[kind]}</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
          {kind === "liquido" && <Field label="Cantidad (ml)"><input type="number" min="0" step="10" value={f.amount ?? ""} onChange={(e) => set("amount", e.target.value)} style={{ width: 120 }} /></Field>}
          {kind === "panal" && <>
            <Field label="Peso total (g)"><input type="number" min="0" value={f.weight ?? ""} onChange={(e) => set("weight", e.target.value)} style={{ width: 110 }} /></Field>
            <Field label="Peso seco (g)"><input type="number" min="0" value={f.dryWeight ?? ""} onChange={(e) => set("dryWeight", e.target.value)} style={{ width: 110 }} /></Field>
          </>}
          {kind === "miccion" && <Field label="Volumen de la jarra (ml)"><input type="number" min="0" step="10" value={f.volume ?? ""} onChange={(e) => set("volume", e.target.value)} placeholder="vacío si no se midió" style={{ width: 170 }} /></Field>}
          {kind === "escape" && <>
            <Field label="Desencadenante">
              <select value={f.trigger} onChange={(e) => set("trigger", e.target.value)}>
                {LEAK_TRIGGERS.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
              </select>
            </Field>
            <Field label="Cantidad">
              <select value={f.amount} onChange={(e) => set("amount", e.target.value)}>
                {LEAK_AMOUNTS.map((a) => <option key={a} value={a}>{a}</option>)}
              </select>
            </Field>
          </>}
          <Field label="Fecha"><input type="date" value={f.date || ""} onChange={(e) => set("date", e.target.value)} /></Field>
          <Field label="Hora"><input type="time" value={f.time || ""} onChange={(e) => set("time", e.target.value)} /></Field>
          {kind !== "miccion" && <Field label="Nota"><input type="text" value={f.note || ""} onChange={(e) => set("note", e.target.value)} style={{ width: 200 }} /></Field>}
        </div>
        {err && <div style={{ color: "#B3492F", fontSize: 12.5, marginTop: 10 }}>{err}</div>}
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 18 }}>
          <button onClick={onClose} style={{ background: COLORS.card, color: COLORS.inkSoft, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "9px 16px", fontWeight: 600, fontSize: 13 }}>Cancelar</button>
          <button onClick={save} style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 10, padding: "9px 18px", fontWeight: 700, fontSize: 13 }}>Guardar cambios</button>
        </div>
      </div>
    </div>
  );
}

function BackupPanel({ data, onRestore, settings, setDefault }) {
  const [pending, setPending] = useState(null); // datos leídos del archivo
  const [msg, setMsg] = useState("");
  const fileRef = useRef(null);
  const counts = (d) => `${(d.liquids || []).length} líquidos, ${(d.diapers || []).length} pesajes, ${(d.voids || []).length} micciones, ${(d.leaks || []).length} escapes, ${Object.keys(d.dayNotes || {}).length} notas`;

  const exportBackup = () => {
    const payload = {
      app: "incontrol", version: 1, exportedAt: new Date().toISOString(),
      liquids: data.liquids, diapers: data.diapers, voids: data.voids || [], leaks: data.leaks || [],
      dayNotes: data.dayNotes || {}, settings: data.settings || {}, lastReport: data.lastReport || null,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `incontrol-copia-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    setDefault("lastBackup", todayStr());
    setMsg("Copia descargada. Guárdala en un lugar seguro (nube, correo o tu ordenador).");
  };

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || parsed.app !== "incontrol") throw new Error("no es una copia de Incontrol");
        setPending(parsed); setMsg("");
      } catch (err) {
        setPending(null); setMsg("No se pudo leer el archivo: " + err.message + ".");
      }
    };
    reader.onerror = () => setMsg("No se pudo leer el archivo.");
    reader.readAsText(file);
  };

  const restore = (mode) => {
    onRestore(pending, mode);
    setPending(null);
    setMsg(mode === "replace" ? "Copia restaurada: se han reemplazado todos tus datos." : "Copia fusionada: se han añadido los registros que faltaban.");
  };

  const daysSince = settings?.lastBackup ? Math.floor((new Date(todayStr() + "T00:00:00") - new Date(settings.lastBackup + "T00:00:00")) / 86400000) : null;

  return (
    <FormCard>
      <div style={{ width: "100%" }}>
        <div style={{ fontWeight: 700, fontSize: 15 }}>Copia de seguridad</div>
        <div style={{ fontSize: 12, color: COLORS.inkSoft, lineHeight: 1.5, marginTop: 4 }}>
          Tus datos solo están en este navegador. Si borras los datos del navegador o cambias de móvil, se pierden. Descarga una copia de vez en cuando y, si cambias de dispositivo, impórtala allí.
        </div>
        <div style={{ fontSize: 12, marginTop: 8, color: daysSince === null || daysSince > 14 ? "#B3492F" : COLORS.teal, fontWeight: 600 }}>
          {daysSince === null ? "Aún no has hecho ninguna copia." : daysSince === 0 ? "Última copia: hoy." : `Última copia: hace ${daysSince} días.`}
        </div>
        <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 4 }}>Ahora tienes: {counts(data)}.</div>
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button onClick={exportBackup} style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.teal, color: "#fff", border: "none", borderRadius: 10, padding: "10px 16px", fontWeight: 700, fontSize: 13 }}>
          <Download size={15} /> Descargar copia
        </button>
        <button onClick={() => fileRef.current && fileRef.current.click()} style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.card, color: COLORS.teal, border: `1px solid ${COLORS.teal}`, borderRadius: 10, padding: "10px 16px", fontWeight: 700, fontSize: 13 }}>
          <Upload size={15} /> Cargar copia…
        </button>
        <input ref={fileRef} type="file" accept="application/json,.json" onChange={onFile} style={{ display: "none" }} />
      </div>
      {pending && (
        <div style={{ width: "100%", border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 14, background: COLORS.tealSoft }}>
          <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 4 }}>Copia lista para cargar</div>
          <div style={{ fontSize: 12.5, marginBottom: 10 }}>Contiene: {counts(pending)}{pending.exportedAt ? ` · creada el ${String(pending.exportedAt).slice(0, 10)}` : ""}.</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button onClick={() => restore("merge")} style={{ background: COLORS.teal, color: "#fff", border: "none", borderRadius: 10, padding: "9px 14px", fontWeight: 700, fontSize: 12.5 }}>Fusionar con lo que tengo</button>
            <button onClick={() => { if (window.confirm("Se reemplazarán TODOS tus datos actuales por los de la copia. ¿Continuar?")) restore("replace"); }} style={{ background: COLORS.card, color: "#B3492F", border: "1px solid #B3492F", borderRadius: 10, padding: "9px 14px", fontWeight: 700, fontSize: 12.5 }}>Reemplazar todo</button>
            <button onClick={() => setPending(null)} style={{ background: "none", color: COLORS.inkSoft, border: "none", padding: "9px 8px", fontWeight: 600, fontSize: 12.5 }}>Cancelar</button>
          </div>
          <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 8 }}>«Fusionar» añade solo lo que no tengas ya y no borra nada. La clave de Gemini no se incluye en la copia.</div>
        </div>
      )}
      {msg && <div style={{ width: "100%", fontSize: 12.5, color: COLORS.ink }}>{msg}</div>}
    </FormCard>
  );
}

function SimpleEntryList({ title, icon: Icon, items, onRemove, onEdit, empty, describe, noTime }) {
  const groups = useMemo(() => {
    const sorted = [...items].sort((a, b) => ((b.date || "") + (b.time || "")).localeCompare((a.date || "") + (a.time || "")));
    const by = {};
    sorted.forEach((it) => { (by[it.date] = by[it.date] || []).push(it); });
    return Object.entries(by).sort((a, b) => b[0].localeCompare(a[0]));
  }, [items]);
  return (
    <div style={{ marginTop: 32 }}>
      <h3 style={{ fontFamily: "Inter, sans-serif", fontSize: 16, fontWeight: 800, letterSpacing: "-0.01em", marginBottom: 12 }}>{title}</h3>
      {groups.length === 0 && <EmptyState icon={Icon} text={empty} />}
      {groups.map(([date, list]) => (
        <div key={date} style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>
            {fmtDateFull(date)} <span style={{ color: COLORS.inkSoft, fontWeight: 500 }}>· {list.length}</span>
          </div>
          <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 14, overflow: "hidden" }}>
            {list.map((it, i) => (
              <div key={it.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", borderTop: i > 0 ? `1px solid ${COLORS.line}` : "none", fontSize: 13.5 }}>
                {!noTime && <span className="num" style={{ color: COLORS.inkSoft, minWidth: 46 }}>{it.time}</span>}
                <div style={{ flex: 1 }}>{describe(it)}</div>
                {onEdit && <button onClick={() => onEdit(it)} aria-label="Editar" style={{ background: "none", border: "none", color: COLORS.teal, padding: 4 }}><Pencil size={15} /></button>}
                <button onClick={() => onRemove(it.id)} aria-label="Eliminar" style={{ background: "none", border: "none", color: COLORS.inkSoft, padding: 4 }}>
                  <Trash2 size={15} />
                </button>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function RemindersPanel({ settings, setDefault }) {
  const r = settings?.reminders || { enabled: false, times: [] };

    if (!newTime || r.times.includes(newTime)) return;
    save({ times: [...r.times, newTime].sort() });

  const toggle = async () => {
    if (!r.enabled && typeof Notification !== "undefined" && Notification.permission === "default") {
      try { setPerm(await Notification.requestPermission()); } catch (e) {}
    }
    beep();
    save({ enabled: !r.enabled });
  };
  const quick = (list) => save({ times: list });

  return (
    <FormCard>
      <div style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 15 }}>Recordatorios de toma de líquido</div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft }}>Programa las horas a las que quieres beber.</div>
        </div>
        <button onClick={toggle} style={{ background: r.enabled ? COLORS.teal : COLORS.card, color: r.enabled ? "#fff" : COLORS.teal, border: `1px solid ${COLORS.teal}`, borderRadius: 20, padding: "7px 14px", fontWeight: 700, fontSize: 12.5, flexShrink: 0 }}>

        {r.times.length === 0 && <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Aún no hay horas programadas.</div>}
        {r.times.map((t) => (
          <span key={t} className="num" style={{ display: "inline-flex", alignItems: "center", gap: 6, background: COLORS.tealSoft, color: COLORS.teal, borderRadius: 20, padding: "5px 6px 5px 12px", fontSize: 13, fontWeight: 700 }}>
            {t}
            <button onClick={() => save({ times: r.times.filter((x) => x !== t) })} aria-label={`Quitar ${t}`} style={{ background: "none", border: "none", color: COLORS.teal, padding: 2, display: "flex" }}><X size={14} /></button>
          </span>
        ))}
      </div>

      <Field label="Añadir hora">
        <input type="time" value={newTime} onChange={(e) => setNewTime(e.target.value)} />
      </Field>
      <button onClick={addTime} style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.teal, color: "#fff", border: "none", borderRadius: 10, padding: "10px 18px", fontWeight: 700, fontSize: 13 }}>
        <Plus size={15} /> Añadir

      <div style={{ width: "100%", display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <span style={{ fontSize: 12, color: COLORS.inkSoft }}>Rápido:</span>
        <ExportButton icon={Bell} label="Cada 2 h (8–20 h)" onClick={() => quick(["08:00","10:00","12:00","14:00","16:00","18:00","20:00"])} />
        <ExportButton icon={Bell} label="Cada 3 h (9–21 h)" onClick={() => quick(["09:00","12:00","15:00","18:00","21:00"])} />
      </div>

      <div style={{ width: "100%", borderTop: `1px solid ${COLORS.line}`, paddingTop: 12 }}>
        <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 4 }}>Alarma en el móvil aunque la app esté cerrada</div>
        <div style={{ fontSize: 12, color: COLORS.inkSoft, lineHeight: 1.5, marginBottom: 8 }}>
          Descarga las horas como evento diario con alarma y ábrelo con el calendario del móvil (Google Calendar, Apple Calendario…). Así suena y avisa todos los días sin necesitar Incontrol abierta. Si cambias las horas aquí, vuelve a descargarlo y borra los eventos antiguos.
        </div>
        <ExportButton icon={Download} label="Añadir al calendario del móvil (.ics)" onClick={() => r.times.length && downloadIcs(r.times)} />
      </div>

      </div>
    </FormCard>
  );
